# we own it and are isolated from the workbench's frequent changes (3-4 people commit there).
source_repo: git@github.com:AI-native-Systems-Research/ai-native-storage-certus-workbench.git
source_commit: dd19bc04aaff0bb6dab115566649b97a1ee9a9f1
built_from_spec: .claude/skills/component-repair/spec.yaml
build_run: agent_builder/runs/20261005-050320-ece640f5 (spec v3 + oracle timeout 7200 s + budget 14400 s)
build_result: deterministic contract and smoke gates PASSED; promotion refused as UNTESTED (no live
  evaluation was run — by choice, so nothing could open a PR or push unattended)
contents:
  agents/_kit: the workbench runtime kit, minus its tests/ (those import agent_builder; the runtime does not)
