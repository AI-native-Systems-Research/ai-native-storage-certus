to_update: rebuild from spec.yaml with a newer workbench, then re-copy both directories and bump source_commit
note: the implementer rewrote its own copies of the three acceptance scripts; they are DISCARDED and replaced by
  symlinks to ours (an agent must not supply its own judge). Two ideas in them are worth adopting deliberately:
  a statement-hash leg in repair_accept_repo.sh, and excluding the repair's own test file from leg REAL.
