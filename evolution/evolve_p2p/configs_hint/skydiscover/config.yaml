language: rust
max_iterations: 30
diff_based_generation: false

llm:
  api_base: "https://ete-litellm.ai-models.vpc-int.res.ibm.com"
  models:
    - name: "aws/claude-opus-4-6"
      weight: 1.0
  max_tokens: 16384
  timeout: 300

optimization:
  objective: "Implement GPUDirect Storage (P2P): NVMe reads DMA directly into GPU BAR1 memory, bypassing host DRAM. Maximize throughput and minimize latency."

evaluator:
  timeout: 90

prompt:
  system_message: |
    You are optimizing a storage server's NVMe-SSD-to-GPU data transfer path.
    The score rewards higher throughput (GB/s) and lower p99 latency.
    Hardware: NVMe Gen4 SSDs via SPDK, NVIDIA A30 GPU PCIe Gen4 x16.
    Kernel modules loaded: nvidia-peermem, gdrdrv.
    Data integrity is mandatory — corruption scores -1.

    GOAL: Implement GPUDirect Storage (P2P) — NVMe reads DMA directly into GPU
    BAR1 memory, bypassing host DRAM entirely. This eliminates the host-bounce
    cudaMemcpy step.

    Implementation notes:
    - Build uses --features p2p, so all #[cfg(feature = "p2p")] code is compiled and type-checked.
    - The cuda_ffi module uses std::os::raw::c_int for all flags and error return types.
    - The function create_spdk_dma_buffer_from_gpu_bar(gpu_ptr, size, container_fd) in dma.rs creates an SPDK-registered DMA buffer backed by GPU BAR1 memory.
    - PipelineRing.streams is [GpuStream; 2] — callers pass &ring.streams as a fixed-size array.

    The code is structured as multiple files separated by '// --- FILE: xxx ---' markers.
    Your output MUST include exactly these two files with their markers:
    // --- FILE: pipeline.rs ---
    // --- FILE: dma.rs (buffer creation functions) ---

    The lib.rs section marked CONTEXT is read-only — it shows how your code is called.
    Do NOT include lib.rs in your output. Only modify pipeline.rs and dma.rs.
