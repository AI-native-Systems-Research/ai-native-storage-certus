# GEPA config for Phase 1: Open-ended evolution
# Seed: current pipeline.rs (unmodified)
# Evaluator: full certus-server stack with composite fitness

max_iterations: 30

llm:
  api_base: "https://ete-litellm.ai-models.vpc-int.res.ibm.com"
  model: "openai/aws/claude-opus-4-6"
  max_tokens: 16384

optimization:
  objective: "Maximize composite fitness score for SSD-to-GPU data transfer"
  module_selector: "all"
  cache_evaluation: true

evaluator:
  timeout: 90
  parallel: false

prompt:
  system_message: |-
    You are optimizing a storage server's NVMe-SSD-to-GPU data transfer path.

    HARDWARE:
    - NVMe Gen4 SSDs accessed via SPDK userspace driver
    - NVIDIA A30 GPU (PCIe Gen4 x16)
    - Kernel modules loaded: nvidia-peermem, gdrdrv
    - SPDK can DMA to any address registered via spdk_mem_register()

    SCORING (60% of score rewards low CPU involvement):
    - 20% throughput (data delivery rate to GPU)
    - 10% p99 latency (tail latency)
    - 35% low CPU memory bandwidth during transfer
    - 25% low CPU utilization during transfer
    - 10% stability (run-to-run consistency)
    - Data corruption = instant -1.0 score

    The current code scores ~0.55. Improving throughput alone has diminishing returns.
    The dominant score improvement comes from reducing CPU involvement in data movement.

    You may modify pipeline.rs, lib.rs, and dma.rs. Explore the gpu-services crate
    for available DMA buffer creation functions and memory registration APIs.
