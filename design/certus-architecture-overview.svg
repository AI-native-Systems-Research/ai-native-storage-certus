353,860.2093 2272.46,854.3298 C2268.2232,860.3036 2263.4031,858.043 2260.7357,852.7035 C2256.2827,857.7887 2252.289,856.5822 2249.9992,850.6042 C2245.2726,856.598 2241.3954,854.9587 2237.7475,849.4548 C2234.647,855.0519 2228.9109,856.2758 2225.2044,850.1005 C2220.3315,853.9643 2216.3825,854.49 2213.7355,847.7036 C2209.088,853.9135 2204.6162,853.7358 2200.735,846.9378 C2187.9132,844.1213 2186.51,835.9417 2194.357,826.6329 C2188.593,818.8338 2190.6131,810.3845 2200.6491,807.8894" fill="#FEE2E2" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="146.7539" x="2210.5" y="831.292">Peer Certus Nodes</text></g><g class="entity" data-qualified-name="GMN44" data-source-line="92" id="ent0045"><path d="M1839.5,447.2969 L1839.5,525.8281 L2140.6875,525.8281 L2140.6875,457.2969 L2130.6875,447.2969 L1839.5,447.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M2130.6875,447.2969 L2130.6875,457.2969 L2140.6875,457.2969 L2130.6875,447.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.0073" x="1903.0901" y="468.3638">(1) Lazy write-through</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.9312" x="1870.6282" y="483.4966">Populate returns after D2H into the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.1245" x="1870.0315" y="498.6294">DRAM slot; the block is persisted to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.5142" x="1849.5" y="513.7622">SSD</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.6514" x="1880.1465" y="513.7622">asynchronously</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.7573" x="1998.9302" y="513.7622">in the background.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="99" id="ent0048"><path d="M1839.5,779.2969 L1839.5,872.9609 L2146.8003,872.9609 L2146.8003,789.2969 L2136.8003,779.2969 L1839.5,779.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M2136.8003,779.2969 L2136.8003,789.2969 L2146.8003,789.2969 L2136.8003,779.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="213.6685" x="1881.8159" y="800.3638">(2) Memory-tier-full handling</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.4238" x="1861.9382" y="815.4966">When the DRAM pool is saturated, LRU</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3989" x="1856.4507" y="830.6294">blocks with completed write-through are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="155.1621" x="1864.1282" y="845.7622">demoted to SSD-only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.7495" x="2023.4226" y="845.7622">to free space;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.3003" x="1849.5" y="860.895">new/cold data is served straight from SSD.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="107" id="ent0051"><path d="M1839.5,621.2969 L1839.5,699.8281 L2146.7432,699.8281 L2146.7432,631.2969 L2136.7432,621.2969 L1839.5,621.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M2136.7432,621.2969 L2136.7432,631.2969 L2146.7432,631.2969 L2136.7432,621.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="269.2676" x="1853.9878" y="642.3638">(3) Pluggable block-device backends</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3843" x="1891.4294" y="657.4966">Any impl of &#171;IBlockDevice&#187; &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.2432" x="1849.5" y="672.6294">SPDK userspace NVMe, filesystem-backed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.7417" x="1914.7507" y="687.7622">or kernel block device.</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="114" id="ent0054"><path d="M2186,447.2969 L2186,525.8281 L2502.314,525.8281 L2502.314,457.2969 L2492.314,447.2969 L2186,447.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M2492.314,447.2969 L2492.314,457.2969 L2502.314,457.2969 L2492.314,447.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.1987" x="2239.5576" y="468.3638">(4) Optional GPUDirect P2P</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2573" x="2223.0283" y="483.4966">The dispatcher-p2p variant streams</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.314" x="2196" y="498.6294">SSD &lt;-&gt; GPU through a BAR1-mapped ring,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1987" x="2226.5576" y="513.7622">bypassing the DRAM staging copy.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="121" id="ent0057"><path d="M37.5,920.7969 L37.5,999.3281 A0,0 0 0 0 37.5,999.3281 L328.3979,999.3281 A0,0 0 0 0 328.3979,999.3281 L328.3979,930.7969 L318.3979,920.7969 L187,920.7969 L183,853.0569 L179,920.7969 L37.5,920.7969 A0,0 0 0 0 37.5,920.7969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M318.3979,920.7969 L318.3979,930.7969 L328.3979,930.7969 L318.3979,920.7969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.5156" x="96.6912" y="941.8638">(5) Cold-hit promotion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.3975" x="56.2502" y="956.9966">A lookup that hits on SSD is pipelined</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.7764" x="47.5" y="972.1294">into DRAM and</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="71.4619" x="148.4087" y="972.1294">promoted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.395" x="224.0029" y="972.1294">back into the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8608" x="69.0186" y="987.2622">memory tier for future warm hits.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="128" id="ent0060"><path d="M2421.5,794.7969 L2421.5,858.1953 L2736.4619,858.1953 L2736.4619,804.7969 L2726.4619,794.7969 L2421.5,794.7969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M2726.4619,794.7969 L2726.4619,804.7969 L2736.4619,804.7969 L2726.4619,794.7969" fill="#FEFCE8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="209.3457" x="2469.8081" y="815.8638">(6) Pluggable eviction policy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.9619" x="2431.5" y="830.9966">MemoryTier &amp; DispatchMap delegate victim</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.2061" x="2437.3779" y="846.1294">selection to &#171;IEvictionPolicy&#187; (LRU today).</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="134" id="ent0063"><path d="M2547.5,447.2969 L2547.5,525.8281 L2856.5015,525.8281 L2856.5015,457.2969 L2846.5015,447.2969 L2547.5,447.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:0.5;"/><path d="M2846.5015,447.2969 L2846.5015,457.2969 L2856.5015,457.2969 L2846.5015,447.2969" fill="#FEFCE8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="201.957" x="2596.5222" y="468.3638">(7) Remote peers via RDMA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.0015" x="2557.5" y="483.4966">Local misses query peers (Zyre discovery);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.8921" x="2567.5547" y="498.6294">the holding peer RDMA-writes the value</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1475" x="2589.927" y="513.7622">directly into this node's memory.</text></g><!--link pyclient to shmq--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" data-source-line="66" id="lnk25"><path d="M764.93,156.4869 C719.19,188.7569 651.4223,236.5775 605.7623,268.7975" fill="none" id="pyclient-to-shmq" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="600.86,272.2569,610.5197,270.3361,604.9453,269.3741,605.9073,263.7996,600.86,272.2569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="34.2012" x="724" y="2