" data-source-line="41" id="ent0012"><rect fill="#DBEAFE" height="76.8906" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="177.2354" x="551.5" y="622.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.0342" x="594.6006" y="649.292">DispatchMap</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2939" x="583.9707" y="665.5889">&#171;IDispatchMap&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.2354" x="565.5" y="681.8857">key -&gt; location index</text></g><!--entity evict--><g class="entity" data-qualified-name="server_box.evict" data-source-line="42" id="ent0013"><rect fill="#E5E7EB" height="76.8906" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="188.0293" x="906" y="787.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.0293" x="920" y="814.792">EvictionPolicy (plug-in)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.5645" x="941.2324" y="831.0889">&#171;IEvictionPolicy&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.625" x="970.7021" y="847.3857">e.g. LRU</text></g><!--entity gpu--><g class="entity" data-qualified-name="server_box.gpu" data-source-line="49" id="ent0017"><rect fill="#BBF7D0" height="76.8906" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="175.5469" x="1063" y="448.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.6436" x="1106.9517" y="475.292">GpuServices</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.9033" x="1096.3218" y="491.5889">&#171;IGpuServices&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" te