      reports that the component is not initialized.
    traces:     ["lib.rs:100", "lib.rs:101", "lib.rs:102", "lib.rs:105", "lib.rs:108", "lib.rs:109"]

  - id:         MT-DEFAULT-POOL-ID-AMBIGUOUS
    subject:    Default for MemoryTierState
    kind:       invariant
    verifiable: true
    statement:  >
      An uninitialized component stores the pool identifier zero, which is not a reserved
