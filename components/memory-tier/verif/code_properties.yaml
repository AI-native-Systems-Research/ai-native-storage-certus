  - id:         MT-FREELIST-ALLOCATE-POST
    subject:    FreeList::allocate
    kind:       postcondition
    verifiable: true
    statement:  >
      A successful allocation returns the starting offset of a run of free bytes at least as long
      as the requested size rounded up to the next 4 KiB boundary, marks that rounded amount as
      used, and leaves whatever is left over of the chosen run available as a smaller free run
      immediately after it.
