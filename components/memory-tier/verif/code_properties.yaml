    traces:     ["allocator.rs:59", "allocator.rs:60", "allocator.rs:61"]

  - id:         MT-FREELIST-DEALLOCATE-NO-DOUBLE-FREE-CHECK
    subject:    FreeList::deallocate
    kind:       error-case
    verifiable: true
    statement:  >
