    traces:     ["lib.rs:102", "lib.rs:312", "lib.rs:426", "lib.rs:436", "lib.rs:596"]

  # -------------------------------------------------------- global invariants
  - id:         MT-INV-SLOT-RANGES-DISJOINT
    subject:    "Global invariant: entries never share bytes"
    kind:       invariant
    verifiable: true
    statement:  >
      At every moment, the byte ranges belonging to two different keys in the pool never overlap,
      so writing through the address obtained for one key can never corrupt the data of another.
    traces:     ["lib.rs:78", "lib.rs:368", "allocator.rs:44", "allocator.rs:46", "allocator.rs:50"]

  - id:         MT-INV-SLOT-WITHIN-POOL
    subject:    "Global invariant: every entry lies inside the pool"
    kind:       invariant
    verifiable: true
    statement:  >
      For every entry the pool holds, its starting offset plus its rounded size never exceeds the
      pool's total size, which is what makes the address handed to the caller a real address
      inside the mapped region; the three places that compute such an address by advancing the
      base pointer rely on this invariant and, contrary to the project's own convention for
      unsafe code, none of them carries a justification comment.
    traces:     ["lib.rs:377", "lib.rs:404", "lib.rs:420", "allocator.rs:44", "allocator.rs:48"]

  - id:         MT-INV-USED-EQUALS-SUM-OF-ENTRIES
    subject:    "Global invariant: bytes used matches the entries held"
    kind:       invariant
    verifiable: true
    statement:  >
      The bytes-used total is always exactly the sum of the rounded sizes of the entries the pool
      currently holds, which is what makes the reported usage trustworthy; every operation that
      adds an entry reserves its space in the same step and every operation that drops an entry
      releases its space in the same step, with the single exception of an insert whose tracking
      step panics, which leaves reserved space with no entry behind it.
    traces:     ["lib.rs:360", "lib.rs:368", "lib.rs:456", "lib.rs:457", "lib.rs:367"]

  - id:         MT-INV-USED-NEVER-EXCEEDS-CAPACITY
    subject:    "Global invariant: usage never exceeds capacity"
    kind:       invariant
    verifiable: true
    statement:  >
      The bytes-used total never exceeds the pool's capacity, because space is only ever marked
      used when it has been carved out of a free run that lies inside the pool.
    traces:     ["allocator.rs:44", "allocator.rs:48", "allocator.rs:53", "lib.rs:186"]

  - id:         MT-INV-CAPACITY-EQUALS-POOL-SIZE
    subject:    "Global invariant: capacity equals the mapped pool size"
    kind:       invariant
    verifiable: true
    statement:  >
      The capacity the component reports is always the same as the size of the memory region it
      actually mapped, both immediately after initialization and after any clear.
    traces:     ["lib.rs:311", "lib.rs:314", "lib.rs:605", "lib.rs:573"]

  - id:         MT-INV-INITIALIZED-IMPLIES-USABLE-POOL
    subject:    "Global invariant: initialized implies a real pool"
    kind:       invariant
    verifiable: true
    statement:  >
      Whenever the component reports itself as initialized, its stored base address is non-null
      and its stored pool size is greater than zero, because a zero size is rejected up front and
      neither allocation path can return a null address without the whole call failing.
    traces:     ["lib.rs:262", "lib.rs:291", "lib.rs:218", "lib.rs:310", "lib.rs:318"]

  - id:         MT-INV-INITIALIZED-MONOTONIC
    subject:    "Global invariant: initialization happens at most once"
    kind:       invariant
    verifiable: true
    statement:  >
      The component has exactly two states, uninitialized and initialized, and the only legal
      transition is from the first to the second, exactly once: nothing ever clears the flag, so
      there is no way to shut the pool down, resize it, or re-initialize it on a different NUMA
      node without destroying the whole component.
    traces:     ["lib.rs:108", "lib.rs:271", "lib.rs:318", "lib.rs:594"]

  - id:         MT-INV-ENTRY-SIZE-POSITIVE
    subject:    "Global invariant: no zero-sized entry exists"
    kind:       invariant
    verifiable: true
    statement:  >
      Every entry the pool holds has a size of at least one byte, because insert rejects a size of
      zero and no other operation creates entries.
    traces:     ["lib.rs:329", "lib.rs:330", "lib.rs:368", "lib.rs:371"]

  - id:         MT-INV-KEY-UNIQUE
    subject:    "Global invariant: at most one entry per key"
    kind:       invariant
    verifiable: true
    statement:  >
      A key never has more than one entry in the pool at a time, which is enforced both by the
      duplicate check in insert and by the keyed map the entries are stored in.
    traces:     ["lib.rs:78", "lib.rs:356", "lib.rs:357", "lib.rs:368"]

  - id:         MT-INV-OFFSET-IS-THE-ONLY-IDENTITY
    subject:    "Global invariant: a slot is identified only by its position"
    kind:       invariant
    verifiable: true
    statement:  >
      The only thing that identifies an entry's storage is its byte position in the pool, and
      positions are freely recycled: when an entry is removed, evicted or cleared away, its
      position goes straight back into the free space and the very next allocation of a similar
      size is given the same position again, with no generation number, epoch, or any other tag
      distinguishing one use of a position from the next; consequently an address the component
      handed out earlier cannot be told apart from a currently valid address for a different key,
      and the interface's promise that an address is "valid until the slot is evicted or removed"
      is unenforceable because nothing in the component can detect that a caller is still holding
      the old one.
    traces:     ["lib.rs:71", "lib.rs:377", "lib.rs:501", "allocator.rs:44", "allocator.rs:82", "imemory_tier.rs:65"]

  - id:         MT-INV-POLICY-AND-POOL-AGREE
    subject:    "Global invariant: the eviction policy and the pool track the same keys"
    kind:       invariant
    verifiable: true
    statement:  >
      Every key the eviction policy tracks for this pool should correspond to an entry the pool
      actually holds and vice versa, since otherwise eviction can free nothing, report phantom
      victims, or never reach a real entry; the component upholds one direction by tracking each
      key as it is inserted, but breaks the other direction in two places, because eviction never
      untracks the victim it destroys and an untracking failure during removal is discarded.
    traces:     ["lib.rs:365", "lib.rs:456", "lib.rs:462", "lib.rs:500", "lib.rs:606"]

  - id:         MT-INV-HANDLE-CAN-OUTLIVE-ENTRY
    subject:    "Global invariant: eviction handles are copies that can outlive their entry"
    kind:       invariant
    verifiable: true
    statement:  >
      An entry's eviction handle is a freely copyable value, and three operations copy it out,
      release the pool lock, and use it afterwards, so a handle in flight can refer to an entry
      that no longer exists by the time it is used; nothing in the component invalidates a copied
      handle or checks that it still belongs to the key it came from.
    traces:     ["lib.rs:73", "lib.rs:406", "lib.rs:514", "lib.rs:550", "lib.rs:554"]

  - id:         MT-INV-NOT-EVICTABLE-NEVER-PRODUCED
    subject:    "Global invariant: one declared error is unreachable"
    kind:       invariant
    verifiable: true
    statement:  >
      The component declares seven kinds of error but only ever produces six of them: the
      not-evictable error, documented as meaning an entry cannot be evicted yet because for
      example its write-through to durable storage has not finished, is never constructed anywhere
      in the implementation, which means there is no pinning or in-flight check at all and a
      caller can never be told that an eviction was refused for that reason.
    traces:     ["imemory_tier.rs:31", "imemory_tier.rs:32", "lib.rs:434", "lib.rs:472"]

  - id:         MT-INV-RECEPTACLE-LOOKUP-PANICS
    subject:    "Global invariant: a missing eviction policy crashes most operations"
    kind:       invariant
    verifiable: true
    statement:  >
      Initialization refuses cleanly when the eviction-policy receptacle is not connected, and
      batch-touch returns quietly in that case, but seven other places fetch the same receptacle
      and unwrap the result, so if the policy is ever disconnected after initialization those
      operations crash the calling thread instead of returning an error, even though the error
      list contains a perfectly suitable not-initialized error that initialization itself uses for
      exactly this condition.
    traces:     ["lib.rs:266", "lib.rs:340", "lib.rs:387", "lib.rs:430", "lib.rs:440", "lib.rs:480", "lib.rs:511", "lib.rs:601"]

  - id:         MT-INV-LOCK-POISONING-CASCADE
    subject:    "Global invariant: one panic disables the whole component"
    kind:       invariant
    verifiable: true
    statement:  >
      Every single lock acquisition in the component unwraps its result, so once any thread panics
      while holding either the component-state lock or the pool lock, every later call on the
      component panics too and there is no way to recover; the panic sites that can start this
      cascade are the unwrapped eviction-policy lookups and the unwrapped tracking call inside
      insert.
    traces:     ["lib.rs:270", "lib.rs:333", "lib.rs:354", "lib.rs:367", "lib.rs:494", "lib.rs:602"]

  - id:         MT-INV-LOCK-ORDER
    subject:    "Global invariant: locks are always taken in the same order"
    kind:       invariant
    verifiable: true
    statement:  >
      Every operation takes the component-state lock first and the inner pool lock second, never
      the other way round, and every call out to the eviction policy for a refresh is made after
      the pool lock has been released; this consistent ordering is what keeps two concurrent
      operations from waiting on each other forever.
    traces:     ["lib.rs:333", "lib.rs:354", "lib.rs:407", "lib.rs:515", "lib.rs:553"]

  - id:         MT-INV-FREE-SPACE-CONSERVATION
    subject:    "Global invariant: free space plus used space equals capacity"
    kind:       invariant
    verifiable: true
    statement:  >
      The sizes of all free runs added together plus the bytes-used total always equal the pool's
      capacity, so no byte of the pool is ever lost or counted twice by the bookkeeping.
    traces:     ["allocator.rs:19", "allocator.rs:48", "allocator.rs:53", "allocator.rs:61", "allocator.rs:82"]

  - id:         MT-INV-FREE-RUNS-DISJOINT-AND-MERGED
    subject:    "Global invariant: free runs are separate and fully merged"
    kind:       invariant
    verifiable: true
    statement:  >
      No two free runs overlap, none has a size of zero, and no two of them are immediately
      adjacent, because whenever a run is released it is merged with any free neighbour on either
      side; without this the allocator would report a large amount of free space that it could
      never hand out in one piece.
    traces:     ["allocator.rs:49", "allocator.rs:50", "allocator.rs:67", "allocator.rs:77", "allocator.rs:82"]

  - id:         MT-INV-USED-IS-ALIGNED
    subject:    "Global invariant: bytes used is always a whole number of 4 KiB units"
    kind:       invariant
    verifiable: true
    statement:  >
      The bytes-used total is always a multiple of 4096, because every amount added to it and
      every amount taken from it is first rounded up to the next 4 KiB boundary.
    traces:     ["allocator.rs:5", "allocator.rs:42", "allocator.rs:53", "allocator.rs:60", "allocator.rs:61"]

  - id:         MT-INV-UNALIGNED-CAPACITY-TAIL
    subject:    "Global invariant: a pool size that is not a multiple of 4 KiB wastes its tail"
    kind:       invariant
    verifiable: true
    statement:  >
      Nothing requires the requested pool size to be a whole number of 4 KiB units, and when it is
      not, the leftover bytes at the end of the pool can never be allocated to anyone, so the
      component reports a capacity it can never fully use and no warning is given; the allocator
      does stay safe in this case, because a request is only satisfied by a run at least as long as
      the rounded size.
    traces:     ["lib.rs:262", "lib.rs:314", "allocator.rs:19", "allocator.rs:42", "allocator.rs:44"]

  - id:         MT-INV-ENTRY-SIZE-NARROW-FIELD
    subject:    "Global invariant: entry sizes are limited to a 32-bit range"
    kind:       invariant
    verifiable: true
    statement:  >
      An entry's size is stored in a 32-bit field while the pool's capacity and usage are counted
      in machine-word-sized numbers, so no single entry can ever be larger than four gigabytes
      even in a much larger pool; the conversions the code performs all widen the 32-bit size to
      the larger type and therefore lose nothing, but a caller wanting one very large entry has no
      way to ask for it and must discover the limit from the type alone.
    traces:     ["lib.rs:72", "lib.rs:362", "lib.rs:457", "lib.rs:501", "imemory_tier.rs:67"]

  - id:         MT-INV-DMA-FLAG-SET-ONLY-AT-INIT
    subject:    "Global invariant: the direct-transfer flag is fixed at initialization"
    kind:       invariant
    verifiable: true
    statement:  >
      Whether the pool supports direct device transfers is decided once, while the pool is being
      created, and never changes afterwards, so the answer the component gives is stable for its
      whole lifetime.
    traces:     ["lib.rs:87", "lib.rs:300", "lib.rs:306", "lib.rs:317", "lib.rs:612"]

  - id:         MT-INV-MODULE-DOC-LOCKING-CLAIM
    subject:    "Global invariant: the documented locking discipline holds"
    kind:       invariant
    verifiable: true
    statement:  >
      The module documentation claims that lookups, peeks, batch refreshes and presence checks take
      only a shared lock while inserts, removals and evictions take an exclusive one, and that
      eviction-order refreshes happen after the pool lock is released; the implementation does match
      this claim at every one of those call sites, so the documented discipline is a real property
      rather than an aspiration.
    traces:     ["lib.rs:8", "lib.rs:9", "lib.rs:10", "lib.rs:401", "lib.rs:454", "lib.rs:553"]

  # ------------------------------------------------- not-verifiable ledger
  - id:         NV-1
    scope:      "Success of the underlying memory calls: mmap, spdk_zmalloc, munmap, spdk_free"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Whether the operating system or the SPDK allocator can satisfy a request for hundreds of
      megabytes, and whether the release call succeeds, depends on the machine's configuration and
      on how much memory other processes are using; this is an assumption about the environment,
      not behaviour of the component that a checker could falsify.
    traces:     ["lib.rs:195", "lib.rs:207", "lib.rs:284", "lib.rs:125", "lib.rs:132"]

  - id:         NV-2
    scope:      "Actual NUMA placement of the pool's pages"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Whether the kernel really places the pool's pages on the requested memory node, and what
      error it reports if it cannot, is decided by the kernel's memory policy machinery and the
      machine's topology; only the component's reaction to success or failure can be checked, not
      the placement itself.
    traces:     ["lib.rs:233", "lib.rs:244", "lib.rs:247"]

  - id:         NV-3
    scope:      "Content and delivery of log messages"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The wording of the informational and warning messages is not observable behaviour that a
      checker can meaningfully falsify. Worth noting as a defect all the same: the initialization
      message divides the pool size by a megabyte using integer division, so any pool smaller than
      one megabyte is announced as a "0 MiB pool".
    traces:     ["lib.rs:320", "lib.rs:321", "lib.rs:322", "lib.rs:245", "lib.rs:296"]

  - id:         NV-4
    scope:      "Lock-contention counter values"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      How many times a lock is found to be busy depends entirely on thread scheduling, so the
      counters can legitimately hold any value from zero upwards for the same workload; only the
      fact that they never decrease is checkable, and that is recorded as a separate obligation.
    traces:     ["lib.rs:343", "lib.rs:348", "lib.rs:390", "lib.rs:534"]

  - id:         NV-5
    scope:      "Freedom from deadlock and progress under contention"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Whether concurrent callers eventually make progress is an unbounded liveness question about
      the reader-writer locks and the scheduler; the checkable part, that locks are always taken in
      the same order, is recorded as a separate obligation.
    traces:     ["lib.rs:333", "lib.rs:354", "lib.rs:602"]

  - id:         NV-6
    scope:      "The hand-written promise that the component may be shared across threads"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The claim that the raw pool address stays valid and usable from any thread is an assumption
      about the memory the operating system gave us rather than a property of this code; note also
      that the justification calls the stored address immutable while the destructor does in fact
      overwrite it.
    traces:     ["lib.rs:92", "lib.rs:93", "lib.rs:95", "lib.rs:96", "lib.rs:134"]

  - id:         NV-7
    scope:      "Missing safety justifications on the three pointer-arithmetic sites"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The project requires every unsafe block to carry a written justification, and the three places
      that build an entry's address by advancing the pool's base pointer carry none; this is a
      documentation-convention gap rather than a behaviour a checker can falsify, and the underlying
      in-bounds requirement is recorded as its own obligation.
    traces:     ["lib.rs:377", "lib.rs:404", "lib.rs:420"]

  - id:         NV-8
    scope:      "The published default pool size constant"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The exported constant naming a 256 mebibyte default is a plain numeric fact that gates no
      behaviour in this component, and nothing inside the component reads it; only a caller that
      chooses to pass it to initialization gives it any effect.
    traces:     ["lib.rs:33", "lib.rs:34"]

  - id:         NV-9
    scope:      "Which code exists under the telemetry and SPDK build options"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Whether the telemetry counters and the SPDK allocation path are compiled in at all is decided
      when the crate is built, so it is a build-configuration fact rather than a runtime behaviour;
      each configuration's behaviour is covered by the obligations above.
    traces:     ["lib.rs:20", "lib.rs:37", "lib.rs:277", "lib.rs:305", "lib.rs:616"]

  - id:         NV-10
    scope:      "The unit tests in the two test modules"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The tests are themselves checks of the behaviour described above rather than obligations the
      component must meet; they are listed here only so that no part of the source is left
      unaccounted for. They exercise double initialization, insert-and-look-up, duplicate and
      zero-size rejection, removal and reuse, eviction, the pool-full error, capacity and usage,
