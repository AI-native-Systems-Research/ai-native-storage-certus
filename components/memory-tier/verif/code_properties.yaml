    traces:     ["lib.rs:638", "lib.rs:639", "allocator.rs:86", "allocator.rs:87", "imemory_tier.rs:139"]

  - id:         NV-11
    scope:      "The caller's obligation not to use an address after its entry is gone"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Once the component has handed out a raw address, nothing it does can prevent the caller from
      reading or writing that address after the entry has been removed, evicted or cleared; this is
      a caller-side memory-safety assumption. The component-side consequence, that positions are
      recycled with nothing distinguishing one use from the next, is recorded as its own obligation.
    traces:     ["imemory_tier.rs:63", "imemory_tier.rs:65", "lib.rs:378", "lib.rs:501"]

  - id:         NV-12
    scope:      "The behaviour of the bound eviction policy"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      What the eviction policy does when asked to create a pool, track a key, name the next victim,
      refresh an entry, or clear a pool is implemented in a different component and cannot be
      established from this source; every obligation above is stated in terms of what this component
      asks for and how it reacts to the answer.
    traces:     ["lib.rs:308", "lib.rs:366", "lib.rs:431", "lib.rs:441", "lib.rs:606"]

  - id:         NV-13
    scope:      "Exact telemetry values observed under relaxed memory ordering"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The counters are read and written with the weakest memory ordering, so a snapshot taken while
      other threads are working may return values from slightly different instants and the three
      numbers need not be mutually consistent; the precise values are therefore not a falsifiable
      property, though their never decreasing is.
    traces:     ["lib.rs:49", "lib.rs:348", "lib.rs:620", "lib.rs:624"]
