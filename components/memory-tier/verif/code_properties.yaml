  # ------------------------------------------------------ drop / default state
  - id:         MT-DROP-POST-UNMAP
    subject:    Drop for MemoryTierState
    kind:       postcondition
    verifiable: true
    statement:  >
      When the component is destroyed, a pool that came from the ordinary memory-mapping path is
      handed back to the operating system and the stored base address is set to null, so the
      region is released exactly once even if the destructor logic runs on a state that was never
      initialized, which it detects by the null address and returns immediately.
    traces:     ["lib.rs:117", "lib.rs:118", "lib.rs:131", "lib.rs:132", "lib.rs:134"]

  - id:         MT-DROP-SPDK-LEAK
    subject:    Drop for MemoryTierState
    kind:       error-case
    verifiable: true
    statement:  >
      For a pool obtained from the SPDK allocator the destructor frees it only while the SPDK
      environment is still active; if that environment has already been shut down, the destructor
      nulls the stored address and returns without freeing anything and without falling back to
      unmapping, so the entire pool, typically hundreds of megabytes, is leaked silently and no
      warning is logged.
    traces:     ["lib.rs:121", "lib.rs:122", "lib.rs:123", "lib.rs:128", "lib.rs:129"]

  - id:         MT-DROP-DOES-NOT-UNTRACK
    subject:    Drop for MemoryTierState
    kind:       error-case
    verifiable: true
    statement:  >
      Destroying the component releases its memory but never tells the eviction policy that the
      pool is gone: the policy keeps the pool identifier and every entry it was tracking, so a
      policy shared with other components accumulates candidates that point into memory which no
      longer exists.
    traces:     ["lib.rs:117", "lib.rs:134", "lib.rs:606", "lib.rs:308"]

  - id:         MT-DEFAULT-STATE-POST
    subject:    Default for MemoryTierState
    kind:       postcondition
    verifiable: true
    statement:  >
      A freshly created component starts with a null base address, a pool size of zero, a
