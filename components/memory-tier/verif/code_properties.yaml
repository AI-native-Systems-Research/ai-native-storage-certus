  - id:         MT-FREELIST-ALLOCATE-FIRST-FIT
    subject:    FreeList::allocate
    kind:       postcondition
    verifiable: true
    statement:  >
      The allocator scans its free runs in increasing order of position and takes the first one
      that is large enough, which is the first-fit strategy the module documentation claims; it
      therefore always returns the lowest possible starting offset among the runs that fit, and
      never the best-fitting or largest run.
    traces:     ["allocator.rs:1", "allocator.rs:7", "allocator.rs:10", "allocator.rs:44"]

  - id:         MT-FREELIST-ALLOCATE-ERR-ZERO
    subject:    FreeList::allocate
    kind:       error-case
    verifiable: true
    statement:  >
      A request for zero bytes fails without reserving anything and without changing the free
      runs or the bytes-used total.
    traces:     ["allocator.rs:39", "allocator.rs:40"]

  - id:         MT-FREELIST-ALLOCATE-ERR-NO-FIT
    subject:    FreeList::allocate
    kind:       error-case
    verifiable: true
    statement:  >
      When no single free run is long enough for the rounded request, the allocation fails and,
      because the search happens before any modification, the free runs and the bytes-used total
      are left exactly as they were.
    traces:     ["allocator.rs:44", "allocator.rs:46", "allocator.rs:53"]

  - id:         MT-FREELIST-ALLOCATE-ROUNDING-OVERFLOW
    subject:    FreeList::allocate
    kind:       error-case
    verifiable: true
    statement:  >
      The allocator rounds the requested size up to the next 4 KiB boundary before any bounds
      check at all, and that rounding is unchecked arithmetic: a request within 4095 bytes of the
      largest representable size crashes the process in a debug build and, in a release build,
      silently wraps round to a tiny or zero rounded size that is then compared against the free
      runs, so an absurdly large request could be answered with a tiny allocation.
    traces:     ["allocator.rs:39", "allocator.rs:42", "allocator.rs:44"]

  - id:         MT-FREELIST-ALLOCATE-FRAME
    subject:    FreeList::allocate
    kind:       frame
    verifiable: true
    statement:  >
      Allocation never changes the total capacity and never moves or shrinks any free run other
      than the single run it takes space from.
    traces:     ["allocator.rs:44", "allocator.rs:46", "allocator.rs:50", "allocator.rs:29"]

  - id:         MT-FREELIST-DEALLOCATE-PRE
    subject:    FreeList::deallocate
    kind:       precondition
    verifiable: true
    statement:  >
      The caller of deallocate must pass the exact starting offset of a run that is currently
      allocated together with the exact size that was originally requested for it; the documented
      rule is stated in a comment and is never checked by the code, and violating it silently
      corrupts the free-space bookkeeping instead of reporting an error.
    traces:     ["allocator.rs:57", "allocator.rs:58", "allocator.rs:59", "allocator.rs:60"]

  - id:         MT-FREELIST-DEALLOCATE-POST
    subject:    FreeList::deallocate
    kind:       postcondition
    verifiable: true
    statement:  >
      Deallocating returns the run's rounded number of bytes to the free space and reduces the
      bytes-used total by that same amount, making those bytes available to later allocations.
    traces:     ["allocator.rs:60", "allocator.rs:61", "allocator.rs:82"]

  - id:         MT-FREELIST-DEALLOCATE-COALESCE
    subject:    FreeList::deallocate
    kind:       postcondition
    verifiable: true
    statement:  >
      When the freed run directly abuts a free run before it, a free run after it, or both, the
      neighbours are merged with it into a single larger free run, so that space freed in pieces
      can later satisfy one large request.
    traces:     ["allocator.rs:67", "allocator.rs:68", "allocator.rs:76", "allocator.rs:77", "allocator.rs:82"]

  - id:         MT-FREELIST-DEALLOCATE-UNDERFLOW
    subject:    FreeList::deallocate
    kind:       error-case
    verifiable: true
    statement:  >
      Deallocate subtracts from the bytes-used total as its very first action, before it looks at
      the free runs at all and without ever checking that the run being freed was actually
      allocated or that the total is large enough; an unmatched or oversized release therefore
      crashes the process in a debug build and, in a release build, wraps the bytes-used total
