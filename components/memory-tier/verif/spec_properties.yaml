      never built, so no obligation can be taken from this text. The requirement side of the
      contradiction is captured as properties stating that the pool is one global region, that the key
      argument to the space-freeing operation is ignored, and that no rotation state exists.
    traces:     ["plan.md Memory Layout", "plan.md Pointer Arithmetic", "plan.md Concurrency Model", "plan.md Key Design Decisions 1 and 6", FR-005, FR-013, FR-014]

