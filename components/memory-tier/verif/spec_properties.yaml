  # ------------------------------------------------- global state invariants
  - id:         MT-INV-USED-WITHIN-CAPACITY
    subject:    "global invariant: allocated bytes never exceed pool capacity"
    kind:       invariant
    verifiable: true
    statement:  >
      At every point in the component's life the number of bytes reported as in use is between zero
      and the pool's total capacity inclusive, so the cache can never claim to hold more data than
      the pool can physically contain.
    traces:     [US-5, FR-010, SC-4]

  - id:         MT-INV-SLOT-REGIONS-DISJOINT
    subject:    "global invariant: live entries never share memory"
    kind:       invariant
    verifiable: true
    statement:  >
      No two entries that are in the cache at the same time occupy overlapping memory, so writing
      through the address of one entry can never corrupt the data of another.
    traces:     [FR-007, FR-026, SC-3, "spec.md Key Entities: Slot maps a key to an offset and size"]

  - id:         MT-INV-POINTERS-INSIDE-POOL
    subject:    "global invariant: every handed-out address lies inside the pool"
    kind:       invariant
    verifiable: true
    statement:  >
      Every memory address the component gives out for an entry, together with the whole block of
      bytes that entry is said to occupy, lies inside the single region of memory reserved when the
      pool was set up, so a caller writing within the stated size can never write outside the pool.
    traces:     [FR-001, FR-022, "plan.md: Pointer Arithmetic"]

  - id:         MT-INV-FOUR-KIB-ALIGNMENT
    subject:    "global invariant: four-kibibyte alignment of all allocations"
    kind:       invariant
    verifiable: true
    statement:  >
      Every entry's position within the pool and every entry's reserved length are whole multiples
      of four kibibytes, which is what makes the addresses usable for direct disk transfers.
    traces:     [FR-004, SC-4, NFR-010]

  - id:         MT-INV-SIZE-ACCOUNTING
    subject:    "global invariant: reported entry size versus space charged"
    kind:       invariant
    verifiable: true
    statement:  >
      For each entry the size reported back to callers on lookup is the size they originally asked
      for, while the space charged against the pool is that size rounded up to the next multiple of
      four kibibytes; the difference, which can be up to 4095 bytes per entry, is accounted as used
      space and is never handed to another entry.
    traces:     [FR-004, US-5, "spec.md Implementation Notes: small objects waste up to 4095 bytes"]

  - id:         MT-INV-UNIQUE-KEY
    subject:    "global invariant: at most one entry per key"
    kind:       invariant
    verifiable: true
    statement:  >
      The cache holds at most one entry for any given key at any time, so a lookup can never be
      ambiguous and a deletion can never leave a second copy behind.
    traces:     [FR-009, FR-007, US-1]

  - id:         MT-INV-OBSERVER-CONSISTENCY
    subject:    "global invariant: all observers agree about which keys are present"
    kind:       invariant
    verifiable: true
    statement:  >
      The presence check, the two lookup operations, the count returned when the cache is wiped, and
      the bytes-in-use figure all agree about which entries exist: a key reported as present is
      exactly a key whose lookups succeed and whose space is included in the bytes in use.
    traces:     [US-1, US-4, US-5, FR-018]

  - id:         MT-INV-INITIALIZE-ONCE-ONLY
    subject:    "global invariant: set-up happens at most once and is never undone"
    kind:       invariant
    verifiable: true
    statement:  >
      Setting up the pool is a one-way step: once it has succeeded the component stays set up for the
      rest of its life, its capacity and base address never change, and no operation on the public
      interface returns it to the not-set-up state.
    traces:     [US-3, FR-023, "spec.md Implementation Notes: after initialization the immutable state fields do not change"]

  - id:         MT-INV-POOL-BASE-STABLE
    subject:    "global invariant: the pool's memory is never moved or resized"
    kind:       invariant
    verifiable: true
    statement:  >
      Once the pool exists, its starting address and total size stay the same no matter what
      sequence of insertions, lookups, deletions, evictions, or wipes is performed, which is what
      makes it safe for an outside party such as a GPU driver to register that range once and keep
      using it.
    traces:     [FR-022, US-5, FR-001]

  - id:         MT-INV-POINTER-STABLE-UNTIL-FREED
    subject:    "global invariant: an entry's address stays valid until that entry goes away"
    kind:       invariant
    verifiable: true
    statement:  >
      The address given out for an entry remains valid and keeps pointing at that entry's own data
      until the entry is explicitly deleted or evicted; until then the component never moves the
      entry and never re-uses its memory for a different entry.
    traces:     ["imemory_tier.rs: insert doc comment", FR-011, US-1]

  - id:         MT-INV-ALLOCATOR-SLOT-MAP-AGREEMENT
    subject:    "global invariant: no leaked or double-booked space"
    kind:       invariant
    verifiable: true
    statement:  >
      Every byte of the pool is either free or belongs to exactly one entry that is currently in the
      cache, so repeatedly adding and removing entries can never lose space permanently and can
      never hand the same space out twice.
    traces:     [FR-007, FR-026, SC-5, US-4]

  - id:         MT-INV-FREE-LIST-COALESCING
    subject:    "global invariant: adjacent freed space merges back into one usable run"
    kind:       invariant
    verifiable: true
    statement:  >
      When two entries that sat next to each other in the pool are both removed, their space merges
      into one larger free run, so an insertion as large as the two of them together succeeds
      afterwards.
    traces:     [FR-026, US-4, "plan.md: coalesce_adjacent"]

  - id:         MT-INV-NEVER-NOT-EVICTABLE
    subject:    "global invariant: the not-evictable error is never produced"
    kind:       invariant
    verifiable: true
    statement:  >
      No operation of the component ever returns the not-evictable error, because that error value
      exists only as a placeholder for a future feature that protects entries during write-through
      and no such protection is implemented.
    traces:     ["spec.md Implementation Notes: NotEvictable reserved for future use", "plan.md: Error Handling Strategy", "plan.md Future Considerations 3"]

  - id:         MT-INV-DEFAULT-POOL-SIZE-NEVER-APPLIED
    subject:    "global invariant: the published default pool size is never substituted"
    kind:       invariant
    verifiable: true
    statement:  >
      The component never silently uses its published default pool size of 256 mebibytes; the size of
      a pool is always exactly the size the caller passed when setting it up, since every set-up call
      requires an explicit size.
    traces:     [NFR-007, "spec.md Implementation Notes: DEFAULT_POOL_SIZE is currently unused by any call site"]

  - id:         MT-INV-NO-INTERNAL-VICTIM-SELECTION-STATE
    subject:    "global invariant: the component keeps no victim-selection state of its own"
    kind:       invariant
    verifiable: true
    statement:  >
      All decisions about which entry to evict come from the external eviction-policy component; the
      memory tier itself stores no ordering, rotation, or region-selection information, so its
      eviction behaviour is fully determined by that policy plus the current cache contents.
    traces:     [FR-013, FR-014, FR-024, "spec.md Spec-Sync Notes: no internal round-robin counter or shard-selection state"]

  - id:         MT-INV-LOGGER-OPTIONAL
    subject:    "global invariant: results do not depend on whether a logger is attached"
    kind:       invariant
    verifiable: true
    statement:  >
      Every operation returns the same result and leaves the cache in the same state whether or not
      the optional logging component is attached, so logging is never required for correct operation.
    traces:     [FR-025, "plan.md: logger receptacle is optional, best-effort"]

  - id:         MT-INV-CONCURRENT-STRUCTURAL-INTEGRITY
    subject:    "global invariant: concurrent use cannot corrupt the cache"
    kind:       invariant
    verifiable: true
    statement:  >
      When many threads use the component at the same time, the cache always ends up in a state that
      satisfies all of its structural rules: entries never overlap, no key appears twice, no space is
      lost or double-booked, and the bytes-in-use figure still matches the entries that are present.
    traces:     [SC-3, NFR-002, NFR-004, FR-006]

  # ---------------------------------------- not-verifiable coverage ledger
  - id:         MT-NV-01-MMAP-CONTIGUOUS-REGION
    scope:      "FR-001 — pool is allocated as a single contiguous memory mapping"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This names the operating-system mechanism used to obtain the memory rather than a behaviour a
      caller can observe through the component's operations; which system call produced the memory
      cannot be checked from the outside. The observable consequences that matter are captured
      separately as the rules that every entry address lies inside one reported region.
    traces:     [FR-001]

  - id:         MT-NV-02-HUGEPAGE-BACKING
    scope:      "FR-002 — large-page backing is preferred with automatic fallback"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Whether the memory ended up on large pages depends on how the machine is configured at the
      moment of the call, so it is an environment fact rather than a property of the component. The
      part that is a real obligation, namely that set-up still succeeds when large pages are
      unavailable, is recorded as its own property.
    traces:     [FR-002, US-3]

