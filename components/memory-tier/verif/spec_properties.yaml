    subject:    telemetry_snapshot
    kind:       frame
    verifiable: true
    statement:  >
      Reading the telemetry snapshot neither resets nor otherwise alters the counters and changes
      nothing about the cache, so two readings taken with no activity in between are identical.
    traces:     [FR-028, US-7]

  - id:         MT-TELEMETRY-SNAPSHOT-INV-MONOTONIC
    subject:    telemetry_snapshot
    kind:       invariant
    verifiable: true
    statement:  >
      Every telemetry counter only ever grows as the component is used and never decreases, except
      when the dedicated reset operation is deliberately called.
