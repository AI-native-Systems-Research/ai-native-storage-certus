  # --------------------------------------------------------- telemetry_snapshot
  - id:         MT-TELEMETRY-SNAPSHOT-PRE
    subject:    telemetry_snapshot
    kind:       precondition
    verifiable: true
    statement:  >
      The telemetry snapshot may be requested at any time, including before the pool has been set up
      and regardless of whether the optional counter-tracking build option was enabled, and it
      always returns a set of numbers rather than failing.
    traces:     [US-7, FR-028]

  - id:         MT-TELEMETRY-SNAPSHOT-POST-ZERO-WHEN-DISABLED
    subject:    telemetry_snapshot
    kind:       postcondition
    verifiable: true
    statement:  >
      When the component was built without the optional counter-tracking option, the telemetry
      snapshot reports zero for every counter, so callers see a well-defined empty reading rather
      than stale or invented numbers.
    traces:     [FR-028, US-7, NFR-011]

  - id:         MT-TELEMETRY-SNAPSHOT-POST-EVICTION-COUNT
    subject:    telemetry_snapshot
    kind:       postcondition
    verifiable: true
    statement:  >
      When the component was built with the optional counter-tracking option, the eviction counter
      in the snapshot equals the total number of entries that have actually been evicted since the
      counters were last reset, counting each successful eviction exactly once and counting nothing
      when an eviction attempt found the cache empty.
    traces:     [FR-027, US-7]

  - id:         MT-TELEMETRY-SNAPSHOT-POST-NO-CONTENTION-WHEN-UNCONTENDED
    subject:    telemetry_snapshot
    kind:       postcondition
    verifiable: true
    statement:  >
      When only one thread has ever used the component, both lock-contention counters in the
      snapshot remain zero, because a contention is recorded only when an operation fails to take
      the lock on its first attempt.
    traces:     [FR-027, US-7, "spec.md Implementation Notes: a failed first try_read/try_write attempt bumps the counter"]

