- id: D-RANGE-FR-019-b98877
  name: 'Input range: the NUMA node is absent, -1 (any), or a node id in 0..64 that fits the single-word nodemask'
  kind: input-range-mismatch
  methods:
  - initialize
  spec_says: numa_node is Option<i32>; Some(node) with node >= 0 binds the pool via mbind(MPOL_BIND), None uses
    default placement, and a failed binding falls back gracefully (imemory_tier.rs:57-60, FR-019, US-3 spec.md:71).
    No upper bound on node is stated, and negative Some values are not described.
  code_does: 'mmap path: negative nodes are silently ignored (lib.rs:226); node_id >= 64 leaves the one-word nodemask
    at 0 (lib.rs:228-231) yet mbind is still called with maxnode = node_id + 2 (lib.rs:240), which for node_id >=
    64 makes the kernel read BITS_TO_LONGS(node_id+1) words from an 8-byte stack variable (out-of-bounds user read;
    bits beyond word 0 are garbage). SPDK path: the raw value (or -1 for None) is passed unchecked to spdk_zmalloc
    as the socket id (lib.rs:280,287), so a negative value other than -1 or an out-of-range node yields AllocationFailed
