  - telemetry_snapshot
  spec_says: When many threads use the component at the same time the cache always ends up in a state that satisfies
    all of its structural rules -- entries never overlap, no key appears twice, no space is lost or double-booked
    and the bytes-in-use figure still matches the entries held -- which the code secures by always taking the component-state
    lock first and the inner pool lock second, never the other way round, and by making every call out to the eviction
    policy after the pool lock has been released.
  code_does: Spec states the outcome (structural rules always hold under concurrent use, SC-3/NFR-002); the code
    only states the mechanism (a single consistent lock order and policy calls made outside the pool lock), and
    that mechanism is precisely what creates the stale-handle window recorded as MT-INV-HANDLE-CAN-OUTLIVE-ENTRY,
    so the mechanism does not by itself establish the outcome.
  spec_pointers:
