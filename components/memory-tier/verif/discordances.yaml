- id: D-FR-004-lib.rs:377-444f51
  kind: spec-not-found-in-code
  methods:
  - insert
  - get
  - peek
  spec_says: Every address handed back when adding a cache entry starts on a four-kibibyte boundary, so the memory
    can be used directly as the source or destination of a disk transfer without any extra copying or realignment.
  code_does: The specification makes alignment of the returned address an explicit obligation (FR-004, SC-4, NFR-010);
    the code never states or checks it anywhere -- it follows only indirectly from the pool starting at a page boundary
    and every allocation being rounded to four kibibytes, and nothing in the allocator guards it.
