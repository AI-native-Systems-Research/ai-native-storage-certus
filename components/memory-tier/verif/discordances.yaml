- id: D-FR-011-lib.rs:383-81dfd5
  kind: spec-and-code-differ
  methods:
  - get
  spec_says: Looking up a key that is not in the cache reports absence rather than returning a stale or invalid
    memory address. Looking up any key before the pool has been set up reports absence, because the operation checks
    that the component is set up before doing anything else.
  code_does: Get reports nothing found both when the pool has no entry for the key and when the component has not
    been initialized, so a caller cannot tell a genuine cache miss apart from an unusable component; in the uninitialized
    case no eviction-order refresh happens either.
