- id: D-FR-011-lib.rs:383-81dfd5
  kind: spec-and-code-differ
  methods:
  - get
  spec_says: The recency-updating lookup reports that nothing was found both when the cache holds no entry for the
    key and when the pool has never been set up, rather than returning a stale or invalid address.
  code_does: The spec states the two cases as separate obligations (a genuine miss under FR-011 and the set-up check
    under FR-023); the code collapses them into one indistinguishable 'nothing found' answer at lib.rs:383, so a
    caller can never tell a real cache miss from an entirely unusable component.
  spec_pointers:
