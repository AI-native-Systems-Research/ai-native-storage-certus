discordances:
- id: D-US-3-lib.rs:271-9b3c9c
  kind: spec-and-code-differ
  methods:
  - initialize
  spec_says: A second attempt to set up the memory pool on a component that is already set up fails with an error
    and leaves the existing pool completely untouched instead of replacing it.
  code_does: Spec requires the failure but deliberately leaves the error value unnamed; code returns the generic
    allocation-failed error carrying the text 'already initialized' (lib.rs:271-273) even though a dedicated already-initialized/invalid-state
    error value exists in the interface (imemory_tier.rs:28), so callers cannot distinguish a double set-up from
    a genuine out-of-memory condition.
  spec_pointers:
  - US-3
  - FR-023
  - 'plan.md: initialize_twice_fails'
  code_pointers:
  - lib.rs:271
  - lib.rs:272
  - lib.rs:273
  - imemory_tier.rs:28
  status: candidate
  excluded_properties:
  - MT-INIT-ERR-DOUBLE-INIT
  extraction_sides:
    spec:
    - MT-INITIALIZE-ERR-DOUBLE-INIT
    code:
    - MT-INITIALIZE-ERR-ALREADY-INITIALIZED
- id: D-FR-024-lib.rs:266-8a9610
  kind: spec-and-code-differ
  methods:
  - initialize
  spec_says: If the external eviction-policy receptacle has not been connected when the pool is set up, the set-up
    call fails before any memory is allocated rather than producing a pool that could never choose a victim.
  code_does: Spec states only that the set-up call must fail when the policy is not connected; code reports this
    as a not-initialized error whose message mentions the receptacle (lib.rs:266-268), reusing the same error value
    that every other operation uses for 'pool not initialized', so the two very different causes are indistinguishable
    to a caller.
  spec_pointers:
  - FR-024
  - 'plan.md: Required Receptacles'
  code_pointers:
