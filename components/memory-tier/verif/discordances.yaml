- id: D-RANGE-US-3-ec579e
  name: 'Input range: the requested pool size is a whole multiple of 4 KiB'
  kind: input-range-mismatch
  methods:
  - initialize
  - insert
  - capacity
  - free_capacity
  - clear
  spec_says: initialize allocates a pool of the specified size, only zero is rejected, and capacity() returns the
    total pool size (US-3 spec.md:68,73; US-5 spec.md:103); after clear the whole pool is reusable (FR-018, US-4
    spec.md:89-90); free_capacity = capacity - used for proactive-eviction triggers (FR-029). The spec places no
    alignment requirement on pool_size.
  code_does: FreeList::new(pool_size) seeds one free run of pool_size bytes (lib.rs:314, lib.rs:605, allocator.rs:16-19)
    but every request is rounded up to 4096 (allocator.rs:42), so the trailing pool_size % 4096 bytes can never
    be allocated, while capacity() (lib.rs:573) and free_capacity() (lib.rs:186) still count them; e.g. after clear
    an insert of capacity() bytes returns PoolFull. pool_size is never checked for 4 KiB alignment (lib.rs:262 checks
    only != 0).
  spec_pointers:
  - US-3
  - US-5
  - FR-004
  - FR-018
  - FR-029
  - spec.md:68
  - spec.md:73
  - spec.md:103
  - spec.md:243
  code_pointers:
  - lib.rs:262
  - lib.rs:314
  - lib.rs:605
  - allocator.rs:19
  - allocator.rs:42
  - lib.rs:573
  - lib.rs:186
  status: candidate
  assume_in_level2: the requested pool size is a whole multiple of 4 KiB
  assume_rust: pool_size % 4096 == 0
  excluded_properties: []
- id: D-RANGE-FR-002-fad39d
  name: 'Input range: the requested pool size is a whole multiple of the system''s default hugepage size (2 MiB)
    whenever the hugepage mapping is the one used'
  kind: input-range-mismatch
  methods:
  - initialize
  - Drop for MemoryTierState
  spec_says: hugepage backing (MAP_HUGETLB) is preferred with automatic fallback (FR-002), and pool memory is properly
    freed on Drop via munmap or spdk_free (NFR-006, SC-2 'no memory leaks'); the spec places no constraint on pool_size
    other than > 0 (US-3 spec.md:73).
  code_does: alloc_mmap maps pool_size bytes with MAP_HUGETLB first (lib.rs:196-203); the kernel rounds the mapping
    up to the hugepage size, but Drop calls munmap(pool_ptr, pool_size) and ignores the return value (lib.rs:132).
    For a hugetlb mapping munmap requires a hugepage-multiple length (unaligned split of a hugetlb VMA is EINVAL),
    so a pool_size that is not a multiple of the hugepage size (2 MiB default) is silently leaked on Drop; the same
    length is passed to mbind (lib.rs:233-243), which then fails into the warning path.
  spec_pointers:
  - FR-002
  - NFR-006
  - Success Criteria 2 (spec.md:230)
  - US-3
  code_pointers:
