  spec_says: The address given out for an entry remains valid and keeps pointing at that entry's own data until
    that entry is explicitly deleted or evicted; until then the component never moves the entry and never re-uses
    its memory for a different entry.
  code_does: Spec and the interface doc promise validity until the entry itself is deleted or evicted; the code
    adds two unstated ways to break that promise -- a wipe of the whole cache invalidates every outstanding address
    at once (lib.rs:604-605), and because a byte position is an entry's only identity, a freed position is recycled
