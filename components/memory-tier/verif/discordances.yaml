  methods:
  - clear
  - capacity
  - pool_info
  - is_dma_capable
  spec_says: 'Wiping the cache removes the entries but keeps the pool itself: the total capacity, the pool''s base
    address, and whether the memory is directly usable by storage hardware are all unchanged, and the component
    remains set up and ready for new insertions.'
  code_does: Clear rebuilds the free-space bookkeeping from the pool size stored in the component rather than from
    the capacity the old bookkeeping reported, so the two values must always agree; if they ever diverged, clearing
    would silently change the pool's reported capacity and could hand out addresses outside the real memory region.
