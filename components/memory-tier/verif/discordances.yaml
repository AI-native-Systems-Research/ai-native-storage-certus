  spec_says: 'When many threads use the component at the same time, the cache always ends up in a state that satisfies
    all of its structural rules: entries never overlap, no key appears twice, no space is lost or double-booked,
    and the bytes-in-use figure still matches the entries that are present.'
  code_does: Every operation takes the component-state lock first and the inner pool lock second, never the other
    way round, and every call out to the eviction policy for a refresh is made after the pool lock has been released;
    this consistent ordering is what keeps two concurrent operations from waiting on each other forever.
