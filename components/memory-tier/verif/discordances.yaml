routed_to_other_tools:
- property: MT-EVICT-NEXT-POST-LRU-ORDER
  name: Evict next lru order
  methods:
  - evict_next
  - evict_next_for_key
  - get
  - touch
  - batch_touch
  statement: With the least-recently-used policy that the system currently binds, an entry that has been read or
    explicitly refreshed more recently is never evicted before an entry that has not been used since.
  reason: external
  checked_by: test
  why: The victim ordering is computed entirely inside the bound eviction-policy-lru component; the memory tier
    only forwards touches and asks for a victim.
