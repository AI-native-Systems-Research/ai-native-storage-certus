- id: D-FR-007-allocator.rs:4853-a8fb3d
  name: No leaked or double booked space
  kind: spec-and-code-differ
  methods:
  - insert
  - remove
  - evict_next
  - evict_next_for_key
  - clear
  - used
  - capacity
  - free_capacity
  spec_says: Every byte of the pool is either free or belongs to exactly one entry that is currently in the cache,
    so repeatedly adding and removing entries can never lose space permanently and can never hand the same space
    out twice.
  code_does: The bytes-used total is always exactly the sum of the rounded sizes of the entries the pool currently
    holds, which is what makes the reported usage trustworthy; every operation that adds an entry reserves its space
    in the same step and every operation that drops an entry releases its space in the same step, with the single
    exception of an insert whose tracking step panics, which leaves reserved space with no entry behind it. The
    sizes of all free runs added together plus the bytes-used total always equal the pool's capacity, so no byte
    of the pool is ever lost or counted twice by the bookkeeping.
