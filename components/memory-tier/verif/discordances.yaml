- id: D-US-2-lib.rs:456458-c70362
  kind: spec-and-code-differ
  methods:
  - evict_next
  - evict_next_for_key
  - contains
  - get
  - peek
  - used
  - free_capacity
  - insert
  spec_says: 'After an entry is evicted, that key is no longer reported as present and looking it up reports absence,
    so the evicted entry is fully gone from the cache index. Evicting an entry gives its memory back to the pool:
    the reported bytes in use drop by the space that entry occupied, and a later insertion that needs that much
    room succeeds where it would previously have been rejected for lack of space.'
  code_does: When the eviction policy names a victim that the pool actually holds, that entry is removed from the
    pool and its bytes are returned to the free space, so the pool no longer contains the key and the number of
    bytes used drops by that entry's rounded size.
  spec_pointers:
