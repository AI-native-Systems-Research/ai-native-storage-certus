- id: D-FR-013-lib.rs:456462-1a89b4
  kind: spec-and-code-differ
  methods:
  - evict_next
  - evict_next_for_key
  - oldest_keys
  spec_says: An evicted key is also removed from the external eviction-policy component's bookkeeping, so it can
    no longer appear in the list of oldest keys and cannot be nominated as a victim a second time.
  code_does: 'Unlike the explicit removal operation, evict-next never tells the eviction policy to stop tracking
    the entry it just destroyed: it drops the entry''s eviction handle on the floor, so unless the policy untracks
    the victim by itself the policy keeps listing a key whose storage has already been freed, and every later eviction
    attempt can keep returning that dead key.'
