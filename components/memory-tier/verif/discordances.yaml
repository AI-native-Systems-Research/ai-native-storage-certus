- id: D-FR-004-lib.rs:371-cf2666
  kind: spec-and-code-differ
  methods:
  - insert
  - get
  - peek
  - used
  - free_capacity
  spec_says: For each entry the size reported back to callers on lookup is the size they originally asked for, while
    the space charged against the pool is that size rounded up to the next multiple of four kibibytes; the difference,
    which can be up to 4095 bytes per entry, is accounted as used space and is never handed to another entry.
  code_does: 'The bytes-used figure counts whole 4 KiB units while lookups report the unrounded sizes the caller
    asked for, so the two can never be reconciled by the caller: adding up the sizes of all entries always gives
    a smaller number than the reported usage, and in the worst case a pool reported as completely full holds only
    one useful byte per 4096.'
