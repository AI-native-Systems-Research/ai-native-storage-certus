- id: D-US-3-lib.rs:271-9b3c9c
  kind: spec-and-code-differ
  methods:
  - initialize
  spec_says: A second attempt to set up the memory pool on a component that is already set up fails with an error
    instead of replacing the existing pool; the specification requires the failure but does not say which of the
    component's error values is returned.
  code_does: A second call to initialize on an already-initialized component fails and leaves the existing pool
    untouched; note that the error it reports is the generic allocation-failed error carrying the text "already
    initialized", even though nothing was allocated and the error list has no dedicated already-initialized variant,
    so callers cannot distinguish this condition from a genuine out-of-memory failure except by matching on the
    message text.
  spec_pointers:
  - US-3
  - FR-023
  - 'plan.md: initialize_twice_fails'
  code_pointers:
  - lib.rs:271
  - lib.rs:272
  - lib.rs:273
  - imemory_tier.rs:28
  status: candidate
