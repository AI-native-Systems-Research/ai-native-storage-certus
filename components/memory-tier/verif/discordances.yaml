- id: D-FR-011-lib.rs:377-4ea7a4
  kind: spec-and-code-differ
  methods:
  - insert
  - get
  - peek
  - remove
  - evict_next
  - evict_next_for_key
  - clear
  spec_says: The address given out for an entry remains valid and keeps pointing at that entry's own data until
    the entry is explicitly deleted or evicted; until then the component never moves the entry and never re-uses
    its memory for a different entry.
  code_does: 'The only thing that identifies an entry''s storage is its byte position in the pool, and positions
    are freely recycled: when an entry is removed, evicted or cleared away, its position goes straight back into
    the free space and the very next allocation of a similar size is given the same position again, with no generation
    number, epoch, or any other tag distinguishing one use of a position from the next; consequently an address
    the component handed out earlier cannot be told apart from a currently valid address for a different key, and
    the interface''s promise that an address is "valid until the slot is evicted or removed" is unenforceable because
    nothing in the component can detect that a caller is still holding the old one. Clear makes every address previously
    handed out by the component reusable, even though the interface documentation promises only that an address
    stays valid until its own entry is evicted or removed and never mentions clearing as a third way of invalidating
    it.'
  spec_pointers:
