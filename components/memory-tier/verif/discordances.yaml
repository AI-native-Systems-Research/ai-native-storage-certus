  - get
  spec_says: Every key returned by the oldest-keys query is a key that is actually still present in the cache at
    the time of the call, so a caller can look each one up without getting a miss.
  code_does: Spec promises every returned key is live in the cache (FR-021); the code passes the policy's list straight
    through at lib.rs:431 and never checks it against the pool's own entries, so because eviction never untracks
    its victim (lib.rs:456) a key whose storage was already freed still appears in the answer as though it were
    cached.
