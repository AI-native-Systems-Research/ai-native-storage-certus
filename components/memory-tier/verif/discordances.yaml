- id: D-FR-013-lib.rs:456462-1a89b4
  kind: spec-and-code-differ
  methods:
  - evict_next
  - evict_next_for_key
  - oldest_keys
  spec_says: An evicted key is also removed from the external eviction-policy component's bookkeeping, so it can
    no longer appear in the list of oldest keys and cannot be nominated as a victim a second time.
  code_does: Spec promises that eviction removes the key from the policy's bookkeeping (FR-013, FR-021); the code
    never does so -- unlike remove (lib.rs:500) it simply drops the entry's eviction handle at lib.rs:456-457 and
    never calls the policy's untrack, so unless the policy untracks its own victim the same dead key can be nominated
    again and can keep appearing among the oldest keys.
  spec_pointers:
