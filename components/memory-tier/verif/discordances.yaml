- id: D-SC-3-lib.rs:333-2fb813
  name: Concurrent structural integrity
  kind: spec-and-code-differ
  methods:
  - initialize
  - insert
  - get
  - peek
  - evict_next
  - evict_next_for_key
  - oldest_keys
  - remove
