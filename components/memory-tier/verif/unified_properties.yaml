- tool: kani
  headline: run on a 5-property sample only, so nothing in it covers the component.
  detail: 'By design, Kani was run only on a 5-property validation sample, not on all 161: the projected
    authoring cost was 55-125 hours. 4 of the 5 proved, each scored harness and its mutant twin run at
    the same scale. The fifth, MT-INV-LOCK-POISONING-CASCADE, is withheld: Kani builds std with panic=abort,
    so a poisoned lock cannot exist in its model. Read the column as a sample, NOT as ''Kani cannot prove
    these''.'
  measured: Kani gate 13 min 41 s, peak 2 GB per harness; scored 4 proved, 1 unresolved of 5
# Orchestrator-written triage (node7 report, 2026-10-03). Not a status.
triage:
  MT-INV-SIZE-ACCOUNTING:
    verdict: not-a-defect
    why: it says the sizes add up to 'always smaller' than the bytes in use; the code keeps them equal-or-smaller, and the
      witness proves that form.
  MT-RESET-TELEMETRY-POST:
    verdict: not-a-defect
    why: only its clause about a 64-bit counter wrapping is false; that wrap cannot be reached in practice.
  MT-BATCH-TOUCH-EMPTY-NOOP:
    verdict: not-a-defect
    why: before set-up, a non-empty batch briefly takes the state lock before checking the flag; the intended 'no pool lock,
      no policy call, no effect' still holds.
  MT-TELEMETRY-COUNTERS-MONOTONIC:
    verdict: not-a-defect
    why: the counters wrap only at 2^64 increments, which cannot be reached; below that they are proved to only increase.
