[package]
name = "memory-tier"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
spdk = ["dep:spdk-sys"]
telemetry = []

[dependencies]
component-framework.workspace = true
component-core.workspace = true
component-macros.workspace = true
interfaces = { workspace = true, features = ["spdk"] }
libc = "0.2"
spdk-sys = { workspace = true, optional = true }

[dev-dependencies]
eviction-policy-lru.workspace = true

[lints.rust]
# `cfg(kani)` is set only by cargo-kani; declare it so `clippy -D warnings` stays clean
# with the additive `#[cfg(kani)] mod verification` harnesses present.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
