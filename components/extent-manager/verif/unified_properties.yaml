level2_assumptions:
- id: D-RANGE-FR-002-217ace
  assume: the sector size is a power of two
  assume_rust: params.sector_size.is_power_of_two()
  methods:
  - format
  - initialize
  - reserve_extent
  - WriteHandle::publish
  - WriteHandle::abort
  - WriteHandle::drop
  - remove_extent
  - checkpoint
  - get_extents
  - for_each_extent
  - used_bytes
  - capacity_bytes
- id: D-RANGE-FR-002-7cb7c3
  assume: the slab size is a power-of-two number of sectors
  assume_rust: (params.slab_size / params.sector_size as u64).is_power_of_two()
  methods:
  - used_bytes
  - reserve_extent
  - WriteHandle::abort
  - WriteHandle::publish
  - checkpoint
  - initialize
- id: D-RANGE-FR-002-c6d2c5
  assume: the data start offset, the usable data size and the uniform region size are all whole multiples of the
    sector size
  assume_rust: '{ let ss = params.sector_size as u64; let dso = if params.metadata_region_size > 0 { checkpoint_region_offset
    + 2 * checkpoint_region_size } else { 0 }; let usable = params.data_disk_size - dso; dso % ss == 0 && usable
    % ss == 0 && (usable / params.region_count as u64) % ss == 0 }  // checkpoint_region_offset/size as computed
    at lib.rs:420-432'
  methods:
  - format
  - initialize
  - reserve_extent
  - used_bytes
  - capacity_bytes
- id: D-RANGE-FR-002-84618e
  assume: the usable data size is at least the region count, so every uniform region spans at least one byte
  assume_rust: (params.data_disk_size - data_start_offset) / params.region_count as u64 > 0  // data_start_offset
    as computed at lib.rs:442-446
  methods:
  - format
  - remove_extent
- id: D-RANGE-FMT-METADATA-DEVICE-LAYOUT-2ee144
  assume: aligning the superblock size up to the metadata alignment does not overflow (lib.rs:427 adds sb_size +
    alignment first)
  assume_rust: params.metadata_alignment <= u64::MAX - SUPERBLOCK_SIZE as u64
  methods:
  - format
- id: D-RANGE-FMT-METADATA-DEVICE-LAYOUT-dfd6b0
  assume: the metadata device's sector size divides both the checkpoint region offset and the checkpoint region
    size
  assume_rust: '{ let ms = self.metadata_device.get().unwrap().sector_size(params.metadata_disk_ns_id).unwrap()
    as u64; checkpoint_region_offset % ms == 0 && checkpoint_region_size % ms == 0 }  // values computed at lib.rs:420-432'
  methods:
  - format
  - checkpoint
  - initialize
- id: D-RANGE-FR-036-1d780b
  assume: the metadata base address plus the reserved metadata area fits inside the metadata namespace
  assume_rust: (metadata_base_lba as u128) * (ms as u128) + ((checkpoint_region_offset + 2 * checkpoint_region_size)
    as u128) <= (metadata_disk_size as u128)  // ms = metadata sector size, metadata_disk_size = lib.rs:410-415
  methods:
  - set_metadata_base_lba
  - format
  - initialize
  - checkpoint
- id: D-RANGE-FMT-CHECKPOINT-PAYLOAD-e0fe79
  assume: a slab holds at most u32::MAX slots of the smallest (one-sector) element size
  assume_rust: params.slab_size / params.sector_size as u64 <= u32::MAX as u64
  methods:
  - format
  - reserve_extent
  - checkpoint
  - initialize
- id: D-RANGE-FMT-CHECKPOINT-REGION-HEADER-87044b
  assume: the serialized checkpoint payload is shorter than 4 GiB
  assume_rust: payload.len() <= u32::MAX as usize  // payload as built from the regions at checkpoint.rs:48-55
  methods:
  - checkpoint
  - initialize
- id: D-RANGE-FR-005-231ab0
  assume: the requested size is greater than zero
  assume_rust: size > 0
  methods:
  - reserve_extent
- id: D-RANGE-FR-005-3783f8
  assume: rounding the requested size up to a whole sector does not overflow u32 (region.rs:38, lib.rs:595 add size
    + sector_size first)
  assume_rust: size as u64 + format_params.sector_size as u64 <= u32::MAX as u64
  methods:
  - reserve_extent
- id: D-RANGE-FR-002-a27ede
  assume: the requested size does not exceed the configured maximum extent size
  assume_rust: size <= format_params.max_extent_size
  methods:
  - reserve_extent
- id: D-RANGE-FR-002-91a1f6
  assume: the CRC-valid superblock read by initialize satisfies format's geometry rules (as every superblock this
    component writes does)
  assume_rust: sb.sector_size > 0 && sb.slab_size % sb.sector_size as u64 == 0 && sb.max_extent_size as u64 <= sb.slab_size
    && sb.region_count.is_power_of_two() && sb.data_start_offset <= sb.data_disk_size  // sb = Superblock::deserialize(block
    0), recovery.rs:15-16
  methods:
  - initialize
  - reserve_extent
  - remove_extent
  - used_bytes
  - capacity_bytes
  - checkpoint
- id: D-RANGE-KE-SUPERBLOCK-23f855
  assume: the persisted superblock has the format version this code writes
  assume_rust: sb.version == FORMAT_VERSION
  methods:
  - initialize
- id: D-RANGE-FMT-SUPERBLOCK-0de740
  assume: the persisted superblock names copy 0 or copy 1 as active
  assume_rust: sb.active_copy <= 1
  methods:
  - initialize
  - checkpoint
- id: D-RANGE-FMT-CHECKPOINT-PAYLOAD-980f61
  assume: 'the recovered checkpoint payload is one this component serialised for this superblock: one entry per
    region, and every slab descriptor has a non-zero element size, exactly slab_size / element_size keys, and lies
    on a free buddy block inside its region without overlapping another slab'
  assume_rust: regs.len() == sb.region_count as usize && regs.iter().enumerate().all(|(i, r)| r.iter().all(|d| d.element_size
    > 0 && d.element_size as u64 <= d.slab_size && d.keys.len() as u64 == d.slab_size / d.element_size as u64 &&
    within_region_disjoint(i, d, r, &sb)))  // regs = deserialize_slabs(payload); within_region_disjoint = d lies
    in region i's byte range (lib.rs:538-545) and overlaps no other descriptor of r
  methods:
  - initialize
  - reserve_extent
  - remove_extent
  - get_extents
  - for_each_extent
  - used_bytes
  - checkpoint
- id: D-RANGE-FR-002-3b58ea
  assume: twice the data disk size plus one sector fits in u64
  assume_rust: params.data_disk_size.checked_mul(2).and_then(|x| x.checked_add(params.sector_size as u64)).is_some()
  methods:
  - format
  - initialize
  - reserve_extent
  - remove_extent
  - checkpoint
- id: D-RANGE-FR-002-67ea4f
  assume: the metadata device byte size fits in u64
  assume_rust: (metadata_bd.num_sectors(ns)? ).checked_mul(metadata_bd.sector_size(ns)? as u64).is_some()
  methods:
  - format
- id: D-RANGE-FR-004-a23fc2
  assume: the recovered checkpoint layout (offset + 2 copies) fits in u64, as every superblock format() writes does
  assume_rust: sb.checkpoint_region_offset.checked_add(2 * sb.checkpoint_region_size).is_some()
  methods:
  - initialize
- id: D-RANGE-FR-003-9c0757
  assume: the checkpoint sequence number has not reached u64::MAX
  assume_rust: sb.checkpoint_seq < u64::MAX
  methods:
  - checkpoint
  - initialize
- id: D-RANGE-FR-004-3b612e
  assume: each recovered slab descriptor has the superblock slab size and lies on a slab-aligned block inside its
    region (as every checkpoint this component writes does)
  assume_rust: regs.iter().enumerate().all(|(i, r)| r.iter().all(|d| d.slab_size == sb.slab_size && (d.start_offset
    - region_base(i)) % sb.slab_size == 0 && d.start_offset + sb.slab_size <= region_end(i)))
  methods:
  - initialize
tool_notes:
- tool: kani
  headline: 'partial: Kani proves 23 and refutes 1 of 160; 136 are not proved by Kani, each with a measured reason'
  detail: Kani was run on every property. The 136 not proved are blocked by structures Kani could not get through
    in a bounded search - the buddy allocator's nested Vec (out of memory at 32 GB), the region/slab BTreeMap and
    HashMap (timeouts at 300-420 s), a background timer thread, OS randomness, and real multi-thread interleaving,
    which Kani cannot explore. Every attempt (unwind sweep, checked stubs, contracts, bounded runs with mutant twins)
    is recorded per property with its time and memory in verif/kani_limits.yaml. 22 further proofs from that study
    are not credited because they rest on stubs or inputs that were not checked against the real code (verif/kani_harness_audit.yaml).
    Creusot proves 128 of the same 160.
  measured: see verif/kani_limits.yaml
