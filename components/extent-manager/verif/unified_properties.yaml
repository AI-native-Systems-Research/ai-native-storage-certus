    note: 'LEVEL-3 RETIRED (id excluded at level 1, not among the 21 refutations): the module is renamed support_old_refute_<id>
      because its witness (copy size 6144 on a 4096-byte-sector metadata device) lies OUTSIDE D-RANGE-FMT-METADATA-DEVICE-LAYOUT-dfd6b0.
      (Level-2 text follows.) — INDEPENDENT candidate bug, ROOT CAUSE = CKPT-LAYOUT-SECTOR: lib.rs:430-432 rounds
      checkpoint_region_size down to a multiple of the DATA sector size params.sector_size, and lib.rs:420-424 aligns
      copy 0 to metadata_alignment (4096 when 0), never to the metadata device''s own sector size (queried at lib.rs:410-415),
