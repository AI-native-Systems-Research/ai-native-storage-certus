    note: 'INDEPENDENT candidate bug, NEW ROOT CAUSE = SB-ACTIVE-COPY-UNCHECKED: Superblock::deserialize checks
      the length, the magic and the CRC but never active_copy (superblock.rs:99-168, the byte is copied at :128
      and returned at :152-167), and recover computes `(1 - sb.active_copy) as u64` on u8 (recovery.rs:26). REFUTED
      over the byte-level serialize/deserialize mirror (model/sbbytes.rs): a correctly encoded superblock (magic,
      CRC; checkpoint_seq 1) naming copy 2 decodes with Ok(active_copy = 2) instead of CorruptMetadata, and recovery''s
      1 - 2 then underflows (a debug build panics inside initialize; a release build wraps to copy 255 and reads
      at checkpoint_region_offset + 255 * checkpoint_region_size). The first half holds: every superblock this component
      writes names copy 0 or 1 (Superblock::new sets 0, superblock.rs:49; write_checkpoint stores 1 - active, checkpoint.rs:61/109).
      Reachability: needs a superblock sector this component did not write (another writer on the namespace, a different
      on-disk version, or corruption that keeps the CRC consistent) - exactly the input the CorruptMetadata error-case
      is for; no device contract violation. Trusted: to_le_bytes64/32, get64/get32 (from_le_bytes inverts to_le_bytes),
      crc32_hash (opaque crc32).'
  kani:
    note: 'J6: harness renamed uncredited_* - it installs stub_random_state, whose map-operation conformance check
      did not finish (>79 min, 6.6 GB); only the empty-map conformance passed. Conservative: no credit.'
  origin_before_level1: code-only
  divergence_note: 'BOUNDARY of domain_discordances[14] (active_copy <= 1): the record is about rejecting active_copy
