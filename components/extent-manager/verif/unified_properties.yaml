  creusot:
    fidelity: trusted-boundary
    note: 'INDEPENDENT candidate bug, NEW ROOT CAUSE = CKPT-COALESCE-FAILED-RUN: a caller arriving during a run
      gets needed = completed_seq + 2 (lib.rs:731-735), which assumes the in-progress run will advance completed_seq
      to exactly completed_seq + 1; a FAILED run leaves completed_seq unchanged (lib.rs:753-755), so a waiter whose
      needed is already completed_seq + 2 becomes the next runner, and a caller arriving during THAT run computes
      the same completed_seq + 2 and is satisfied by it (lib.rs:738) although it started before the call. REFUTED
      (model/b6.rs Cs6 exact coalescing steps + model/ckpt.rs phase-split checkpoint, sector 4, C8 region; witness
      w6_coalesce_chain): publish(K1); A calls checkpoint() and runs; B calls during A''s run (needed 0+2) and waits;
      A''s copy write fails (IoError, IBlockDevice contract); B wakes, runs and serialises the region; C''s publish(K2)
      completes, then C calls checkpoint() (B in progress: needed 0+2 = 2) and waits; B''s writes succeed, completed_seq
      = 2; C wakes and returns Ok(()) - no checkpoint started after its call - and a fresh component recovers an
      image lacking K2. BORDERLINE (over-strict) check: the audit''s suggested wording ("every publish and removal
      that completed before the call began is persisted") FAILS on the same execution (K2 completed before the call
      and is not persisted) - NOT a wording artifact. Distinct from CKPT-SNAPSHOT-RACE: even if run_checkpoint kept
      the dirty flag set, C''s call has already returned Ok. Reachable with one user thread: the background timer
      thread can be A or B. Trusted: SlabMap::*, hm_* (region ops); copy byte layout and CRC not modelled.'
  kani:
    evidence: null
    fidelity: null
    note: null
  origin_before_level1: spec+code
  divergence_note: 'SPEC (FR-015, AS-2.4; spec rec): a caller that arrives during a checkpoint and is satisfied
    by waiting returns success once a checkpoint has completed that includes every modification made before the
    call began; FR-015 allows this to be ''the current (or next)'' checkpoint. CODE (lib.rs:729-761; code rec EM-CKPT-POST-COVERS-PRIOR-CHANGES):
    with needed = completed_seq + 2 (or + 1), success requires a run that started after the call began. The merge
    widens the spec''s waiting-caller scope to every caller and replaces ''covers prior modifications'' with strict
    temporal ordering. FR-014''s skip-when-clean path does no I/O at all (extraction_audit over_strict flag). Note:
    the CKPT-COALESCE-FAILED-RUN witness (Ok without persisting after a failed run) breaks the spec reading too.
    Reclassifying leaves that defect with no in-scope record, so the spec owner should re-extract a coverage-worded
    record.'
