  - 'code: EM-FORMAT-POST-INSTANCE-ID-GENERATED'
  creusot:
    fidelity: trusted-boundary
    note: 'LEVEL-3 NOT CREDITED (narrowed obligation): `(c.dev.sb, c.shared) = (Some x, Some s) ==> x.instance_id
      == s.superblock.instance_id` on an arbitrary state c — the device superblock and the in-memory one agreeing
      on the id is no proved invariant: the model''s checkpoint leaves dev.sb unconstrained when it fails, and the
      model''s initialize takes the superblock as a free argument instead of reading dev.sb, so neither the base
      (initialize) nor the step (failed checkpoint) can be proved; the "after a later initialize()" half of the
      statement therefore holds here only along chains of successful checkpoints. (D-B1; the module verify_em_format_post_instance_id_generated
      still proves, its __mutant still fails; evidence dropped.) Earlier note: PROVED. (a) format with instance_id
      None draws the id from /dev/urandom (lib.rs:471-481), writes it in the superblock to the device (lib.rs:483-498)
      and get_instance_id returns it; (b) a later initialize() of the same component from that persisted superblock
      (no checkpoint yet: recovery.rs:18-21 gives empty regions) returns the same id; (c) no reserve/publish/abort/remove/checkpoint
      changes get_instance_id, and a successful checkpoint that rewrites the device superblock writes one with the
      same id (lib.rs:302-307; a FAILED superblock write leaves the device sector unspecified per the IBlockDevice
      contract). Trusted: urandom_u64 (any 8 bytes, may fail with IoError), dev_write_superblock, dev_write_checkpoint,
      SlabMap::*, hm_*, as_u32. The initialize step uses the initialize mirror after recovery (the superblock decode
      is covered by EM-INV-SUPERBLOCK-ROUNDTRIP).'
