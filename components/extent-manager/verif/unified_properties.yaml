      (format mirror + ckpt_lba mirror): valid FR-002 parameters with a 512-byte data sector, separate-device mode,
      a 16 KiB metadata device with 4096-byte sectors (the spec assumes the superblock fits in one sector): format
      succeeds (or the device write fails with IoError) with copy 0 at 4096 and checkpoint_region_size 6144, so
      copy 1 starts at byte 10240, not a metadata-sector boundary; write_checkpoint / read_checkpoint_region address
      it at LBA 2 = byte 8192, inside copy 0 [4096,10240); and a copy-0 checkpoint of the largest size the size
      check admits (16 + payload <= 6144, checkpoint.rs:69-75) is padded to 2 sectors (checkpoint.rs:90-93) and
      written to LBAs 1-2, over copy 1''s header sector, so writing one copy can destroy the other (crash-consistency
      of the dual-copy scheme is lost). Not a power-of-two issue: 512 and 4096 are both powers of two. Trusted:
      dev_write_superblock.'
