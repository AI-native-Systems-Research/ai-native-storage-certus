# J5 harness audit: the 22 `outcome: proved` records of the extent-manager Kani limitation study, part 1
# Tree: /home/cornel/fv-runs/extent-manager-2cd35bac (pin 2cd35bac). Read-only audit; no cargo kani run.
# Sources: components/extent-manager/src/verification.rs (V:<line>), src/lib.rs (L:<line>),
#   verif-l3/unified_properties.yaml (statements + level2_assumptions), ~/FV/extent-manager_kani_limits.yaml,
#   verif/kani_measurements.md (which conformance harnesses ran), ~/fv-runs/scratch/kani_l3/logs/.
date: '2026-10-08'
auditor: J5 (subagent, read-only)
rule: >
  A credited proof may assume or fix ONLY (a) what the statement says, (b) the exact assume_rust of a declared
  level2_assumptions entry the code path really needs, or (c) a proved invariant. Fixing inputs to a finite set is a
  BOUND. Unreachability stubs (assert!(false)[; assume(false)]) are sound. Any other behavioural stub or model is an
  assumption unless its check_stub_conforms_* harness exists AND was run.
classes:
  OBL: the statement itself says it
  ASSUME:<id>: exact assume_rust of a declared level2_assumptions entry, and the exercised path needs it
  INV: proved fact. Used here for a stub whose check_stub_conforms_* harness exists AND ran SUCCESSFUL
  TYPE: given by the Rust type or by the real code under test (no restriction)
  BOUND: input / pre-state / environment fixed to a finite set or a single point
  UNNEEDED-ASSUME: an assume the exercised path does not need for the claim (cost cutting, or narrowing a claim
    that holds anyway)
  UNDECLARED-ASSUME: (added by J5; neither UNNEEDED nor BOUND fits) an assume the claim really needs, but it is
    neither in the statement nor a declared level2 assumption. The statement or the level-2 list has a gap.
  UNCHECKED-STUB: behavioural stub/model with no conformance harness that exists and ran SUCCESSFUL
  SOUND-UNREACH: unreachability stub (assert!(false)); allowed, since a reach shows up as a failed check

# ---------------------------------------------------------------------------------------------------------------
# Cross-cutting findings (these apply to many harnesses and are referenced as G1..G7 below)
# ---------------------------------------------------------------------------------------------------------------
global_findings:
  G1_random_state:
    text: '#[kani::stub(RandomState::new, stub_random_state)]: a fixed [0,0] SipHash seed'
    file_line: V:47-56
    class: UNCHECKED-STUB
    note: >
      REACHED in every harness that builds an ExtentManager. support_new_em (V:270) calls InterfaceMap::new(), which
      calls HashMap::new() (component-core/src/component.rs:40), and that calls RandomState::new. There is no
      check_stub_conforms_random_state. The argument for it (kani_RESUME.md:18: the value is in the real function's
      range, and the map is never queried) is plausible and the risk is low, but the rule makes it an assumption.
      Lifting it: one conformance harness, or build the empty map without RandomState under cfg(kani).
  G2_arc_drop_slow:
    text: '#[kani::stub(Arc::drop_slow, stub_arc_drop_slow)]: the last Arc reference leaks and Drop of the inner value is skipped'
    file_line: V:63-66
    class: UNCHECKED-STUB
    note: >
      No conformance harness. By inspection it is probably NOT reached on the shallow paths: each harness ends
      with mem::forget(em), and the receptacle keeps one reference to every Arc it clones. If it is unreached it has
      no effect. It is not decisive for any verdict below, but nothing has checked it.
  G3_condvar_notify:
    text: '#[kani::stub(Condvar::notify_all/notify_one, stub_condvar_notify)]: no-op'
    file_line: V:85
    class: UNCHECKED-STUB
    note: >
      Argued to be exact because Kani explores one thread, so there are no waiters. No conformance harness.
      REACHED only by checkpoint() (notify_all, L:783) and by set_interval/stop (notify_one, L:76/81). It is
      unreached on the format/initialize/getter paths.
  G4_nvme_to_em:
    text: '#[kani::stub(error::nvme_to_em, stub_nvme_to_em)]: always IoError("")'
    file_line: V:3021
    class: INV
    note: 'check_stub_conforms_nvme_to_em (V:3035) ran SUCCESSFUL (verif/kani_measurements.md:133). Lines 1-4124 are byte-identical to the measured file.'
  G5_support_new_em:
    text: 'pre-state = support_new_em(): a direct struct literal (every user field Default, receptacles disconnected, empty interface map); NOT the real constructor'
    file_line: V:270-291
    class: BOUND
    note: >
      Two separate issues. (i) As a pre-state for 'before format/initialize has succeeded' (or 'no device
      connected') it is ONE point of the pre-state family. data/metadata base LBA = 0, ns_id = None, no
      device/logger, checkpoint_coalesce default, interval None. The getters under test read only regions/shared
      (L:215-245, 636-719), so the bound is INESSENTIAL there. It is still a fixed pre-state that the rule does not
      allow, and making those fields symbolic would lift it cheaply. (ii) Where the statement is about the
      CONSTRUCTOR ('newly created', 'never called'), support_new_em is a MODEL of define_component!'s
      new_default/new (define_component.rs:297-327). Its conformance harness check_stub_conforms_new_default
      (V:6278) did NOT pass. CORRECTION to the brief: it WAS run. ~/fv-runs/scratch/kani_l3/logs/
      verification__check_stub_conforms_new_default.p2u4.log (--unwind 4) gives "VERIFICATION:- FAILED", failed
      check "unwinding assertion loop 0", 3 min, 2.2 GB. So in case (ii) the model is UNCHECKED-STUB.
  G6_meta_device_mock:
    text: 'support_em_with_device(sectors, geometry_fails): KaniMetaDevice mock, sector size fixed MD_SS=4096'
    file_line: V:200-268, 294-303
    class: INV
    note: >
      check_stub_conforms_iblockdevice (V:369) ran SUCCESSFUL (kani_measurements.md:48). It ran BEFORE the
      Arc::drop_slow stub was added to that harness, so the current text has not been re-run (kani_RESUME.md:30
      "re-measure"). It does not cover the geometry_fails=true branch. The fixed metadata sector size 4096 is a
      BOUND wherever the path multiplies by it.
  G7_unwind:
    text: '#[kani::unwind(N)] with default unwinding assertions'
    class: TYPE
    note: 'Unwinding assertions are on and every run reports SUCCESSFUL, so the unwind value is not a hidden bound.'

