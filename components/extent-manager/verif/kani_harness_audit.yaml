# ------------------------------------------------------------------ format guards -------------------------------
- id: EM-FORMAT-ERR-DEVICE-NOT-CONNECTED
  harness: verify_em_format_err_device_not_connected
  harness_line: V:4497 (mutant V:4507) -> support_case_l3_fmt_dev_not_connected V:4180
  statement: If no metadata block device has been connected, format() fails with a NotInitialized error and leaves the component's state unchanged.
  premises:
  - {text: 'no device connected (support_new_em)', file_line: 'V:4181', class: OBL, note: 'the statement precondition'}
  - {text: 'pre-state otherwise fixed to support_new_em defaults', file_line: 'V:270', class: BOUND, note: 'G5(i). Inessential: format reads only params before Receptacle::get (L:387-407)'}
  - {text: 'FormatParams fully symbolic, instance_id always Some', file_line: 'V:4148-4160', class: BOUND, note: 'instance_id=None is excluded. Inessential: instance_id is read only after the receptacle (L:474)'}
  - {text: 'kani::assume(sector_size.is_power_of_two())', file_line: 'V:4164', class: UNNEEDED-ASSUME, note: 'D-RANGE-FR-002-217ace is declared for format, but the path to the receptacle needs only sector_size != 0. pow2 is there to make the % guard cheap'}
  - {text: 'kani::assume(slab % sector == 0); assume(max_extent <= slab); assume(region_count.is_power_of_two())', file_line: 'V:4165-4167', class: UNDECLARED-ASSUME, note: 'The claim NEEDS these: format validates params BEFORE the device check (L:388-401), so with an invalid param it returns CorruptMetadata and the literal statement is false. Neither the statement nor any level2 entry says this. Spec gap: the statement should say "with params that pass validation"'}
  - {text: 'stub_random_state', file_line: 'V:47', class: UNCHECKED-STUB, note: G1, reached}
  - {text: 'stub_arc_drop_slow', file_line: 'V:63', class: UNCHECKED-STUB, note: 'G2, probably unreached'}
  - {text: 'stub_condvar_notify (all/one)', file_line: 'V:85', class: UNCHECKED-STUB, note: 'G3, unreached on this path'}
  - {text: 'stub_nvme_to_em', file_line: 'V:3021', class: INV, note: 'G4, unreached on this path'}
  coverage_note: '"state unchanged" is checked only as regions/shared still None (V:4142). That is the right check here, because format writes only those two before it fails'
  verdict: do-not-credit
  reason: 'undeclared guard-pass assumes (needed: the statement is false without them), one unneeded pow2 assume, and a reached unchecked RandomState stub'

