- id: EM-FORMAT-ERR-SLAB-NOT-SECTOR-MULTIPLE
  harness: verify_em_format_err_slab_not_sector_multiple
  harness_line: V:6138 (mutant V:6147) -> support_case_l3_fmt_slab_not_multiple_b3 V:6209
  statement: When format() is called with a slab size that is not an exact multiple of the sector size, it returns a CorruptMetadata error.
