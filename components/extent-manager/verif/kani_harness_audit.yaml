  - {text: 'kani::assume(sector_size.is_power_of_two())', file_line: 'V:6212', class: UNNEEDED-ASSUME, note: 'This is the exact text of D-RANGE-FR-002-217ace, but the guard L:391 is correct for any sector != 0. The record admits it was added because the general u64 % u32 guard is > 400 s and becomes a mask test under pow2. The rule forbids exactly this. Needed instead: sector_size != 0, which the statement implies (sector 0 hits guard 1, also Corrupt)'}
  - {text: 'pre-state: no device OR mock device; assume(sectors <= u64::MAX/MD_SS)', file_line: 'V:4170-4178', class: UNNEEDED-ASSUME, note: 'Device size is never queried on this path. Pre-state otherwise G5(i), inessential'}
