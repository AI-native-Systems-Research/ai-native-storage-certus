- id: EM-FORMAT-ERR-MAX-EXTENT-EXCEEDS-SLAB
  harness: verify_em_format_err_max_extent_exceeds_slab
  harness_line: V:4557 (mutant V:4567) -> support_case_l3_fmt_max_extent V:4213
  statement: When format() is called with a maximum extent size strictly greater than the slab size, it returns a CorruptMetadata error; a maximum extent size equal to the slab size is accepted.
  premises:
  - {text: 'gt / eq cases split on symbolic max_extent_size vs slab_size', file_line: 'V:4221-4231', class: OBL, note: ''}
  - {text: 'kani::assume(sector_size.is_power_of_two())', file_line: 'V:4218', class: UNNEEDED-ASSUME, note: 'Clause gt: any earlier guard failure is also CorruptMetadata, so no assume is needed. Clause eq: needs only sector != 0. pow2 is there for speed'}
  - {text: 'kani::assume(slab % sector == 0)', file_line: 'V:4219', class: UNNEEDED-ASSUME, note: 'Not needed for clause gt (an earlier failure is also Corrupt). Clause eq reads "accepted" as "this guard does not reject", which is observable only if the other guards pass, so for eq it is part of the reading of the statement'}
  - {text: 'kani::assume(region_count.is_power_of_two())', file_line: 'V:4220', class: UNDECLARED-ASSUME, note: 'Clause eq: needed so that the later region guard does not mask "accepted". Undeclared. Arguably implied by "accepted [by this check]"'}
  - {text: 'no device connected (support_new_em); "accepted" observed as "not CorruptMetadata" (NotInitialized)', file_line: 'V:4216, V:4231', class: BOUND, note: 'Clause eq is checked only on the no-device pre-state (one point, G5(i)). With a device, eq-acceptance would need the layout path. The harness uses a proxy observation'}
  - {text: 'stub_random_state', file_line: 'V:47', class: UNCHECKED-STUB, note: G1, reached}
  - {text: 'stub_arc_drop_slow / stub_condvar_notify', file_line: 'V:63, V:85', class: UNCHECKED-STUB, note: 'G2/G3, unreached'}
  - {text: 'stub_nvme_to_em', file_line: 'V:3021', class: INV, note: G4}
  verdict: do-not-credit
  reason: 'unneeded pow2 assume, undeclared region-pow2 assume for the eq clause, eq clause checked only on the no-device pre-state, and the RandomState stub'

