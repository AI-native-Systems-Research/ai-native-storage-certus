summary:
  audited: 22
  credit: 0
  do_not_credit: 22
  decisive_reason_tiers:
    only_G1_RandomState_plus_inessential_pre_state_bound:
      note: 'Would be credit if stub_random_state got a conformance harness (or the empty map were built without it) AND the uninitialised pre-state were made symbolic in the unread fields (or accepted as inessential)'
      ids: [EM-FORMAT-ERR-SECTOR-ZERO, EM-INIT-ERR-DEVICE-NOT-CONNECTED, EM-GETEXT-UNINIT-EMPTY, EM-FOREACH-UNINIT-NO-CALLS,
            EM-REMOVE-ERR-NOT-INITIALIZED, EM-INSTID-ERR-NOT-INITIALIZED, EM-USED-UNINIT-ZERO, EM-CAP-UNINIT-ZERO,
            EM-RESERVE-ERR-NOT-INITIALIZED]
    plus_reached_condvar_stub:
      ids: [EM-CKPT-ERR-NOT-INITIALIZED]
    assume_violations:
      note: 'An assume beyond (a)/(b), whether unneeded (incl. pow2 used only for speed) or undeclared'
      ids: [EM-FORMAT-ERR-DEVICE-NOT-CONNECTED, EM-FORMAT-ERR-MAX-EXTENT-EXCEEDS-SLAB, EM-FORMAT-ERR-REGION-COUNT,
            EM-FORMAT-ERR-SLAB-NOT-SECTOR-MULTIPLE]
    essential_bound:
      ids: [EM-FORMAT-ERR-NO-USABLE-DATA, EM-SETMBASE-FRAME, EM-SETDBASE-POST-STORED, EM-DBASE-FRAME-READ-ONLY,
            EM-FORMAT-POST-INSTANCE-ID-GENERATED]
    essential_unchecked_model:
      ids: [EM-DBASE-POST-DEFAULT-ZERO, EM-SETINT-DEFAULT-30S, EM-BIO-FLUSH, EM-FORMAT-POST-INSTANCE-ID-GENERATED]
  record_corrections:
  - 'EM-SETINT-DEFAULT-30S note says check_stub_conforms_new_default was "written but NOT run". It was run (--unwind 4) and FAILED: "unwinding assertion loop 0" (~/fv-runs/scratch/kani_l3/logs/verification__check_stub_conforms_new_default.p2u4.log).'
  - 'EM-DBASE-POST-DEFAULT-ZERO note defers the constructor default to verify_em_setint_default_30s rung b. That harness stubs new_default with the same support_new_em, so the argument is circular.'
  - 'EM-BIO-FLUSH: the channel device model (stub_chan_send/recv) has no conformance harness. check_stub_conforms_nvme_to_em covers only the error mapping.'
  - 'EM-FORMAT-ERR-SLAB-NOT-SECTOR-MULTIPLE: the record frames the pow2 assume as "within the level-2 range". The guard does not depend on it, so by the rule it is a speed-only assume.'
  - 'EM-FORMAT-ERR-DEVICE-NOT-CONNECTED (and the statement): format validates params before it checks for the device, so the literal statement is false for invalid params. The statement or the level-2 list needs a "params pass validation" precondition.'
