  - {text: 'stub_random_state', file_line: 'V:47', class: UNCHECKED-STUB, note: G1, reached}
  - {text: 'stub_arc_drop_slow', file_line: 'V:63', class: UNCHECKED-STUB, note: 'G2, unreached'}
  - {text: 'stub_nvme_to_em', file_line: 'V:3021', class: INV, note: G4}
  verdict: do-not-credit
  reason: 'sector pow2 assumed only to make Kani fast (record note says so); the guard does not depend on it'

- id: EM-FORMAT-ERR-NO-USABLE-DATA
  harness: verify_em_format_err_no_usable_data
  harness_line: V:6192 (mutant V:6201) -> support_case_l3_no_usable_b2 V:6127 -> l3_dispatch! V:6101-6119 -> support_l3_body_no_usable V:6066
  statement: If no data space remains after the metadata reservation (the data disk is not larger than the data start offset), format() fails with a CorruptMetadata error.
  premises:
  - {text: 'l3_dispatch!: sector_size in {512,4096}, metadata_alignment in {0,4096,1<<20}, region_count in {1,2} (const generics)', file_line: 'V:6101-6119, V:6128, V:6023-6031', class: BOUND, note: 'ESSENTIAL: these are the divisors of the layout arithmetic (L:420-432), which is exactly what the property is about. The record fidelity says representative. Also: if a >= 3 no body runs (a vacuous but harmless branch)'}
  - {text: 'kani::assume(slab % SSZ == 0); assume(max_extent <= slab)', file_line: 'V:6028-6029', class: UNNEEDED-ASSUME, note: 'Not needed for the claim, since earlier guard failures are also CorruptMetadata. They narrow the domain'}
  - {text: 'kani::assume(sectors <= u64::MAX / MD_SS)', file_line: 'V:6068', class: 'ASSUME:D-RANGE-FR-002-67ea4f', note: 'Needed: the path computes num_sectors * sector_size (L:410-415). Its form is the exact assume_rust with sector_size = 4096'}
  - {text: 'metadata device sector size fixed 4096 (MD_SS), geometry query succeeds', file_line: 'V:296-299', class: BOUND, note: 'G6. A device connected with a working geometry is implied by "after the metadata reservation" (OBL-ish). The fixed 4096 is a point bound'}
  - {text: 'kani::assume(crs > 0 && data_disk_size <= dso), with dso recomputed by the harness', file_line: 'V:6073-6086', class: OBL, note: 'This is the statement precondition. crs > 0 drops the too-small case. That is defensible because "data start offset" is undefined when there is no checkpoint region. The harness mirror is div_ceil vs (sb+al-1)/al*al, which agree for the three menu alignments (no overflow)'}
  - {text: 'stub BuddyAllocator::new -> stub_l3_unreachable_buddy_new (assert!(false); assume(false))', file_line: 'V:5866-5874', class: SOUND-UNREACH, note: Sound}
  - {text: 'stub_random_state', file_line: 'V:47', class: UNCHECKED-STUB, note: G1, reached}
  - {text: 'stub_arc_drop_slow', file_line: 'V:63', class: UNCHECKED-STUB, note: 'G2, probably unreached (receptacle keeps the device Arc)'}
  - {text: 'stub_nvme_to_em', file_line: 'V:3021', class: INV, note: 'G4, unreached (geometry_fails=false)'}
  - {text: 'KaniMetaDevice mock', file_line: 'V:200-268', class: INV, note: G6}
  verdict: do-not-credit
  reason: 'l3_dispatch! fixes sector size, alignment and region count to finite menus (BOUND on the divisors the property is about); also unneeded guard assumes'

