    reason: >
      Logging content and formatting is not a correctness obligation; the one negative logging
      rule is recorded separately.
    traces: ["lib.rs:38-51", "lib.rs:257-273", "lib.rs:288", "lib.rs:359-363", "lib.rs:509", "lib.rs:515", "lib.rs:579", "recovery.rs:40-43", "recovery.rs:61-63"]

  - id: NV-2
    scope: "background checkpoint thread timing"
    kind: not-verifiable
    verifiable: false
    reason: >
      How long the background thread actually waits before firing is wall-clock timing; only the
      occurrence of a checkpoint is captured as a property.
    traces: ["lib.rs:126-142"]

  - id: NV-3
    scope: "ExtentManager drop and thread shutdown"
    kind: not-verifiable
    verifiable: false
    reason: >
      That dropping the component stops and joins the background thread promptly, without waiting
      for its sleep to expire, is a liveness and timing claim.
    traces: ["lib.rs:59-61", "lib.rs:75-78", "lib.rs:114-117", "lib.rs:160", "lib.rs:373-380"]

  - id: NV-4
    scope: "release of callers waiting on an in-flight checkpoint"
    kind: not-verifiable
