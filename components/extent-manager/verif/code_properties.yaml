    reason: >
      That every waiter is eventually woken and returns is an unbounded liveness property.
    traces: ["lib.rs:744", "lib.rs:757"]

  - id: NV-5
    scope: "WriteHandle single use and accessors"
    kind: not-verifiable
    verifiable: false
    reason: >
      publish and abort take the handle by value, so a second use is excluded by the type system;
      the accessors simply return construction values and are covered by the reserve
      postcondition.
    traces: ["interfaces/src/iextent_manager.rs:103-147", "interfaces/src/iextent_manager.rs:157-167"]

