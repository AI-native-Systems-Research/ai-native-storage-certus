  - id: EM-REGION-EMPTY-SLAB-RELEASED
    subject: "global invariant: region layout"
    kind: postcondition
    verifiable: true
    statement: >
      When the last allocated slot of a slab is freed, the slab is removed and its whole space is
      returned to the region's allocator.
    traces: ["region.rs:104-107"]

  - id: EM-REGION-FREE-MISSING-SLAB-NOOP
    subject: "global invariant: region layout"
    kind: frame
    verifiable: true
    statement: >
      Releasing a slot of a slab that does not exist in the region changes nothing.
    traces: ["region.rs:96-102"]

  - id: EM-REGION-NEW-SLAB-ROLLBACK
    subject: "global invariant: region layout"
    kind: frame
    verifiable: true
    statement: >
      If a newly carved slab cannot provide even one slot, its space is returned to the allocator
      before the reservation fails, so nothing is leaked.
    traces: ["region.rs:77-84"]

  # ------------------------------------------------- internal: buddy allocator
  - id: EM-BUDDY-INIT-FREE
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      A new region allocator starts with all of its whole sectors free, that is, total free space
      equal to the region size rounded down to a multiple of the sector size.
    traces: ["buddy.rs:10-46"]

  - id: EM-BUDDY-ALLOC-WITHIN
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      A successful allocation returns a block that starts at or after the region base, is at
      least the requested size, and ends at or before the end of the region.
    traces: ["buddy.rs:57-82"]

  - id: EM-BUDDY-ALLOC-ALIGNED
    subject: "global invariant: buddy allocator"
    kind: invariant
    verifiable: true
    statement: >
      Every free or allocated block of 2 to the power k sectors starts, relative to the region
      base, at a multiple of its own size.
    traces: ["buddy.rs:28-37", "buddy.rs:76-79", "buddy.rs:94-112"]

  - id: EM-BUDDY-FREE-DISJOINT
    subject: "global invariant: buddy allocator"
    kind: invariant
    verifiable: true
    statement: >
      Free blocks recorded by a region allocator never overlap each other.
    traces: ["buddy.rs:6", "buddy.rs:84-115", "buddy.rs:117-157"]

  - id: EM-BUDDY-ALLOC-ACCOUNTING
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      A successful allocation reduces the total free space by exactly the size of the block
      handed out, which is the smallest power-of-two number of sectors that holds the request.
    traces: ["buddy.rs:57-82", "buddy.rs:160-166"]

  - id: EM-BUDDY-FREE-ACCOUNTING
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      Freeing a block that was allocated with the same size increases the total free space by
      that block's size, so allocate-then-free restores the previous free total.
    traces: ["buddy.rs:84-115", "buddy.rs:160-166"]

  - id: EM-BUDDY-FREE-PRE
    subject: "global invariant: buddy allocator"
    kind: precondition
    verifiable: true
    statement: >
      A block is only freed if it is currently allocated from this region, with the size it was
      allocated with and an offset at or after the region base.
    traces: ["buddy.rs:85-86", "region.rs:81", "region.rs:105"]

  - id: EM-BUDDY-ALLOC-NONE-ONLY-IF-EXHAUSTED
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      Allocation fails only when no free block of the needed size or larger exists.
    traces: ["buddy.rs:65-73"]

  - id: EM-BUDDY-MERGE
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      When a freed block's buddy is also free, the two are merged, so freeing all blocks of a
      region makes the largest original blocks available again.
    traces: ["buddy.rs:94-112"]

  - id: EM-BUDDY-MARK-ALLOCATED
    subject: "global invariant: buddy allocator"
    kind: postcondition
    verifiable: true
    statement: >
      Marking a free range as allocated (during recovery) removes exactly that range from the free
      space, reducing the free total by its block size, and leaves every other free byte free.
    traces: ["buddy.rs:117-157"]

  - id: EM-BUDDY-MARK-ALLOCATED-PRE
    subject: "global invariant: buddy allocator"
    kind: precondition
    verifiable: true
    statement: >
      A range is only marked allocated when it lies in the region and is currently entirely free.
    traces: ["buddy.rs:117-157", "lib.rs:553-555"]

  # ------------------------------------------------- internal: superblock
  - id: EM-SB-ROUND-TRIP
    subject: "global invariant: superblock encoding"
    kind: postcondition
    verifiable: true
    statement: >
      Decoding an encoded superblock succeeds and yields every field with the value it had when it
      was encoded.
    traces: ["superblock.rs:58-97", "superblock.rs:99-168"]

  - id: EM-SB-SIZE
    subject: "global invariant: superblock encoding"
    kind: postcondition
    verifiable: true
    statement: >
      An encoded superblock is exactly 4096 bytes long and all of its fields and checksum fit
      inside it.
    traces: ["superblock.rs:4", "superblock.rs:58-96"]

  - id: EM-SB-CORRUPTION-DETECTED
    subject: "global invariant: superblock encoding"
    kind: error-case
    verifiable: true
    statement: >
      Decoding a superblock whose checksummed bytes were altered, whose magic number is wrong, or
      that is shorter than 4096 bytes fails with a CorruptMetadata error.
    traces: ["superblock.rs:100-112", "superblock.rs:143-150"]

  - id: EM-SB-ACTIVE-COPY-VALID
    subject: "global invariant: superblock encoding"
    kind: error-case
    verifiable: true
    statement: >
      The active checkpoint copy number is always 0 or 1; decoding a superblock that names any
      other copy fails with a CorruptMetadata error instead of crashing later.
    traces: ["superblock.rs:128", "recovery.rs:23-26", "checkpoint.rs:61"]
    note: >
      Not validated on decode; 1 - active_copy on a u8 underflows for values above 1.

  - id: EM-SB-NEW-DEFAULTS
    subject: "global invariant: superblock encoding"
    kind: postcondition
    verifiable: true
    statement: >
      A newly created superblock carries the expected magic number and current format version,
      a checkpoint sequence of zero and copy 0 as the active copy.
    traces: ["superblock.rs:28-56"]

  # ------------------------------------------------- internal: checkpoint codec
  - id: EM-CKPT-READ-SEQ-MISMATCH
    subject: "global invariant: checkpoint encoding"
    kind: error-case
    verifiable: true
    statement: >
      Reading a checkpoint copy whose recorded sequence number differs from the expected one fails
      with a CorruptMetadata error.
    traces: ["checkpoint.rs:136-140"]

  - id: EM-CKPT-READ-OVERSIZE
    subject: "global invariant: checkpoint encoding"
    kind: error-case
    verifiable: true
    statement: >
      Reading a checkpoint copy whose header claims more data than fits in the copy fails with a
      CorruptMetadata error; data that exactly fills the copy is accepted.
    traces: ["checkpoint.rs:142-147"]

  - id: EM-CKPT-READ-TRUNCATED
    subject: "global invariant: checkpoint encoding"
    kind: error-case
    verifiable: true
    statement: >
      Reading a checkpoint copy that yields fewer bytes than the header and recorded payload
      require fails with a CorruptMetadata error.
    traces: ["checkpoint.rs:128-130", "checkpoint.rs:158-160"]

  - id: EM-CKPT-READ-CRC
    subject: "global invariant: checkpoint encoding"
    kind: error-case
    verifiable: true
    statement: >
      Reading a checkpoint copy whose header or payload bytes were altered after writing fails
      with a CorruptMetadata error because the checksum no longer matches.
    traces: ["checkpoint.rs:162-170", "checkpoint.rs:80-87"]

  - id: EM-CKPT-CODEC-ROUND-TRIP
    subject: "global invariant: checkpoint encoding"
    kind: postcondition
    verifiable: true
    statement: >
      Decoding the encoded state of a set of regions yields, region by region and slab by slab in
      order, each slab's start offset, slab size, element size and the key of every slot.
    traces: ["checkpoint.rs:15-33", "checkpoint.rs:48-55", "checkpoint.rs:183-241"]

  - id: EM-CKPT-DECODE-TRUNCATED
    subject: "global invariant: checkpoint encoding"
    kind: error-case
    verifiable: true
    statement: >
      Decoding checkpoint contents that end before the region count, a slab count, a slab header
      or a slab's keys are complete fails with a CorruptMetadata error and never reads past the
      end of the data.
    traces: ["checkpoint.rs:186-221"]

  - id: EM-RECOVER-SLAB-FROM-DESCRIPTOR
    subject: "global invariant: checkpoint encoding"
    kind: postcondition
    verifiable: true
    statement: >
      A slab rebuilt from a checkpoint has exactly the slots with real keys marked allocated,
      carrying those keys, and every other slot free.
    traces: ["recovery.rs:73-85"]

  # ------------------------------------------------- internal: block I/O
  - id: EM-BIO-WRITE-LAYOUT
    subject: "global invariant: metadata block I/O"
    kind: postcondition
    verifiable: true
    statement: >
      A successful metadata write stores the given bytes, followed by zero padding up to the next
      whole sector, in consecutive blocks starting at the base LBA plus the requested LBA, on the
      configured namespace.
    traces: ["block_io.rs:49-108"]

  - id: EM-BIO-WRITE-ERR
    subject: "global invariant: metadata block I/O"
    kind: error-case
    verifiable: true
    statement: >
      If the device reports an error, returns an unexpected completion, or its channel closes
      during a metadata write, the write fails with an IoError and no further blocks of that write
      are sent.
    traces: ["block_io.rs:82-104"]

  - id: EM-BIO-READ-LAYOUT
    subject: "global invariant: metadata block I/O"
    kind: postcondition
    verifiable: true
    statement: >
      A successful metadata read of n bytes returns exactly n bytes, taken from consecutive blocks
      starting at the base LBA plus the requested LBA.
    traces: ["block_io.rs:110-155"]

  - id: EM-BIO-READ-ERR
    subject: "global invariant: metadata block I/O"
    kind: error-case
    verifiable: true
    statement: >
      If the device reports an error, returns an unexpected completion, or its channel closes
      during a metadata read, the read fails with an IoError.
    traces: ["block_io.rs:125-152"]

  - id: EM-BIO-ALLOC-ERR
    subject: "global invariant: metadata block I/O"
    kind: error-case
    verifiable: true
    statement: >
      If a DMA buffer for metadata I/O cannot be allocated, the read or write fails with an
      IoError and nothing is sent to the device for that block.
    traces: ["block_io.rs:42-47", "block_io.rs:57", "block_io.rs:73-75", "block_io.rs:120-122"]

  - id: EM-BIO-FLUSH
    subject: "global invariant: metadata block I/O"
    kind: postcondition
    verifiable: true
    statement: >
      With the volatile write cache feature, a flush reports success only when the device answers
      the flush request with a successful flush completion; any other answer is an IoError.
    traces: ["block_io.rs:161-180"]

  - id: EM-ERR-DEVICE-AS-IOERROR
    subject: "global invariant: error mapping"
    kind: invariant
    verifiable: true
    statement: >
      Every failure reported by the metadata block device reaches the caller as an IoError.
    traces: ["error.rs:23-25"]

  # ------------------------------------------------- global invariants
  - id: EM-INV-NO-OVERLAP
    subject: "global invariant: extent disjointness"
    kind: invariant
    verifiable: true
    statement: >
      At all times, no two extents that are reserved, published, or removed but not yet released
      occupy overlapping disk bytes.
    traces: ["region.rs:41-92", "slab.rs:58-60", "buddy.rs:57-82"]

  - id: EM-INV-CONCURRENT-LINEARIZABLE
    subject: "global invariant: concurrency"
    kind: invariant
    verifiable: true
    statement: >
      When reserve, publish, abort and remove run concurrently from many threads, the resulting
      extents and used bytes are the same as for some one-at-a-time ordering of those calls.
    traces: ["lib.rs:584-630", "lib.rs:680-684", "tests/concurrent.rs:31-125"]

  - id: EM-INV-SEQ-AGREE
    subject: "global invariant: checkpoint sequence"
    kind: invariant
    verifiable: true
    statement: >
      The component's recorded checkpoint sequence number always equals the sequence number held
      in its in-memory superblock.
    traces: ["region.rs:21", "checkpoint.rs:106-112", "lib.rs:570-574", "lib.rs:500-504"]

  - id: EM-INV-CHECKPOINT-SECTOR-ALIGNED
    subject: "global invariant: metadata layout"
    kind: invariant
    verifiable: true
    statement: >
      Both checkpoint copies begin on a sector boundary of the metadata device, so a checkpoint is
      written exactly where it will later be read.
    traces: ["lib.rs:420-432", "checkpoint.rs:96", "checkpoint.rs:124"]
    note: >
      The LBA is computed by integer division by the device sector size, while the layout is
      computed from the configured alignment and params.sector_size.

  - id: EM-INV-INITIALIZED-TOGETHER
    subject: "global invariant: lifecycle"
    kind: invariant
    verifiable: true
    statement: >
      The component is either fully initialized (regions and shared layout state both present) or
      not initialized at all; no operation observes one without the other.
    traces: ["lib.rs:506-507", "lib.rs:576-577"]

  - id: EM-INV-FREE-KEY-NEVER-LISTED
    subject: "global invariant: key sentinel"
    kind: invariant
    verifiable: true
    statement: >
      No listed extent ever has the key u64::MAX.
    traces: ["lib.rs:642", "lib.rs:666", "lib.rs:600-608"]

  - id: EM-INV-EXTENT-SIZE-UNIT
    subject: "global invariant: extent size unit"
    kind: invariant
    verifiable: true
    statement: >
      The size reported for an extent is expressed in blocks, as the Extent type declares.
    traces: ["interfaces/src/iextent_manager.rs:13", "lib.rs:591", "lib.rs:646"]
    note: >
      The code fills size with the element size in bytes (tests assert size >= 4096 for a 4096
      byte request).

  # ------------------------------------------------- not verifiable
  - id: NV-1
    scope: "logging helpers and log messages (format_bytes, log_info, log_warn, log_error; checkpoint_start, checkpoint_complete, recovery_start, recovery_complete, recovery_fallback, corruption_detected, format complete)"
    kind: not-verifiable
