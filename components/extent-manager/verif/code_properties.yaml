  # ------------------------------------------------------------- checkpoint
  - id: EM-CKPT-ERR-NOT-INIT
    subject: checkpoint
    kind: error-case
    verifiable: true
    statement: >
      Before the component is formatted or initialized, checkpoint fails with a NotInitialized
      error.
    traces: ["lib.rs:276-282"]

  - id: EM-CKPT-CLEAN-NOOP
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      When nothing has been published or removed since the last successful checkpoint (or since
      format or initialize), checkpoint succeeds without writing anything to the metadata device.
    traces: ["lib.rs:276-286", "tests/checkpoint.rs:54-61"]

  - id: EM-CKPT-POST-DURABLE
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      After checkpoint succeeds, a fresh component that initializes from the same metadata device
      lists exactly the extents that were published and not removed before checkpoint was
      called.
    traces: ["lib.rs:299-306", "checkpoint.rs:35-115", "recovery.rs:11-71"]

  - id: EM-CKPT-POST-COVERS-PRIOR-CHANGES
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      When several callers checkpoint concurrently, a call that returns success only does so after
      a checkpoint that started after the call began has completed, so every change finished
      before the call is persisted.
    traces: ["lib.rs:729-761"]

  - id: EM-CKPT-POST-SEQ-AND-COPY
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      Each checkpoint that writes increases the persisted checkpoint sequence number by exactly
      one and writes to, then makes active, the checkpoint copy that was not active before.
    traces: ["checkpoint.rs:58-67", "checkpoint.rs:106-112"]

  - id: EM-CKPT-ORDER-DATA-BEFORE-SUPERBLOCK
    subject: checkpoint
    kind: invariant
    verifiable: true
    statement: >
      The superblock is only updated to point at a new checkpoint after that checkpoint's data
      has been completely written (and, with the volatile write cache feature, flushed) to the
      metadata device.
    traces: ["lib.rs:299-306", "checkpoint.rs:96-112"]

  - id: EM-CKPT-CRASH-ATOMIC
    subject: checkpoint
    kind: invariant
    verifiable: true
    statement: >
      If the system crashes at any point during a checkpoint, recovery yields either the state of
      the previous completed checkpoint or the state of the new one, never a mixture or an error.
    traces: ["lib.rs:299-306", "checkpoint.rs:96-112", "block_io.rs:68-104", "superblock.rs:4"]
    note: >
      The superblock is written one device sector per command; with sectors smaller than 4 KiB
      the superblock update itself is not a single write.

  - id: EM-CKPT-FAILED-SUPERBLOCK-WRITE
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      If a checkpoint fails after writing its data but before the superblock reaches the device,
      later checkpoints never overwrite the checkpoint copy that the on-disk superblock still
      names as active, so the device always recovers to a completed checkpoint.
    traces: ["checkpoint.rs:106-112", "lib.rs:303-306"]
    note: >
      The in-memory active copy and sequence are advanced before the superblock write is
      attempted, and are not rolled back on its failure.

  - id: EM-CKPT-AFTER-FALLBACK-PRESERVES-VALID
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      After initialize recovered from the previous checkpoint copy because the active one was
      invalid, the next checkpoint does not overwrite that only valid copy before a new valid
      checkpoint is durable elsewhere.
    traces: ["recovery.rs:48-58", "checkpoint.rs:61-63"]

  - id: EM-CKPT-ERR-TOO-LARGE
    subject: checkpoint
    kind: error-case
    verifiable: true
    statement: >
      When the serialized state does not fit in one checkpoint copy, checkpoint fails with a
      CorruptMetadata error and leaves the persisted metadata and the in-memory active copy and
      sequence number unchanged; a payload that exactly fills the copy is accepted.
    traces: ["checkpoint.rs:69-75"]

  - id: EM-CKPT-ERR-IO
    subject: checkpoint
    kind: error-case
    verifiable: true
    statement: >
      When the metadata device fails during a checkpoint, checkpoint returns an IoError and the
      device still recovers to the last completed checkpoint.
    traces: ["lib.rs:297", "lib.rs:306", "checkpoint.rs:97", "block_io.rs:91-104"]

  - id: EM-CKPT-FAIL-RETAINS-CHANGES
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      After a failed checkpoint, the changes it did not persist are still written by the next
      successful checkpoint, and space of removed extents stays unavailable until then.
    traces: ["lib.rs:299-321"]

  - id: EM-CKPT-NO-LOST-UPDATE
    subject: checkpoint
    kind: invariant
    verifiable: true
    statement: >
      A publish or removal that happens while a checkpoint is in progress is persisted either by
      that checkpoint or by a later one; the component never treats such a change as already
      persisted when it is not.
    traces: ["checkpoint.rs:51-55", "lib.rs:312-321", "region.rs:118", "region.rs:148"]
    note: >
      Regions are serialized under per-region read locks and all dirty flags are cleared later in
      a separate pass.

  - id: EM-CKPT-RELEASE-ONLY-PERSISTED-REMOVALS
    subject: checkpoint
    kind: invariant
    verifiable: true
    statement: >
      A checkpoint only makes reusable the space of removals that are recorded in the checkpoint
      it persisted.
    traces: ["lib.rs:316-318", "region.rs:147", "region.rs:152-160"]
    note: >
      flush_pending_frees releases every pending removal, including ones queued after the region
      was serialized.

  - id: EM-CKPT-MUTUAL-EXCLUSION
    subject: checkpoint
    kind: invariant
    verifiable: true
    statement: >
      At most one checkpoint write runs at a time, regardless of how many callers (including the
      background timer) request checkpoints concurrently.
    traces: ["lib.rs:729-750"]

  - id: EM-CKPT-COMPLETED-SEQ-MONOTONIC
    subject: checkpoint
    kind: invariant
    verifiable: true
    statement: >
      The count of completed checkpoints used to coalesce concurrent requests never decreases.
    traces: ["lib.rs:54-57", "lib.rs:752-756"]

  - id: EM-CKPT-HOOK-ON-SUCCESS
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      The registered post-checkpoint hook runs exactly once for each checkpoint that writes and
      succeeds, and does not run when the checkpoint is skipped because nothing changed or when
      it fails.
    traces: ["lib.rs:173-175", "lib.rs:284-286", "lib.rs:365-367"]

  - id: EM-CKPT-VOLATILE-SUPERBLOCK-FLUSH
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      With the volatile write cache feature enabled, a checkpoint only reports success after the
      superblock write has also been flushed to non-volatile media.
    traces: ["lib.rs:308-310", "block_io.rs:161-180"]

  - id: EM-CKPT-FRAME
    subject: checkpoint
    kind: frame
    verifiable: true
    statement: >
      checkpoint does not change the set of listed extents or the reported capacity.
    traces: ["lib.rs:275-370"]

  - id: EM-CKPT-WRITE-INACTIVE-COPY
    subject: checkpoint
    kind: postcondition
    verifiable: true
    statement: >
      A checkpoint writes its data only into the checkpoint copy that is not currently active, and
      writes nothing outside that copy.
    traces: ["checkpoint.rs:58-67", "checkpoint.rs:89-97"]

  - id: EM-CKPT-ROUND-TRIP
    subject: checkpoint
    kind: postcondition
    verifiable: true
