    traces: [FR-012, PLAN-Key-Design-Decisions-10, SC-005]

  - id: NV-4
    scope: "FR-016 periodic background checkpoint at a default 30-second interval"
    kind: not-verifiable
    verifiable: false
    reason: >
      That a checkpoint eventually fires, and how many seconds apart, is wall-clock timing and
      liveness, which a verifier cannot decide.
    traces: [FR-016, US-2, SYNC-2026-09-01-b, SYNC-2026-09-01-c, SYNC-2026-08-07-d, IFACE-set_checkpoint_interval]

  - id: NV-5
    scope: "FR-027 Some(duration) enables periodic checkpoints at that cadence"
    kind: not-verifiable
    verifiable: false
    reason: >
      The cadence of background checkpoints after enabling an interval is wall-clock timing;
      only the negative case (None disables them) is captured as a property.
    traces: [FR-027]

  - id: NV-6
    scope: "FR-020 bitmap rover for even distribution"
    kind: not-verifiable
    verifiable: false
    reason: >
      Even spreading of allocations within a slab is a heuristic quality goal with no exact
      pass/fail condition; slot disjointness is covered by the no-overlap invariant.
    traces: [FR-020]

  - id: NV-7
    scope: "FR-021 amortized constant-time size-class lookup"
    kind: not-verifiable
    verifiable: false
    reason: >
      Amortized running time is a performance property, not a functional assertion; the
      observable reuse-before-new-slab behavior is captured separately.
    traces: [FR-021, PLAN-Key-Design-Decisions-4]

  - id: NV-8
    scope: "FR-024 Send + Sync and freedom from data races"
    kind: not-verifiable
    verifiable: false
    reason: >
      Thread-safety marker traits are a type-system fact checked by the compiler, and absence of
