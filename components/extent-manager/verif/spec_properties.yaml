  # ---------------------------------------------------------------- global invariants
  - id: EM-INV-NO-OVERLAP
    subject: INV extent space disjointness
    kind: invariant
    verifiable: true
    statement: >
      No two slots that are in use at the same time (reserved, published, or removed but not yet
      freed by a checkpoint) share any byte of the data device.
    traces: [FR-005, FR-019, FR-020, AS-4.1, SC-004]

  - id: EM-INV-WITHIN-USABLE-RANGE
    subject: INV extent placement range
    kind: invariant
    verifiable: true
    statement: >
      Every reserved or published extent lies entirely within the usable data range, which
      starts at the data start offset and spans capacity_bytes() bytes; in shared-device mode no
      extent overlaps the reserved metadata area.
    traces: [FR-035, FR-032, FMT-Data-Device-Layout, PLAN-Device-Layout]

  - id: EM-INV-DEFERRED-FREE
    subject: INV deferred free
    kind: invariant
    verifiable: true
    statement: >
      After an extent is removed, no part of its disk slot is handed out by any reservation
      until a checkpoint that began after the removal has completed successfully; a reservation
      of the same size made before that point receives a different slot.
    traces: [FR-025, FR-008, AS-6.3, EC-9, US-6]

  - id: EM-INV-KEY-SHARDING
    subject: INV region sharding
    kind: invariant
    verifiable: true
    statement: >
      An extent reserved for key k is placed in region number (k AND (region_count minus 1)),
      that is, inside the contiguous data-device byte range owned by that region.
    traces: [FR-022, US-4, PLAN-Key-Design-Decisions-3, PLAN-Key-Design-Decisions-11]

  - id: EM-INV-SLAB-WITHIN-REGION
    subject: INV slab placement
    kind: invariant
    verifiable: true
    statement: >
      Every slab occupies exactly one slab size of contiguous bytes that lie inside its own
      region's byte range on the data device.
    traces: [FR-019, KE-Region, PLAN-Device-Layout]

  - id: EM-INV-SLAB-UNIFORM-ELEMENT
    subject: INV slab size class
    kind: invariant
    verifiable: true
    statement: >
      All slots of a given slab have the same element size; extents whose sector-aligned sizes
      differ are never placed in the same slab.
    traces: [FR-020, FR-021, EC-8]

  - id: EM-INV-ELEMENT-SECTOR-MULTIPLE
    subject: INV slab size class
    kind: invariant
    verifiable: true
    statement: >
      Every slab's element size is a positive multiple of the sector size.
    traces: [FR-005, EC-8, PLAN-Space-Allocation]

  - id: EM-INV-KEY-VECTOR-LENGTH
    subject: INV slab key vector
    kind: invariant
    verifiable: true
    statement: >
      Every slab keeps exactly one key entry per slot, so the number of key entries equals the
      slab size divided by the element size.
    traces: [FR-010, FMT-Checkpoint-Payload]

  - id: EM-INV-KEY-IMPLIES-ALLOCATED
    subject: INV slab key vector
    kind: invariant
    verifiable: true
    statement: >
      Any slot whose key entry is not the FREE_KEY sentinel (u64::MAX) is marked allocated in
      its slab's allocation bitmap.
    traces: [FR-010, FR-011, FR-018, PLAN-Per-Region-State]

  - id: EM-INV-FREE-KEY-NEVER-VISIBLE
    subject: INV FREE_KEY sentinel
    kind: invariant
    verifiable: true
    statement: >
      No extent listed by get_extents() or passed to a for_each_extent() callback ever has the
      key u64::MAX; that value only ever marks an unoccupied slot.
    traces: [FR-011, KE-ExtentKey, KE-FREE_KEY, EC-3]

  - id: EM-INV-CRASH-CONSISTENT
    subject: INV crash consistency
    kind: invariant
    verifiable: true
    statement: >
      At every point in time, including in the middle of a checkpoint, the superblock on the
      metadata device is valid and names an active checkpoint copy that is complete and passes
      its CRC check, so a crash at any moment leaves the device recoverable to the last
      successful checkpoint (given sector-atomic writes).
    traces: [US-2, FR-018, FR-013, ASSUMP-2, ASSUMP-5]

  - id: EM-INV-SUPERBLOCK-WELL-FORMED
    subject: INV superblock encoding
    kind: invariant
    verifiable: true
    statement: >
      Every superblock the component writes is 4096 bytes, begins with the magic value
      0x4345_5254_5553_5634 ("CERTUSV4") and version 6, has an active-copy field of 0 or 1,
      zero-filled reserved bytes and padding, and stores at byte 92 the CRC32 of bytes 0 to 91.
    traces: [FR-003, KE-Superblock, FMT-Superblock, ASSUMP-3]

  - id: EM-INV-SUPERBLOCK-ROUNDTRIP
    subject: INV superblock encoding
    kind: invariant
    verifiable: true
    statement: >
      Any superblock the component writes is accepted by initialize() and reads back with
      exactly the field values that were written.
    traces: [FR-003, FR-004, FMT-Superblock]

  - id: EM-INV-SUPERBLOCK-PARAMS-VALID
    subject: INV superblock encoding
    kind: invariant
    verifiable: true
    statement: >
      Every superblock the component writes holds format parameters that satisfy the format
      validation rules (sector size above zero, slab size a multiple of sector size, maximum
      extent size at most the slab size, region count a positive power of two).
    traces: [FR-002, FR-003]

  - id: EM-INV-CHECKPOINT-ROUNDTRIP
    subject: INV checkpoint encoding
    kind: invariant
    verifiable: true
    statement: >
      Decoding any checkpoint copy the component has written yields exactly the per-region slab
      descriptors and key lists that were serialized into it.
    traces: [FR-013, FR-018, SC-002, FMT-Checkpoint-Payload]

  - id: EM-INV-CLEAN-MATCHES-DISK
    subject: INV checkpoint freshness
    kind: invariant
    verifiable: true
    statement: >
      Whenever no extent has been published or removed since the last successful checkpoint,
      a reboot followed by initialize() would reproduce exactly the set of extents that
      get_extents() currently returns.
    traces: [FR-014, AS-2.3, US-2]

  - id: EM-INV-CONCURRENT-PUBLISH
    subject: INV concurrent operation
    kind: invariant
    verifiable: true
    statement: >
      When several threads concurrently reserve and publish extents with distinct keys, every
      operation succeeds without panicking and afterwards get_extents() lists exactly the total
      number published (for example, 800 for 8 threads publishing 100 each over 8 regions).
    traces: [AS-4.1, US-4, SC-004, FR-024]

  - id: EM-INV-CONCURRENT-PUBLISH-ABORT
    subject: INV concurrent operation
    kind: invariant
    verifiable: true
    statement: >
      When threads concurrently mix publishing and aborting reservations, afterwards exactly the
      published extents are listed by get_extents() and none of the aborted ones are.
    traces: [AS-4.2, US-4, SC-004]

  - id: EM-INV-CONCURRENT-REMOVE
    subject: INV concurrent operation
    kind: invariant
    verifiable: true
    statement: >
      When threads concurrently remove non-overlapping sets of existing extents by offset, every
      removal succeeds and afterwards get_extents() lists none of the removed extents.
    traces: [AS-4.3, US-4, SC-004]

  - id: EM-INV-REGION-LOCK-SCOPE
    subject: INV region locking
    kind: invariant
    verifiable: true
    statement: >
      Hot-path operations (reserve, publish, abort, remove) acquire only the lock of the one
      region they target, so operations on different regions never wait on each other.
    traces: [FR-023, US-4, KE-Region]

  - id: EM-INV-CAPACITY-CONSTANT
    subject: INV capacity
    kind: invariant
    verifiable: true
    statement: >
      Between one successful format() or initialize() and the next, capacity_bytes() returns the
      same value no matter which reservations, publishes, removals or checkpoints occur.
    traces: [FR-032]

  - id: EM-INV-USED-AT-MOST-CAPACITY
    subject: INV capacity
