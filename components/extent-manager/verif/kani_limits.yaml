groups:
  shallow-unattempted: 'All 21 attempted. 19 proved with a failing __mutant twin under the same flags (unwinding
    checks ON, unwind 2; the three representatives sweep 2,3,4,6,8 with a FLAT CBMC time: region-count 5.5 s, setdbase
    1.4 s, reserve 4.0 s), 1 refuted (METADATA-TOO-SMALL: Kani reproduces the Creusot FORMAT-ALIGN-OVERFLOW witness,
    "attempt to add with overflow" at alignment u64::MAX-4095, control without that alignment verifies), 1 limit
    (DEVICE-QUERY). What blocks Kani here is not structure but SYMEX PRUNING: a guard that fails on a SYMBOLIC value
    (or an uninitialised Option read through locks/dyn) does not prune the rest of format()/reserve_extent(), so
    rung a OOMs at the 32 GB cap (format guards, 118-158 s) or times out (reserve, > 600 s / 17.9 GB). The technique
    that overcomes it is the UNREACHABILITY STUB: replace the first deep callee on the infeasible tail (RegionState::alloc_extent,
    BuddyAllocator::new, Receptacle::get) by assert!(false); kani::assume(false) - sound with no conformance argument,
    because any reach is a failed check. That cut memory 32 GB -> 0.9-2.3 GB; the remaining SAT cost (symbolic 64-bit
    divisors in the layout arithmetic) yielded to concrete DIVISOR dispatch via const generics (NO-USABLE-DATA 166
    s) and, for the u64 % u32 slab guard, to the level-2 power-of-two sector assumption (28 s; without it > 400
    s even with the tail cut). DEVICE-QUERY stays a measured limit (> 400 s / 11.6 GB with cut + divisor dispatch):
    the always-failing geometry answer of the dyn IBlockDevice mock is not resolved by symex.'
  gate-feature-flag: 'Not a Kani limit. EM-BIO-FLUSH needs --features volatile_write_cache (harness pair cfg-gated).
    The inherited body (boundary_em_bio_flush) turned out VACUOUS for its success clause: under the reworked device
    model the first command always faults, so its __mutant verifies (unwind 6: 38.5 s; unwind 10: 40.6 s). A reworked
    case that drives the no-fault answer and each fault kind in concrete branches proves the property at unwind
    10 with checks ON (181.6 s / 3.06 GB) and its twin fails (185.6 s). The mutant twin, not the unwinding check,
    is what exposed the gap.'
  os-file-io-urandom: 'Blocker = host syscalls (open/read of /dev/urandom). Real File::open: no verdict (> 300 s
    unbounded; unwind 2: unwinding assertion only, 3255 checks undetermined). Technique: stub File::open (generic
    over P) and <File as Read>::read, plus <OwnedFd as Drop>::drop (close) - Read::read_exact cannot be stubbed
    for File in Kani 0.67 (trait default method: concrete stub rejected "Expected &mut Self", generic stub rejected
    "0 generic parameters"), so the real default read_exact runs on the read stub. With it the SUCCESS property
    (POST-INSTANCE-ID-GENERATED) is proved at unwind 4 (106.5 s / 3.7 GB, twin fails). The ERROR property (ERR-INSTANCE-ID-GENERATION)
    is a measured limit: > 300 s / 13.8-14.2 GB at unwind 2 and 4 with either OS model; cause not isolated within
    the time box.'
  background-timer-thread: 'Blocker = std::thread::spawn + Condvar timing. Technique: spawn stub (deferred or inline;
    zeroed JoinHandle, read back as None via the Option niche - probe P7c), Condvar::wait/wait_timeout as one nondeterministic
    peer step per wait, notify_all as a checkpoint() counter, and a ExtentManager::new_default model (the real define_component!
    constructor fails "unwinding assertion loop 0" at unwind 2-4, ~170 s each). DEFAULT-30S (needs only new_inner)
    is proved at unwind 2 (38.6 s, twin fails). Every harness that RUNS the thread body (BG-NOT-INIT-SILENT, CHANGE-NO-SPURIOUS,
    POST-NONE-DISABLES, SOME-FIRES) times out (> 240-400 s, 3.2-8 GB) at unwind 2-4 under deferred spawn, deferred
    + run_checkpoint tail cut, and inline spawn - so the two Creusot refutations (TIMER-TIMEOUT-STALE, TIMER-DEADLINE-RESET)
    were not reproduced. Rungs c/d (cfg_attr contracts / loop invariants, allowed late by Cornel) were not attempted
    within the time box; the measured cost is not in a production loop that an invariant would summarise but in
    the thread-body symex itself.'
  multi-thread-interleaving: 'Not expressible with real threads: a harness with two real std::thread::spawn callers
    of checkpoint() gives NO verdict (> 600 s / 18.4 GB at unwind 2); a trivial spawn+join in the scratch crate
    likewise (> 300 s unbounded, > 200 s / 5.9 GB at unwind 2, > 110 s / 3.9 GB at unwind 1). Kani never reports
    an "unsupported construct" check for spawn; its only messages are the compile-time warnings (foreign function
    (40) unsupported; atomics/thread-locals "treated as sequential operations"). Only the a-rung (limit capture)
    was in scope for part 1; the one-peer environment model is part 2.'
  buddy-nested-vec: 'J8 (2026-10-08, 95-min box, 0 credited). All concrete small cases are CHEAP, not a wall: new()+total_free(),
    alloc(), free()-merge on n = 1, 2, 4 sectors prove at unwind 2-4 with checks ON in 5-12 s / < 1 GB, twins fail
    (proved-bounded). The earlier 105-113 GB measurements came from SYMBOLIC state/geometry, not from Vec<Vec<u64>>
    as such. Wall 1 (isolated by diag_j8_new_* copies): BuddyAllocator::new''s vec![Vec::new(); max_order + 1] with
