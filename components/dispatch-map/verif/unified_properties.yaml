# LEVEL 1: input-range mismatches. Level 2 proves the dependent properties UNDER these.
level2_assumptions:
- id: D-RANGE-FR-003-8e9f6a
  assume: the memory-tier byte size is at most 4,294,963,200 bytes (4 GiB minus 4 KiB), so its rounded-up size fits in 32 bits
  assume_rust: size <= u32::MAX - 4095
  methods:
  - create_memory_tier_entry
  - promote_block_to_memory_tier
  - entry_size
- id: D-RANGE-FR-023-388782
  assume: a recovered extent's block count is at most 1,048,575 (so the extent is smaller than 4 GiB)
  assume_rust: size_blocks <= u32::MAX / 4096
  methods:
  - recover_extent
  - initialize
  - entry_size
- id: D-RANGE-AS-1.3-193445
  assume: the memory pointer passed in is not null
  assume_rust: '!pointer.is_null()'
  methods:
  - create_memory_tier_entry
  - promote_block_to_memory_tier
- id: D-RANGE-FR-012-437b1e
  assume: an eviction-policy component is connected when initialize is called
  assume_rust: self.eviction_policy.get().is_ok()
  methods:
  - initialize
- id: D-RANGE-FR-020-fd9bf8
  assume: when initialize runs, the map holds no entry for any key the extent manager reports
  assume_rust: 'for every extent e reported by for_each_extent: !inner.entries.contains_key(&e.key)'
  methods:
