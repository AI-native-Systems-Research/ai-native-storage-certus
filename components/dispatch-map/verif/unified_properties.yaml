    - lib.rs:395-415
    - lib.rs:428-431
    - lib.rs:478-481
    - lib.rs:535-538
    - lib.rs:576-590
    - lib.rs:597-601
    - lib.rs:394-415
    - lib.rs:575-590
    - lib.rs:596-601
    why: Every keyed operation reads or changes only the map entry found under its own key (get_mut/insert/remove
      on that key), so other keys' location, size and reference counts are untouched.
  DM-LOOKUP-REFRESHES-EVICTION-PRIORITY:
    class: A
    reason: null
    checked_by: kani
    evidence:
    - lib.rs:144
    - lib.rs:154-157
    why: After a successful lookup the code takes the entry's eviction handle and calls the eviction policy's
      touch on it, which is the policy's "mark as most recently used" call (the policy's own error is
      ignored).
  DM-OLDEST-KEYS-EMPTY:
    class: B
    reason: null
    checked_by: kani
    evidence:
    - lib.rs:373
    - lib.rs:55
    - lib.rs:374-377
    - lib.rs:50-58
    - lib.rs:374-378
    why: With an eviction policy connected an empty map gives an empty list, but on a fresh map with no
      eviction policy connected oldest_keys calls get_pool_id, which unwraps the missing policy and crashes
      instead of reaching the empty-list fallback on line 377.
  DM-OLDEST-KEYS-FILLS-TO-N:
    class: '?'
    needs_human: true
    run1:
      class: A
      reason: null
      evidence:
      - lib.rs:373-375
      - lib.rs:399
      - lib.rs:579
      - lib.rs:91-92
      why: Every entry is registered in the dispatch map's eviction pool and oldest_keys passes n straight
        to the policy's get_eviction_candidates, which returns up to n tracked keys, so with at least
        n entries it returns n.
    run2:
      class: C
      reason: external
      evidence: []
      why: The dispatch map just passes n to the eviction policy and returns whatever list it gets back,
        so how many keys come back is decided by the eviction-policy component.
  DM-OLDEST-KEYS-ORDER:
    class: A
    reason: null
    checked_by: kani
    evidence:
    - lib.rs:373-375
    - lib.rs:91-92
    - lib.rs:399
    - lib.rs:579
    - lib.rs:155-156
    - lib.rs:357-358
    - lib.rs:91-93
    - lib.rs:154-157
    - lib.rs:357-359
    why: Every create, recover, initialize, lookup and touch reports the use to the eviction policy, and
      oldest_keys returns the policy's candidates in its eviction order, so with a least-recently-used
      policy the order is oldest-use first (the ordering rule itself belongs to the policy).
  DM-TOUCH-NO-WAIT:
    class: A
    reason: null
    checked_by: creusot
    evidence:
    - lib.rs:349-361
    - lib.rs:349-360
    why: touch only takes the map's short internal lock, never waits on the reference-count condition
      and has no Timeout return path, so it completes regardless of read or write references held on the
      entry.
  DM-TOUCH-REFRESHES-PRIORITY:
    class: A
    reason: null
    checked_by: kani
    evidence:
    - lib.rs:349-360
    - lib.rs:355
    - lib.rs:357-359
    - lib.rs:355-359
    why: touch looks up the entry, takes its eviction handle and calls the eviction policy's touch on
