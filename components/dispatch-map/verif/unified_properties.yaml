  DM-TRY-EVICT-TO-BLOCK-ATOMIC:
    class: C
    reason: interleaving
    checked_by: loom
    evidence:
    - lib.rs:534-563
    why: Whether another caller can grab a reference between the check and the move is a question about
      how threads interleave; the code does both under one lock hold, which a thread-interleaving checker
      can confirm.
