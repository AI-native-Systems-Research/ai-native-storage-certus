    in any state that satisfies the proved invariant DM-INV-READ-WRITE-EXCLUSIVE, so it can be neither
    proved meaningfully nor refuted. Latent ordering issue at lib.rs:308-312 (write_ref cleared before
    the checked add): worth a one-line reorder, not a defect.'
