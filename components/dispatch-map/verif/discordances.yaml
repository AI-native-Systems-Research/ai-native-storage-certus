  spec_says: If initialize is called while no eviction-policy component is connected, it returns an error to the
    caller (it does not crash) and the map is not populated.
  code_does: If no eviction policy is connected, initialize returns a NotInitialized error instead of terminating
    the program, and the map is left unchanged.
