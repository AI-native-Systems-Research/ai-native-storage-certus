- id: D-FR-004-lib.rs:144-7c1ad2
  name: Lookup refreshes eviction priority
  kind: spec-and-code-differ
  methods:
  - lookup
  spec_says: A successful lookup of an existing entry makes that entry the most recently used for eviction ordering,
    so it is listed after all other entries by oldest_keys.
  code_does: A lookup that finds the key reports an access for that entry's eviction handle to the eviction policy,
    so the entry's eviction ranking is refreshed.
