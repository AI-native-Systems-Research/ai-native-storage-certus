- id: D-RANGE-FR-003-8e9f6a
  name: 'Input range: memory-tier byte size small enough for its 4 KiB-rounded size to fit in 32 bits'
  kind: input-range-mismatch
  methods:
  - create_memory_tier_entry
  - promote_block_to_memory_tier
  - entry_size
  spec_says: 'A memory-tier entry may have any non-zero 32-bit byte size, and entry_size must report that size rounded
    up to a whole number of 4 KiB blocks, as a 32-bit value (FR-003, FR-023, FR-025).

    '
  code_does: 'The code rounds the byte size up to 4 KiB blocks and later multiplies the block count by 4096 in 32-bit
    arithmetic without a check; a byte size above 4,294,963,200 rounds up to 1,048,576 blocks and the product overflows
    (lib.rs:406, lib.rs:494, lib.rs:369).

    '
  spec_pointers:
  - FR-003
  - FR-023
  - FR-025
  code_pointers:
  - lib.rs:369
  - lib.rs:406
  - lib.rs:494
  status: candidate
  assume_in_level2: the memory-tier byte size is at most 4,294,963,200 bytes (4 GiB minus 4 KiB), so its rounded-up
    size fits in 32 bits
  excluded_properties: []
- id: D-RANGE-FR-023-388782
  name: 'Input range: recovered extent block count small enough for its byte size to fit in 32 bits'
  kind: input-range-mismatch
  methods:
  - recover_extent
  - initialize
  - entry_size
  spec_says: 'A recovered extent''s size is a 32-bit block count, and entry_size must report that block count times
    4096 as a 32-bit value; the specification places no upper limit on the block count (FR-023, FR-024).

    '
  code_does: 'The code stores the block count as given by recover_extent or by the extent manager during initialize
    and multiplies it by 4096 in unchecked 32-bit arithmetic, which overflows for any block count above 1,048,575
    (lib.rs:582, lib.rs:98, lib.rs:369).

    '
  spec_pointers:
  - FR-023
  - FR-024
  - FR-012
  code_pointers:
  - lib.rs:369
  - lib.rs:582
  - lib.rs:98
  status: candidate
  assume_in_level2: a recovered extent's block count is at most 1,048,575 (so the extent is smaller than 4 GiB)
  excluded_properties: []
- id: D-RANGE-AS-1.3-193445
  name: 'Input range: memory pointer must be non-null'
  kind: input-range-mismatch
  methods:
  - create_memory_tier_entry
  - promote_block_to_memory_tier
  spec_says: 'create_memory_tier_entry must reject a null memory pointer with an error and record nothing (acceptance
    scenario 1.3, edge case on a null pointer).

    '
  code_does: 'The code stores the caller''s pointer without checking it and has no error for a null pointer; it
    assumes the caller passes a valid, non-null pointer (lib.rs:384-404, lib.rs:470-493).

    '
  spec_pointers:
  - AS-1.3
  - EC-create-null-pointer
  code_pointers:
  - lib.rs:384
  - lib.rs:402
  - lib.rs:470
  - lib.rs:490
  status: candidate
  assume_in_level2: the memory pointer passed in is not null
  excluded_properties: []
- id: D-RANGE-FR-012-437b1e
  name: 'Configuration: an eviction-policy component must be connected'
  kind: input-range-mismatch
  methods:
  - initialize
  spec_says: 'initialize must check that an eviction-policy component is connected and return an error, not crash,
    when it is not; the extent manager is optional (FR-012, FR-015).

    '
  code_does: 'The code does not check; it obtains the eviction pool first, and that step unwraps the eviction-policy
    connection, so a missing policy aborts the program before the error branch is reached (lib.rs:55, lib.rs:68-71).

    '
  spec_pointers:
  - FR-012
  - FR-015
  code_pointers:
  - lib.rs:55
  - lib.rs:68-71
  status: candidate
  assume_in_level2: an eviction-policy component is connected when initialize is called
  excluded_properties: []
- id: D-RANGE-FR-020-fd9bf8
  name: 'State: initialize runs on a map holding no entry for a reported key'
  kind: input-range-mismatch
  methods:
  - initialize
  spec_says: 'initialize must be called explicitly after construction; the specification does not limit when it
    may be called or require the map to be empty beforehand (FR-020).

    '
  code_does: 'The code inserts each recovered extent with a plain insert, so an existing entry for the same key,
    including its read and write references, would be silently replaced; it assumes initialize runs once on an empty
    map (lib.rs:106, lib.rs:87-108).

    '
  spec_pointers:
  - FR-020
  - FR-012
  code_pointers:
  - lib.rs:106
  - lib.rs:87-108
  status: candidate
  assume_in_level2: when initialize runs, the map holds no entry for any key the extent manager reports
  excluded_properties:
  - DM-INITIALIZE-PRESERVES-REFERENCED-ENTRY
