    traces:     [FR-002]
  - id:         SPEC-TRACK-NONIDEMPOTENT
    subject:    track
    kind:       postcondition
    verifiable: true
    statement:  >
      Tracking a key that is already tracked in the same pool is NOT idempotent for this LRU
      policy: it creates a second, independent entry and returns a new handle rather than
      refreshing the existing entry, so the pool's entry count rises by one on every track call.
    traces:     [FR-002]
  - id:         SPEC-TRACK-IGNORES-SEMANTICS
    subject:    track
    kind:       frame
    verifiable: true
    statement:  >
      The BlockSemantics hint passed to track (for example its session_id) has no effect on this
      LRU policy's behavior or ordering: two track calls that differ only in their semantics
      argument produce the same resulting order and entry count.
    traces:     [FR-002]
  - id:         SPEC-TOUCH-MRU
    subject:    touch
    kind:       postcondition
    verifiable: true
    statement:  >
      Calling touch on a live handle moves the referenced entry to the most-recently-used position
      in its pool, so that after the touch it is the last, not the first, of the pool's entries to
      be chosen for eviction.
    traces:     [FR-003, US1-AS2]
  - id:         SPEC-REMOVE-UNLINK
    subject:    remove
    kind:       postcondition
    verifiable: true
    statement:  >
      Calling remove on a live handle unlinks the referenced entry from its pool's ordering, so
      that entry no longer counts toward the pool and is never subsequently returned for eviction.
    traces:     [FR-004, US1-AS3]
  - id:         SPEC-EVICT-LRU
    subject:    identify_next_to_evict
    kind:       postcondition
    verifiable: true
    statement:  >
      Calling identify_next_to_evict on a non-empty pool removes and returns the least-recently-used
      key of that pool, and after entries are tracked without any touch this is exactly the
      first-tracked (oldest) key, giving first-in-first-out eviction order.
    traces:     [FR-005, US1-AS1]
