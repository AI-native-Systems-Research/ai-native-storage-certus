historical_notes:
  source: components/eviction-policy-lru/verif/PROPERTIES.md @ 35ce4a3a (2026-08-24), the .md-era properties
    record that this YAML pipeline replaced. Preserved here so the branch update does not lose it. It
    describes an EARLIER, NARROWER verification — 5 modules (len, clear, push_back, remove, move_to_back),
    21 VCs, 0 admits — NOT the current proof set, and it is not evidence for any status in this file.
  why_ordering_was_not_proved: 'LRU ordering correctness — FR-005 (pop_front/identify_next_to_evict returns
    the genuinely oldest key), the ordering half of FR-003 (touch makes a node most-recent in traversal
    order), and FR-006 (peek_front_n/get_eviction_candidates returns the n oldest, in order) — each require
    a reachability/acyclicity invariant relating the head->next->...->tail chain to the abstract insertion
    order. That is a quantified, inductive structural invariant, judged out of practical scope for the
    SMT backend at this depth. pop_front and peek_front_n were unproved for the same reason: both traverse
    the next chain, whose termination needs that acyclicity invariant.'
  arena_invariant_caveat: '`inv` (head, tail, every prev/next and every free-list slot is None or in-bounds;
    len <= nodes.len()) was ASSUMED as a precondition, not re-established in postconditions. Those proofs
    were therefore conditional on a well-formed arena and did not themselves show the arena stays well-formed
    across a sequence of operations.'
  mirror_caveat: All of that ran on a standalone line-faithful copy of src/lru_list.rs, because the shipped
    policy wraps LruList in RwLock<Vec<Mutex<Pool>>> which cannot compile under Creusot. Injecting a fault
    into the SHIPPED function would not have failed those proofs.
  fault_injection_log:
    method: 'Manual anti-vacuity check from the 2026-08-24 run: each proof was perturbed in the mirror
      body and the verification condition observed to go red; all five were reverted. This is the manual
      predecessor of the __mutant twins the gate now requires and scores automatically, and it is retained
      as history, not as current evidence.'
    faults:
    - injected: 'len: return self.len + 1 (wrong count)'
      observed: vc_len red — exact-count postcondition load-bearing
    - injected: 'clear: set len = 1 instead of 0'
      observed: vc_clear red (2/3) — reset-to-empty postcondition load-bearing
    - injected: 'push_back: drop self.len += 1'
      observed: vc_push_back red (10/12) — +1 cardinality postcondition load-bearing
    - injected: 'remove: drop self.len -= 1'
      observed: vc_remove red (13/14) — -1 cardinality postcondition load-bearing
    - injected: 'move_to_back: drop self.tail = Some(idx)'
      observed: vc_move_to_back red (19/21) — tail-update postcondition load-bearing
