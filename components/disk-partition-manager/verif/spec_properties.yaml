    statement:  >
      No two partitions in a partition table ever cover the same sector of the drive, whether the table
      was just created or was read back from the drive.
    traces:     ["AS-US1-1", FR-004, "Plan disk layout"]

  - id:         DPM-INV-ORDER-MONOTONIC
    subject:    "Global invariant: partitions are laid out in request order"
    kind:       invariant
    verifiable: true
    statement:  >
      Partitions are placed on the drive in the order they were listed in the request, so each
      partition begins after the previous one ends and the positions increase steadily down the list.
    traces:     ["Key entity: PartitionConfig", "AS-US1-1"]

  - id:         DPM-INV-WITHIN-USABLE
    subject:    "Global invariant: partitions stay inside the usable region"
    kind:       invariant
    verifiable: true
    statement:  >
      Every partition lies entirely within the part of the drive set aside for data, never overlapping
      the decoy legacy record, the main header, the main entry list, the backup entry list or the backup
      header.
    traces:     [FR-001, "Plan disk layout"]

  - id:         DPM-INV-ENTRY-ARRAY-SHAPE
    subject:    "Global invariant: the partition-entry list has a fixed shape"
    kind:       invariant
    verifiable: true
    statement:  >
      The on-disk list of partition entries always consists of exactly 128 entries, each occupying
      exactly 128 bytes, giving a fixed 16 kilobytes of entry data whatever the drive or layout.
    traces:     [FR-001, "Implementation note: entry padding"]

  - id:         DPM-INV-CRC-SELF-CONSISTENT
    subject:    "Global invariant: written tables pass their own integrity checks"
    kind:       invariant
    verifiable: true
    statement:  >
      Any partition table this component writes carries integrity checksums, over both the header and
      the list of partition entries, that a subsequent reader recomputes and finds to match, so a
      freshly formatted drive is never immediately judged corrupt.
    traces:     [FR-002, SC-001]

  - id:         DPM-INV-SIGNATURE-REVISION
    subject:    "Global invariant: header identifying marker and version"
    kind:       invariant
    verifiable: true
    statement:  >
      Every partition-table header this component writes begins with the standard eight-character
      identifying marker required by the partitioning standard and declares version 1.0, and a header
      read back that lacks the correct marker is treated as damaged rather than as valid.
    traces:     [FR-001, FR-003]

  - id:         DPM-INV-BACKUP-MIRRORS-PRIMARY
    subject:    "Global invariant: the backup copy mirrors the main copy"
    kind:       invariant
    verifiable: true
    statement:  >
      The backup partition-entry list holds the same partition entries as the main one, and the backup
      header describes the same layout as the main header with only the positions of the two copies
      exchanged, so recovering from the backup yields the same partitions as reading the main copy.
    traces:     [FR-003, SC-002, "Plan disk layout"]

  - id:         DPM-INV-GUID-V4-BITS
    subject:    "Global invariant: generated identifiers are well-formed random identifiers"
    kind:       invariant
    verifiable: true
    statement:  >
      Every identifier this component generates, for the drive as a whole and for each partition,
      carries the marker bits that declare it a randomly generated identifier of the standard kind, so
      other tools recognise its format.
    traces:     [FR-008]

  - id:         DPM-INV-GUID-DISTINCT
    subject:    "Global invariant: partition identifiers are distinct"
    kind:       invariant
    verifiable: true
    statement:  >
      Within a single formatted drive, no two partitions are given the same unique identifier, and no
      partition shares the drive's own identifier.
    traces:     [FR-008, "Key entity: PartitionInfo"]

  - id:         DPM-INV-NAME-ROUNDTRIP-ASCII
    subject:    "Global invariant: plain-text partition names survive a write-then-read cycle"
    kind:       invariant
    verifiable: true
    statement:  >
      A partition name made of ordinary English letters, digits and punctuation comes back exactly as
      it went in after being written to the drive in the two-byte-per-character on-disk encoding and
      read back again, with no characters lost, added or altered.
    traces:     [SC-003, FR-009]

  - id:         DPM-INV-NAME-MAX-36
    subject:    "Global invariant: partition names fit the standard's 36-character limit"
    kind:       invariant
    verifiable: true
    statement:  >
      No partition name stored on the drive is longer than the 36 characters the partitioning standard
      allows for a name, so a name can never spill over into the neighbouring fields of a partition
      entry.
    traces:     [FR-009, "Key entity: PartitionSpec"]

  - id:         DPM-INV-SECTOR-SIZE-DOMAIN
    subject:    "Global invariant: the sector size is one of the two supported values"
    kind:       invariant
    verifiable: true
    statement:  >
      The sector size the component works with, and the sector size it reports back in a partition
      table, is always either 512 bytes or 4096 bytes, the two sizes the component promises to support.
    traces:     [FR-011, "Key entity: PartitionConfig", "Implementation note: sector size"]

  - id:         DPM-INV-CACHED-STATE-MONOTONIC
    subject:    "Global invariant: the remembered table is only ever set by a success"
    kind:       invariant
    verifiable: true
    statement:  >
      The component starts out remembering no partition table, begins remembering one only when a read
      or a format succeeds, and never goes back to remembering nothing, so queries that once worked do
      not start reporting that the component is uninitialized.
    traces:     ["Implementation note: internal partition-table state", IR-001]

  - id:         DPM-INV-TYPE-GUID-CONSTANTS
    subject:    "Global invariant: the well-known partition type identifiers are fixed"
    kind:       invariant
    verifiable: true
    statement:  >
      The three partition kinds this system defines — the metadata region, the data region and the
      extended-metadata region — each have one fixed published identifier value that never changes, so
      a drive formatted by one version of the software is recognised by another.
    traces:     ["Well-known type GUIDs table"]

  - id:         DPM-INV-PARTITION-INDEX-SEQUENTIAL
    subject:    "Global invariant: partition position numbers are sequential from zero"
    kind:       invariant
    verifiable: true
    statement:  >
      The partitions in a returned partition table are numbered starting at zero and increasing by one
      with no gaps and no repeats, so the numbering can be used directly to walk through them.
    traces:     ["Key entity: PartitionInfo", IR-001]

  - id:         DPM-INV-NUM-SECTORS-POSITIVE
    subject:    "Global invariant: every partition has a non-zero length"
    kind:       invariant
    verifiable: true
    statement:  >
      Every partition that appears in a partition table spans at least one sector; a zero-length
      partition is never produced, including for the partition that was asked to take all the remaining
      space when little space remains.
    traces:     ["Key entity: PartitionInfo", FR-004]

  - id:         DPM-INV-NSID-CONSISTENT
    subject:    "Global invariant: all device access uses the configured namespace"
    kind:       invariant
    verifiable: true
    statement:  >
      Every read and write the component issues is addressed to the storage namespace that was
      configured for it, so on a drive that presents several namespaces the component never reads or
      writes the wrong one.
    traces:     [FR-010, "Key entity: PartitionConfig"]

  # ---------------------------------------------------------------------------
  # Not-verifiable ledger — every remaining unit of the spec bundle, accounted for
  # ---------------------------------------------------------------------------

  - id:         NV-1
    scope:      "tasks.md checklist: review the backfilled spec"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These are human review chores — check that the generated user stories are accurate, confirm the
      requirements describe intended rather than merely current behavior, prune implementation notes,
      add any missing requirements, and set the document status. They ask a person to make editorial
      judgements about a document and place no obligation on the running software.
    traces:     ["tasks.md: Review Backfilled Spec"]

  - id:         NV-2
    scope:      "tasks.md checklist: add unit tests"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These entries call for tests to be written — a round-trip test, a backup-fallback test, two
      layout-rejection tests, name-encoding tests and a decoy-record test. They describe work to be
      done on the project, not behavior the software must exhibit; the behaviors they would cover are
      already captured as properties in their own right.
    traces:     ["tasks.md: Add Unit Tests"]

  - id:         NV-3
    scope:      "tasks.md checklist: documentation"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Writing a component readme with usage examples and documenting the meaning of the well-known
      partition kinds are documentation chores. Nothing about the software's observable behavior can be
      shown true or false by them.
    traces:     ["tasks.md: Documentation"]

  - id:         NV-4
    scope:      "Implementation note: identifiers fall back to all zeros when the system randomness source cannot be opened"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Whether the operating system's randomness source can be opened is a property of the environment
      the component runs in, not of the component, so the triggering condition cannot be produced or
      checked by a verifier. This note also directly contradicts the requirement that identifiers are
      always randomly generated, and that contradiction is a documentation or design defect to resolve
      rather than an obligation to check.
    traces:     ["Implementation note: GUIDs are generated from the system randomness source", FR-008]

  - id:         NV-5
    scope:      "Implementation note: input and output are performed with synchronous request messages over the block device channel"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This describes the mechanism by which the component talks to the storage device rather than an
      outcome a caller can observe. Which message type carries a read or a write, and whether it blocks
      the calling thread, is an internal transport choice with no falsifiable statement about partition
      tables attached to it.
    traces:     ["Implementation note: synchronous command messages", "Plan design decision: synchronous I/O via client channels"]

  - id:         NV-6
    scope:      "Implementation note: the component is declared with the framework macro, one storage receptacle and a lock-protected optional table"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is a statement about how the component is wired together in source form — which macro
      declares it and which container holds its state. It is a structural fact about the code's shape,
      not a behavior with a possible counterexample; the behavior that depends on it, namely that a
      table is remembered after a success, is captured separately.
    traces:     ["Implementation note: component declaration and internal state", "Plan architecture: component layer"]

  - id:         NV-7
    scope:      "PR-002 detail: the exact number of device round-trips and the deferred batching optimization"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The claim that reading the table costs thirty-three round-trips at the smaller sector size and
      five at the larger one, and the accompanying decision to leave batching them into one multi-sector
      request for a future performance task, is a performance characteristic and a planning decision. It
      depends on how the transport splits requests rather than on the component's observable result; the
      part that is checkable — that the cost does not grow with device size — is captured as a property.
    traces:     [PR-002]

  - id:         NV-8
    scope:      "plan.md testing section: no dedicated test files exist and validation happens at integration level"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This records the current state of the project's test suite and how the component is presently
      exercised against real hardware. It is a fact about the repository and the development process,
      not a promise about what the software does.
    traces:     ["plan.md: Testing"]

  - id:         NV-9
    scope:      "plan.md future considerations: online growth, attribute flags, table repair, non-blocking input and output"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These are ideas for features that do not exist yet — growing a partition in place, supporting
      read-only or hidden markings, rebuilding one copy of the table from the other, and switching to a
      non-blocking access path. There is no present behavior to confirm or refute.
    traces:     ["plan.md: Future Considerations"]

  - id:         NV-10
    scope:      "plan.md design decision: simplicity is traded for blocking the calling thread during setup"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is a rationale about a trade-off in engineering effort and about how long a thread waits.
      How long something takes is a timing matter rather than a state or result, so it cannot be settled
      by examining the component's outputs.
    traces:     ["plan.md: Key Design Decisions, item 1"]

  - id:         NV-11
    scope:      "dependencies section: the storage interface crate, the component framework and the checksum library"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Listing which other packages the component builds against is a build-configuration fact. The
      behavior that matters — that the table carries checksums that validate, and that a storage device
      is required before any access — is captured as properties in its own right.
    traces:     ["spec.md: Dependencies", "plan.md: Technical Context"]

  - id:         NV-12
    scope:      "spec document metadata: the backfill notice, the status and last-synced stamps, and the drift-report bookkeeping"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The warning that the document was generated from existing code, the dates of the synchronization
      passes, and the record of which drift report was stamped clean for the build gate are all
      bookkeeping about the document itself. They say nothing about the component's behavior.
    traces:     ["spec.md: header and Backfill Notice"]

  - id:         NV-13
    scope:      "overview and user-story motivation prose"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The explanations of why partitioning is wanted — so that checkpoint structures live apart from
      user data, so that offsets can be recovered without reformatting, so that existing data survives
      restarts — are motivations for the requirements. Each concrete promise inside them is captured as
      a property; the motivation itself has no counterexample.
    traces:     ["spec.md: Overview", "US-1", "US-2", "US-3"]

  - id:         NV-14
    scope:      "ambiguity: when a caller sees the corrupt-table error rather than the no-partition-table error"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The document describes a corrupt-table error as one of the possible outcomes and says it is
      produced internally when a checksum does not match, but it also says that when both copies fail
      the caller is told no partition table was found. It never states any situation in which a caller
      of the read operation actually receives the corrupt-table error, so there is no obligation here
      precise enough to confirm or refute. This gap should be resolved in the specification.
    traces:     [FR-003, "AS-US2-3", "Error variant: CorruptTable"]

  - id:         NV-15
    scope:      "plan.md design decision: partition management lives in its own component rather than inside the extent manager"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is an architectural placement decision, justified by wanting several components to be able
      to ask about partition offsets independently. Where code lives is not an observable behavior of
      the running component.
    traces:     ["plan.md: Key Design Decisions, item 4"]

  - id:         NV-16
    scope:      "well-known type identifier table: the usage column, including one kind reserved for future use"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The descriptions of what each partition kind is meant to be used for, and the note that one of
      them is reserved for later, express intent about how other components should interpret a
      partition. The identifier values themselves are captured as a property; their intended meaning
      cannot be confirmed or refuted by inspecting this component.
    traces:     ["Well-known type GUIDs table"]

  - id:         NV-17
    scope:      "Implementation note caveat: tables written by external tools with a different entry-list position would be read incorrectly"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This caveat narrows the promise of reading an existing table to tables this system wrote or that
      happen to use the standard placement, and warns that a table written elsewhere with a different
      placement would be misread. Since the specification does not define correct behavior for such
      foreign tables at all, there is no obligation to check; the behavior that is checkable, namely
      that the entry list is read from the fixed third sector, is captured as a property.
    traces:     ["Implementation note: read path assumes Certus-written layout", "US-2"]

  - id:         NV-18
    scope:      "open decision: whether to validate the sector size explicitly or widen the requirement to accept any sector size"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The document notes that the requirement names two supported sector sizes while the behavior it
      describes accepts any sector size without checking, and then leaves the choice between adding a
      check and relaxing the requirement to a future decision. An unresolved choice is not an
      obligation; the stated two-value requirement is captured as a property, and this open decision is
      recorded here because the two halves of the document disagree.
    traces:     [FR-011, "Implementation note: sector size"]
