bugs:
  FV-BUG-003:
    title: The sector size is never validated
    root_cause: config.sector_size is passed through unchecked (lib.rs:91 -> gpt.rs:58); 512 or 4096 appears only
      in a doc comment. The protective MBR buffer is sized by it, then written at offset 446.
    location: components/disk-partition-manager/src/gpt.rs:58
    status: open
    also_seen: Kani (unscored) — with a 1-byte sector size the u64 sector sum wraps and passes the capacity check
      (DPM-FORMAT-SUM-OVERFLOW).
  FV-BUG-004:
    title: More than 128 partitions are not rejected
    root_cause: The layout pads the entry list UP to 128 but never truncates or rejects more (gpt.rs:310), so a
      129th entry is serialised past the fixed 16 KiB entry buffer.
    location: components/disk-partition-manager/src/gpt.rs:310
    status: open
  FV-BUG-005:
    title: A 'rest of disk' partition with no space left gets an inverted extent
    root_cause: When no sectors remain, the rest-of-disk partition gets ending_lba = starting_lba - 1 (gpt.rs:293),
      and its length is then computed as ending - starting + 1.
    location: components/disk-partition-manager/src/gpt.rs:293
    status: open
