    Divides by it (entry_sectors gpt.rs:326, div_ceil gpt.rs:267, 283, 452, 502) -> panic on 0; builds
    sector-sized MBR/header buffers and writes mbr[446..462], mbr[510], mbr[511] (gpt.rs:330-352) and
    buf[0..92] (gpt.rs:408-423) -> index panic for sector_size < 512 (MBR) / < 92 (header); any other
    value (e.g. 520, 1024) is silently accepted.
