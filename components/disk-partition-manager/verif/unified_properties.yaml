    - gpt.rs:90-95
    - lib.rs:69-71
    why: Layout errors from format do propagate, and primary-read I/O errors propagate, but an I/O failure
      on the backup read is rewritten as NoPartitionTable and initialize_or_format then formats the drive
      instead of returning the error.
  DPM-IOF-NO-REFORMAT-ON-DAMAGED-PRIMARY:
    class: '?'
    needs_human: true
    run1:
      class: A
      reason: null
      evidence:
      - src/gpt.rs:68-84
      - src/gpt.rs:87-90
      - src/lib.rs:55-56
      - src/lib.rs:62
      why: A primary that fails CRC or signature falls back to the backup, and an intact backup returns
        Ok so initialize_or_format returns (table, false) without formatting; a primary I/O error returns
        the error (not a reformat); read with "damaged" meaning CRC/signature failure (an unreadable primary
        sector is not recovered from the backup but is also not reformatted).
    run2:
      class: B
      reason: null
      evidence:
      - gpt.rs:79-84
      - gpt.rs:103
      - gpt.rs:118-120
      - gpt.rs:90-95
      - lib.rs:57-60
      why: A primary damaged by a CRC or signature fault is recovered from an intact backup. A primary
        whose damage surfaces as an I/O error (an unreadable header sector, or a corrupt entry count that
        drives the read off the device, gpt.rs:103, 118-120) returns at gpt.rs:83 without trying the intact
        backup, and a transient backup read failure is turned into NoPartitionTable and the drive is reformatted
        (gpt.rs:91, lib.rs:57-60).
  DPM-IOF-POST-MISSING-FORMATTED:
    class: A
    reason: null
    checked_by: kani
    evidence:
    - src/lib.rs:55-61
    - src/gpt.rs:90-95
    - lib.rs:50-53
    - lib.rs:55-61
    - gpt.rs:90-95
    why: When force_format is false and initialize returns NoPartitionTable (also CorruptTable), format(config)
      is called and Ok((table, true)) returned; the extra CorruptTable branch does not contradict the
      statement.
  DPM-IOF-PRE-CONFIG-VALID:
    class: '?'
    needs_human: true
    run1:
      class: A
      reason: null
      evidence:
      - src/lib.rs:50-52
      - src/lib.rs:57-61
      why: Caller-side precondition; initialize_or_format passes the config unchanged to format (with
        ?) on both format branches, so the config is subject to exactly format's acceptance and is otherwise
        unused — read as a precondition the code relies on, not one it must check eagerly.
    run2:
      class: B
      reason: null
      evidence:
      - lib.rs:50-63
      - lib.rs:59
      - lib.rs:86-95
      why: 'initialize_or_format does not validate config up front. When a valid table exists it returns
        success with an invalid config (lib.rs:55-56), and the config is only checked, by format, on the
        fallback branch (lib.rs:59). I was unsure here: this may simply be a caller obligation the code
        is consistent with.'
  DPM-NAME-LENGTH-LIMIT:
    class: B
    reason: null
    checked_by: kani
    evidence:
    - src/gpt.rs:576-587
    - src/gpt.rs:578
    - gpt.rs:576-587
    - gpt.rs:294
    - ipartition_table.rs:32
    why: Names longer than 36 UTF-16 units are not rejected; encode_utf16le_name silently keeps the first
      36 units (possibly splitting a surrogate pair).
  DPM-NAME-ROUNDTRIP:
    class: B
    reason: null
    checked_by: kani
    evidence:
    - src/gpt.rs:578
    - src/gpt.rs:589-595
    - gpt.rs:578
    - gpt.rs:589-595
    why: Only ASCII names of at most 36 characters round-trip; an ASCII name of 37+ characters is truncated
      to 36 on encode, and the statement has no length qualifier.
  DPM-PINFO-POST-INDEX-ECHO:
    class: B
    reason: null
    checked_by: kani
    evidence:
    - src/lib.rs:104
    - src/gpt.rs:134-137
    - src/gpt.rs:221-223
    - lib.rs:102-110
    - gpt.rs:132-137
    - gpt.rs:219-224
    why: partition_info indexes the filtered (non-empty) list while each returned PartitionInfo.index
      is the pre-filter slot number, so after an empty slot the returned index differs from the requested
      one.
  DPM-READ-BACKUP-LOCATION-UNDERFLOW:
    class: A
    reason: null
    checked_by: kani
    evidence:
    - src/gpt.rs:87
    - src/gpt.rs:89
    - gpt.rs:87-89
    - lib.rs:76-80
    why: backup_lba = num_sectors - 1 and backup_entry_lba = backup_lba - entry_sectors are unchecked
      subtractions with no minimum-size check, so they underflow (panic/wrap) on a tiny device as stated.
  DPM-READ-STRIDE-MISMATCH:
    class: A
    reason: null
    checked_by: kani
    evidence:
    - src/gpt.rs:118-120
    - src/gpt.rs:387-394
    - src/gpt.rs:131
    - gpt.rs:118-120
    - gpt.rs:387-394
    - gpt.rs:131
    why: The byte count uses header.partition_entry_size but parse_entries always strides GPT_ENTRY_SIZE
      (128) and breaks when data runs out, exactly the boundary behaviour stated.
