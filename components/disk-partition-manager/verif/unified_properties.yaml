  origin_before_level1: spec+code
  divergence_note: 'SPEC (FR-002; AS-US2-3): both CRCs must be validated, and when both copies are bad
    initialize() returns NoPartitionTable; the header CRC is a UEFI header CRC (FR-001 ''implement UEFI
    GPT rev 1.0'', i.e. over HeaderSize bytes). CODE (gpt.rs:107-114, 123-128, 91-95): the header CRC
    is always taken over a fixed 92 bytes, ignoring the parsed header_size (gpt.rs:373), and the CorruptTable
    error is internal to try_read_gpt_at: on the primary it triggers fallback (gpt.rs:79) and on the backup
    it is replaced by NoPartitionTable (gpt.rs:91), so no public method ever returns the ''corrupt-table
    error reporting stored and recomputed value'' the merged record promises. The merge added a code-internal
    error the spec does not name and that is not observable at initialize/initialize_or_format (see domain
    discordance header_size == 92).'
