level2_assumptions:
- id: D-RANGE-FR-011-46880c
  assume: the sector size (config.sector_size for format, the device-reported size for initialize) is
    512 or 4096
  assume_rust: matches!(config.sector_size, 512 | 4096) && matches!(bd.sector_size(ns_id), Ok(512) | Ok(4096))
  methods:
  - format
  - initialize
  - initialize_or_format
- id: D-RANGE-FR-001-4b3044
  assume: the format request lists at most 128 partitions
  assume_rust: config.partitions.len() <= 128
  methods:
  - format
  - initialize_or_format
- id: D-RANGE-FR-009-d84272
  assume: every requested partition name is at most 36 UTF-16 code units
  assume_rust: config.partitions.iter().all(|p| p.name.encode_utf16().count() <= 36)
  methods:
  - format
  - initialize_or_format
  - initialize
  - partition_info
- id: D-RANGE-SC-003-a2168d
  assume: no requested partition name contains a NUL character
  assume_rust: config.partitions.iter().all(|p| !p.name.contains('\0'))
  methods:
  - format
  - initialize
  - initialize_or_format
  - partition_info
- id: D-RANGE-FR-001-2e9472
  assume: every header read from the drive (primary at LBA 1, backup at the last LBA) declares 128 entries
    of 128 bytes
  assume_rust: hdr.num_partition_entries == 128 && hdr.partition_entry_size == 128
  methods:
  - initialize
  - initialize_or_format
- id: D-RANGE-FR-001-97e8c9
  assume: the primary header names LBA 2 and the backup header names the sectors just before the last
    LBA as their entry arrays
  assume_rust: primary_hdr.partition_entry_lba == 2 && backup_hdr.partition_entry_lba == num_sectors -
    1 - (16384u64).div_ceil(sector_size as u64)
  methods:
  - initialize
  - initialize_or_format
- id: D-RANGE-FR-002-3abcfd
  assume: every header read from the drive declares a header size of 92 bytes
  assume_rust: hdr.header_size == 92
  methods:
  - initialize
  - initialize_or_format
- id: D-RANGE-KEYENTITY:PARTITIONCONFIG-062b0c
  assume: the format request's sector size and total sector count equal what the device reports for that
    namespace
  assume_rust: bd.sector_size(config.ns_id) == Ok(config.sector_size) && bd.num_sectors(config.ns_id)
    == Ok(config.total_sectors)
  methods:
  - format
  - initialize_or_format
  - initialize
- id: D-RANGE-FR-010-fceb34
  assume: the namespace in the format request is the namespace the component is configured to read
  assume_rust: config.ns_id == self.ns_id.lock().unwrap().unwrap_or(1)
  methods:
  - initialize_or_format
  - format
  - initialize
- id: D-RANGE-KEYENTITY:PARTITIONCONFIG-90393c
  assume: the device has room for both headers, both entry arrays, the MBR and at least two usable sectors
  assume_rust: config.total_sectors >= 2 * 16384u64.div_ceil(config.sector_size as u64) + 5 && num_sectors
    >= 16384u64.div_ceil(sector_size as u64) + 1
  methods:
  - format
  - initialize
  - initialize_or_format
- id: D-RANGE-FR-006-9e23ee
  assume: the total sector demand of the fixed-size partitions fits in a u64
  assume_rust: config.partitions.iter().try_fold(0u64, |a, p| a.checked_add(p.size_bytes.div_ceil(config.sector_size
    as u64))).is_some()
  methods:
  - format
  - initialize_or_format
- id: D-RANGE-FR-004-4d24c8
  assume: if a rest-of-disk partition is requested, the fixed-size partitions leave at least one usable
    sector
  assume_rust: '!config.partitions.iter().any(|p| p.size_bytes == 0) || config.partitions.iter().map(|p|
    p.size_bytes.div_ceil(config.sector_size as u64)).sum::<u64>() < config.total_sectors - 2 * 16384u64.div_ceil(config.sector_size
    as u64) - 3'
  methods:
  - format
  - initialize_or_format
  - initialize
- id: D-RANGE-KEYENTITY:PARTITIONINFO-6425ed
  assume: every occupied entry read from the drive has starting_lba <= ending_lba and does not span the
    whole u64 range
  assume_rust: entries.iter().filter(|e| e.type_guid != [0u8; 16]).all(|e| e.starting_lba <= e.ending_lba
    && e.ending_lba - e.starting_lba < u64::MAX)
  methods:
  - initialize
  - initialize_or_format
  - partition_info
