- id: NV-1
  scope: 'tasks.md checklist: review the backfilled spec'
  kind: not-verifiable
  verifiable: false
  reason: These are human review chores — checking that the generated user stories are accurate, confirming
    the requirements describe intended rather than merely current behaviour, pruning implementation notes,
    adding missing requirements and setting the document status. They ask a person to make editorial judgements
    about a document and place no obligation on the running software.
  traces: []
- id: NV-2
  scope: 'tasks.md checklist: add unit tests'
  kind: not-verifiable
  verifiable: false
  reason: These entries call for tests to be written — a round-trip test, a backup-fallback test, two
    layout-rejection tests, name-encoding tests and a decoy-record test. They describe work to be done
    on the project rather than behaviour the software must exhibit, and the behaviours they would cover
    are already captured as properties in their own right.
  traces: []
- id: NV-3
  scope: 'tasks.md checklist: documentation'
  kind: not-verifiable
  verifiable: false
  reason: Writing a component readme with usage examples and documenting the meaning of the well-known
    partition kinds are documentation chores. Nothing about the software observable behaviour can be shown
    true or false by them.
  traces: []
- id: NV-4
  scope: Quality of the system randomness source behind generated identifiers
  kind: not-verifiable
  verifiable: false
  reason: Whether the operating system randomness source can be opened, and whether two identifiers drawn
    from it really differ, is a property of the environment rather than of the component, so the triggering
    condition can neither be produced nor checked by a verifier. The shape of the identifier and the fact
    that a failed draw is ignored are captured as properties of their own; the randomness itself is not
    checkable here, and the specification note that identifiers fall back to all zeros directly contradicts
    its own requirement that they are always randomly generated — a documentation defect to resolve rather
    than an obligation to check.
  traces: []
- id: NV-5
  scope: 'Mechanism of device access: synchronous request messages over the block-device channel'
  kind: not-verifiable
  verifiable: false
  reason: This describes the mechanism by which the component talks to the storage device rather than
    an outcome a caller can observe. Which message type carries a read or a write, and whether it blocks
    the calling thread, is an internal transport choice with no falsifiable statement about partition
    tables attached to it.
  traces: []
- id: NV-6
  scope: 'Source-level shape: framework macro declaration, one receptacle, lock-protected optional table'
  kind: not-verifiable
  verifiable: false
  reason: This is a statement about how the component is wired together in source form — which macro declares
    it and which container holds its state. It is a structural fact about the code shape rather than a
    behaviour with a possible counterexample; the behaviour that depends on it, namely that a table is
    remembered after a success, is captured separately.
  traces: []
- id: NV-7
  scope: 'PR-002 detail: the exact number of device round-trips and the deferred batching optimization'
  kind: not-verifiable
  verifiable: false
  reason: The claim that reading the table costs thirty-three round-trips at the smaller sector size and
    five at the larger one, and the decision to defer batching them into one multi-sector request, is
    a performance characteristic plus a planning decision. It depends on how the transport splits requests
    rather than on any observable result; the checkable part — that the cost does not grow with device
    size — is captured as a property.
  traces: []
- id: NV-8
  scope: 'plan.md testing section: no dedicated test files exist and validation happens at integration
    level'
  kind: not-verifiable
  verifiable: false
  reason: This records the current state of the project test suite and how the component is presently
    exercised against real hardware. It is a fact about the repository and the development process, not
    a promise about what the software does.
  traces: []
- id: NV-9
  scope: 'plan.md future considerations: online growth, attribute flags, table repair, non-blocking input
    and output'
  kind: not-verifiable
  verifiable: false
  reason: These are ideas for features that do not exist yet — growing a partition in place, supporting
    read-only or hidden markings, rebuilding one copy of the table from the other, and switching to a
    non-blocking access path. There is no present behaviour to confirm or refute.
  traces: []
- id: NV-10
  scope: 'Timing: how long a partition-table read or write takes and how long the calling thread waits'
  kind: not-verifiable
  verifiable: false
  reason: The component sets no deadlines and measures no elapsed time, and how long a device takes to
    answer is a wall-clock quantity that cannot be pinned down by inspecting the code. The specification
    rationale that simplicity was traded for blocking the calling thread during setup is likewise a statement
    about engineering effort and waiting time rather than about a state or result.
  traces: []
- id: NV-11
  scope: 'Dependencies section: the storage interface crate, the component framework and the checksum
    library'
  kind: not-verifiable
  verifiable: false
  reason: Listing which other packages the component builds against is a build-configuration fact. The
    behaviour that matters — that the table carries checksums that validate, and that a storage device
    is required before any access — is captured as properties in its own right.
  traces: []
- id: NV-12
  scope: 'Spec document metadata: the backfill notice, the status and last-synced stamps, and the drift-report
    bookkeeping'
  kind: not-verifiable
  verifiable: false
  reason: The warning that the document was generated from existing code, the dates of the synchronization
    passes, and the record of which drift report was stamped clean for the build gate are all bookkeeping
    about the document itself. They say nothing about the component behaviour.
  traces: []
- id: NV-13
  scope: Overview and user-story motivation prose
  kind: not-verifiable
  verifiable: false
  reason: The explanations of why partitioning is wanted — so that checkpoint structures live apart from
    user data, so that offsets can be recovered without reformatting, so that existing data survives restarts
    — are motivations for the requirements. Each concrete promise inside them is captured as a property;
    the motivation itself has no counterexample.
  traces: []
- id: NV-14
  scope: 'Ambiguity: when a caller sees the corrupt-table error rather than the no-partition-table error'
  kind: not-verifiable
  verifiable: false
  reason: The specification describes a corrupt-table error as a possible outcome and says it is produced
    internally when a checksum does not match, but it also says that when both copies fail the caller
    is told no partition table was found. It never states any situation in which a caller of the read
    operation actually receives the corrupt-table error, so there is no obligation here precise enough
    to confirm or refute; this gap should be resolved in the specification.
  traces: []
- id: NV-15
  scope: 'plan.md design decision: partition management lives in its own component rather than inside
    the extent manager'
  kind: not-verifiable
  verifiable: false
  reason: This is an architectural placement decision, justified by wanting several components to be able
    to ask about partition offsets independently. Where code lives is not an observable behaviour of the
    running component.
  traces: []
- id: NV-16
  scope: 'Well-known type identifier table: the usage column, including one kind reserved for future use'
  kind: not-verifiable
  verifiable: false
  reason: The descriptions of what each partition kind is meant to be used for, and the note that one
    of them is reserved for later, express intent about how other components should interpret a partition.
    The identifier values themselves are captured as a property; their intended meaning cannot be confirmed
    or refuted by inspecting this component.
  traces: []
- id: NV-17
  scope: Interoperability with firmware, third-party partitioning tools and foreign tables
  kind: not-verifiable
  verifiable: false
  reason: Whether a table this component writes is accepted by system firmware or by other partitioning
    tools can only be settled by trying those external consumers, and the specification does not define
    correct behaviour for reading a table written elsewhere with a different entry-list placement at all,
    so there is no obligation to check for foreign tables either. The checkable parts — that the entry
    list is read from the fixed third sector, and the several places where the component departs from
    general practice — are captured as properties.
  traces: []
- id: NV-18
  scope: 'Open decision: whether to validate the sector size explicitly or widen the requirement to accept
    any sector size'
  kind: not-verifiable
  verifiable: false
  reason: The specification notes that the requirement names two supported sector sizes while the behaviour
    it describes accepts any sector size without checking, then leaves the choice between adding a check
    and relaxing the requirement to a future decision. An unresolved choice is not an obligation; the
    stated two-value requirement is captured as a property, and this open decision is recorded because
    the two halves of the document disagree.
  traces: []
- id: NV-19
  scope: Blocking wait for a device completion (read_bytes gpt.rs:470, write_bytes gpt.rs:532)
  kind: not-verifiable
  verifiable: false
  reason: Each command is followed by a blocking wait for an answer from the block-device actor. Whether
    that answer always eventually arrives is an unbounded liveness question about another component and
    the operating system scheduler, so it cannot be settled by checking this component alone.
  traces: []
- id: NV-20
  scope: Durability of a completed write across power loss (write_gpt gpt.rs:204-216)
  kind: not-verifiable
  verifiable: false
  reason: Whether the bytes reported as written are still on the medium after a sudden power loss depends
    on the drive own caching and flush behaviour, which this component neither controls nor inspects —
    it never issues a flush of any kind.
  traces: []
- id: NV-21
  scope: Validity and alignment of the transfer buffers (alloc_dma_buffer gpt.rs:556)
  kind: not-verifiable
  verifiable: false
  reason: The transfer buffers are allocated by an external facility and handed to hardware. That the
    memory is valid, correctly aligned and reachable by the device is an assumption about the environment
    rather than a property of this code.
  traces: []
- id: NV-22
  scope: Truthfulness of the device-reported sector size and sector count
  kind: not-verifiable
  verifiable: false
  reason: Every layout calculation rests on the two numbers the block device reports about itself. Whether
    those numbers describe the real hardware is an assumption about the device, not something this component
    can establish.
  traces: []
- id: NV-23
  scope: Behaviour of the two internal locks when another thread panics
  kind: not-verifiable
  verifiable: false
  reason: The remembered table and the namespace setting are each guarded by a lock the code assumes is
    healthy. What happens when a thread dies while holding one depends on non-deterministic interleaving;
    the resulting crash on a later call is recorded as its own property, but the interleaving itself is
    not checkable here.
  traces: []
- id: NV-24
  scope: Soundness of sharing a transfer buffer across threads (read_bytes gpt.rs:459, write_bytes gpt.rs:521)
  kind: not-verifiable
  verifiable: false
  reason: The transfer buffer is wrapped for shared ownership, in one case with an explicit suppression
    of the compiler warning that it is not safe to share between threads. Whether that sharing is actually
    safe depends on the buffer type own internals and on the block-device actor behaviour, both outside
    this component.
  traces: []
- id: NV-25
  scope: Correctness of the external checksum routine
  kind: not-verifiable
  verifiable: false
  reason: All integrity checking delegates to an external checksum library. That the library computes
    the checksum the partition-table standard prescribes is a property of that library, not of this component;
    what is checkable here is only that the same span of bytes is used when writing and when reading.
  traces: []
