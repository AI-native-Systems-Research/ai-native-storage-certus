- id: D-FR-004-gpt.rs:293-9d5bb1
  kind: spec-and-code-differ
  methods:
  - initialize
  - format
  - partition_info
  - num_partitions
  - initialize_or_format
  spec_says: Every partition that appears in a partition table spans at least one sector; a zero-length partition
    is never produced, including for the partition that was asked to take all the remaining space when little space
    remains.
  code_does: Spec promises no zero-length partition is ever produced, naming the rest-of-disk case explicitly; code
    produces exactly that — when the explicitly sized partitions already consume the whole drive, the rest-of-disk
    partition is given zero sectors and an end sector one before its start (gpt.rs:293), and the later conversion
    of start and end into a sector count then subtracts a larger number from a smaller one and crashes the caller
    instead of returning a layout error. The same unguarded subtraction sits on the read path (gpt.rs:139), where
    a checksum-valid table whose entry has its last sector before its first crashes the read.
