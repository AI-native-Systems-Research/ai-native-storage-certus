- id: D-FR-010-lib.rs:72-0b7634
  kind: spec-and-code-differ
  methods:
  - initialize
  - format
  - partition_info
  - num_partitions
  - initialize_or_format
  spec_says: Every read and write the component issues is addressed to the one storage namespace that was configured
    for it, including all of the sector writes performed during a format, so on a drive that presents several namespaces
    the component never reads or writes the wrong one and only the chosen namespace is modified.
  code_does: Spec treats the namespace as one configured value used by every read and write; code uses two different
    sources — reading the partition table uses the namespace configured on the component, defaulting to 1 (lib.rs:72),
    while writing a new table uses the namespace number carried inside the caller’s format request and ignores the
    configured one entirely (lib.rs:91) — so a table can be written to one namespace and then read back from another
    with no warning that they differ.
