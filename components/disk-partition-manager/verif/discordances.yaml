  spec_says: When formatting succeeds, the caller receives a description of the finished partition table that contains
    exactly one entry for each partition that was requested, in the same order it was requested, with each entry
    carrying that partition's starting position and length on the drive. Immediately after a drive has been formatted,
    the count returned equals the number of partitions that the format request asked for — for example three, when
    metadata, extended-metadata and data partitions were requested.
  code_does: SURPRISE - a requested partition silently disappears from the result. The table returned after formatting
    lists only those entries whose type identifier is not all zero bytes, so a caller who asks for a partition with
    an all-zero type identifier has disk space reserved for it on the medium but receives a result that does not
    mention it, and every later partition is reported under a different position than the caller asked for.
