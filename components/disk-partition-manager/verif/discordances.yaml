  - initialize_or_format
  spec_says: If the storage device fails one of the sector reads needed to load the partition table — the command
    cannot be queued, the device reports a failure, it answers with an unexpected kind of completion, or the completion
    channel breaks — the read reports an input/output failure carrying the device’s own explanation, rather than
