    named in the format request, so that a drive presenting several namespaces has only the chosen one modified.
    Every read and write the component issues is addressed to the storage namespace that was configured for it,
    so on a drive that presents several namespaces the component never reads or writes the wrong one.
  code_does: SURPRISE - two operations can act on two different namespaces. Reading the partition table uses the
    namespace number configured on the manager, defaulting to 1, while writing a new table uses the namespace number
    carried inside the caller's request and ignores the configured one entirely, so a table can be written to one
    namespace and then read back from another with no warning that they differ.
