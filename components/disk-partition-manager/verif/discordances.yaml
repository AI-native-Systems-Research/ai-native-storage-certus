- id: D-NOSPEC-lib.rs:104-b23f41
  kind: spec-and-code-differ
  methods:
  - partition_info
  spec_says: The partition description returned reports the same position number that the caller asked for, so a
    caller can never be handed a different partition than the one it requested and can feed a returned position
    straight back in.
  code_does: Spec promises the returned description reports the position the caller asked for; code uses two different
    meanings of position — the number recorded inside each returned description is the slot it occupied in the on-disk
    entry list (gpt.rs:137) while the number this operation accepts is a place in the shorter list of non-empty
    partitions (lib.rs:104) — so when a leading slot is empty the two disagree and feeding a partition’s own reported
    position back in can select a different partition or fail as out of range.
