- id: D-AS-US2-4-lib.rs:5759-323f41
  kind: spec-and-code-differ
  methods:
  - initialize_or_format
  spec_says: A drive whose main table copy is damaged but whose backup copy is intact is recovered from the backup
    and is not reformatted by the combined read-or-create operation, so a partially failed write can never escalate
    into destroying the data on the drive.
  code_does: Spec promises a damaged main copy with an intact backup is recovered and never reformatted; code reformats
    the drive without asking whenever the read returns either missing-table or corrupt-table (lib.rs:57), and because
    a failure reading the backup copy is itself reported as missing-table (gpt.rs:91), a drive that merely could
    not be read at its backup location, or whose main header is rejected for a reason that does not trigger the
    backup fallback, is silently overwritten with possibly live data on it.
