- id: D-FR-011-gpt.rs:326-582fc3
  name: Format precondition sector size
  kind: spec-and-code-differ
  methods:
  - format
  - initialize_or_format
  spec_says: The sector size supplied in the format request must be one of the two sizes the component promises
    to support, namely 512 bytes or 4096 bytes.
  code_does: SURPRISE - missing guard and unchecked indexing. The caller must supply a sector size that is non-zero
    and at least 512 bytes, because the code divides by the sector size and writes to fixed byte positions 446 through
    511 of a buffer whose length is the sector size; nothing in the component ever checks the value, even though
    the declared configuration documents it as being 512 or 4096, so a sector size of zero divides by zero and any
    size below 512 writes past the end of the buffer - both crash the caller instead of returning the declared layout
    error.
