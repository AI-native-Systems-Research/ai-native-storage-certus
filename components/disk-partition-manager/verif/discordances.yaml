- id: D-FR-003-gpt.rs:9092-ca0c39
  kind: spec-and-code-differ
  methods:
  - initialize
  - initialize_or_format
  spec_says: If neither the main copy nor the backup copy of the partition table can be accepted as intact, the
    read fails with an error saying no partition table was found, which is also the answer given for a completely
    blank drive.
  code_does: Spec promises a drive with no usable table (a blank drive included) yields the no-partition-table error;
    code accepts a header that declares zero entry slots as a valid table — reading zero entry bytes whose checksum
    is the checksum of nothing (gpt.rs:118-123) — and reports success with a table of zero partitions instead of
    no-partition-table.
