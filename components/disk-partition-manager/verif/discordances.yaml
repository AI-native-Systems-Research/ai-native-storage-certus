- id: D-FR-003-gpt.rs:9092-ca0c39
  name: Init error no table
  kind: spec-and-code-differ
  methods:
  - initialize
  - initialize_or_format
  spec_says: Reading the existing partition table can only succeed if the drive already carries at least one intact
    copy of the table, either the main copy at the front or the backup copy at the end. If neither the main copy
    nor the backup copy of the partition table can be accepted as intact, the read fails with an error saying no
    partition table was found, which is also the answer given for a completely blank drive.
  code_does: If neither the partition table at the start of the disk nor the spare copy at the end of the disk can
    be validated, reading fails with a "no partition table" error stating that neither the primary nor the backup
    header is valid. SURPRISE - an empty table counts as a successful read. A header that declares zero entry slots
    leads to reading zero bytes of entries, whose checksum is the checksum of nothing, so if the header happens
    to record that same value the read succeeds and reports a partition table with no partitions at all rather than
    reporting that no usable table was found.
  spec_pointers:
  - FR-003
  - AS-US2-1
  - AS-US2-3
  code_pointers:
