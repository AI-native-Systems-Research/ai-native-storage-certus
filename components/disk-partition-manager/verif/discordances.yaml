- id: D-FR-011-gpt.rs:326-582fc3
  kind: spec-and-code-differ
  methods:
  - format
  - initialize_or_format
  spec_says: The sector size supplied in the format request must be one of the two sizes the component promises
    to support, namely 512 bytes or 4096 bytes.
  code_does: Spec requires the supplied sector size to be 512 or 4096 and the component to promise only those; code
    never checks the value anywhere — it divides by the sector size and writes to fixed byte positions 446 through
    511 of a buffer whose length is the sector size (gpt.rs:326, gpt.rs:330), so a sector size of zero divides by
    zero and any size below 512 writes past the end of the buffer, crashing the caller instead of returning the
    declared layout error.
