- id: D-FR-003-gpt.rs:7990-06856a
  name: Init backup fallback
  kind: spec-and-code-differ
  methods:
  - initialize
  - initialize_or_format
  spec_says: If the main copy of the partition table fails its integrity check, the backup copy stored at the last
    sector of the drive is tried instead, and if that copy is intact the read succeeds and returns the partitions
    it describes. If the main copy of the partition table is damaged in the specific way that its identifying marker
    at the start of the header is wrong or has been wiped to zeros, that also counts as corruption and the backup
    copy at the end of the drive is tried, and the read succeeds when the backup is intact.
  code_does: The spare copy is consulted for exactly two reasons - the first copy failed its checksum, or the first
    copy did not carry the expected signature - while any other failure such as an input/output error on the first
    copy is reported immediately without touching the spare copy.
