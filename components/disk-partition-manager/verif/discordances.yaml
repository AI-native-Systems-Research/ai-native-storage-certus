- id: D-AS-US1-2-gpt.rs:160161-267b4d
  name: Format no write on reject
  kind: spec-and-code-differ
  methods:
  - format
  - initialize_or_format
  spec_says: When a format request is rejected because the requested layout is impossible, nothing at all is written
    to the drive, so a bad request cannot leave the drive in a half-formatted state.
  code_does: If the device does not leave at least one sector of usable space between the partition table structures
    at the two ends of the disk, writing a new table fails with a layout error saying the device is too small, and
    nothing is written. SURPRISE - partial change left behind on the failure path. Writing a new partition table
    performs five separate disk writes one after another and gives up at the first one that fails, with no attempt
    to undo the writes that already landed, so a failure part-way through leaves the disk in a mixed state - for
    example the protective first sector and the primary header replaced while the backup header still describes
    the old layout - and the caller is told only that a write failed.
