- id: D-FR-004-gpt.rs:293-9d5bb1
  name: Num sectors positive
  kind: spec-and-code-differ
  methods:
  - initialize
  - format
  - partition_info
  - num_partitions
  - initialize_or_format
  spec_says: Every partition that appears in a partition table spans at least one sector; a zero-length partition
    is never produced, including for the partition that was asked to take all the remaining space when little space
    remains.
  code_does: SURPRISE - subtraction below zero on a reachable path. If the caller asks for a partition that takes
    all remaining space but the explicitly sized partitions already consume the whole disk, that partition is given
    zero sectors and its end sector is computed as one before its start; the later conversion of start and end into
    a sector count then subtracts a larger number from a smaller one, which crashes the caller rather than reporting
    a layout error. SURPRISE - subtraction below zero driven by on-disk data. A partition's sector count is computed
    as its last sector minus its first sector plus one, with no check that the last is not smaller than the first;
    a checksum-valid table whose entry has those two fields the wrong way round therefore crashes the read instead
    of being reported as corrupt.
  spec_pointers:
  - FR-004
  code_pointers:
  - gpt.rs:293
  - gpt.rs:226
  - gpt.rs:139
  status: candidate
  excluded_properties:
