- id: D-NOSPEC-gpt.rs:464487-be2449
  name: Init error io
  kind: spec-and-code-differ
  methods:
  - initialize
  - initialize_or_format
  spec_says: If the underlying storage device fails one of the sector reads needed to load the partition table,
    the read reports an input/output failure rather than pretending the table is missing or corrupt.
  code_does: SURPRISE - error masking. When the attempt to read the spare copy of the partition table at the end
    of the disk fails, every possible cause is collapsed into the single answer "no partition table", including
    a genuine hardware or channel failure; a caller therefore cannot distinguish an unformatted disk from a disk
    the manager simply failed to read, and the convenience entry point reacts to that answer by reformatting the
    disk. If the read command cannot be handed to the device's command queue, the operation fails with an input/output
    error saying the read command could not be sent. If the device reports that the read itself failed, or reports
    a generic error for the command, the operation fails with an input/output error carrying the device's own description
    of the failure. If the device answers a read command with some other kind of completion than a read result or
    an error, the operation fails with an input/output error saying the completion type was unexpected. If the completion
    channel from the device is closed or broken while waiting for a read result, the operation fails with an input/output
    error saying the completion could not be received.
