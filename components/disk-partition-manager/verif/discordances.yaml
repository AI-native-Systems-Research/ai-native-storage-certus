  spec_says: Every partition name supplied in the format request must be short enough to fit in the space the partition
    table reserves for a name, which is 36 characters.
  code_does: SURPRISE - silent truncation where the documentation implies a limit. A partition name is stored as
    at most 36 two-byte characters; the interface documents the name as having a maximum of 36 characters but the
    code neither rejects nor reports a longer name, it simply keeps the first 36 units and discards the rest, and
