  spec_says: When formatting succeeds, the caller receives a description of the finished partition table that contains
    exactly one entry for each partition that was requested, in the same order it was requested, each carrying that
    partition’s starting position and length on the drive, and the partition count reported immediately afterwards
    equals the number of partitions the request asked for.
