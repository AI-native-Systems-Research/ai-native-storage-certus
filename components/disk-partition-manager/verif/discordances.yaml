- id: D-FR-002-gpt.rs:107124-e301de
  name: Init crc validation
  kind: spec-and-code-differ
  methods:
  - initialize
  - initialize_or_format
  spec_says: A copy of the partition table is only accepted as good after two separate integrity checksums have
    been recomputed and found to match, one covering the table header and one covering the whole list of partition
    entries.
  code_does: If the checksum stored in a header does not match the checksum recomputed over the header's first 92
    bytes with the checksum field treated as zero, the read fails with a "corrupt table" error reporting both the
    stored and the computed value. If the checksum stored in the header for the table of partition entries does
    not match the checksum recomputed over the entry bytes just read, the read fails with a "corrupt table" error
    reporting both values, and no partition is reported.
