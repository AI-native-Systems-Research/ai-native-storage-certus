  spec_says: No two partitions in a partition table ever cover the same sector of the drive, whether the table was
    just created or was read back from the drive.
  code_does: In any table this component creates, no two partitions share a sector - each one begins exactly one
    sector after the previous one ends - and together they never reach outside the usable region between the two
