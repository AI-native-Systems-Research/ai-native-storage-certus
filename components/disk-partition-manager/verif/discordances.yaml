- id: D-FR-001-gpt.rs:310-90710b
  kind: spec-and-code-differ
  methods:
  - format
  - initialize_or_format
  - num_partitions
  spec_says: No more than 128 partitions can ever be created or reported, because the partitioning standard this
    component implements provides exactly 128 slots for partition entries.
  code_does: Spec states the number of partitions can never exceed 128 because the standard provides exactly 128
    entry slots; code neither caps nor rejects a larger request — the entry list is built with one element per requested
    partition and only padded, while the buffer it is written into is sized for exactly 128 (gpt.rs:310, gpt.rs:433)
    — so asking for a 129th partition writes past the end of that buffer and crashes rather than returning the declared
    layout error.
