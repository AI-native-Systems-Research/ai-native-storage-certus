- id: D-NOSPEC-gpt.rs:118120-4d9cf0
  name: Init io count bounded
  kind: spec-and-code-differ
  methods:
  - initialize
  - initialize_or_format
  spec_says: Reading the partition table touches a fixed set of sectors — the one sector holding the header plus
    the sectors holding the list of partition entries — and that number does not grow as the drive gets larger.
  code_does: SURPRISE - untrusted on-disk numbers used directly to size a read. The number of entry slots and the
    size of each slot are taken from the header on the disk and multiplied together to decide how many bytes to
    read, with no check against the 128 slots of 128 bytes each that this component itself always writes, so a damaged
    or hostile header can make the component reserve an enormous buffer and issue an enormous number of single-sector
    reads before any checksum is ever examined.
