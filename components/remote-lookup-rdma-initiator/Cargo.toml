[package]
name = "remote-lookup-rdma-initiator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
telemetry = []
# Enables the real rdma-core (libibverbs/librdmacm) transport. Off by default:
# the crate builds and unit-tests its connection-table logic over the in-process
# mock transport with no rdma-core present. Mainline apps enable this; CI/
# default-members do not.
rdma = []

[dependencies]
component-framework.workspace = true
component-core.workspace = true
component-macros.workspace = true
# Only IMemoryTier/ILogger are used, neither of which needs the spdk feature.
interfaces.workspace = true

anyhow = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "push_telemetry"
harness = false
