syntax = "proto3";

package certus.remote_request.v1;

// Protocol for RDMA-based remote cache lookups between Certus nodes.
// Messages are serialized via protobuf and transmitted over RDMA Send/Recv.
// Actual data transfer uses RDMA Write to caller-specified memory.

// --- Handshake (first message exchange on new connection) ---

message HandshakeRequest {
  // Caller's protocol version. Must match handler's version exactly.
  uint32 protocol_version = 1;
  // Optional client identifier for logging/telemetry.
  string client_id = 2;
}

message HandshakeResponse {
  // Whether the connection was accepted.
  bool accepted = 1;
  // Handler's protocol version.
  uint32 server_version = 2;
  // Maximum entries allowed per batch (currently 64).
  uint32 max_batch_size = 3;
  // Reason for rejection (populated only when accepted is false).
  string error_message = 4;
}

// --- Lookup Batch ---

message LookupEntry {
  // 64-bit cache key identifying the cached object.
  uint64 cache_key = 1;
  // Remote memory address where result data should be written via RDMA Write.
  uint64 remote_addr = 2;
  // 32-bit RDMA memory key (rkey) authorizing write to remote_addr.
  uint32 rkey = 3;
  // Maximum bytes allocated at remote_addr for this entry's result.
  uint32 max_size = 4;
}

message BatchLookupRequest {
  // Caller-assigned batch identifier for response correlation.
  uint32 batch_id = 1;
  // 1 to 64 lookup entries.
  repeated LookupEntry entries = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_KEY_NOT_FOUND = 1;
  ERROR_CODE_DISPATCH_ERROR = 2;
  ERROR_CODE_INVALID_REQUEST = 3;
  ERROR_CODE_RDMA_WRITE_FAILED = 4;
  ERROR_CODE_NOT_INITIALIZED = 5;
  ERROR_CODE_VERSION_MISMATCH = 6;
  ERROR_CODE_BATCH_TOO_LARGE = 7;
}

message EntryResult {
  // Echoed cache key for correlation.
  uint64 cache_key = 1;
  // Whether lookup and RDMA write succeeded.
  bool success = 2;
  // Bytes written to remote memory (0 on failure).
  uint32 bytes_written = 3;
  // Error classification (meaningful only when success is false).
  ErrorCode error_code = 4;
  // Human-readable error detail (optional).
  string error_message = 5;
}

message BatchLookupResponse {
  // Echoed batch identifier.
  uint32 batch_id = 1;
  // One result per entry, same order as request.
  repeated EntryResult results = 2;
}

// --- Close ---

message CloseRequest {
  // Optional reason for logging.
  string reason = 1;
}

message CloseResponse {
  // Total batches processed during this session.
  uint64 batches_total = 1;
}

// --- Envelope (discriminated union for multiplexing message types on a single QP) ---

message RequestMessage {
  oneof payload {
    HandshakeRequest handshake = 1;
    BatchLookupRequest lookup = 2;
    CloseRequest close = 3;
  }
}

message ResponseMessage {
  oneof payload {
    HandshakeResponse handshake = 1;
    BatchLookupResponse lookup = 2;
    CloseResponse close = 3;
  }
}
