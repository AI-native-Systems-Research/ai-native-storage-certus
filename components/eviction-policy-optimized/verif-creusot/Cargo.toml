[package]
name = "eviction-policy-optimized-verif"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
creusot-std = "0.12.0-dev"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

# creusot-std is not vendored on this branch. The patch path is CHECKOUT-RELATIVE via the
# gitignored `components/eviction-policy-optimized/creusot` symlink (-> tools/creusot/creusot),
# so it is not tied to one machine. It lives HERE, in the Creusot crate, and deliberately NOT in
# components/<component>/.cargo/config.toml: at component scope it would apply to every cargo
# command in the component, including `cargo kani`, which does not need creusot-std and fails to
# resolve it.
[patch.crates-io]
creusot-std = { path = "../creusot/creusot-std" }
