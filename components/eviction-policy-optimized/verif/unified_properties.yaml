- id: EPO-TRACK-POST-MAXLEN-HIGHWATER
  subject: track
  methods:
  - track
  object_fn: EvictionPolicyOptimizedComponent::track -> Pool::max_len = max(max_len, LruList::len)
  kind: postcondition
  verifiable: true
  global: false
  attachments: 1
  origin: divergent
  derived_from:
    spec:
    - EPO-TRACK-POST-MAXLEN-HIGHWATER
    code:
    - EPO-TRACK-POST-MAXLEN
  source:
    spec:
    - FR-013
    - IN-4
    code:
    - lib.rs:122
  statement: 'On each track the pool updates its record of the largest size it has ever reached to be
    the larger of the previous record and the pool''s size measured at that moment. The measurement is
    taken BEFORE the new entry is inserted, so the record is the high-water mark of the pool''s size just
    before an insertion, not of the pool''s size itself: whenever the pool reaches a new peak, the record
    is one short of that peak.

    '
  note: 'DIVERGENT — adjudicated in favour of the CODE. The spec (FR-013 and implementation note IN-4)
    calls max_len "the high-water mark of pool size" and the blind spec pass accordingly asserted that
    the record "is always at least as big as the pool''s current size". The implementation measures LruList::len()
    at lib.rs:122 BEFORE the push at lib.rs:129-137, so after the first ever track the record is 0 while
    the size is 1. The blind code pass found this independently and stated the true relation (size is
    never more than one greater than the record). The observable consequence is a real defect, not a wording
    quibble: a pool whose size at track time never reaches 1 keeps a record of 0 and therefore NEVER ages
    its frequency estimator at all, because the ageing test at lib.rs:124 is guarded by max_len > 0. The
    same contradiction is recorded as a global invariant in EPO-INV-MAXLEN-UPPER-BOUNDS-LEN; the statement
    above is what a prover should be asked to establish.

    '
  traces:
  - FR-013
  - IN-4
  creusot:
