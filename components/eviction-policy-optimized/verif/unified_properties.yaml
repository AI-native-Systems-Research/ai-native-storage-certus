  - what: verifiability disagreement on the ageing-period multiplication
    detail: 'The spec pass kept the multiplication overflow as a verifiable obligation; the code pass
      classified it as unreachable by magnitude and put it in its not-verifiable ledger. Recorded both
      ways on purpose: kept as the property EPO-TRACK-INV-AGING-PERIOD-NO-OVERFLOW and named in NV-UNREACHABLE-MAGNITUDE-OVERFLOW.
      This is the only place where one unit of the two blind ledgers is deliberately carried on both sides
      of the verifiable line, and it is called out so the counts cannot be mistaken for double counting:
      it contributes one verifiable record and one NV record, and the NV record explains why.

      '
