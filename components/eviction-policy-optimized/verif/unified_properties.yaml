- id: EPO-TRACK-POST-NON-IDEMPOTENT-REREGISTRATION
  subject: track
  methods:
  - track
  object_fn: EvictionPolicyOptimizedComponent::track -> LruList::push_front | LruList::push_back
  kind: postcondition
  verifiable: true
  global: false
  attachments: 1
  origin: divergent
  derived_from:
    spec:
    - EPO-TRACK-POST-NON-IDEMPOTENT-REREGISTRATION
    code:
    - EPO-TRACK-POST-LEN
  source:
    spec:
    - FR-002
    code:
    - lib.rs:129-139
    - ieviction_policy.rs:85-87
  statement: 'Tracking a key that is already being tracked in the same pool does not refresh the existing
    entry: it deliberately creates a second, separate entry for that key and returns a new handle that
    differs from the one returned the first time, so the pool then holds two entries for the same key
    and its reported size grows by one.

    '
  note: 'DIVERGENT — adjudicated in favour of the component spec and the implementation, which agree with
    each other; the contradicted side is the shared interface''s own documentation. The IEvictionPolicy
    doc comment (ieviction_policy.rs:85-87) promises that "Re-registering a key already tracked in `pool`
    is idempotent: it refreshes recency and returns the existing handle without creating a new node or
    altering lineage." The component spec FR-002 states the opposite in bold and calls it a deliberate
    divergence from the interface''s general idempotency clause, shared with eviction-policy-lru. The
    implementation keeps no key-to-entry lookup of any kind (the blind code pass noted it therefore CANNOT
    detect a repeat), so the interface promise is unimplementable as written here. Both blind passes described
    the same behaviour, each flagging the contradiction against the other document it had in hand: the
    spec pass against the interface clause it was told about in FR-002, the code pass against the doc
    comment it read directly. The obligation to verify is the statement above (non-idempotence). The defect
    to fix is a documentation defect in the shared interface (or an explicit carve-out for policies that
    do not index by key); it is NOT closed by this inventory. Note also that the spec pushes the safety
    of this onto callers, recorded as NV-CALLER-NO-RETRACK-GUARD.

    '
