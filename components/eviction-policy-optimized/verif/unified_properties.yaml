  object_fn: EvictionPolicyOptimizedComponent::track -> u64::rem (access_count % (max_len * 10))
  kind: invariant
  verifiable: true
  global: false
  attachments: 1
  origin: spec+code
  derived_from:
    spec:
    - EPO-TRACK-POST-AGING-NO-DIVISION-BY-ZERO
    code:
    - EPO-TRACK-INV-NO-MOD-ZERO
  source:
    spec:
    - FR-013
    code:
    - lib.rs:124-127
  statement: 'Tracking into a pool that has never held an entry must not attempt the remainder calculation
    that schedules ageing, because that calculation would divide by zero and crash the process. The remainder
    is only reached when the pool''s record of largest-ever size is greater than zero, which is exactly
    the case in which the divisor is non-zero, so track never divides by zero.

    '
  note: 'INDEPENDENT CONVERGENCE: both blind passes raised this obligation on their own — the spec pass
    from FR-013''s guard wording, the code pass from the short-circuit at lib.rs:124. Two isolated derivations
    agreeing is real corroboration that the guard is load-bearing.

