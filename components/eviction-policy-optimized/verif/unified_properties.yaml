reconciliation:
  method: 'The two blind extractions were un-blinded and walked side by side, obligation by obligation.
    Every pairing was decided by OBLIGATION IDENTITY — the same subject, the same kind, and the same thing
    asserted about the same observable state — and then checked against the spec text and the Rust source,
    which were both read during this step to adjudicate. No fuzzy string similarity and no automatic sequence
    matcher was used anywhere: a wrong pair would silently merge two different obligations into one id
    and hide a real gap, which is exactly the defect this procedure exists to prevent. The resulting table
    is recorded twice, on purpose: per record as `derived_from`, and in one place as `pairing_table` below.
    Both are generated from the same records, so they cannot disagree.

    '
  origin_policy: '`origin` records which blind pass raised THAT obligation, not merely whether the behaviour
    happens to exist in both artifacts. A spec obligation whose behaviour is plainly implemented but which
    the code pass never raised as its own obligation is therefore marked spec-only, with the code pass''s
    nearest records named in the record''s note. This under-claims agreement rather than over-claims it,
    which is the honest direction.

    '
  spec_only:
    count: 10
    ids:
    - EPO-TRACK-INV-AGING-PERIOD-NO-OVERFLOW
    - EPO-TRACK-FRAME-EXISTING-ENTRIES
    - EPO-TOUCH-POST-NOT-NEXT-VICTIM
    - EPO-BATCH-TOUCH-POST-REMOVED-HANDLES-SKIPPED
    - EPO-EVICT-POST-ORDER-FIRST-TIME-KEYS
    - EPO-INV-SKETCH-ROW-HASHES-DISTINCT
    - EPO-INV-SKETCH-OPS-BOUNDED-BY-FIXED-SIZE
    - EPO-INV-NO-DATA-CORRUPTION-UNDER-CONCURRENCY
    - EPO-INV-CONCURRENT-TRACK-TOTAL-COUNT
    - EPO-INV-NO-STARTUP-BANNER
    note: 'None of these is unimplemented: each is either an end-to-end consequence the code pass expressed
      only in pieces (not-next-victim, first-time-key eviction order, batch stale-handle tolerance, insertion''s
      frame condition), a structural residue of a claim the code pass put in its not-verifiable ledger
      (row-hash distinctness, bounded estimator work, the ageing-period multiplication), or a concurrency
      promise the code pass declined to raise (no corruption under concurrency, concurrent tracks all
      landing).

      '
  code_only:
    count: 20
    ids:
    - EPO-CREATE-POOL-PRE-TOTAL
    - EPO-TOUCH-POST-ALREADY-AT-BACK-NOOP
    - EPO-TOUCH-FRAME-COUNTERS
    - EPO-BATCH-TOUCH-ERROR-PARTIAL-APPLICATION
    - EPO-BATCH-TOUCH-ERROR-NO-LOG
    - EPO-REMOVE-POST-SLOT-RECYCLED
    - EPO-EVICT-PRE-TOTAL
    - EPO-CANDIDATES-PRE-TOTAL
    - EPO-LEN-PRE-TOTAL
    - EPO-CLEAR-PRE-TOTAL
    - EPO-CLEAR-POST-SLOT-NUMBERING-RESTARTS
    - EPO-INV-POOLS-APPEND-ONLY
    - EPO-INV-LEN-MATCHES-ACTIVE-SLOTS
    - EPO-INV-LIST-TAIL-IS-ONLY-NODE-WITHOUT-NEXT
    - EPO-INV-SLOTS-ACCOUNTED
    - EPO-INV-INTERNAL-INDEX-IN-RANGE
    - EPO-INV-LEN-NO-UNDERFLOW
    - EPO-INV-SKETCH-ESTIMATE-AT-LEAST-ONE-AFTER-FIRST-TRACK
    - EPO-INV-AT-MOST-ONE-POOL-LOCK
    - EPO-INV-LOGGER-OPTIONAL
    note: 'Four are the totality preconditions of the four gracefully degrading methods, which the spec
      implies through FR-010 but never states. The rest are undocumented behaviour the spec is silent
      about, and three of them are findings worth a reader''s attention in their own right: batch_touch
      is not all-or-nothing on error, batch_touch alone logs nothing on its error path, and a just-tracked
      key''s estimate is at least one, which is what makes cold newcomers tie with the victim.

      '
  divergent:
    count: 4
    cases:
    - id: EPO-TRACK-POST-NON-IDEMPOTENT-REREGISTRATION
      contradiction: 'The IEvictionPolicy doc comment (ieviction_policy.rs:85-87) promises that re-registering
        a key already tracked in a pool is idempotent, refreshing recency and returning the existing handle
        without creating a new node. The component spec FR-002 states the opposite in bold, calling it
        a deliberate divergence from the interface''s general idempotency clause, and the implementation
        does exactly what FR-002 says.

        '
      adjudication: 'The spec and the implementation agree; the contradicted side is the shared interface''s
        documentation. The implementation keeps no key-to-entry lookup at all, so the interface promise
        is not merely unmet but unimplementable as written in this policy. The obligation carried into
        verification is non-idempotence. The defect is a documentation defect in the shared interface
        (or a missing carve-out for policies that do not index by key) and is NOT closed by this inventory;
        a second-order consequence is that the spec pushes the duplicate guard onto consumers, which is
        recorded as NV-CALLER-NO-RETRACK-GUARD.

        '
    - id: EPO-INV-STALE-HANDLE-NEVER-CRASHES
      contradiction: 'FR-012 requires that touch and remove on an already-removed handle be idempotent
        with "no panic, no effect", and the blind spec pass carried that through as a no-crash guarantee.
        The implementation indexes the slot storage without any bounds check (lru_list.rs:109 and :160),
        so the guarantee holds only while the slot is still allocated; clear_pool empties the slot storage,
        after which every handle the pool ever issued names a slot that does not exist and using any of
        them panics.

        '
      adjudication: 'In favour of the code: FR-012''s promise is overbroad and the implementation genuinely
        crashes on a legitimately issued handle kept across a clear_pool. The obligation is kept in the
        positive so that a prover produces the counterexample; the expected outcome is a REFUTATION, and
        the miss is a real component defect, not a tool boundary. The legitimate part of FR-012 — a removed-but-still-allocated
        entry is a silent no-op — is kept separately and does pair cleanly (EPO-TOUCH-POST-REMOVED-HANDLE-IS-SILENT-NOOP,
        EPO-REMOVE-POST-IDEMPOTENT-REMOVED-HANDLE).

        '
    - id: EPO-TRACK-POST-MAXLEN-HIGHWATER
      contradiction: 'FR-013 and implementation note IN-4 call max_len "the high-water mark of pool size",
        and the blind spec pass asserted that the record is always at least as big as the pool''s current
        size. The implementation measures the list length at lib.rs:122 BEFORE the insertion at lib.rs:129-137,
        so the record is the high-water mark of the size just before an insertion and is one short whenever
        the pool stands at a new peak.

        '
      adjudication: 'In favour of the code, as an apparent off-by-one in the implementation rather than
        a mis-reading of the spec. The consequence is behavioural, not cosmetic: a pool whose size is
        still zero at every track keeps a record of zero, so the guard max_len > 0 is never satisfied
        and the frequency estimator is never aged for that pool at all.

        '
    - id: EPO-INV-MAXLEN-UPPER-BOUNDS-LEN
      contradiction: 'The same contradiction as the preceding case, stated at the level of the global
        invariant: the spec pass asserted that the largest-ever-size record always upper-bounds the current
        size; the code pass derived that the current size can exceed the record by exactly one.

        '
      adjudication: 'In favour of the code. Recorded as its own divergent id, and not folded into the
        track postcondition, because the two are distinct obligations that a prover meets in different
        places — one as a postcondition of a single call, the other as a state invariant over every reachable
        state — and both are stated incompatibly by the two sides.

        '
  convergences:
    note: 'Where both blind passes independently found the SAME defect or the SAME obligation, that is
      recorded explicitly, both here and in the property''s own note. Independent agreement between two
      lists derived in isolation is real corroboration and is the main reason the extraction is run blind
      twice.

      '
    cases:
    - id: EPO-INV-STALE-HANDLE-NO-CROSS-ENTRY-EFFECT
      what: 'The stale-handle / free-list ABA hazard. The spec pass derived the obligation as a gap and
        openly doubted the spec: FR-012 makes stale handles harmless via a per-entry live flag while the
        Key Entities also describe free-slot recycling, and a recycled slot is live again, so an old handle
        pointing at it would appear valid. The code pass found the mechanism directly: LruList::remove
        pushes the freed slot onto the free list and the next push_front/push_back pops it, so a kept
        handle can come to name a completely different key, with nothing in the code detecting it. Two
        isolated derivations of the same hazard, from opposite directions. Expected to be refuted.

        '
    - id: EPO-INV-AGING-PERIOD-NON-DECREASING
      what: 'The max_len ageing defect. Both passes concluded independently that because the largest-ever
        size record never decreases and is deliberately preserved by clear_pool, the ageing interval can
        only lengthen over a pool''s lifetime — so a pool that once grew large keeps ageing on the schedule
        of a working set it no longer has, even after being cleared and left tiny. The spec pass reached
        it from FR-013 with note IN-4; the code pass from max_len being written only in track and left
        alone by clear_pool. The separate off-by-one in how the record is measured is the divergence EPO-INV-MAXLEN-UPPER-BOUNDS-LEN.

        '
    - id: EPO-TRACK-INV-AGING-NO-DIVISION-BY-ZERO
      what: 'Both passes raised the division-by-zero guard on the ageing schedule as an obligation in
        its own right — the spec pass from FR-013''s guard wording, the code pass from the short-circuit
        at lib.rs:124 — which corroborates that the guard is load-bearing rather than incidental.

        '
    - id: EPO-INV-INVALID-HANDLE-NEVER-RETURNED
      what: 'Both passes independently observed that the interface''s InvalidHandle error variant is dead
        in this component: the only error ever constructed is InvalidPool, so a bad handle is never reported
        as an error.

        '
    - id: EPO-INV-PREVIEW-AGREES-WITH-EVICTION
      what: 'Both passes raised the agreement between previewing candidates and actually evicting, each
        attaching it to the opposite method (the spec pass to get_eviction_candidates, the code pass to
        identify_next_to_evict); unified here as one invariant over both methods.

        '
  refinement_gaps:
  - what: batch_touch has no atomicity guarantee anywhere in the spec
    detail: 'FR-004 and FR-010 require the invalid-pool error but promise nothing about what happens to
      the handles already processed. The implementation keeps them. Every other Result-returning method
      does guarantee no mutation on error. Flagged by the code pass only; carried as EPO-BATCH-TOUCH-ERROR-PARTIAL-APPLICATION.

      '
  - what: the interface promises a single lock acquisition for batch_touch; the component spec and the
      code promise less
    detail: 'The doc comment says batch_touch records accesses "in a single lock acquisition"; FR-004
      says a pool''s lock is acquired once across a RUN of handles for that pool, which is what the code
      does. The component spec therefore agrees with the code and diverges from the interface comment.
      Carried in the note of EPO-INV-AT-MOST-ONE-POOL-LOCK rather than as a separate divergent property,
      because no observable component behaviour contradicts anything.

      '
  - what: the sketch's column shift and table width are coupled only by convention
    detail: 'The position is the top ten bits of the product, which is in range only because the table
      has 1024 columns; nothing in the code checks the two stay in step. Found by the code pass, carried
      in the note of EPO-INV-SKETCH-BUCKET-IN-RANGE.

