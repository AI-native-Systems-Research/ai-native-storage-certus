    kind:       invariant
    verifiable: true
    statement:  >
      Each pool keeps its own entries, its own ordering, its own frequency estimator, and its own
      counters, so no operation on one pool can change what any other pool contains, what it would
      evict next, or what it believes about key popularity.
    traces:     [US3, US3-AS1, FR-001, NFR-003]

  - id:         EPO-INV-LEN-MATCHES-ACTIVE-ENTRIES
    subject:    "Global invariant: reported size equals the number of live entries"
    kind:       invariant
    verifiable: true
    statement:  >
      A pool's reported size always equals the number of entries actually linked into its eviction
      order, so the count can never drift away from the real contents after any mixture of
      tracking, touching, removing, evicting, and clearing.
    traces:     [FR-008, FR-005, FR-009, KE-LruList]

  - id:         EPO-INV-LIST-WELL-FORMED
    subject:    "Global invariant: the eviction order is a well-formed chain"
    kind:       invariant
    verifiable: true
    statement:  >
      A pool's entries always form one unbroken chain from the front (first to be evicted) to the
      back (protected): following the forward links from the front reaches the back and visits
      every entry exactly once, the backward links mirror the forward ones, and an empty pool has
      neither front nor back.
    traces:     [KE-LruList, NFR-002, US4-AS1]

  - id:         EPO-INV-VICTIM-IS-LIST-FRONT
    subject:    "Global invariant: the victim is always the front of the order"
    kind:       invariant
    verifiable: true
    statement:  >
      Whatever sequence of operations has happened, the entry the policy would evict next is
      always the one at the least-recently-used front of the pool's chain, and that is the same
      entry whose estimated popularity a newly tracked key is compared against.
    traces:     [FR-006, FR-011, KE-LruList]

  - id:         EPO-INV-SLOT-OWNERSHIP-DISJOINT
    subject:    "Global invariant: each internal slot is either in use or free, never both"
    kind:       invariant
    verifiable: true
    statement:  >
      The internal storage slots that hold entries are partitioned at all times: a slot is either
      part of the live eviction chain or on the list of recycled free slots, never on both and
      never on neither, so a freed slot cannot be handed out twice.
    traces:     [KE-LruList, FR-005]

  - id:         EPO-INV-HANDLE-POOL-SCOPED
    subject:    "Global invariant: a handle is only ever interpreted inside its own pool"
    kind:       invariant
    verifiable: true
    statement:  >
      Because a handle carries the pool it belongs to along with the position inside that pool, an
      operation performed with a handle can only ever affect an entry in that same pool, and never
      an entry that happens to sit at the same position in a different pool.
    traces:     [KE-EvictionHandle, FR-002, US3]

  - id:         EPO-INV-STALE-HANDLE-NO-CROSS-ENTRY-EFFECT
    subject:    "Global invariant: a stale handle must not act on a different entry that reused its slot"
    kind:       invariant
    verifiable: true
    statement:  >
      After an entry has been removed and its internal slot has been recycled for a different key,
      using the old handle from the removed entry must not move or remove that different key's
      entry.
    note:       >
      Derived obligation, not stated in the spec, and the spec's own description makes it doubtful.
      The spec says stale handles are made harmless by a per-entry live flag and that freed slots
      are recycled, but a recycled slot is live again, so an old handle pointing at it would appear
      valid. Flagged as a genuine spec gap for the code pass to settle.
    traces:     [FR-012, KE-EvictionHandle, KE-LruList]

  - id:         EPO-INV-INVALID-HANDLE-NEVER-RETURNED
    subject:    "Global invariant: the invalid-handle error is never produced"
    kind:       invariant
    verifiable: true
    statement:  >
      No operation of this policy ever returns the invalid-handle error, even though that error
      exists in the shared interface, because stale handles are handled silently instead of being
      reported.
    traces:     [FR-012, KE-EvictionPolicyError]

  - id:         EPO-INV-MAXLEN-MONOTONE-UPPER-BOUND
    subject:    "Global invariant: the largest-ever-size record only grows and is never exceeded"
    kind:       invariant
    verifiable: true
    statement:  >
      A pool's record of the largest size it has ever reached never goes down, not even when
      entries are removed, evicted, or the whole pool is cleared, and it is always at least as
      large as the pool's current size.
    traces:     [FR-013, IN-4, FR-009]

  - id:         EPO-INV-ACCESS-COUNT-MONOTONE
    subject:    "Global invariant: the running access count only grows"
    kind:       invariant
    verifiable: true
    statement:  >
      A pool's running count of accesses only ever increases, by exactly one per successful track,
      and no other operation, including clearing the pool, ever lowers or resets it.
    traces:     [FR-013, FR-009, KE-Pool]

  - id:         EPO-INV-AGING-PERIOD-NON-DECREASING
    subject:    "Global invariant: the ageing interval never shortens"
    kind:       invariant
    verifiable: true
    statement:  >
      Because the ageing interval is ten times the pool's largest-ever size and that record never
      shrinks, the gap between two successive ageing events never gets shorter over a pool's
      lifetime; it can only stay the same or grow.
    traces:     [FR-013, IN-4]

  - id:         EPO-INV-SKETCH-COUNTERS-SATURATE
    subject:    "Global invariant: frequency counters saturate instead of wrapping"
    kind:       invariant
    verifiable: true
    statement:  >
      Every counter in a pool's frequency estimator always holds a value between zero and its
      maximum of 255, and a counter already at the maximum stays there when incremented rather
      than wrapping round to zero and making a hot key look cold.
    traces:     [KE-CountMinSketch, NFR-004]

  - id:         EPO-INV-SKETCH-ESTIMATE-IS-ROW-MINIMUM
    subject:    "Global invariant: an estimate is the smallest of the rows' counters"
    kind:       invariant
    verifiable: true
    statement:  >
      The popularity estimate reported for a key is always the smallest of the four row counters
      that key maps to, which is what limits how much accidental sharing of counters between
      different keys can inflate an estimate.
    traces:     [KE-CountMinSketch]

  - id:         EPO-INV-SKETCH-BUCKET-IN-RANGE
    subject:    "Global invariant: every hashed counter position is inside the fixed table"
    kind:       invariant
    verifiable: true
    statement:  >
      For every possible key and every one of the four rows, the counter position computed for it
      falls inside the fixed table of 1024 columns, so no key can ever read or write outside the
      estimator's storage and the storage never has to grow with the number of keys.
    traces:     [KE-CountMinSketch, NFR-004]

  - id:         EPO-INV-SKETCH-HALVE-NON-INCREASING
    subject:    "Global invariant: ageing never raises an estimate"
    kind:       invariant
    verifiable: true
    statement:  >
      Halving the frequency estimator during ageing never makes any counter larger, so no key's
      popularity estimate can go up as a result of ageing.
    traces:     [FR-013, KE-CountMinSketch]

  - id:         EPO-INV-SKETCH-ROW-HASHES-DISTINCT
    subject:    "Global invariant: the four estimator rows use four different hash multipliers"
    kind:       invariant
    verifiable: true
    statement:  >
      The four rows of the frequency estimator each use a different odd multiplier to pick their
      counter position, so the rows are genuinely independent views of a key rather than four
      identical copies of the same counter.
    note:       >
      This is a check over the fixed multiplier constants together with the position calculation;
      it is decidable but it is a weak obligation compared with the behavioural rows.
    traces:     [KE-CountMinSketch]

  - id:         EPO-INV-SKETCH-OPS-BOUNDED-BY-FIXED-SIZE
    subject:    "Global invariant: frequency-estimator work is bounded by the fixed table size"
    kind:       invariant
    verifiable: true
    statement:  >
      Raising a key's count and reading its estimate each touch exactly four counters, and ageing
      touches the whole fixed table once, so the amount of work never depends on how many keys are
      tracked or how large the pool has grown.
    traces:     [NFR-001, NFR-004, KE-CountMinSketch]

  - id:         EPO-INV-ADMISSION-DECIDED-ONLY-BY-VICTIM-COMPARISON
    subject:    "Global invariant: admission depends only on the comparison with the current victim"
    kind:       invariant
    verifiable: true
    statement:  >
      Which end a newly tracked key is inserted at is decided solely by whether its estimated
      popularity is greater than the current victim's; there is no fixed popularity threshold, so a
      very hot key still enters at the eviction end if the victim looks just as hot, and a barely
      warm key is protected if the victim looks colder still.
    traces:     [FR-011, IN-1, IN-2, US2]

  - id:         EPO-INV-NO-DATA-CORRUPTION-UNDER-CONCURRENCY
    subject:    "Global invariant: concurrent use cannot corrupt the policy's state"
    kind:       invariant
    verifiable: true
    statement:  >
      When several threads track, touch, remove, and evict at the same time, every one of the
      policy's structural guarantees still holds afterwards: the eviction chain stays unbroken, the
      reported size matches the real contents, slots are never double-used, and no operation reads
      a half-updated state.
    traces:     [NFR-002, US4, US4-AS1]

  - id:         EPO-INV-CONCURRENT-TRACK-TOTAL-COUNT
    subject:    "Global invariant: concurrent tracks all land exactly once"
    kind:       invariant
    verifiable: true
    statement:  >
      If several threads together perform a known total number of successful tracks into the same
      pool, the pool afterwards holds exactly that many entries: no track is lost and none is
      counted twice.
    traces:     [US4-AS1, SC-002, NFR-002]

  - id:         EPO-INV-NO-STARTUP-BANNER
    subject:    "Global invariant: bringing the component up logs no banner"
    kind:       invariant
    verifiable: true
    statement:  >
      Starting this component up produces no banner or announcement log message, unlike components
      that print a line about themselves when they initialise.
    traces:     [IN-6]

  # ------------------------------------------------------------------
  # Not-verifiable ledger — every remaining unit of the three spec files
  # ------------------------------------------------------------------
  - id:         NV-1
    scope:      "NFR-001 and the plan's operation and complexity table: single-entry operations MUST be O(1), candidate peek O(n)"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      An asymptotic cost claim is a statement about how running time grows, not a statement about
      a single behaviour that a checker can find a counterexample to. The part of this claim that
      can be checked, namely that the frequency-estimator work is bounded by a fixed table size
      and does not grow with the pool, is captured as a separate property.
    traces:     [NFR-001, PLAN-complexity-table]

  - id:         NV-2
    scope:      "NFR-003: per-pool locking granularity, operations on different pools MUST NOT contend"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Freedom from lock contention is a performance characteristic of how the component is locked
      internally, not an observable result any single run can contradict. The behavioural
      consequence that matters, namely that pools cannot influence one another, is captured as the
      pool-independence property.
    traces:     [NFR-003, PLAN-concurrency-model]

  - id:         NV-3
    scope:      "FR-004: batch_touch acquires each pool's lock once across a run of handles for the same pool to amortize lock overhead"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      How many times an internal lock is taken is an efficiency detail that leaves no trace in the
      component's observable state, so no outcome can disprove it. The observable half of the
      requirement, that a batch behaves like the equivalent sequence of individual touches, is
      captured as a property.
    traces:     [FR-004, PLAN-complexity-table]

  - id:         NV-4
    scope:      "NFR-005: conformance to the Certus component model, providing the eviction-policy interface with a single logger receptacle"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is a structural and compile-time fact about how the component is declared and wired,
      not a runtime behaviour with possible counterexamples; it is settled by the code building and
      the component loading, not by a verifier.
    traces:     [NFR-005, PLAN-component-layer]

  - id:         NV-5
    scope:      "Implementation note: the only logging is a debug message on pool creation and a warning on an invalid-pool track, touch, or remove"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Emitting a log line is a side effect on an external sink rather than part of the policy's
      own state, and the spec attaches no behaviour to whether the line appears. The one negative
      logging claim that is checkable, that starting up prints no banner, is kept as a property.
    traces:     [IN-6]

  - id:         NV-6
    scope:      "SC-001: all tests in the crate pass"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is a statement about the project's own test suite passing, which is a development
      process outcome rather than a property of the component's behaviour.
    traces:     [SC-001]

  - id:         NV-7
    scope:      "SC-003: the linter with warnings denied and the formatter check both pass cleanly"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Lint and formatting cleanliness are properties of the source text and its style, with no
      bearing on what the component does at run time.
    traces:     [SC-003]

  - id:         NV-8
    scope:      "SC-004: the component builds and wires into the full-optimized server profile and is selectable in place of the plain LRU policy with no other wiring changes"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is a build and deployment outcome spanning the server binary and its configuration
      profiles, outside this component's own behaviour and not decidable by reasoning about it
      alone.
    traces:     [SC-004]

  - id:         NV-9
    scope:      "FR-002: consumers enforce an already-exists guard upstream and MUST NOT track a key that is still tracked in the pool"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      This is an obligation placed on the callers of the component rather than on the component
      itself, so nothing the component does can violate it. What the component does when a caller
      breaks the rule is captured separately as the deliberate non-idempotent re-registration
      behaviour.
    traces:     [FR-002]

  - id:         NV-10
    scope:      "Key Entities type and representation facts: the cache key is a 64-bit number, the pool identifier a 32-bit number, the handle is opaque and embeds pool and position, the per-block hint is passed by value"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These are declarations about the shapes and widths of data types, which the compiler already
      guarantees and for which no misbehaving run can exist. Wherever such a fact does drive
      behaviour, for example that a handle carries its pool, that behaviour is captured as its own
      property.
    traces:     [KE-CacheKey, KE-PoolId, KE-EvictionHandle, KE-BlockSemantics]

  - id:         NV-11
    scope:      "NFR-004 memory footprint claim: a fixed four-by-1024 array of single-byte counters per pool, independent of the number of tracked keys"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The size and layout of a fixed array is a static fact about the data structure rather than a
      behaviour that can be contradicted at run time. Its behavioural consequences, that every
      hashed position lands inside the fixed table and that estimator work does not grow with the
      number of keys, are captured as properties.
    traces:     [NFR-004, KE-CountMinSketch]

  - id:         NV-12
    scope:      "Implementation note: the ageing period of ten times the largest-ever pool size is a hard-coded constant of the current tuning and not yet configurable"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      The absence of a configuration knob is a statement about what the component's surface does
      not offer, and whether a particular tuning constant is the right one is a judgement call, so
      neither can be settled by a checker. The rule the constant produces is captured as the
      ageing-trigger property.
    traces:     [IN-3, FR-013]

  - id:         NV-13
    scope:      "Backfill notice, the Backfilled document status, and the review checklist in tasks.md"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These are notes about the document itself, warning that it records what the code currently
      does rather than what was intended, plus a list of open review questions for people to
      settle. They describe no component behaviour, so there is nothing to check.
    traces:     [BACKFILL-NOTICE, TASKS-review-checklist]

  - id:         NV-14
    scope:      "Future Considerations: making the ageing period configurable, adding an absolute admission threshold, adding direct admission-gate tests, revisiting whether clearing a pool should reset the estimator, and adding a doorkeeper filter"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These are proposals for work that has not been done, so they state no obligation the present
      component could fail to meet.
    traces:     [PLAN-future-considerations, TASKS-review-checklist]

  - id:         NV-15
    scope:      "Overview and Dependencies: this component is a drop-in alternative to the plain LRU policy, interchangeable at the same interface and selected by the full-optimized profile, and its consumers use sixteen pools and one pool respectively"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      Interchangeability is a claim about two components and the system that wires them together,
      and the pool counts describe how other components choose to use this one; neither is a
      property of this component's own behaviour that could be checked in isolation.
    traces:     [OVERVIEW, DEPENDENCIES]

  - id:         NV-16
    scope:      "The fidelity of the popularity estimate that the admission decision in FR-011 and User Story 2 rests on"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      How close the estimated popularity is to how often a key was really seen is a statistical
      question about hash collisions, and the spec states no accuracy guarantee at all. Two
      documented mechanisms also work against the usual guarantee that such an estimate is never
      too low, namely periodic halving and counters that stop at 255, so there is no stated bound
      to check. The structural facts that are checkable, the minimum over rows, saturation, and
      non-increasing ageing, are captured as properties.
    traces:     [FR-011, US2, KE-CountMinSketch, IN-2]

  - id:         NV-17
    scope:      "Plan document architecture diagrams, data-structure sketches, concurrency model description, and the five key design decisions"
    kind:       not-verifiable
    verifiable: false
    reason:     >
      These sections explain the internal shape of the component and the reasoning behind the
      choices made, which is background rather than promised behaviour; every behavioural claim
      they contain, above all the admission flow and the ageing rule, is already captured as its
      own property.
    traces:     [PLAN-architecture, PLAN-design-decisions, PLAN-testing]
