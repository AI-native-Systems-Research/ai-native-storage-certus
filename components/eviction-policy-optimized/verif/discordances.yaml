routed_to_other_tools:
- property: EPO-INV-SKETCH-OPS-BOUNDED-BY-FIXED-SIZE
  name: Sketch ops bounded by fixed size
  methods:
  - track
  statement: Raising a key's count and reading its estimate each touch exactly four counters, and ageing touches
    the whole fixed table once, so the amount of work the frequency estimator does never depends on how many keys
    are tracked or how large the pool has grown.
  reason: performance
  checked_by: test
  why: This is a claim about how much work an operation costs regardless of pool size, which is a performance bound
    that Creusot and Kani do not express.
- property: EPO-INV-NO-DATA-CORRUPTION-UNDER-CONCURRENCY
  name: No data corruption under concurrency
  methods:
  - create_pool
  - track
  - touch
  - batch_touch
  - remove
  - identify_next_to_evict
  - get_eviction_candidates
  - len
  - clear_pool
  statement: 'When several threads track, touch, remove, and evict at the same time, every one of the policy''s
    structural guarantees still holds afterwards: the eviction order stays an unbroken chain, the reported size
    matches the real contents, slots are never double-used, and no operation reads a half-updated state.'
  reason: interleaving
  checked_by: loom
  why: Whether the structure survives several threads acting at once depends on how the threads interleave, which
    needs a thread-interleaving checker.
- property: EPO-INV-CONCURRENT-TRACK-TOTAL-COUNT
  name: Concurrent track total count
  methods:
  - track
  - len
  statement: 'If several threads together perform a known total number of successful tracks into the same pool,
    the pool afterwards holds exactly that many entries: no track is lost and none is counted twice.'
  reason: interleaving
  checked_by: loom
  why: Whether no track is lost when several threads track at once depends on thread interleaving, which Creusot
    and Kani do not model.
- property: EPO-INV-NO-STARTUP-BANNER
  name: No startup banner
