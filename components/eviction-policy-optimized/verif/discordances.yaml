- id: D-RANGE-FR-002-7fbb2b
  name: 'Input range: a pool never allocates more than 2^32 - 1 entry slots over its lifetime'
  kind: input-range-mismatch
  methods:
  - track
  - touch
  - batch_touch
  - remove
  - identify_next_to_evict
  spec_says: Tracking puts no limit on how many entries a pool may hold over its lifetime.
  code_does: Handles are 32-bit slot numbers (nodes.len() as u32). Once a pool has allocated 2^32 slots the number
    wraps around, so a new entry receives the same handle as a live one.
  spec_pointers:
  - FR-002
  - FR-011
  code_pointers:
  - lru_list.rs:47
  - lru_list.rs:85
  status: candidate
  assume_in_level2: a pool never allocates more than 2^32 - 1 entry slots over its lifetime
  assume_rust: self.nodes.len() < u32::MAX as usize
