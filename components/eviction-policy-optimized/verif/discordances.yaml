  spec_says: 'On each track the pool updates its record of the largest size it has ever reached to be the larger
    of the previous record and the pool''s size measured at that moment. The measurement is taken BEFORE the new
    entry is inserted, so the record is the high-water mark of the pool''s size just before an insertion, not of
    the pool''s size itself: whenever the pool reaches a new peak, the record is one short of that peak.'
