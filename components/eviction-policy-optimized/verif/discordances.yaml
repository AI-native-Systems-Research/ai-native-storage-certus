- id: D-FR-002-lib.rs:129139-a799ec
  name: Track non idempotent reregistration
  kind: spec-and-code-differ
  methods:
  - track
  spec_says: 'Tracking a key that is already being tracked in the same pool does not refresh the existing entry:
    it deliberately creates a second, separate entry for that key and returns a new handle that differs from the
    one returned the first time, so the pool then holds two entries for the same key.'
  code_does: Every successful registration increases the number of tracked entries in that pool by exactly one,
    without exception. In particular, registering a key that the pool is already tracking creates a second, independent
    entry for the same key rather than reusing the existing one. This contradicts the interface documentation, which
    promises that re-registering an already-tracked key is idempotent and returns the existing handle; the implementation
    has no lookup from key to entry at all, so it cannot detect a repeat.
  spec_pointers:
  - FR-002
  code_pointers:
  - lib.rs:129-139
  - ieviction_policy.rs:85-87
  status: candidate
  excluded_properties:
