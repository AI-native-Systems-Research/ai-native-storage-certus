- id: D-FR-013-lib.rs:122-91416b
  name: Track maxlen highwater
  kind: spec-and-code-differ
  methods:
  - track
  spec_says: On each track the pool updates its record of the largest size it has ever reached to be the larger
    of the previous record and the pool's size at that moment, so the record is always at least as big as the pool's
    current size.
  code_does: Every successful registration updates the pool's record of the largest length it has ever held, setting
    it to the larger of its old value and the pool's length as measured before the new entry is inserted. Because
    the measurement happens before the insertion, the record always lags the true maximum by one whenever the pool
    is at a new peak, and it never decreases, not even when the pool is emptied.
  spec_pointers:
