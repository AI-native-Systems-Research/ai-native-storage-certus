- id: D-FR-013-lib.rs:122-d210f9
  name: Maxlen upper bounds len
  kind: spec-and-code-differ
  methods:
  - track
  - len
  spec_says: A pool's record of the largest size it has ever reached never goes down, not even when entries are
    removed, evicted, or the whole pool is cleared, and it is always at least as large as the pool's current size.
  code_does: 'A pool''s current count of tracked entries is never more than one greater than its recorded high-water
    mark, and the recorded mark is never greater than the true peak. The mark is measured just before each new entry
    is inserted rather than after, so whenever the pool reaches a new peak the recorded mark is one too low. This
    looks like an accidental off-by-one: it means the frequency-ageing interval is computed from a slightly stale
    peak, and a pool that has only ever held one entry records a mark of zero and so never ages its frequency records
    at all.'
  spec_pointers:
  - FR-013
  code_pointers:
  - lib.rs:122
  - lib.rs:124-127
  status: candidate
  excluded_properties:
  - EPO-INV-MAXLEN-UPPER-BOUNDS-LEN
  extraction_sides:
    spec:
    - EPO-INV-MAXLEN-MONOTONE-UPPER-BOUND
