[package]
name = "dispatcher"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
component-framework.workspace = true
component-core.workspace = true
component-macros.workspace = true
interfaces = { workspace = true, features = ["spdk"] }
gpu-services = { workspace = true, features = ["spdk", "gpu"] }
spdk-env.workspace = true
block-device-spdk-nvme = { workspace = true, optional = true }
disk-partition-manager.workspace = true
extent-manager.workspace = true
memory-tier.workspace = true
libc = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
crc32fast = { version = "1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = ["spdk-backend"]
spdk-backend = ["dep:block-device-spdk-nvme"]
hardware-test = []
pipeline-telemetry = []
# End-to-end data integrity: CRC-32 the block on store (verified before H2D on
# load). Gates BOTH compute and check — one is useless without the other. Off
# by default; the ~100us/block hash only runs when enabled.
integrity-check = ["dep:crc32fast", "interfaces/integrity-check"]
# Enable per-direction SSD read/write byte counters (IDispatcher::read_write_stats)
# by turning on the underlying block device's telemetry counters.
rw-telemetry = ["block-device-spdk-nvme?/telemetry"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
eviction-policy-lru.workspace = true
logger.workspace = true
libc = "0.2"

[[bench]]
name = "dispatcher_benchmark"
harness = false

[[bench]]
name = "ssd_evictor_benchmark"
harness = false

[[bench]]
name = "pipeline_hw_benchmark"
harness = false
required-features = ["hardware-test"]

[[bench]]
name = "dispatcher_hw_benchmark"
harness = false
required-features = ["hardware-test"]
