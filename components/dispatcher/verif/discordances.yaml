- id: D-RANGE-FR-019-73b5ad
  name: 'Input range: At every cold read (lookup, lookup_async, batch_lookup, promote_to_memory_tier), every data
    drive''s max_transfer_size is at least the read chunk size. The read chunk size is the first drive''s max_transfer_size,
    or 131072 bytes when no pipeline ring was allocated.'
  kind: input-range-mismatch
  methods:
  - lookup
  - lookup_async
  - batch_lookup
  - promote_to_memory_tier
  spec_says: Every block-device I/O must respect the MDTS of the device it is issued to. The dispatcher queries
    IBlockDevice::max_transfer_size() for each device. Nothing requires all data drives to share one MDTS.
  code_does: 'All cold-read pipelines segment reads by a single chunk_size: the FIRST drive''s max_transfer_size
    (lib.rs:1948-1952), or 131072 when no pipeline ring exists (lib.rs:2473-2476, 840-842, 960-962, 3703-3705).
    That one value is used for every drive (pipeline.rs:250-254, 812-816). Only the write path uses each drive''s
    own MDTS (lib.rs:674-683).'
  spec_pointers:
  - FR-019
  - SC-012
  - research.md MDTS decision
  - DIS-INV-PIPELINE-SEGMENT-MDTS
  code_pointers:
  - dispatcher/src/lib.rs:1948
  - dispatcher/src/lib.rs:2475
  - dispatcher/src/lib.rs:842
  - dispatcher/src/lib.rs:962
  - dispatcher/src/lib.rs:3705
  - dispatcher/src/pipeline.rs:250
  - dispatcher/src/pipeline.rs:812
  status: candidate
  assume_in_level2: At every cold read (lookup, lookup_async, batch_lookup, promote_to_memory_tier), every data
    drive's max_transfer_size is at least the read chunk size. The read chunk size is the first drive's max_transfer_size,
    or 131072 bytes when no pipeline ring was allocated.
  assume_rust: drives.iter().all(|d| d.block_dev_iface.max_transfer_size() as usize >= chunk_size)
  excluded_properties: []
- id: D-RANGE-FR-019-319d26
  name: 'Input range: At every call of segment_io (every SSD write-through and every cold read), the transfer size
    it is given is a multiple of the drive''s block size.'
  kind: input-range-mismatch
  methods:
  - populate
  - batch_populate
  - copy_gpu_to_memory_completed
  - schedule_write_through
  - lookup
  - lookup_async
  - batch_lookup
  - promote_to_memory_tier
  spec_says: I/O is split into segments of at most MDTS (FR-019). The spec places no constraint relating MDTS to
    the drive's block size.
  code_does: segment_io advances the LBA by length / sector_size with truncating division (io_segmenter.rs:50).
    It therefore assumes every non-final segment, that is the transfer size, is a whole number of blocks. The transfer
    size is max_transfer_size on writes (lib.rs:674-683) and chunk_size on reads (pipeline.rs:247-254). Otherwise
    later segments land at the wrong LBA.
  spec_pointers:
  - FR-019
  - DIS-INV-PIPELINE-SEGMENT-MDTS
  code_pointers:
  - dispatcher/src/io_segmenter.rs:43
  - dispatcher/src/io_segmenter.rs:50
  - dispatcher/src/lib.rs:683
  - dispatcher/src/pipeline.rs:250
  - dispatcher/src/pipeline.rs:486
  - dispatcher/src/pipeline.rs:812
  status: candidate
  assume_in_level2: At every call of segment_io (every SSD write-through and every cold read), the transfer size
    it is given is a multiple of the drive's block size.
  assume_rust: max_transfer_size % sector_size == 0
  excluded_properties: []
- id: D-RANGE-US-5AS-4-a11766
  name: 'Input range: In memory-tier-only mode (no data drives), every key that reaches a background write-through
    is at most u64::MAX / 4096.'
  kind: input-range-mismatch
  methods:
  - populate
  - batch_populate
  - copy_gpu_to_memory_completed
  - schedule_write_through
  spec_says: With no SPDK environment, write-throughs assign synthetic offsets (US-5 AS-4). A CacheKey may be any
    u64.
  code_does: The synthetic offset is computed as job.key * 4096 with an unchecked multiplication (lib.rs:1409).
    It panics in debug builds and wraps in release builds, where two keys can receive the same offset, for any key
    above u64::MAX / 4096.
  spec_pointers:
  - US-5 AS-4
  - DIS-INITIALIZE-NO-SPDK-MEMORY-ONLY
  - idispatcher.rs CacheKey
  code_pointers:
  - dispatcher/src/lib.rs:1407
  - dispatcher/src/lib.rs:1409
  status: candidate
  assume_in_level2: In memory-tier-only mode (no data drives), every key that reaches a background write-through
    is at most u64::MAX / 4096.
  assume_rust: key <= u64::MAX / 4096
  excluded_properties: []
- id: D-RANGE-IDISPATCHER.RSIPCHANDLE.SIZE-926281
  name: 'Input range: At every background write-through, the entry size rounded up to the target drive''s block
    size is at most u32::MAX.'
  kind: input-range-mismatch
  methods:
  - populate
  - batch_populate
  - copy_gpu_to_memory_completed
  - schedule_write_through
  spec_says: Entry sizes are u32 values greater than zero. The spec states no tighter upper bound.
  code_does: The write-through rounds the size up to the drive's block size and passes it to reserve_extent as aligned_bytes
    as u32 (lib.rs:1418, 1439). A size within one block of u32::MAX rounds past u32::MAX and is truncated.
  spec_pointers:
  - idispatcher.rs IpcHandle.size
  - idispatcher.rs reserve_memory
  - FR-004
  code_pointers:
  - dispatcher/src/lib.rs:1418
  - dispatcher/src/lib.rs:1439
  status: candidate
  assume_in_level2: At every background write-through, the entry size rounded up to the target drive's block size
    is at most u32::MAX.
  assume_rust: (size as usize).next_multiple_of(block_size) <= u32::MAX as usize
  excluded_properties: []
- id: D-RANGE-FR-039-d29c77
  name: 'Input range: At every call of batch_lookup, the sizes of each entry''s GPU regions add up to at most u32::MAX.'
  kind: input-range-mismatch
  methods:
  - batch_lookup
  spec_says: Each batch_lookup entry carries a Vec of GPU destination regions, each with a u32 size (FR-039). The
    spec does not bound their total.
  code_does: batch_lookup adds up each entry's region sizes in u32 (lib.rs:2356 for the slot size, lib.rs:2775 for
    the remote-lookup size). The sum overflows when the regions total more than u32::MAX. copy_gpu_to_memory_async
    adds them up in usize instead (lib.rs:3441).
  spec_pointers:
  - FR-039
  - idispatcher.rs batch_lookup
  code_pointers:
  - dispatcher/src/lib.rs:2356
  - dispatcher/src/lib.rs:2775
  status: candidate
  assume_in_level2: At every call of batch_lookup, the sizes of each entry's GPU regions add up to at most u32::MAX.
  assume_rust: entries.iter().all(|(_, rs)| rs.iter().map(|r| r.size as u64).sum::<u64>() <= u32::MAX as u64)
  excluded_properties: []
routed_to_other_tools:
- property: DIS-LOOKUP-CONCURRENT-READERS
  name: Lookup concurrent readers
  methods:
  - lookup
  statement: Several concurrent lookups of the same cached key may all succeed, because multiple readers of one
    entry are allowed.
  reason: interleaving
  checked_by: loom
  why: Depends on how several concurrent lookups of one key interleave on the dispatch-map read references.
- property: DIS-LOOKUP-NO-DATA-CORRUPTION-CONCURRENT
  name: Lookup no data corruption concurrent
  methods:
  - lookup
  statement: Concurrent populates and lookups on different keys each deliver the correct data for their own key
    and all complete.
  reason: interleaving
  checked_by: loom
  why: Concerns concurrent populates and lookups on different keys interleaving without corrupting each other.
- property: DIS-RESERVE-MEMORY-BACKPRESSURE-RETRIES
  name: Reserve memory backpressure retries
  methods:
  - reserve_memory
  statement: While the memory tier is full and the deadline has not passed, reserve_memory keeps retrying the allocation
    and succeeds if room appears before the deadline.
  reason: timing
  checked_by: test
  why: The obligation is defined by a wall-clock deadline (Instant::now against store_backpressure_ms) and retry
    polling over time.
