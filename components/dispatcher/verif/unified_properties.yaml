- id: DIS-SPIN-CLEAR-MT-KEEPS-PINNED
  methods:
  - clear_memory_tier
  kind: invariant
  verifiable: true
  origin: spin-model
  statement: 'When clear_memory_tier meets an entry that it cannot demote or remove because a lookup or
    the background writer holds a pin on it, it does not release that entry''s memory-tier slot: no dispatch-map
    entry ever points at a released slot, no reader reads a released slot, and when clear_memory_tier
    returns every entry is BlockDevice with an SSD offset or is removed, and the returned count equals
    the entries that it really cleared.'
  traces:
  - Spin J22 clear_memory_tier PA, PA1, PA2, PB, PD (node7, reproduced on green 2026-10-19)
  - 'components/dispatcher/src/lib.rs clear_memory_tier (unstable af221dd82: the else branch frees the
    slot after try_evict_to_block is refused)'
  - dispatcher spec FR-038; interfaces idispatcher.rs clear_memory_tier doc
  note: Added 2026-10-19 from the Spin counterexample of node7 J22; not from the blind extraction.
- id: DIS-FLUSH-REPORTS-FAILED-WRITE
  methods:
  - flush_to_ssd
  - clear_memory_tier
  kind: postcondition
  verifiable: true
  origin: spin-model
  statement: When flush_to_ssd returns Ok, every entry populated before the call has its data on the block
    device with an SSD offset recorded, and the returned count is the number of entries that now have
    a valid SSD offset; if a write-through to the block device failed, flush_to_ssd returns Err instead.
    Thus a clear_memory_tier after an Ok flush never removes the only copy of an entry.
  traces:
  - Spin J23 flush_clear PA, PB, PC (node7, reproduced on green 2026-10-20)
  - components/interfaces/src/idispatcher.rs flush_to_ssd doc (persistence guarantee, return value)
  - 'Decision by Cornel 2026-10-20: flush_to_ssd returns Err when a write-through failed (FV_NOTEBOOK/decisions/decision_dispatcher_flush-to-ssd-and-a07.md)'
- id: DIS-REMOVE-REFUSED-LEAVES-ENTRY-UNCHANGED
  methods:
  - remove
  kind: postcondition
  verifiable: true
  origin: spec-sync
  statement: When remove returns KeyNotFound because a reader, a client pin or a concurrent lookup holds
    a MemoryTier entry, the entry is unchanged - it is still MemoryTier with its memory-tier slot and
    its ssd_offset, nothing is freed, a later lookup is served from DRAM, and after the hold is released
    a remove succeeds and frees both the slot and the SSD extent.
  traces:
  - specs/001-dispatcher-cache-interface/spec.md:239 (a refused remove returns KeyNotFound and frees nothing)
  - specs/001-dispatcher-cache-interface/contracts/idispatcher.md:171 (KeyNotFound means nothing was freed)
  - 'Spec-sync proposal A-9 (2026-10-23): remove flips a pinned MemoryTier entry to BlockDevice (src/lib.rs:3299)
    before dm.remove is refused (src/lib.rs:3331); a regression of 18c4f1f9'
  - 'Decision by Cornel 2026-10-23: fix A-9 before the remove PR; test first'
- id: DIS-EVICTOR-NO-FOREIGN-PIN-RELEASE
  origin: spec-review
  kind: invariant
  verifiable: true
  methods:
  - get_evictable_offset
  statement: 'The SSD evictor releases only a read reference that its own lookup acquired: a candidate
    that answers NotExist took none, so none is released. Releasing after NotExist can drop the write-through
    pin of a concurrently registered entry; a later remove then frees its slot while a job reads it (spec-sync
    A-11, 2026-10-23; the same defect class as DIS-REMOVE-NO-FOREIGN-PIN-RELEASE).'
  traces:
  - dispatcher/src/background.rs:581
  - dispatcher/src/background.rs:595
  - dispatcher/src/lib.rs:3784
domain_discordances:
- spec_says: Every block-device I/O must respect the MDTS of the device it is issued to. The dispatcher
    queries IBlockDevice::max_transfer_size() for each device. Nothing requires all data drives to share
    one MDTS.
  code_does: 'All cold-read pipelines segment reads by a single chunk_size: the FIRST drive''s max_transfer_size
    (lib.rs:1948-1952), or 131072 when no pipeline ring exists (lib.rs:2473-2476, 840-842, 960-962, 3703-3705).
    That one value is used for every drive (pipeline.rs:250-254, 812-816). Only the write path uses each
    drive''s own MDTS (lib.rs:674-683).'
  spec_pointers:
  - FR-019
  - SC-012
  - research.md MDTS decision
  - DIS-INV-PIPELINE-SEGMENT-MDTS
  code_pointers:
  - dispatcher/src/lib.rs:1948
  - dispatcher/src/lib.rs:2475
  - dispatcher/src/lib.rs:842
  - dispatcher/src/lib.rs:962
  - dispatcher/src/lib.rs:3705
  - dispatcher/src/pipeline.rs:250
  - dispatcher/src/pipeline.rs:812
  methods:
  - lookup
  - lookup_async
  - batch_lookup
  - promote_to_memory_tier
  assume: At every cold read (lookup, lookup_async, batch_lookup, promote_to_memory_tier), every data
    drive's max_transfer_size is at least the read chunk size. The read chunk size is the first drive's
    max_transfer_size, or 131072 bytes when no pipeline ring was allocated.
  assume_rust: drives.iter().all(|d| d.block_dev_iface.max_transfer_size() as usize >= chunk_size)
- spec_says: I/O is split into segments of at most MDTS (FR-019). The spec places no constraint relating
    MDTS to the drive's block size.
  code_does: segment_io advances the LBA by length / sector_size with truncating division (io_segmenter.rs:50).
    It therefore assumes every non-final segment, that is the transfer size, is a whole number of blocks.
    The transfer size is max_transfer_size on writes (lib.rs:674-683) and chunk_size on reads (pipeline.rs:247-254).
    Otherwise later segments land at the wrong LBA.
  spec_pointers:
  - FR-019
  - DIS-INV-PIPELINE-SEGMENT-MDTS
  code_pointers:
  - dispatcher/src/io_segmenter.rs:43
  - dispatcher/src/io_segmenter.rs:50
  - dispatcher/src/lib.rs:683
  - dispatcher/src/pipeline.rs:250
  - dispatcher/src/pipeline.rs:486
  - dispatcher/src/pipeline.rs:812
  methods:
  - populate
  - batch_populate
  - copy_gpu_to_memory_completed
  - schedule_write_through
  - lookup
  - lookup_async
  - batch_lookup
  - promote_to_memory_tier
  assume: At every call of segment_io (every SSD write-through and every cold read), the transfer size
    it is given is a multiple of the drive's block size.
  assume_rust: max_transfer_size % sector_size == 0
- spec_says: With no SPDK environment, write-throughs assign synthetic offsets (US-5 AS-4). A CacheKey
    may be any u64.
  code_does: The synthetic offset is computed as job.key * 4096 with an unchecked multiplication (lib.rs:1409).
    It panics in debug builds and wraps in release builds, where two keys can receive the same offset,
    for any key above u64::MAX / 4096.
  spec_pointers:
  - US-5 AS-4
  - DIS-INITIALIZE-NO-SPDK-MEMORY-ONLY
  - idispatcher.rs CacheKey
  code_pointers:
  - dispatcher/src/lib.rs:1407
  - dispatcher/src/lib.rs:1409
  methods:
  - populate
  - batch_populate
  - copy_gpu_to_memory_completed
  - schedule_write_through
  assume: In memory-tier-only mode (no data drives), every key that reaches a background write-through
    is at most u64::MAX / 4096.
  assume_rust: key <= u64::MAX / 4096
- spec_says: Entry sizes are u32 values greater than zero. The spec states no tighter upper bound.
  code_does: The write-through rounds the size up to the drive's block size and passes it to reserve_extent
    as aligned_bytes as u32 (lib.rs:1418, 1439). A size within one block of u32::MAX rounds past u32::MAX
    and is truncated.
  spec_pointers:
  - idispatcher.rs IpcHandle.size
  - idispatcher.rs reserve_memory
  - FR-004
  code_pointers:
  - dispatcher/src/lib.rs:1418
  - dispatcher/src/lib.rs:1439
  methods:
  - populate
  - batch_populate
  - copy_gpu_to_memory_completed
  - schedule_write_through
  assume: At every background write-through, the entry size rounded up to the target drive's block size
    is at most u32::MAX.
  assume_rust: (size as usize).next_multiple_of(block_size) <= u32::MAX as usize
- spec_says: Each batch_lookup entry carries a Vec of GPU destination regions, each with a u32 size (FR-039).
    The spec does not bound their total.
  code_does: batch_lookup adds up each entry's region sizes in u32 (lib.rs:2356 for the slot size, lib.rs:2775
    for the remote-lookup size). The sum overflows when the regions total more than u32::MAX. copy_gpu_to_memory_async
    adds them up in usize instead (lib.rs:3441).
  spec_pointers:
  - FR-039
  - idispatcher.rs batch_lookup
  code_pointers:
  - dispatcher/src/lib.rs:2356
  - dispatcher/src/lib.rs:2775
  methods:
  - batch_lookup
  assume: At every call of batch_lookup, the sizes of each entry's GPU regions add up to at most u32::MAX.
  assume_rust: entries.iter().all(|(_, rs)| rs.iter().map(|r| r.size as u64).sum::<u64>() <= u32::MAX
    as u64)
