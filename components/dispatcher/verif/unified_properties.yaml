  divergence_note: 'SPEC (FR-058, SC-017; DIS-TIER-STATS-REMOTE-HIT-ON-FETCH folded into DIS-TIER-STATS-REMOTE-ACCOUNTING):
    lookup_hits_dram + lookup_hits_ssd + remote_lookup_hits increases by exactly the number of keys served.
    The spec also says a remote hit is counted when the peer returns the data, even if local delivery
    then fails. CODE (dispatcher/src/lib.rs:2843, 2881-2895, 2904-2911, 2919-2920): remote_hits is incremented
    before delivery. A key whose post-fetch lookup, GPU copy or remote-delivery sync fails is still counted
    as a remote hit, while its outcome is KeyNotFound or IoError (lib.rs:2968-2973). The equality therefore
    fails whenever a remote delivery fails. The merge kept the equality and dropped the hit-on-fetch clause
    that contradicts it.'
