  divergence_note: 'SPEC (FR-042, FR-050): the evictor emits a Demoted event (Removed on transition failure)
    for each entry it evicts, and an event that does not fit the bounded channel increments the dropped-event
    counter. CODE: only the foreground emit_eviction (dispatcher/src/lib.rs:572-577) counts a drop. The
    background memory-tier evictor (background.rs:539-544) and the SSD evictor (background.rs:335-340)
    call try_send and discard failures without counting them. The SSD evictor also copies the channel
    sender once at initialize (lib.rs:2054), so a channel created later never receives its events. The
    dropped counter is reset on every read (lib.rs:567-570). The code-side reading (DIS-INV-EVICTION-EVENT-DROP-COUNT)
    covered only emit_eviction, and the merge widened it to every evictor.'
