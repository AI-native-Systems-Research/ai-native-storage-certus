  origin_before_level1: spec+code
  divergence_note: 'SPEC (002 FR-033): evictions_blocked_unpersisted counts ONLY candidates refused for
    want of an ssd_offset. Both counters must be counted, so that their sum against the scanned total
    exposes any third cause rather than absorbing it. CODE (dispatcher/src/lib.rs:1073-1083): every try_evict_to_block
    error other than ActiveReferences adds to blocked_unpersisted. That includes KeyNotFound for a memory-tier
    slot that reserve_memory reserved but that is not registered in the dispatch map yet, InvalidState
    for an entry that is not in MemoryTier state, and Timeout (interfaces/src/idispatch_map.rs:181-186).
    The code-side reading (DIS-RESERVE-EVICTION-COUNTERS: ''each other refused candidate'') was narrowed
    to ''lacking an SSD offset'' in the merge.'
