[package]
name = "block-device-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux kernel block device component implementing IBlockDevice via io_uring on raw devices"

[features]
default = []
telemetry = []

[dependencies]
component-core.workspace = true
component-macros.workspace = true
component-framework.workspace = true
interfaces = { workspace = true, features = ["spdk"] }
crossbeam-channel = "0.5"
io-uring = "0.7"
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "throughput"
harness = false
