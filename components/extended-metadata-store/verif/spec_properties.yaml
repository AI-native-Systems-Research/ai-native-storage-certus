interface_methods: [put, get, delete, iterate_all, force_flush]   # N = 5
properties:
  - id: SPEC-PUT-GET-ROUNDTRIP
    statement: "After put(key, value) succeeds with a value of 0..=128 KiB, a subsequent get(key) returns Ok holding an identical copy of the stored bytes."
    kind: functional
    source: [FR-01, FR-02, US1]
    verifiable: true
    methods: [put, get]

  - id: SPEC-PUT-SIZE-LIMIT
    statement: "put rejects any value strictly larger than 128 KiB (MAX_VALUE_SIZE) by returning ExtendedMetadataStoreError::ValueTooLarge, and no such value is stored."
    kind: safety
    source: [FR-06, US1]
    verifiable: true
    methods: [put]

  - id: SPEC-PUT-OVERWRITE
    statement: "Writing an existing key with put replaces the previous value atomically; a following get returns the most recently written value."
    kind: functional
    source: [FR-01, US1]
    verifiable: true
    methods: [put, get]

  - id: SPEC-GET-NOTFOUND
    statement: "get on a key that is not present returns ExtendedMetadataStoreError::NotFound."
    kind: functional
    source: [FR-02, US1]
    verifiable: true
    methods: [get]

  - id: SPEC-DELETE-REMOVES
    statement: "After delete(key) the key is absent: get(key) returns NotFound and the pair is excluded from iterate_all()."
    kind: functional
    source: [FR-03, US3]
    verifiable: true
    methods: [delete, get, iterate_all]

  - id: SPEC-DELETE-IDEMPOTENT
    statement: "Deleting a key that is not present is idempotent and returns Ok(())."
    kind: functional
    source: [FR-03, US3]
    verifiable: true
    methods: [delete]

  - id: SPEC-ITERATE-SNAPSHOT
    statement: "iterate_all() returns a consistent snapshot-at-call-time of every current key-value pair, with deleted entries excluded and no partial updates visible."
    kind: functional
    source: [FR-04, US4]
    verifiable: true
    methods: [iterate_all]

  - id: SPEC-DIRTY-COUNT
    statement: "The dirty count tracks mutations since the last flush; each put and each delete increases it."
    kind: functional
    source: [FR-14, US3]
    verifiable: true
    methods: [put, delete]

  - id: SPEC-FORCE-FLUSH-NOOP
    statement: "In pure in-memory mode (no durable-flush trigger installed) force_flush() is a correct no-op returning Ok(())."
    kind: functional
    source: [FR-05]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-FORCE-FLUSH-DURABLE
    statement: "When the wiring layer has installed a durable-flush trigger, force_flush() invokes it, blocks until it returns, and maps any trigger error to StorageError; it returns Ok only once all data is durable."
    kind: functional
    source: [FR-05, US6]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-DUAL-REGION-PINGPONG
    statement: "Flush writes the serialized state to the inactive region and only then flips the superblock's active-region pointer and writes the superblock as the single atomic commit point."
    kind: functional
    source: [FR-07, US2]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-CRASH-CONSISTENCY
    statement: "A crash at any point during a flush leaves either the previous committed state or the new state intact; a partial flush never corrupts previously-committed data."
    kind: safety
    source: [NFR-04, US2]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-FLUSH-SEQ-MONOTONE
    statement: "Flush sequence numbers are monotonically increasing across successive flushes."
    kind: functional
    source: [US2, FR-07]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-RECOVER-ACTIVE
    statement: "Recovery reads the superblock, identifies the active region, and deserializes its entries back into memory."
    kind: functional
    source: [FR-08, US2]
    verifiable: true
    methods: [force_flush]      # recovery is FR-17 wiring; attached to durability surface

  - id: SPEC-RECOVER-FALLBACK
    statement: "If the active region is corrupt, recovery falls back to the inactive region (previous checkpoint)."
    kind: functional
    source: [FR-09, US2]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-RECOVER-FRESH
    statement: "A fresh (all-zeros / no valid superblock) partition is auto-detected and formatted to an empty store without crashing; if both regions are corrupt the store initializes empty."
    kind: functional
    source: [FR-10, US2]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-CRC32-INTEGRITY
    statement: "On-disk superblock, region headers, and entry records carry CRC32 integrity checks; a record whose stored CRC does not match its recomputed CRC is rejected."
    kind: safety
    source: [NFR-02]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-SECTOR-ALIGNED
    statement: "All on-disk structures are sector-aligned (default 4096-byte sectors)."
    kind: functional
    source: [NFR-03]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-LITTLE-ENDIAN
    statement: "All on-disk integer fields use little-endian byte order and round-trip losslessly."
    kind: functional
    source: [NFR-09]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-SUPERBLOCK-MAGIC
    statement: "The superblock is identified by magic number 0x4345525445544D41 (CERTMETA) and a format version; deserialization rejects data with a wrong magic or version."
    kind: functional
    source: [NFR-10]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-REGION-CAPACITY-BYTES
    statement: "Superblock::region_capacity_bytes() returns the usable per-region byte capacity, region_a_size * sector_size."
    kind: functional
    source: [FR-18]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-CONCURRENT-READERS
    statement: "Multiple concurrent get() calls proceed without blocking one another (shared read lock); put/delete take an exclusive write lock."
    kind: liveness
    source: [NFR-01, US5]
    verifiable: true
    methods: [get, put, delete]

  - id: SPEC-ITERATE-CONCURRENT-SAFE
    statement: "Concurrent writers do not corrupt the result of an in-progress iterate_all()."
    kind: safety
    source: [US4, US5]
    verifiable: true
    methods: [iterate_all]

  - id: SPEC-FLUSH-COALESCE
    statement: "Multiple concurrent force_flush() calls coalesce into a single in-flight flush operation."
    kind: functional
    source: [FR-12, US6]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-FLUSH-BG-TRIGGERS
    statement: "The background FlushManager supports a configurable timer interval and a dirty-count threshold that trigger flushes."
    kind: functional
    source: [FR-11, US6]
    verifiable: true
    methods: [force_flush]

  - id: SPEC-FLUSH-FINAL-ON-DROP
    statement: "FlushManager performs a final flush when it is dropped (graceful shutdown)."
    kind: functional
    source: [FR-13, US6]
    verifiable: true
    methods: [force_flush]

