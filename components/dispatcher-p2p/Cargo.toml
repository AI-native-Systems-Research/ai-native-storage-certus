[package]
name = "dispatcher-p2p"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "P2P-capable dispatcher with GDRCopy BAR1 staging ring + D2D copy path. Supports runtime path selection: p2p|dram|auto via CERTUS_FORCE_PATH env var."

[dependencies]
component-framework.workspace = true
component-core.workspace = true
component-macros.workspace = true
interfaces = { workspace = true, features = ["spdk"] }
gpu-services = { workspace = true, features = ["spdk", "gpu", "p2p"] }
spdk-env.workspace = true
block-device-spdk-nvme.workspace = true
extent-manager.workspace = true
memory-tier.workspace = true
libc = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[features]
hardware-test = []
