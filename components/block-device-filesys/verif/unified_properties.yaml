  - BDF-ADMIN-NOOPS
  code_only_note: 'Behaviors implemented but not (or only implicitly) documented in the spec: config-field
    accessors; fallocate-failure cleanup; telemetry not-initialized error; per-op record accounting; the
    offset non-overflow argument; the sync-write error path; the fsync-SQE-push-failure warn path; the
    512-aligned zero-buffer allocation; silent drop of a completion to an unregistered client; ring-completion
    result mapping; the chained-fsync completion skip; monotonic op-handle assignment; and the four no-op
    admin methods. Each is a real observable obligation kept with origin code-only.'
  divergent:
  - BDF-MAXTRANSFER
  divergent_note: 'BDF-MAXTRANSFER: spec (FR-021 / contract) states block_size * 256; code uses saturating_mul(256),
    which caps at u32::MAX on overflow instead of wrapping. Behaviourally identical for all in-range block
    sizes; the divergence only shows for block sizes above ~16.7M, which the config invariants already
    bound well below.'
  refinement_gap: 'None checked in this Role-1 pass: no harness/verif artifact was fed to extraction (tool-contamination
    guard). A one-way refinement-gap cross-check can be run later; it may only flag a missing obligation
    for spec/code confirmation, never seed ids here.'
  implementing_obligation_map:
  - validate_lba (internal helper) implements the observable bounds obligations BDF-LBA-NS / -OVERFLOW
    / -INRANGE and underpins BDF-SAFETY-NO-OOB; kept as one subject, not split per branch.
  - offset_for_lba (internal helper) implements BDF-OFFSET-EQ and the derived non-overflow invariant BDF-OFFSET-NOOVERFLOW.
  - ClientSession::deliver + flush_pending + send_completion + poll_clients (internal machinery) collapse
    into the observable delivery invariants BDF-DELIVERY-NONBLOCK / -FIFO / -ISOLATION / BDF-COMPLETION-UNKNOWN-CLIENT.
  - TelemetryStats::record_op atomic increments and min/max CAS loops (internal) collapse up into the
    snapshot-observable postconditions BDF-TELEMETRY-RECORD / -MINMAX / -MEAN-LATENCY / -MEAN-THROUGHPUT.
  - harvest_completions + check_timeouts + next_op_handle (internal) collapse into BDF-HARVEST-RESULT
    / -FSYNC-SKIP, BDF-TIMEOUT, BDF-OPHANDLE-UNIQUE.
  - try_open_direct (internal) implements the observable open behavior BDF-FILE-ODIRECT-FALLBACK.
  - process_command dispatch + BatchSubmit recursion (internal) route each Command variant to its per-command
    observable property; the dispatch itself is not a separate id.
  aggregation_unit_note: 'N = 17 public trait methods across the two define_interface! blocks this component
    provides (IBlockDevice: 11, IBlockDeviceAdmin: 6). The observable IO surface, however, is the Command
    enum processed by the actor and reachable only through connect_client''s channels; per the contract
    document''s Command Processing Contract these command operations (ReadSync, WriteSync, ReadAsync,
    WriteAsync, WriteZeros, BatchSubmit, AbortOp, NsProbe, FlushSync, and the unsupported admin commands)
    plus the public config functions (DeviceConfig::new, accessors, open_or_create_backing_file) are treated
    as additional named subjects/mutators in the bundle namespace, since the strong arithmetic nucleus
    (LBA validation, offset arithmetic, config geometry) lives there. Bundle sizes below are counted over
