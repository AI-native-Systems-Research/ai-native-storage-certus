[package]
name = "remote_lookup_verif"
version = "0.1.0"
edition = "2024"
publish = false

# Detach from the parent certus workspace: this is a standalone faithful-mirror
# Creusot crate (the real remote-lookup crate pulls spdk-sys + zyre native libs and
# cannot build under creusot-rustc).
[workspace]

[dependencies]
creusot-std = "0.12.0-dev"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[patch.crates-io]
creusot-std = { path = "/home/cornel/ai-native-storage-certus/tools/creusot/creusot/creusot-std" }
