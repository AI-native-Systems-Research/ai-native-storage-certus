  spec_says: A landing slot is reserved privately in the local memory-tier pool and is published to dispatch-map
    (via create_memory_tier_entry then release_write) only after the RDMA transfer succeeds; on failure or peer-exit
    the slot is discarded (memory_tier.remove) and no dispatch-map entry is ever created. A racing create_memory_tier_entry
    that returns AlreadyExists counts as success only when the resident entry size equals the slot length, and a
    size mismatch discards the private slot without evicting or overwriting the resident entry.
