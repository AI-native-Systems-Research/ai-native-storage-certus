    handle is nothing but the domain identifier plus the storage position (src/lib.rs:140), with no counter
    recording which use of that position it belongs to, and a position freed by a removal or eviction
    is pushed onto a spare list and handed to the next registration (src/session_list.rs:182 and the allocator).
