  - id: EPSL-TRACK-FIRST-BLOCK-IS-HEAD-AND-LEAF
    subject: track
    methods: [track, identify_next_to_evict, get_eviction_candidates]
    kind: postcondition
    verifiable: true
    statement: >
      When a block is registered for a session that currently has no blocks, that
      block becomes both the start of the session's chain (it has no parent block)
      and the end of the chain (it has no child block), which also makes it the one
      block of that session that is eligible for eviction.
    traces: [FR-002, US-2.1, EC-single-block, CONTRACT-1]

  - id: EPSL-TRACK-LINKS-UNDER-CURRENT-LEAF
    subject: track
    methods: [track, identify_next_to_evict, get_eviction_candidates]
    kind: postcondition
    verifiable: true
    statement: >
      When a block is registered for a session that already has blocks, the block
      that was previously the end of that session's chain becomes the new block's
      parent, and the new block becomes the new end of the chain; as a consequence
      the previous end-of-chain block stops being eligible for eviction and the new
      block becomes the session's only eligible block.
    traces: [FR-002, US-2.2, CONTRACT-2, DM-TRANSITION-track]

  - id: EPSL-TRACK-SESSION-COMES-FROM-CALLER
    subject: track
    methods: [track]
    kind: postcondition
    verifiable: true
    statement: >
      The session a newly registered block is placed in is exactly the session the
      caller named at registration time; the policy never works the session out from
      the cache key or from anything else.
    traces: [FR-003, ASSUMPTION-caller-supplies-session, CLAR-2]

  - id: EPSL-TRACK-SETS-INITIAL-RECENCY
    subject: track
    methods: [track, identify_next_to_evict]
    kind: postcondition
    verifiable: true
    statement: >
      Registering a new block records the current time as that block's
      most-recent-access time, so a block that has just been registered counts as
      more recently used than every block registered or accessed before it, and a
      victim can be chosen sensibly even if the caller never reports an access.
    traces: [FR-004, US-3-rationale, DM-TRANSITION-track, RESEARCH-D3]

  - id: EPSL-TRACK-REREGISTRATION-IS-IDEMPOTENT
    subject: track
    methods: [track, len]
    kind: postcondition
    verifiable: true
    statement: >
      Registering a cache key that the domain is already tracking does not create a
      second block for that key. Instead it is treated as an access to the existing
      block, refreshing that block's most-recent-access time, returning the handle
      the caller already had, leaving the number of tracked blocks unchanged, and
      leaving every parent/child link exactly as it was.
    traces: [FR-017, CLAR-4, EC-reregistration, CONTRACT-4, IFACE-track]

  - id: EPSL-TRACK-DISTINCT-SESSIONS-GIVE-PLAIN-RECENCY-ORDER
    subject: track
    methods: [track, identify_next_to_evict, get_eviction_candidates]
    kind: postcondition
    verifiable: true
    statement: >
      If the caller gives every block a session of its own, then every block is a
      one-block chain that is both the start and the end of its session, so every
      block is always eligible for eviction and the policy evicts simply in
      least-recently-used order. This is how a caller that does not care about
      lineage gets ordinary recency behaviour out of this policy, and it needs no
      separate call.
    traces: [FR-001, CONTRACT-3, RESEARCH-D1, DM-TRANSITION-track]

