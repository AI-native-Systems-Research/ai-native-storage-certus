  - id: EPSL-EVICT-NONEMPTY-DOMAIN-ALWAYS-YIELDS-A-VICTIM
    subject: identify_next_to_evict
    methods: [identify_next_to_evict, len]
    kind: postcondition
    verifiable: true
    statement: >
      Whenever an eviction domain tracks at least one block, a request for a victim
