  # ------------------------------------------------- global / shared invariants

  - id: EPSL-INV-AT-MOST-ONE-CHILD
    subject: "Global invariant: each block has at most one child"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      A session's lineage is always a single straight chain and never a branching
      tree: at every moment, no tracked block has more than one tracked child. This
      holds no matter how long the chain is and no matter what sequence of
      registrations, accesses, evictions and removals has been performed.
    traces: [FR-018, CLAR-1, DM-INV-1, EC-deep-chains, SC-006]

  - id: EPSL-INV-EXACTLY-ONE-LEAF-PER-SESSION
    subject: "Global invariant: one eligible end-of-chain block per non-empty session"
    methods: [track, remove, identify_next_to_evict, clear_pool, get_eviction_candidates]
    kind: invariant
    verifiable: true
    statement: >
      Every session that currently holds at least one block has exactly one
      end-of-chain block - one block with no tracked child - and that is the only
      block of that session eligible for eviction. A session holding no blocks has
      none.
    traces: [FR-018, CLAR-1, DM-INV-3, ASSUMPTION-linear-stack]

  - id: EPSL-INV-NO-CYCLES-IN-LINEAGE
    subject: "Global invariant: lineage has no cycles"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      Following the parent links upwards from any tracked block always reaches the
      start of its session's chain after a finite number of steps; no block is ever
      its own ancestor, so the lineage can always be walked to the top without
      looping forever. This holds for chains of any length.
    traces: [SC-006, DM-INV-1, EC-deep-chains]

  - id: EPSL-INV-NO-ORPHANED-BLOCKS
    subject: "Global invariant: parent and child links agree and point at live blocks"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      Whenever a tracked block records another block as its parent, that parent is
      itself still tracked and records the first block as its child; the two links
      always agree with each other. No tracked block is ever left pointing at a
      block that has been evicted or removed.
    traces: [SC-006, DM-INV-4, FR-011]

  - id: EPSL-INV-ELIGIBLE-SET-IS-EXACTLY-THE-CHILDLESS
    subject: "Global invariant: the eviction-eligible set equals the set of childless tracked blocks"
    methods: [track, remove, identify_next_to_evict, get_eviction_candidates, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      The set of blocks the policy considers for eviction is at every moment exactly
      the set of tracked blocks that have no tracked child - never a block that still
      has one, and never missing a block that has none.
    traces: [FR-007, DM-INV-2, SC-004]

  - id: EPSL-INV-SESSION-POINTS-AT-ITS-OWN-END-OF-CHAIN
    subject: "Global invariant: each session's recorded end-of-chain block is live, its own, and childless"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      For every session the policy knows about, the block it remembers as that
      session's end of chain is still tracked, genuinely belongs to that session, and
      has no tracked child.
    traces: [DM-INV-3, FR-002, FR-018]

  - id: EPSL-INV-ONE-TRACKED-BLOCK-PER-CACHE-KEY
    subject: "Global invariant: a cache key is tracked at most once per domain"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      Within one eviction domain, no two tracked blocks ever carry the same cache
      key; each key the policy is tracking corresponds to exactly one block. This is
      what makes re-registering an existing key an update rather than a duplicate.
    traces: [FR-017, DM-INV-5, CLAR-4]

  - id: EPSL-INV-SIZE-ACCOUNTING-IS-EXACT
    subject: "Global invariant: reported size always equals the number of tracked blocks"
    methods: [len, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      The size a domain reports always matches the blocks it really holds: it goes up
      by exactly one for each newly registered block, stays the same when an existing
      key is re-registered, when accesses are reported, and when candidates or the
      size itself are queried, goes down by exactly one for each block evicted or
      removed, and becomes zero when the domain is cleared. It is never negative.
    traces: [FR-013, DM-INV-6]

  - id: EPSL-INV-BLOCK-BELONGS-TO-EXACTLY-ONE-SESSION
    subject: "Global invariant: every block belongs to exactly one session, fixed at registration"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict]
    kind: invariant
    verifiable: true
    statement: >
      Every tracked block belongs to exactly one session - never to none and never to
      two - and the session it belongs to is the one named when it was registered and
      never changes for as long as the block is tracked.
    traces: [FR-003, ASSUMPTION-caller-supplies-session]

  - id: EPSL-INV-LINEAGE-NEVER-CROSSES-SESSIONS
    subject: "Global invariant: parent/child links stay inside one session"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      Blocks of different sessions are never linked to one another: a block's parent
      and its child always belong to the same session as the block itself, so one
      session's blocks never appear anywhere in another session's lineage and the
      chains stay completely independent.
    traces: [FR-003, US-2.3, CONTRACT-6, ASSUMPTION-linear-stack]

  - id: EPSL-INV-A-BLOCK-WITH-A-DESCENDANT-IS-NEVER-EVICTED
    subject: "Global invariant: only end-of-chain blocks may be evicted"
    methods: [identify_next_to_evict, get_eviction_candidates]
    kind: invariant
    verifiable: true
    statement: >
      The policy never selects, and never offers as a candidate, a block that still
      has a tracked block descended from it. Start-of-chain and middle-of-chain
      blocks are therefore protected until everything descended from them has itself
      been evicted or removed - this is the mechanism by which session lineage is
      preserved.
    traces: [FR-007, SC-004, US-1.2, ASSUMPTION-leaves-only]

  - id: EPSL-INV-PARENT-BECOMES-ELIGIBLE-WHEN-ITS-CHILD-GOES
    subject: "Global invariant: losing a child makes a block eligible"
    methods: [identify_next_to_evict, remove]
    kind: invariant
    verifiable: true
    statement: >
      As soon as a block's only child stops being tracked - whether that child was
      evicted or explicitly removed - the block itself becomes an end-of-chain block
      and is therefore eligible for a later eviction, so a chain can be consumed from
      its end one block at a time.
    traces: [FR-009, US-1.2, DM-TRANSITION-remove, DM-TRANSITION-identify_next_to_evict]

  - id: EPSL-INV-VICTIM-CHOICE-IS-REPEATABLE
    subject: "Global invariant: victim selection is deterministic"
    methods: [identify_next_to_evict, get_eviction_candidates]
    kind: invariant
    verifiable: true
    statement: >
      Victim selection depends only on the tracking state, never on anything
      incidental: asking for a victim twice from two domains in identical states
      always names the same block, and the candidate list for identical states is
      always the same list in the same order. In particular, if two eligible blocks
      were somehow equally old, the choice between them is still made the same way
      every time rather than arbitrarily.
    traces: [FR-012, EC-tie]

  - id: EPSL-INV-DOMAINS-ARE-INDEPENDENT
    subject: "Global invariant: eviction domains do not affect one another"
    methods: [create_pool, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      Anything done to one eviction domain leaves every other domain completely
      unchanged: a victim is only ever chosen from among the blocks of the domain
      asked about, a reported size counts only that domain's blocks, and clearing one
      domain never removes a block from another.
    traces: [FR-008, FR-013, FR-014, ASSUMPTION-pool-mapping]

  - id: EPSL-INV-RECENCY-STRICTLY-ADVANCES
    subject: "Global invariant: recency values strictly advance"
    methods: [track, touch, batch_touch]
    kind: invariant
    verifiable: true
    statement: >
      Every time a block is registered or an access to it is reported, it is stamped
      with a recency value strictly later than every recency value handed out before
      it in that domain. Recency therefore only ever moves forward, two blocks never
      end up equally recent, and "the oldest eligible block" is always a single
      well-defined block.
    traces: [FR-004, FR-012, RESEARCH-D3, ASSUMPTION-monotonic-clock]

  - id: EPSL-INV-FAILED-OPERATIONS-CHANGE-NOTHING
    subject: "Global invariant: a rejected or degraded operation never corrupts state"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    kind: invariant
    verifiable: true
    statement: >
      Whenever an operation reports an error, or safely does nothing because the
      domain named does not exist, the policy's tracking state is left exactly as it
      was beforehand. No operation, valid or invalid, ever leaves tracking state
      inconsistent.
    traces: [FR-015]

  - id: EPSL-INV-HANDLES-KEEP-NAMING-THEIR-BLOCK
    subject: "Global invariant: a handle keeps identifying its block while that block is tracked"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict]
    kind: invariant
    verifiable: true
    statement: >
      For as long as a block remains tracked, the handle issued for it keeps
      identifying that same block, no matter how many other blocks are registered,
      accessed, evicted or removed in the meantime. A handle never starts naming a
      different block while its own block is still tracked.
    traces: [FR-001, FR-011, IFACE-track]

  - id: EPSL-NO-INPUT-CAN-MAKE-AN-OPERATION-PANIC
    subject: "Global invariant: every operation is total over its inputs"
    methods: [create_pool, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    kind: precondition
    verifiable: true
    statement: >
      There is no precondition the caller must satisfy beyond supplying
      correctly-typed arguments: any domain identifier, any handle, any cache key,
      any session identifier, any requested candidate count and any group of handles
      - including ones that are unknown, stale, empty or extreme - may be passed to
      any operation without the policy crashing, aborting, or overflowing. Bad inputs
      are reported as errors or handled harmlessly instead.
    traces: [FR-015]

  - id: EPSL-HANDLE-OPERATIONS-REJECT-UNKNOWN-DOMAIN
    subject: "Global invariant: handle-taking operations reject handles naming a dead domain"
    methods: [touch, batch_touch, remove]
    kind: error-case
    verifiable: true
    statement: >
      If a handle refers to an eviction domain that does not exist, the operations
      that take handles report an error instead of appearing to succeed. The
      specification requires an error but does not pin down which of the two error
      kinds is reported, so only the fact that an error is reported is claimed here.
    traces: [FR-015]

  - id: EPSL-READONLY-QUERIES-DEGRADE-SAFELY-ON-UNKNOWN-DOMAIN
    subject: "Global invariant: the read-only queries degrade safely on an unknown domain"
    methods: [identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    kind: error-case
    verifiable: true
    statement: >
      The four operations that have no way to report an error - asking for a victim,
      asking for candidates, asking for a size, and clearing - behave harmlessly when
      asked about a domain that does not exist: they respectively report nothing to
      evict, return an empty list, report zero, and do nothing at all. None of them
      crashes and none of them disturbs any domain that does exist.
    traces: [FR-015]

  # -------------------------------------------------------- not-verifiable ledger

  - id: NV-1
    scope: "Success criterion SC-001: at least 15 percent fewer prefix reloads than basic LRU"
    kind: not-verifiable
    verifiable: false
    reason: >
      This is a comparative empirical measurement against a different component on
      representative workload traces, not a claim about this component's own
      behaviour on a single operation sequence. The specification itself downgrades
      it to an aspirational design goal and records that the comparative
      trace-replay harness needed to measure it does not exist. No counterexample
      execution of this component could refute it.
    traces: [SC-001]

  - id: NV-2
    scope: "Success criterion SC-002: registration, recency refresh and removal cost is effectively constant"
    kind: not-verifiable
    verifiable: false
    reason: >
      This is a statement about how execution time grows with the number of tracked
      blocks. Timing and asymptotic cost are performance characteristics measured by
      benchmarks, not functional assertions a verifier can refute with a
      counterexample.
    traces: [SC-002, PLAN]

  - id: NV-3
    scope: "Success criterion SC-003: victim selection scales with the number of sessions, not blocks"
    kind: not-verifiable
    verifiable: false
    reason: >
      Another asymptotic-cost and wall-clock-bound claim, including a bound on a
      domain of at least one million blocks. Performance scaling is measured, not
      proved, and the functional content of the requirement is already captured by
      the victim-selection correctness properties.
    traces: [SC-003, PLAN]

  - id: NV-4
    scope: "Success criterion SC-005: the recency-refresh path sustains the cache hot-path access rate"
    kind: not-verifiable
    verifiable: false
    reason: >
      A throughput target measured against an external subsystem's demand. It has no
      pass/fail condition on a single execution and depends on the machine it runs
      on.
    traces: [SC-005]

  - id: NV-5
    scope: "One-time informational log line emitted on first selection as the active eviction policy"
    kind: not-verifiable
    verifiable: false
    reason: >
      The specification marks this section non-normative and states explicitly that
      it is a diagnostic, not a functional requirement, and that it has no effect on
      eviction behaviour. Log emission through an optional external receptacle is not
      observable through the eviction-policy interface, so there is no behavioural
      obligation to check.
    traces: [OBS-1]

  - id: NV-6
    scope: "Assumption that a monotonic current-time source is available to the component"
    kind: not-verifiable
    verifiable: false
    reason: >
      This is an assumption about the environment the component runs in, not a
      behaviour of the component. The consequence that matters - that recency values
      only ever move forward - is captured as a verifiable invariant separately.
    traces: [ASSUMPTION-monotonic-clock]

  - id: NV-7
    scope: "Tracking state is in-memory only and is rebuilt by the cache after a restart"
    kind: not-verifiable
    verifiable: false
    reason: >
      A scoping decision about what the component deliberately does not do.
      Behaviour across a process restart is outside any single execution of the
      component, and persistence and crash consistency are declared out of scope, so
      there is nothing to falsify.
    traces: [CLAR-3, ASSUMPTION-in-memory]

  - id: NV-8
    scope: "Assumption that hot-path operations may be invoked concurrently and must remain safe"
    kind: not-verifiable
    verifiable: false
    reason: >
      Safety under arbitrary concurrent interleavings, and freedom from deadlock
      between the operations, is a property of unboundedly many schedules rather than
      of one execution. It needs a concurrency model checker rather than a sequential
      verifier, so it is recorded here instead of being forced into a row.
    traces: [ASSUMPTION-concurrency, RESEARCH-D4]

  - id: NV-9
    scope: "FR-016: all behaviour is reachable only through the shared eviction-policy interface"
    kind: not-verifiable
    verifiable: false
    reason: >
      An encapsulation and architecture requirement about which functions are
      publicly reachable. It is settled by inspecting the visibility of the crate's
      items at compile time and has no runtime counterexample.
    traces: [FR-016, PLAN]

  - id: NV-10
    scope: "The component targets Linux only"
    kind: not-verifiable
    verifiable: false
    reason: >
      A build-and-platform fact, not a behaviour of any operation, so no execution
      can refute it.
    traces: [ASSUMPTION-linux, PLAN]

  - id: NV-11
    scope: "Whether a group recency refresh is all-or-nothing when one handle in the group is invalid"
    kind: not-verifiable
    verifiable: false
    reason: >
      SPECIFICATION GAP found during extraction. The requirement says the group
      refresh must report an error rather than silently succeed on an invalid handle,
      but it never says whether the valid handles in the same group are applied
      first. Both an all-or-nothing group and a partially-applied group satisfy the
      text as written, so there is no obligation here to check; only the
      error-reporting half is stated as a property above.
    traces: [FR-005, FR-015]

  - id: NV-12
    scope: "Whether a stale handle can start naming a different block after its slot is reused"
    kind: not-verifiable
    verifiable: false
    reason: >
      SPECIFICATION GAP found during extraction. An error is required for an invalid
      or already-removed handle, but nothing in the specification says a handle
      carries any marker that distinguishes one use of a tracking slot from the next.
      So after a block is removed or evicted and new blocks are registered, whether
      the old handle is still detected as stale or silently names the newly
      registered block is simply not specified, and neither behaviour can be called a
      violation.
    traces: [FR-015, FR-011]

  - id: NV-13
    scope: "Internal data-structure and concurrency design choices recorded in the design notes"
    kind: not-verifiable
    verifiable: false
    reason: >
      The choice of an index arena with a free list, an ordered set over the eligible
      blocks, a per-domain access counter, and a particular lock layout are
      implementation decisions rather than obligations on observable behaviour. Their
      observable consequences - ordering, determinism, idempotent re-registration,
      chain splicing - appear as properties above; the structures themselves must not
      be pinned by a specification-derived property, or the property would forbid a
      correct alternative implementation.
    traces: [RESEARCH-D1, RESEARCH-D2, RESEARCH-D3, RESEARCH-D4, ASSUMPTION-pool-mapping]

  - id: NV-14
    scope: "Code-quality and build gates: formatting, lint, documentation, no unsafe code, minimum compiler version"
    kind: not-verifiable
    verifiable: false
    reason: >
      These are toolchain and review gates applied to the source text, not assertions
      about what the component computes, so they have no counterexample execution.
    traces: [PLAN, QUICKSTART]

  - id: NV-15
    scope: "Specification-quality checklist items and the build, test and benchmark instructions"
    kind: not-verifiable
    verifiable: false
    reason: >
      These units describe the specification process and how to compile and exercise
      the component. They make no claim about the component's behaviour, so they map
      to no property. Recorded here so that every unit of every artifact read is
      accounted for.
    traces: [CHECKLIST, QUICKSTART]
