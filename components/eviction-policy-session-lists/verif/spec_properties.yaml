  - id: EPSL-TRACK-DOES-NOT-DISTURB-OTHER-BLOCKS
    subject: track
    methods: [track]
    kind: frame
    verifiable: true
    statement: >
      Registering a block changes only that block's own record and the parent/child
      link to the block that used to end its session's chain. No other block's
      most-recent-access time changes, no other block gains or loses a parent or a
      child, no other block stops being tracked, and the chains of all other
