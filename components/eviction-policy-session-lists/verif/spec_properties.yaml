  # ----------------------------------------------------------------- clear_pool

  - id: EPSL-CLEAR-RETURNS-DOMAIN-TO-EMPTY
    subject: clear_pool
    methods: [clear_pool, len, identify_next_to_evict, get_eviction_candidates]
    kind: postcondition
    verifiable: true
    statement: >
