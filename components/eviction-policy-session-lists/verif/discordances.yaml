  name: Track returns usable handle
  kind: spec-and-code-differ
  methods:
  - track
  - touch
  - batch_touch
  - remove
  spec_says: When the caller successfully registers a cache block, the policy hands back a handle that identifies
    exactly that block, and using that handle afterwards to refresh the block's recency or to stop tracking it succeeds
    and acts on that same block and no other.
  code_does: The handle returned when a block is tracked carries the pool number the caller asked for together with
    the storage slot the block occupies, and those are exactly what the later refresh and stop-tracking operations
    use to find the block again.
