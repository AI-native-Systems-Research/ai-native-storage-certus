- id: D-FR-003-session_list.rs:91-184f6d
  name: Track session comes from caller
  kind: spec-and-code-differ
  methods:
  - track
  spec_says: The session a newly registered block is placed in is exactly the session the caller named at registration
    time; the policy never works the session out from the cache key or from anything else.
  code_does: When a key is already being tracked, the session identifier supplied with the new request is discarded
    entirely; the block stays in the session it was first tracked under, even if the caller asked for a different
    one. The interface documentation says a lineage-aware policy reads the supplied session identifier to place
    the block into its session's chain, which is true only for a key that is not yet tracked, so a caller that re-tracks
    a key under a new session gets no error and no effect.
  spec_pointers:
  - FR-003
  - ASSUMPTION-caller-supplies-session
  - CLAR-2
  code_pointers:
