- id: D-FR-014-session_list.rs:221-dec7f1
  kind: spec-and-code-differ
  methods:
  - clear_pool
  - touch
  - batch_touch
  - remove
  - track
  spec_says: A handle the caller obtained before a domain was cleared no longer names a tracked block afterwards,
    so using it to refresh recency or to stop tracking must report an error rather than appearing to succeed.
  code_does: The specification promises that a pre-clear handle is rejected with an error. The code clears the domain's
    whole storage area and its spare list (src/session_list.rs:220-228), so storage positions are numbered from
    the beginning again. A pre-clear handle is rejected only while the domain is still smaller than that handle's
    position; once enough blocks have been registered after the clear, the same handle names a live but completely
    unrelated block and a refresh or a stop-tracking request on it silently succeeds against the wrong block. The
    specification is authoritative; the code cannot deliver the promised error for the same reason as EPSL-STALE-HANDLE-ALIASES-A-RECYCLED-SLOT
    - handles carry no marker of which use of a position they belong to.
  spec_pointers:
