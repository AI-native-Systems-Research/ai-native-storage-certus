- id: D-FR-003-session_list.rs:91-184f6d
  kind: spec-and-code-differ
  methods:
  - track
  spec_says: The session a registered block belongs to must be exactly the session the caller named at registration
    time; the policy never works the session out from the cache key or from anything else.
  code_does: 'The specification promises that the session a block is placed in is exactly the session named by the
    caller on that registration. The code honours this only for a key that is not already tracked: when the key
    is already tracked, registration takes the early idempotent path, refreshes the existing block''s recency and
    returns its handle, discarding the newly supplied session identifier entirely (src/session_list.rs:90-94 - the
    `by_key` hit calls `touch` and returns before the `session` argument is ever read). Re-registering a key under
    a different session therefore silently keeps the block in its original session and the caller is given no indication.
    The specification is authoritative on intent; the code''s behaviour is a defect unless the specification is
    amended to say the session is fixed at first registration.'
  spec_pointers:
  - FR-003
  - ASSUMPTION-caller-supplies-session
  - CLAR-2
  code_pointers:
  - session_list.rs:91
  - session_list.rs:92
  - session_list.rs:93
  - lib.rs:139
  status: candidate
  excluded_properties:
