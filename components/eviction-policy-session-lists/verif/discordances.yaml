- id: D-FR-015-lib.rs:200-8436e2
  name: Readonly queries degrade safely on unknown domain
  kind: spec-and-code-differ
  methods:
  - identify_next_to_evict
  - get_eviction_candidates
  - len
  - clear_pool
  spec_says: 'The four operations that have no way to report an error - asking for a victim, asking for candidates,
    asking for a size, and clearing - behave harmlessly when asked about a domain that does not exist: they respectively
    report nothing to evict, return an empty list, report zero, and do nothing at all. None of them crashes and
    none of them disturbs any domain that does exist.'
  code_does: Asking an unknown pool number for a block to evict reports that there is nothing to evict, rather than
    reporting an error. The caller cannot tell an unknown pool apart from a pool that is simply empty, even though
    the interface has an invalid-pool error and the tracking operation does use it.
  spec_pointers:
