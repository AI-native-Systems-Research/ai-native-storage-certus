- id: D-FR-004-session_list.rs:62-aab037
  name: Track sets initial recency
  kind: spec-and-code-differ
  methods:
  - track
  - touch
  - batch_touch
  - identify_next_to_evict
  spec_says: Registering a new block records the current time as that block's most-recent-access time, so a block
    that has just been registered counts as more recently used than every block registered or accessed before it,
    and a victim can be chosen sensibly even if the caller never reports an access.
  code_does: Every tracking request that either adds a block or refreshes an existing one gives that block an access
    number strictly larger than every access number handed out before it in the same pool, so the block is unambiguously
    the most recently accessed one and the ordering of blocks by recency is never tied.
  spec_pointers:
