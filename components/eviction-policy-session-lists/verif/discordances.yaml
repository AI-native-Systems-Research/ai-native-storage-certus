- id: D-FR-015-session_list.rs:206-12b3fa
  kind: spec-and-code-differ
  methods:
  - remove
  spec_says: Asking the policy to stop tracking a block with a handle that was never issued, or that names a block
    already evicted or already removed, must report an error to the caller rather than quietly succeeding, and must
    change nothing.
  code_does: The specification requires an error for a handle naming an already removed or evicted block. The code
    checks only that the handle's storage position is within the domain's storage and currently occupied (src/session_list.rs:206-209).
    Once the position of a removed block has been reused by a later registration, a stale handle passes the check
    and removes the block that now occupies that position - a silent removal of the wrong block, which is worse
    than the false success in the refresh case. Specification authoritative; same root cause as EPSL-STALE-HANDLE-ALIASES-A-RECYCLED-SLOT.
