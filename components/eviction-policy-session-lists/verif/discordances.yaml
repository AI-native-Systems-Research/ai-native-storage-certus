- id: D-FR-004-session_list.rs:52-8ff4db
  kind: spec-and-code-differ
  methods:
  - track
  - touch
  - batch_touch
  - clear_pool
  spec_says: Every time a block is registered or an access to it is reported, it is stamped with a recency value
    strictly later than every recency value handed out before it in that eviction domain, so recency only ever moves
    forward and older accesses can never appear newer than later ones.
  code_does: The specification promises that recency values strictly advance for the whole life of a domain. The
    code maintains only the weaker property that the domain's recency counter is at least as large as the recency
    of every block it currently tracks, and it resets that counter to zero when the domain is cleared (src/session_list.rs:226),
    so values handed out after a clear repeat values handed out before it. This is unobservable while it lasts,
    because clearing discards every block, so no two blocks ever share a recency value and the eviction order is
    never wrong - but the specification's monotonicity claim is literally false across a clear, and it becomes observable
    if a pre-clear handle is reused (see EPSL-CLEAR-INVALIDATES-EXISTING-HANDLES). The specification should be weakened
    to per-epoch monotonicity, or the counter should not be reset.
  spec_pointers:
  - FR-004
  - FR-012
  - ASSUMPTION-monotonic-clock
  code_pointers:
  - session_list.rs:52
  - session_list.rs:53
  - session_list.rs:63
  - session_list.rs:96
  - session_list.rs:130
  status: candidate
