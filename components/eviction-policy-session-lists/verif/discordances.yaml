- id: D-FR-010-ieviction_policy.rs:106-bfcdca
  kind: spec-and-code-differ
  methods:
  - get_eviction_candidates
  - identify_next_to_evict
  spec_says: The candidates are listed in the order the policy would actually evict them, oldest access first, so
    that the list read from front to back is the sequence of blocks successive victim requests would return.
  code_does: 'The specification promises the candidate list is in true eviction order. The code returns the currently
    eligible end-of-chain blocks sorted by recency, oldest first (src/session_list.rs:196-202), which guarantees
    only the FIRST entry: evicting that block promotes its parent into the eligible set at the parent''s own, possibly
    much older, recency, so the block actually evicted second may be a block that was not in the list at all, or
    one further down it. The code extraction states this explicitly as a separate obligation. The specification''s
    own first-entry claim is met; its whole-list ordering claim is not. Either the specification must be weakened
    to ''the first candidate is the next victim'', or the implementation must simulate successive evictions - the
    specification is authoritative and currently over-promises.'
  spec_pointers:
