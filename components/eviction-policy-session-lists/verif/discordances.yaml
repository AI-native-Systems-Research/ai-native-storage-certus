- id: D-FR-014-session_list.rs:221-dec7f1
  name: Clear invalidates existing handles
  kind: spec-and-code-differ
  methods:
  - clear_pool
  - touch
  - batch_touch
  - remove
  - track
  spec_says: Handles the caller obtained before a domain was cleared no longer name tracked blocks afterwards, so
    using one of them to refresh recency or to stop tracking reports an error rather than appearing to succeed or
    acting on some unrelated block.
  code_does: 'Clearing a pool throws away its whole storage area, so slot numbering restarts from the beginning.
    Handles the caller still holds from before the clear are not marked invalid in any durable way: while the pool
    is empty they are correctly rejected, but as soon as new blocks are tracked the old handles name those new,
    unrelated blocks and will be accepted for refreshing or removal. The operation gives the caller no indication
    that its handles have become meaningless.'
