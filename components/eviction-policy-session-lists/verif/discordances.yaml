- id: D-FR-015-session_list.rs:80-02886a
  kind: spec-and-code-differ
  methods:
  - touch
  spec_says: Reporting an access with a handle that was never issued, or that names a block that has already been
    evicted or removed, must report an error to the caller instead of quietly doing nothing or acting on some other
    block, and must change nothing.
  code_does: The specification requires an error for any handle naming a block that has already been evicted or
    removed. The code only checks that the storage position named by the handle is beyond the end of the domain's
    storage or currently unoccupied (src/session_list.rs:80-82, 123-126). Because a freed position goes onto the
    spare list and is reused by the next registration, a handle to a removed block reports an error only until its
    position is reused; after reuse the refresh silently succeeds and refreshes a different block. The specification
    is authoritative; the code cannot deliver the promised error because handles carry no use-generation marker
    (see EPSL-STALE-HANDLE-ALIASES-A-RECYCLED-SLOT for the root cause, which the specification itself records as
    an open gap).
