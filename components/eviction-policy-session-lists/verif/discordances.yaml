- id: D-FR-004-session_list.rs:52-8ff4db
  name: Recency strictly advances
  kind: spec-and-code-differ
  methods:
  - track
  - touch
  - batch_touch
  - clear_pool
  spec_says: Every time a block is registered or an access to it is reported, it is stamped with a recency value
    strictly later than every recency value handed out before it in that domain. Recency therefore only ever moves
    forward, two blocks never end up equally recent, and "the oldest eligible block" is always a single well-defined
    block.
  code_does: The pool's running access counter is always at least as large as the access number of every block it
    tracks, so the next number it hands out is guaranteed to be newer than everything currently stored. The component's
    own internal invariant check does not test it.
  spec_pointers:
  - FR-004
  - FR-012
  - ASSUMPTION-monotonic-clock
  code_pointers:
  - session_list.rs:52
  - session_list.rs:53
  - session_list.rs:63
  - session_list.rs:96
  - session_list.rs:130
  status: candidate
