- id: D-FR-015-lib.rs:169-133402
  kind: spec-and-code-differ
  methods:
  - track
  - touch
  - batch_touch
  - remove
  - identify_next_to_evict
  - get_eviction_candidates
  - len
  - clear_pool
  spec_says: Whenever an operation reports an error, or safely does nothing because the domain named does not exist,
    the policy's tracking state is left exactly as it was beforehand; no operation, valid or invalid, ever leaves
    partially applied state behind.
  code_does: 'The specification''s global invariant promises that a failed operation leaves no partial state. The
    code''s group recency refresh violates this: it refreshes each handle in turn and returns the error as soon
    as it reaches a bad one (src/lib.rs:169-182), so every handle before the failing one keeps its new recency and
    the eviction order is permanently changed by an operation the caller was told had failed. Every other operation
    does satisfy the invariant - each single-handle operation validates before mutating. The specification is authoritative
    on intent, but its own not-verifiable ledger records that it never explicitly states whether a group refresh
    is all-or-nothing (spec NV-11), so this is at minimum an unresolved conflict that the specification must settle.'
  spec_pointers:
  - FR-015
  code_pointers:
  - lib.rs:169
  - lib.rs:179
  - lib.rs:180
  - lib.rs:181
