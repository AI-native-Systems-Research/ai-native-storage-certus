  spec_says: For as long as a block remains tracked, the handle issued for it keeps identifying that same block,
    no matter how many other blocks are registered, accessed, evicted or removed in the meantime. A handle never
    starts naming a different block while its own block is still tracked.
  code_does: After a block is removed, its storage slot is put back into the pool of spare slots and is reused by
    the next block that is tracked. A handle held from before the removal then names the slot of that new, unrelated
    block, so refreshing or removing through the stale handle succeeds and acts on the new block instead of reporting
    an invalid handle. Because spare slots are reused most-recently-freed first, this happens on the very next tracking
    call after a removal.
