- id: D-FR-001-session_list.rs:69-d8c95a
  kind: spec-and-code-differ
  methods:
  - track
  - touch
  - batch_touch
  - remove
  - identify_next_to_evict
  - clear_pool
  spec_says: For as long as a block remains tracked, the handle issued for it keeps identifying that same block,
    however many other blocks are registered, accessed, evicted or removed in the meantime, and a handle never starts
    identifying a different block.
  code_does: The specification promises a handle never comes to name a different block. The code's handle is nothing
    but the domain identifier plus the storage position (src/lib.rs:140), with no counter recording which use of
    that position it belongs to, and a position freed by a removal or eviction is pushed onto a spare list and handed
    to the next registration (src/session_list.rs:182 and the allocator). A handle held across the removal of its
    block therefore names whatever block later occupies that position, and every operation that takes a handle will
    act on that unrelated block while reporting success. This is the root cause of the three per-method invalid-handle
    divergences and of the clear-domain one. The specification is authoritative but its own not-verifiable ledger
    admits it never required a generation marker (spec NV-12); closing the gap needs either a generation counter
    in the handle or an explicit specification change permitting aliasing.
  spec_pointers:
  - FR-001
  - FR-011
  code_pointers:
  - session_list.rs:69
  - session_list.rs:70
  - session_list.rs:179
  - session_list.rs:182
  - session_list.rs:80
  status: candidate
  excluded_properties:
  - EPSL-INV-HANDLES-KEEP-NAMING-THEIR-BLOCK
  extraction_sides:
    spec:
    - EPSL-INV-HANDLES-KEEP-NAMING-THEIR-BLOCK
