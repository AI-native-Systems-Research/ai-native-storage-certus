- id: D-FR-011-session_list.rs:141-ea322d
  name: Remove relinks the chain
  kind: spec-and-code-differ
  methods:
  - remove
  - identify_next_to_evict
  spec_says: When the block being removed sits in the middle of a session's chain, the policy joins the two ends
    back together - the removed block's child is given the removed block's parent as its new parent - so the chain
    stays in one piece and no block is left with a parent that is no longer tracked. If the removed block was the
    start of the chain, its child becomes the new start and has no parent.
  code_does: Removing a block from the middle of a session's chain joins its ancestor and its descendant directly
    to each other, so the session is still one unbroken chain with no gap and no block left dangling. The descendant's
    recorded ancestor becomes the removed block's ancestor, and that ancestor's recorded descendant becomes the
    removed block's descendant.
  spec_pointers:
