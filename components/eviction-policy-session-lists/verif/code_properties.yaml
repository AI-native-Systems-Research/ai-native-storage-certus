    source: {code: ["session_list.rs:178", "session_list.rs:179", "session_list.rs:180", "session_list.rs:181", "session_list.rs:182", "session_list.rs:183"]}

  - id: EPSL-REMOVE-DOES-NOT-REFRESH-RECENCY
    subject: remove
    methods: [remove, identify_next_to_evict]
    object_fn: "Pool::unlink -> no call to Pool::tick"
    kind: frame
    verifiable: true
    statement: >
      Removing a block does not count as an access to anything. The running access
      counter does not advance and no surviving block's recency changes, so the eviction
      order among the remaining candidates is exactly what it was, apart from the
      removed block disappearing and its ancestor possibly appearing.
    source: {code: ["session_list.rs:143", "session_list.rs:144", "session_list.rs:189"]}

  - id: EPSL-PROMOTED-PARENT-KEEPS-ITS-OLD-STAMP
    subject: "global invariant: promotion recency"
    methods: [remove, identify_next_to_evict, touch, batch_touch]
    object_fn: "Pool::unlink -> BTreeSet::insert with the parent's existing Node::stamp"
    kind: postcondition
    verifiable: true
    statement: >
      When a block becomes eligible for eviction because its descendant was removed, it
      enters the eviction order at the recency it already had, not as a freshly accessed
      block. A long-untouched ancestor can therefore become the very next victim
      immediately after its descendant is evicted, ahead of candidates in other sessions
      that were accessed later. Refreshing a protected block does change the position it
      will take when it is eventually promoted.
    source: {code: ["session_list.rs:165", "session_list.rs:166", "session_list.rs:167", "session_list.rs:131"]}

  - id: EPSL-REMOVE-LEAVES-OTHER-SESSIONS-ALONE
    subject: remove
