  - id: EPSL-EVICT-CHOOSES-THE-OLDEST-LEAF
    subject: identify_next_to_evict
    methods: [identify_next_to_evict]
    object_fn: "Pool::evict_oldest -> BTreeSet<(u64, u32)>::iter().next()"
    kind: postcondition
    verifiable: true
    statement: >
      The block chosen for eviction is the least recently accessed among all blocks that
      have no tracked descendant, considered across every session in the pool at once.
      No candidate with an older access than the chosen one exists at the moment of the
      choice.
    source: {code: ["session_list.rs:186", "session_list.rs:187", "session_list.rs:191", "session_list.rs:50", "session_list.rs:51"]}

  - id: EPSL-EVICT-NEVER-CHOOSES-A-BLOCK-WITH-A-DESCENDANT
    subject: identify_next_to_evict
    methods: [identify_next_to_evict, get_eviction_candidates]
    object_fn: "Pool::leaves -> membership restricted to Node::child == None"
    kind: postcondition
    verifiable: true
    statement: >
      A block that still has a tracked descendant in its session's chain is never chosen
      for eviction, however long ago it was last accessed. This is the whole point of
      the policy: the ancestors that a still-cached block was derived from are protected,
      which a plain least-recently-used policy would not do.
    source: {code: ["session_list.rs:6", "session_list.rs:7", "session_list.rs:8", "session_list.rs:110", "session_list.rs:115", "session_list.rs:191"]}

  - id: EPSL-EVICT-REMOVES-THE-VICTIM-FROM-TRACKING
    subject: identify_next_to_evict
    methods: [identify_next_to_evict, len, track]
    object_fn: "Pool::evict_oldest -> Pool::unlink"
    kind: postcondition
    verifiable: true
    statement: >
      Choosing a block to evict also stops tracking it, with exactly the same effect as
      explicitly asking for it to be removed: the pool's size drops by one, its key is
      no longer tracked, its chain is rejoined, its ancestor may be promoted, and its
      storage slot becomes reusable. The operation is not a read-only query despite its
      name.
    source: {code: ["session_list.rs:187", "session_list.rs:192", "lib.rs:204", "ieviction_policy.rs:101", "ieviction_policy.rs:102"]}

  - id: EPSL-EVICT-DOES-NOT-REFRESH-RECENCY
    subject: identify_next_to_evict
    methods: [identify_next_to_evict]
    object_fn: "Pool::evict_oldest -> Pool::unlink with no Pool::tick"
    kind: frame
    verifiable: true
    statement: >
      Evicting a block does not mark it, or any surviving block, as recently accessed.
      The access counter does not advance, so repeatedly asking for a block to evict
      walks steadily through the candidates from oldest to newest rather than cycling.
    source: {code: ["session_list.rs:188", "session_list.rs:189", "session_list.rs:192"]}

  - id: EPSL-EVICT-VICTIM-IS-UNIQUELY-DETERMINED
    subject: identify_next_to_evict
    methods: [identify_next_to_evict, get_eviction_candidates]
    object_fn: "Pool::leaves -> BTreeSet ordered by (stamp, index) with unique stamps"
    kind: postcondition
    verifiable: true
    statement: >
      There is never any ambiguity about which block gets evicted. Because every access
      is given its own number and no two tracked blocks share one, the candidates have a
      strict oldest-to-newest order with no ties, so the same sequence of operations
      always produces the same victim.
    source: {code: ["session_list.rs:59", "session_list.rs:60", "session_list.rs:61", "session_list.rs:51"]}

  - id: EPSL-DISTINCT-SESSIONS-REDUCE-TO-PLAIN-LRU
    subject: identify_next_to_evict
    methods: [track, identify_next_to_evict, get_eviction_candidates]
    object_fn: "Pool::register -> HashMap(sessions) lookup miss for every distinct session"
    kind: postcondition
    verifiable: true
    statement: >
      If every block is tracked under a session identifier of its own, then no block ever
      has an ancestor or a descendant, every block is always a candidate, and the block
      chosen for eviction is simply the least recently accessed block in the pool. In
      that configuration the policy behaves exactly like a plain least-recently-used
      policy, which is what the module documentation claims.
    source: {code: ["lib.rs:12", "lib.rs:13", "lib.rs:14", "session_list.rs:97", "session_list.rs:107"]}

  # ------------------------------------------------- get_eviction_candidates
  - id: EPSL-CANDIDATES-UNKNOWN-POOL-RETURNS-EMPTY
    subject: get_eviction_candidates
    methods: [get_eviction_candidates]
    object_fn: "EvictionPolicySessionListsComponent::get_eviction_candidates -> Vec::get match on None"
    kind: error-case
    verifiable: true
    statement: >
      Asking an unknown pool number for eviction candidates returns an empty list rather
      than reporting an error, so the caller cannot tell an unknown pool apart from a
      pool that has no candidates.
    source: {code: ["lib.rs:209", "lib.rs:211"]}

  - id: EPSL-CANDIDATES-ARE-LEAVES-OLDEST-FIRST
    subject: get_eviction_candidates
    methods: [get_eviction_candidates]
    object_fn: "Pool::candidates -> BTreeSet::iter in (stamp, index) order"
    kind: postcondition
    verifiable: true
    statement: >
      The candidate list contains only blocks that have no tracked descendant, and they
      are listed least recently accessed first.
    source: {code: ["session_list.rs:195", "session_list.rs:197", "session_list.rs:198", "session_list.rs:200"]}

  - id: EPSL-CANDIDATES-ARE-CAPPED-AT-N
    subject: get_eviction_candidates
    methods: [get_eviction_candidates]
    object_fn: "Pool::candidates -> Iterator::take(n)"
    kind: postcondition
    verifiable: true
    statement: >
      The candidate list never contains more entries than the number the caller asked
      for, and contains exactly as many as are available when fewer exist. Asking for
      zero candidates returns an empty list.
