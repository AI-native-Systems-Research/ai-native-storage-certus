    source: {code: ["session_list.rs:147", "session_list.rs:154", "session_list.rs:158", "session_list.rs:168"]}

  - id: EPSL-TRACKED-SIZE-NEVER-UNDERFLOWS
    subject: "global invariant: size counter bound"
    methods: [remove, identify_next_to_evict]
    object_fn: "Pool::unlink -> usize subtraction guarded by Pool::is_active"
    kind: precondition
    verifiable: true
    statement: >
