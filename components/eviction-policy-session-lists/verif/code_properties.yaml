  # ---------------------------------------------------------------- clear_pool
  - id: EPSL-CLEAR-POOL-EMPTIES-EVERYTHING-AND-RESETS-THE-CLOCK
    subject: clear_pool
    methods: [clear_pool, len, get_eviction_candidates, identify_next_to_evict]
    object_fn: "Pool::clear -> Vec::clear / HashMap::clear / BTreeSet::clear"
    kind: postcondition
    verifiable: true
    statement: >
      Clearing a pool discards every block it tracked, every session it knew about and
      every eviction candidate, reports a size of zero afterwards, offers no eviction
      candidate, and also resets the pool's running access counter back to its starting
      value so that the next block tracked gets the lowest possible access number again.
    source: {code: ["session_list.rs:219", "session_list.rs:220", "session_list.rs:221", "session_list.rs:226", "session_list.rs:227"]}

  - id: EPSL-CLEAR-POOL-UNKNOWN-POOL-IS-A-SILENT-NO-OP
    subject: clear_pool
    methods: [clear_pool]
    object_fn: "EvictionPolicySessionListsComponent::clear_pool -> `if let Some` with no else"
    kind: error-case
    verifiable: true
    statement: >
      Clearing an unknown pool number does nothing at all and says nothing at all. The
      operation returns no result, so a caller has no way to learn that the pool it
      named does not exist.
    source: {code: ["lib.rs:223", "lib.rs:225", "lib.rs:226", "lib.rs:227"]}

  - id: EPSL-CLEAR-POOL-KEEPS-THE-POOL-USABLE
    subject: clear_pool
    methods: [clear_pool, track]
    object_fn: "Pool::clear -> collections emptied but Pool retained in Vec"
    kind: postcondition
    verifiable: true
    statement: >
      A cleared pool keeps its pool number and stays usable. Blocks can be tracked in it
      again immediately afterwards, and the first block tracked after a clear is the
      start of a brand-new chain with no ancestor.
    source: {code: ["lib.rs:225", "lib.rs:226", "session_list.rs:220", "session_list.rs:224"]}

  - id: EPSL-CLEAR-POOL-SILENTLY-INVALIDATES-OUTSTANDING-HANDLES
    subject: clear_pool
    methods: [clear_pool, track, touch, batch_touch, remove]
    object_fn: "Pool::clear -> Vec::clear(nodes) resetting slot numbering to zero"
    kind: postcondition
    verifiable: true
    statement: >
      Clearing a pool throws away its whole storage area, so slot numbering restarts from
      the beginning. Handles the caller still holds from before the clear are not marked
      invalid in any durable way: while the pool is empty they are correctly rejected,
      but as soon as new blocks are tracked the old handles name those new, unrelated
      blocks and will be accepted for refreshing or removal. The operation gives the
      caller no indication that its handles have become meaningless.
    source: {code: ["session_list.rs:221", "session_list.rs:222", "session_list.rs:73", "session_list.rs:80"]}

  - id: EPSL-CLEAR-POOL-LEAVES-OTHER-POOLS-ALONE
    subject: clear_pool
    methods: [clear_pool]
    object_fn: "EvictionPolicySessionListsComponent::clear_pool -> single Mutex<Pool> lock"
    kind: frame
    verifiable: true
    statement: >
      Clearing one pool has no effect on any other pool: their blocks, lineage, recency,
      access counters and sizes are all unchanged, and their pool numbers stay valid.
    source: {code: ["lib.rs:225", "lib.rs:226"]}

  # ------------------------------------------------------- global invariants
  - id: EPSL-INV-CHAIN-LINKS-ARE-MUTUAL
    subject: "global invariant: mutual chain links"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict, clear_pool]
    object_fn: "Node::parent and Node::child -> Pool::register / Pool::unlink"
    kind: invariant
    verifiable: true
    statement: >
      For every tracked block, if it records another block as its ancestor then that
      ancestor records it back as its descendant, and if it records a descendant then
      that descendant records it back as its ancestor. The links are always consistent in
      both directions, after every operation.
    source: {code: ["session_list.rs:279", "session_list.rs:284", "session_list.rs:287", "session_list.rs:289", "session_list.rs:292", "session_list.rs:111", "session_list.rs:155", "session_list.rs:158"]}

  - id: EPSL-INV-A-BLOCK-HAS-AT-MOST-ONE-CHILD
    subject: "global invariant: single descendant"
    methods: [track, remove, identify_next_to_evict]
    object_fn: "Node::child -> Option<u32> single slot, written only from Pool::register and Pool::unlink"
    kind: invariant
    verifiable: true
    statement: >
      No tracked block ever has more than one direct descendant, so each session's blocks
      form a single straight line rather than a tree. This holds because a new block is
      only ever attached beneath the session's current end-of-chain block, which by
      definition has no descendant yet.
    source: {code: ["session_list.rs:31", "session_list.rs:32", "session_list.rs:97", "session_list.rs:111", "session_list.rs:158"]}

  - id: EPSL-INV-CHAINS-ARE-ACYCLIC
    subject: "global invariant: acyclic chains"
    methods: [track, remove, identify_next_to_evict]
    object_fn: "Node::parent -> ancestor walk bounded by Pool::len"
    kind: invariant
    verifiable: true
    statement: >
      Following the ancestor links upward from any tracked block always reaches the start
      of a chain in a finite number of steps, never more steps than the number of blocks
      in the pool. No block is ever its own ancestor, directly or indirectly, so the
      chains never form a loop.
    source: {code: ["session_list.rs:298", "session_list.rs:300", "session_list.rs:301", "session_list.rs:302", "session_list.rs:303"]}

  - id: EPSL-INV-CANDIDATE-SET-IS-EXACTLY-THE-LEAVES
    subject: "global invariant: candidate-set exactness"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::leaves -> BTreeSet<(stamp, index)> maintained against Node::child"
    kind: invariant
    verifiable: true
    statement: >
      The stored set of eviction candidates always holds precisely the tracked blocks
      that have no descendant, each listed once, each recorded with its current access
      number. It never holds a block that has a descendant, never holds a block that has
      been removed, never holds the same block twice, and never records an out-of-date
      access number.
    source: {code: ["session_list.rs:257", "session_list.rs:258", "session_list.rs:264", "session_list.rs:267", "session_list.rs:272", "session_list.rs:275", "session_list.rs:276"]}

  - id: EPSL-INV-SESSION-MAP-POINTS-AT-A-LEAF
    subject: "global invariant: session-to-leaf consistency"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::sessions -> HashMap<SessionId, u32> maintained against Node::child and Node::session"
    kind: invariant
    verifiable: true
    statement: >
      For every session the pool knows about, the block it records as that session's
      current end of chain is a block that is still tracked, that really belongs to that
      session, and that has no descendant.
    source: {code: ["session_list.rs:307", "session_list.rs:308", "session_list.rs:310", "session_list.rs:311", "session_list.rs:312"]}

  - id: EPSL-INV-ONE-LEAF-PER-ACTIVE-SESSION
    subject: "global invariant: one candidate per session"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::leaves and Pool::sessions -> paired insert and remove in Pool::register and Pool::unlink"
    kind: invariant
    verifiable: true
    statement: >
      The number of eviction candidates always equals the number of sessions that
      currently have at least one tracked block, because every candidate is some
      session's end of chain and every such end of chain is a candidate. Every operation
      that adds or removes a candidate makes the matching change to the list of known
      sessions. The module documentation states this as a fact, and the component's own
      internal invariant check does not test it.
    source: {code: ["session_list.rs:16", "session_list.rs:17", "session_list.rs:110", "session_list.rs:114", "session_list.rs:115", "session_list.rs:162", "session_list.rs:167", "session_list.rs:168", "session_list.rs:173"]}

  - id: EPSL-INV-A-CHAIN-BELONGS-TO-ONE-SESSION
    subject: "global invariant: session homogeneity of a chain"
    methods: [track, remove, identify_next_to_evict]
    object_fn: "Node::session -> set once in Pool::register, never rewritten"
    kind: invariant
    verifiable: true
    statement: >
      Every block in one chain names the same session, and a block's session is fixed for
      as long as it is tracked, never rewritten by any later operation. Rejoining a chain
      after a removal therefore never merges two sessions. The component's own internal
      invariant check does not test this.
    source: {code: ["session_list.rs:26", "session_list.rs:27", "session_list.rs:97", "session_list.rs:100", "session_list.rs:147", "session_list.rs:155"]}

  - id: EPSL-INV-KEY-INDEX-IS-ONE-TO-ONE
    subject: "global invariant: key index is one-to-one"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::by_key -> HashMap<CacheKey, u32> maintained against Node::key"
    kind: invariant
    verifiable: true
    statement: >
      Within one pool, the lookup table from key to block holds exactly one entry for
      every tracked block and nothing else. Each entry points at a block that is still
      tracked and that really holds that key, so a key is never tracked twice in the same
      pool and a key that has been removed is never still findable.
    source: {code: ["session_list.rs:245", "session_list.rs:246", "session_list.rs:251", "session_list.rs:253", "session_list.rs:254", "session_list.rs:116", "session_list.rs:178"]}

  - id: EPSL-INV-SIZE-AGREES-WITH-ARENA-OCCUPANCY
    subject: "global invariant: size agreement"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::len -> counted against Node::active and Pool::free"
    kind: invariant
    verifiable: true
    statement: >
      The pool's stored size always equals the number of occupied storage slots, and also
      equals the total number of slots minus the number of slots on the spare list. The
      size counter can never drift away from what the pool actually holds.
    source: {code: ["session_list.rs:236", "session_list.rs:237", "session_list.rs:238", "session_list.rs:240", "session_list.rs:241"]}

  - id: EPSL-INV-FREE-LIST-IS-EXACTLY-THE-EMPTY-SLOTS
    subject: "global invariant: spare-slot list exactness"
    methods: [track, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::free -> Vec<u32> maintained against Node::active"
    kind: invariant
    verifiable: true
    statement: >
      The list of spare storage slots contains every empty slot exactly once and no
      occupied slot. If a slot number appeared on that list twice, the next two blocks
      tracked would be placed in the same slot and one of them would silently overwrite
      the other. The component's own internal invariant check only compares the size of
      the spare list against the number of occupied slots, and does not test that the
      list is free of duplicates or that its entries are really empty.
    source: {code: ["session_list.rs:44", "session_list.rs:45", "session_list.rs:69", "session_list.rs:182", "session_list.rs:239", "session_list.rs:240", "session_list.rs:241"]}

  - id: EPSL-INV-ACTIVE-STAMPS-ARE-DISTINCT
    subject: "global invariant: distinct access numbers"
    methods: [track, touch, batch_touch, clear_pool]
    object_fn: "Node::stamp -> assigned only from Pool::tick"
    kind: invariant
    verifiable: true
    statement: >
      No two tracked blocks in the same pool ever share an access number, because every
      access number handed out is larger than all the ones before it and each block holds
      only the most recent one it was given. This is what makes the oldest-first ordering
      of candidates a strict order with no ties. The component's own internal invariant
      check does not test it.
    source: {code: ["session_list.rs:33", "session_list.rs:34", "session_list.rs:59", "session_list.rs:60", "session_list.rs:63", "session_list.rs:96", "session_list.rs:131"]}

  - id: EPSL-INV-CLOCK-DOMINATES-EVERY-STAMP
    subject: "global invariant: access counter dominates"
    methods: [track, touch, batch_touch, clear_pool]
    object_fn: "Pool::clock -> compared against Node::stamp"
    kind: invariant
    verifiable: true
    statement: >
      The pool's running access counter is always at least as large as the access number
      of every block it tracks, so the next number it hands out is guaranteed to be newer
      than everything currently stored. The component's own internal invariant check does
      not test it.
    source: {code: ["session_list.rs:52", "session_list.rs:53", "session_list.rs:63", "session_list.rs:96", "session_list.rs:130"]}

  - id: EPSL-INV-NO-LIVE-LINK-POINTS-AT-AN-EMPTY-SLOT
    subject: "global invariant: no dangling links"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict, clear_pool]
    object_fn: "Node::parent / Node::child / Pool::sessions / Pool::by_key -> checked against Node::active"
    kind: invariant
    verifiable: true
    statement: >
      Nothing the pool stores ever refers to an empty storage slot. The ancestor and
      descendant recorded by a tracked block are themselves tracked blocks, the block
      recorded as a session's end of chain is tracked, the key lookup table only points
      at tracked blocks, and the candidate set only contains tracked blocks. Because of
      this, the places where the code reaches directly into storage without a bounds
      check are safe.
    source: {code: ["session_list.rs:285", "session_list.rs:291", "session_list.rs:274", "session_list.rs:310", "session_list.rs:252", "session_list.rs:109", "session_list.rs:166"]}

  - id: EPSL-INV-POOLS-ARE-MUTUALLY-ISOLATED
    subject: "global invariant: pool isolation"
    methods: [create_pool, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    object_fn: "EvictionState::pools -> Vec<Mutex<Pool>> with per-pool state"
    kind: invariant
    verifiable: true
    statement: >
      Every operation affects at most the one pool it names. No block, session, chain,
      recency value, access counter or size in any other pool is ever changed. Keys,
      session identifiers and handles are meaningful only within the pool they were used
      in, and two pools may hold the same key or the same session identifier
      independently.
    source: {code: ["lib.rs:82", "lib.rs:130", "lib.rs:147", "lib.rs:189", "lib.rs:202", "lib.rs:209", "lib.rs:217", "lib.rs:225"]}

  - id: EPSL-INV-POOL-IDS-STAY-VALID-FOREVER
    subject: "global invariant: pool identifiers are permanent"
    methods: [create_pool, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    object_fn: "EvictionState::pools -> append-only Vec, never removed or reordered"
    kind: invariant
    verifiable: true
    statement: >
      Once a pool number has been handed out it stays valid for the rest of the
      component's life and always refers to the same pool. There is no operation that
      destroys a pool, so pool numbers are never recycled and never go stale; clearing a
      pool empties it but keeps it.
    source: {code: ["lib.rs:105", "lib.rs:106", "lib.rs:223", "lib.rs:226"]}

  - id: EPSL-INV-ARENA-ONLY-GROWS-EXCEPT-ON-CLEAR
    subject: "global invariant: storage area only grows"
    methods: [track, touch, batch_touch, remove, identify_next_to_evict, clear_pool]
    object_fn: "Pool::nodes -> Vec::push and Vec::clear only"
    kind: invariant
    verifiable: true
    statement: >
      A pool's storage area only ever gets bigger, one slot at a time, except when the
      pool is cleared, which empties it completely. Removing a block marks its slot empty
      but does not shrink the area, so a slot number that was once valid stays within
      range unless the pool is cleared. This is why a handle to a removed block is
      rejected rather than reading past the end of storage.
    source: {code: ["session_list.rs:74", "session_list.rs:179", "session_list.rs:182", "session_list.rs:221"]}

  # --------------------------------------------------------- locking discipline
  - id: EPSL-LOCKS-ASSUMED-NEVER-POISONED
    subject: "global invariant: lock-poisoning assumption"
    methods: [create_pool, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    object_fn: "RwLock::read / RwLock::write / Mutex::lock -> Result::unwrap"
    kind: precondition
    verifiable: true
    statement: >
      Every operation assumes that no earlier operation crashed while holding the
      component's internal locks. The code takes each lock and unconditionally assumes
      success, so if a crash ever happened while a pool's lock was held, every later
      operation on that pool, and in the case of the component-wide lock every later
      operation at all, would itself crash rather than return an error. The interface
      offers no error for this situation, so it cannot be reported to a caller.
    source: {code: ["lib.rs:104", "lib.rs:129", "lib.rs:138", "lib.rs:144", "lib.rs:149", "lib.rs:161", "lib.rs:167", "lib.rs:187", "lib.rs:192", "lib.rs:201", "lib.rs:203", "lib.rs:210", "lib.rs:218", "lib.rs:226"]}

  - id: EPSL-ONLY-POOL-CREATION-TAKES-THE-EXCLUSIVE-LOCK
    subject: "global invariant: concurrency discipline"
    methods: [create_pool, track, touch, batch_touch, remove, identify_next_to_evict, get_eviction_candidates, len, clear_pool]
    object_fn: "RwLock<EvictionState> -> write() only in create_pool, read() elsewhere"
    kind: invariant
    verifiable: true
    statement: >
      Creating a pool is the only operation that takes exclusive access to the
      component's shared state; every other operation takes shared access and then takes
      exclusive access to just the one pool it works on. Operations on different pools
      therefore never block each other, and the list of pools cannot change underneath an
      operation that is already running.
    source: {code: ["lib.rs:104", "lib.rs:129", "lib.rs:144", "lib.rs:161", "lib.rs:187", "lib.rs:201", "lib.rs:208", "lib.rs:216", "lib.rs:224", "lib.rs:19", "lib.rs:20"]}

  # ----------------------------------------------- not-verifiable ledger (NV)
  - id: NV-1
    scope: "asymptotic cost claims in the doc-comments (constant-time refresh and removal, logarithmic victim selection)"
    kind: not-verifiable
    verifiable: false
    reason: >
      How the cost of an operation grows with the amount of data is a statement about
      resource use, not about what the component computes, so no single run can show it
      true or false. It is also worth recording that these claims are loose: the handle
      documentation and the interface documentation both describe refreshing and removal
      as constant-time, whereas the implementation keeps its eviction candidates in an
      ordered set, so both operations cost time that grows with the number of sessions.
      The module documentation of the data structure states the logarithmic cost
      correctly.
    source: {code: ["ieviction_policy.rs:7", "ieviction_policy.rs:98", "session_list.rs:15", "session_list.rs:16"]}

  - id: NV-2
    scope: "throughput and latency levels exercised by the benchmark suite"
    kind: not-verifiable
    verifiable: false
    reason: >
      The benchmarks measure how fast tracking, refreshing, batch refreshing and victim
      selection run with ten thousand up to a million blocks. Wall-clock speed depends on
      the machine, the compiler and the system load, so there is no fixed outcome a
      checker could confirm.
    source: {code: ["benches/session_list_benchmark.rs:41", "benches/session_list_benchmark.rs:64", "benches/session_list_benchmark.rs:79", "benches/session_list_benchmark.rs:94"]}

  - id: NV-3
    scope: "the log messages themselves — the one-off selection announcement, the per-pool debug line, and the warning on tracking into an unknown pool"
    kind: not-verifiable
    verifiable: false
    reason: >
      The text of a log line and the fact that it reaches a log sink are side effects
      outside the component's own state and depend on a separate logging component. Only
      the internal record of whether the announcement has already been made is checkable,
      and that is captured as its own obligation. It is worth noting that the logging is
      inconsistent across operations: tracking into an unknown pool logs a warning, while
      refreshing, batch refreshing and removing through a handle naming an unknown pool,
      and clearing or measuring an unknown pool, log nothing.
    source: {code: ["lib.rs:112", "lib.rs:118", "lib.rs:132", "lib.rs:148", "lib.rs:191"]}

  - id: NV-4
    scope: "whether a logger component is connected to the logger receptacle at run time"
    kind: not-verifiable
    verifiable: false
    reason: >
      Whether the surrounding system wires up a logger is a deployment and
      environment fact decided outside this component, so the component cannot be checked
      for it. The component's behaviour in both cases is captured by the obligations
      above.
    source: {code: ["lib.rs:93", "lib.rs:107", "lib.rs:131"]}

  - id: NV-5
    scope: "progress and freedom from indefinite blocking under concurrent use, and the fairness of the shared/exclusive lock"
    kind: not-verifiable
    verifiable: false
    reason: >
      Whether every waiting thread eventually gets its turn depends on the operating
      system's thread scheduler and on the lock implementation in the standard library,
      neither of which is part of this component. The structural rule that no two pool
      locks are held at once, which is what rules out the circular waiting that this
      component could itself cause, is recorded as its own obligation.
    source: {code: ["lib.rs:19", "lib.rs:20", "lib.rs:167", "lib.rs:171"]}

  - id: NV-6
    scope: "memory footprint, growth of the storage area, and the design claim that index-based slots avoid self-referential borrowing"
    kind: not-verifiable
    verifiable: false
    reason: >
      How much memory a pool occupies, and how often its storage area is reallocated as
      it grows, are resource facts rather than behaviour. The related claim that using
      slot numbers instead of pointers means blocks survive reallocation is a statement
      about the programming language's rules, which hold by construction and admit no
      counterexample to look for.
    source: {code: ["session_list.rs:12", "session_list.rs:13", "session_list.rs:14"]}

  - id: NV-7
    scope: "the absence of lock poisoning"
    kind: not-verifiable
    verifiable: false
    reason: >
      A lock becomes poisoned only if some thread crashes while holding it, which can
      originate in caller code or in a component this one calls into. Whether that ever
      happens cannot be decided by looking at this component alone. What this component
      assumes, and what happens if the assumption breaks, is recorded as its own
      obligation.
    source: {code: ["lib.rs:104", "lib.rs:138", "lib.rs:149"]}

  - id: NV-8
    scope: "the adequacy of the two randomized test loops as evidence that the invariants hold"
    kind: not-verifiable
    verifiable: false
    reason: >
      Both randomized tests drive a fixed number of operations from one fixed
      pseudo-random seed, five thousand operations against the internal invariant check
      and eight thousand against an independent reference model. Passing them shows no
      counterexample was found along those particular paths, which is evidence rather
      than a guarantee; whether the sampling is sufficient is a judgement, not a
      checkable claim. The invariants they are sampling are recorded individually above.
    source: {code: ["session_list.rs:514", "session_list.rs:529", "tests/lineage_properties.rs:104", "tests/lineage_properties.rs:125"]}

  - id: NV-9
    scope: "the runnable examples in the module documentation"
    kind: not-verifiable
    verifiable: false
    reason: >
      The documentation examples are compiled and run by the build system. That they
      compile is a build-time fact about the documentation, and the behaviour they
      demonstrate is already covered by the obligations on tracking, refreshing and
      victim selection.
    source: {code: ["lib.rs:24", "lib.rs:46", "lib.rs:50", "lib.rs:67"]}

  - id: NV-10
    scope: "type and layout facts — the handle being freely copyable, the default-constructibility of the pool and the component state, and the size of a stored block record"
    kind: not-verifiable
    verifiable: false
    reason: >
      These are properties of the type declarations that the compiler enforces, with no
      possible counterexample at run time, and none of them gates any behaviour of the
      policy. One consequence of the handle being freely constructible does gate
      behaviour and is recorded as an obligation about how handles are validated.
    source: {code: ["ieviction_policy.rs:8", "ieviction_policy.rs:42", "session_list.rs:24", "session_list.rs:40", "lib.rs:80"]}

  - id: NV-11
    scope: "the claim that this policy improves on plain recency-based eviction by protecting still-needed ancestors"
    kind: not-verifiable
    verifiable: false
    reason: >
      This is a judgement about how well the policy serves a real workload — how often
      the blocks it protects turn out to be the ones that were needed. It depends on the
      access pattern of whatever system uses the cache, not on the component, so there is
      no fixed outcome to check. The mechanical part of the claim, that a block with a
      tracked descendant is never evicted, is recorded as an obligation.
    source: {code: ["lib.rs:8", "lib.rs:9", "lib.rs:10", "session_list.rs:9", "session_list.rs:10"]}

  - id: NV-12
    scope: "the internal invariant check being compiled only into test builds"
    kind: not-verifiable
    verifiable: false
    reason: >
      The routine that asserts the data-structure invariants is compiled only when the
      component is built for testing, so in a production build nothing checks them at run
      time. Which build configuration is used is a build-system fact, not a behaviour of
      the component. The invariants themselves are recorded individually above so that
      they can be established for all builds rather than sampled in one.
    source: {code: ["session_list.rs:230", "session_list.rs:231", "session_list.rs:232"]}
