  - id: EPSL-CANDIDATES-CHANGE-NOTHING
    subject: get_eviction_candidates
    methods: [get_eviction_candidates]
    object_fn: "Pool::candidates -> &self read-only borrow"
    kind: frame
    verifiable: true
    statement: >
      Asking for the candidate list changes nothing: no block is removed, no recency is
      refreshed, the access counter does not advance, and the pool's reported size is the
      same before and after. Asking twice in a row gives the same answer.
    source: {code: ["session_list.rs:195", "session_list.rs:196"]}

  - id: EPSL-CANDIDATES-FIRST-IS-THE-NEXT-VICTIM
    subject: get_eviction_candidates
    methods: [get_eviction_candidates, identify_next_to_evict]
    object_fn: "Pool::candidates and Pool::evict_oldest -> the same BTreeSet first element"
    kind: postcondition
    verifiable: true
    statement: >
      When at least one candidate exists, the first entry of the candidate list is
      exactly the block that the next eviction would choose, because both read the same
      oldest-first ordering and take its first element.
    source: {code: ["session_list.rs:191", "session_list.rs:197", "session_list.rs:198"]}

  - id: EPSL-CANDIDATES-AFTER-THE-FIRST-ARE-NOT-THE-EVICTION-SEQUENCE
    subject: get_eviction_candidates
    methods: [get_eviction_candidates, identify_next_to_evict]
    object_fn: "Pool::candidates -> snapshot of current leaves, ignoring promotion"
    kind: postcondition
    verifiable: true
    statement: >
      Beyond its first entry, the candidate list is not in general the order in which
      blocks will actually be evicted. Evicting a block can promote its ancestor into the
      candidate set at that ancestor's older recency, and the promoted ancestor can then
      be evicted ahead of blocks that the earlier list named. For example, with one
      session holding an older block beneath a newer one and a second session holding a
      single newest block, the list of two candidates names the newer block of the first
      session and then the block of the second session, whereas two successive evictions
      take the newer block of the first session and then its promoted ancestor. The
      interface documentation describes this list as the keys the policy would evict next
      in eviction order; the code only guarantees that for the first entry.
    source: {code: ["ieviction_policy.rs:106", "ieviction_policy.rs:107", "session_list.rs:195", "session_list.rs:166", "session_list.rs:167"]}

  - id: EPSL-CANDIDATES-HOLD-AT-MOST-ONE-KEY-PER-SESSION
    subject: get_eviction_candidates
    methods: [get_eviction_candidates]
    object_fn: "Pool::leaves -> one entry per non-empty session chain"
    kind: postcondition
    verifiable: true
    statement: >
      No two entries of the candidate list belong to the same session, because a session
      has exactly one block with no tracked descendant. The number of candidates
      available is therefore the number of sessions that currently have any blocks, not
      the number of blocks.
    source: {code: ["session_list.rs:16", "session_list.rs:17", "session_list.rs:49", "session_list.rs:110", "session_list.rs:115"]}

  # ----------------------------------------------------------------------- len
  - id: EPSL-LEN-COUNTS-TRACKED-BLOCKS
    subject: len
    methods: [len]
    object_fn: "Pool::len -> Pool::len field"
    kind: postcondition
    verifiable: true
    statement: >
      The reported size of a pool is the number of blocks it is currently tracking,
      counting blocks anywhere in a chain and not just the ones eligible for eviction. It
      goes up by one for each newly tracked key and down by one for each removal or
      eviction, and is unchanged by refreshing recency or by re-tracking a key already
      held.
    source: {code: ["session_list.rs:54", "session_list.rs:55", "session_list.rs:214", "session_list.rs:216", "session_list.rs:117", "session_list.rs:183"]}

  - id: EPSL-LEN-UNKNOWN-POOL-RETURNS-ZERO
    subject: len
    methods: [len]
    object_fn: "EvictionPolicySessionListsComponent::len -> Vec::get match on None"
    kind: error-case
    verifiable: true
    statement: >
