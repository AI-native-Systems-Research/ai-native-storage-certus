      it no longer has any tracked descendant.
    source: {code: ["session_list.rs:142", "session_list.rs:161", "session_list.rs:164", "session_list.rs:166", "session_list.rs:167", "session_list.rs:168"]}

  - id: EPSL-REMOVE-OF-A-LONE-BLOCK-DROPS-THE-SESSION
    subject: remove
    methods: [remove, identify_next_to_evict, get_eviction_candidates]
    object_fn: "Pool::unlink -> HashMap::remove(sessions)"
    kind: postcondition
    verifiable: true
    statement: >
      Removing the only remaining block of a session makes that session disappear from
      the pool entirely, so the pool no longer offers any eviction candidate for it and
      the session starts fresh if a block is tracked under it again later.
    source: {code: ["session_list.rs:170", "session_list.rs:171", "session_list.rs:172"]}

  - id: EPSL-REMOVE-OF-AN-INTERIOR-BLOCK-KEEPS-THE-CANDIDATES
    subject: remove
    methods: [remove]
    object_fn: "Pool::unlink -> was_leaf guard"
    kind: frame
    verifiable: true
    statement: >
      Removing a block that still has a tracked descendant, including the first block of
      a chain, does not change which blocks are eviction candidates and does not change
      which block is the end of that session's chain. Only the size and the chain's
      shape change.
    source: {code: ["session_list.rs:151", "session_list.rs:161", "session_list.rs:176"]}

  - id: EPSL-REMOVE-UNTRACKS-THE-KEY-AND-FREES-THE-SLOT
    subject: remove
    methods: [remove, identify_next_to_evict, track, len]
    object_fn: "Pool::unlink -> HashMap::remove(by_key) / Vec::push(free) / len decrement"
    kind: postcondition
    verifiable: true
    statement: >
      Removing a block stops the pool from tracking its key, so the key can afterwards
      be tracked again as a brand-new block with a fresh position in its session's
      chain. The block's storage slot is marked empty and made available for reuse, its
      recorded ancestor and descendant are erased, and the pool's reported size goes
