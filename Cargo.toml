[workspace]
# Paths to sub-projects
members = [
    "components/component-framework/crates/component-core",
    "components/component-framework/crates/component-macros",
    "components/component-framework/crates/component-framework",
    "components/component-framework/examples",
    "components/example-helloworld",
    "components/spdk-sys",
    "components/interfaces",
    "components/spdk-env",
    "apps/helloworld-mainline",
    "apps/iops-benchmark",
    "apps/iops-benchmark-md",
    "apps/nvme-ns-manager",
    "apps/extent-benchmark",
    "components/block-device-spdk-nvme",
    "components/block-device-filesys",
    "components/extent-manager",
    "components/logger",
    "components/dispatch-map",
    "components/memory-tier",
    "components/dispatcher",
    "components/gpu-services",
    "apps/gpu-handle-test-server",
    "apps/gpu-show",
    "apps/certus-server",
    "apps/gpu-bb-vs-p2p",
    "certus-connector",
    "components/example-helloworld-dylib",
    "apps/dynamic-loading-example"
]

# SPDK crates require pre-built native libraries at deps/spdk-build/.
# They are excluded from default builds so `cargo build` succeeds without
# SPDK deps. Build them explicitly with: cargo build -p block-device-spdk-nvme
default-members = [
    "components/component-framework/crates/component-core",
    "components/component-framework/crates/component-macros",
    "components/component-framework/crates/component-framework",
    "components/component-framework/examples",
    "components/example-helloworld",
    "components/example-helloworld-dylib",
    "apps/helloworld-mainline",
    "apps/dynamic-loading-example",
    "components/logger",
    "components/gpu-services"
]

resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
component-core = { path = "components/component-framework/crates/component-core" }
component-macros = { path = "components/component-framework/crates/component-macros" }
component-framework = { path = "components/component-framework/crates/component-framework" }
example-helloworld = { path = "components/example-helloworld" }
interfaces = { path = "components/interfaces" }
spdk-sys = { path = "components/spdk-sys" }
spdk-env = { path = "components/spdk-env" }
block-device-spdk-nvme = { path = "components/block-device-spdk-nvme" }
logger = { path = "components/logger" }
dispatch-map = { path = "components/dispatch-map" }
memory-tier = { path = "components/memory-tier" }
dispatcher = { path = "components/dispatcher" }
extent-manager = { path = "components/extent-manager" }
gpu-services = { path = "components/gpu-services" }
certus-connector = { path = "certus-connector" }
libloading = "0.8"
