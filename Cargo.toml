[workspace]
# Paths to sub-projects
members = [
    "components/component-framework/crates/component-core",
    "components/component-framework/crates/component-macros",
    "components/component-framework/crates/component-framework",
    "components/component-framework/examples",
    "components/example-helloworld",
    "components/spdk-sys",
    "components/interfaces",
    "components/spdk-env",
    "apps/helloworld-mainline",
    "apps/iops-benchmark",
    "apps/iops-benchmark-md",
    "apps/nvme-ns-manager",
    "apps/nvme-bar1-bench",
    "apps/extent-benchmark",
    "components/block-device-spdk-nvme",
    "components/block-device-filesys",
    "components/block-device-kernel",
    "components/disk-partition-manager",
    "components/extent-manager",
    "components/logger",
    "components/dispatch-map",
    "components/memory-tier",
    "components/dispatcher",
    "components/dispatcher-p2p",
    "components/gpu-services",
    "apps/gpu-handle-test-server",
    "apps/gpu-show",
    "apps/certus-server",
    "apps/gpu-bb-vs-p2p",
    "certus-connector",
    "components/example-helloworld-dylib",
    "components/eviction-policy-lru",
    "components/remote-lookup",
    "components/remote-lookup-rdma-initiator",
    "components/remote-lookup-rdma-responder",
    "apps/dynamic-loading-example",
    "apps/certus-server-yaml",
    "apps/baseline-generalized-fs",
    "apps/remote-lookup-bench",
    "components/zyre"
]

# SPDK crates require pre-built native libraries at deps/spdk-build/.
# They are excluded from default builds so `cargo build` succeeds without
# SPDK deps. Build them explicitly with: cargo build -p block-device-spdk-nvme
#
# NOTE (002-remote-lookup-rdma): `remote-lookup` is moved OUT of default-members.
# Its 002 rewrite consumes IDispatchMap/IDispatcher, which are
# `#[cfg(feature = "spdk")]` in the `interfaces` crate, so remote-lookup enables
# `interfaces/spdk` and thus transitively requires `spdk-sys`. This is a
# deliberate short-term assumption ("SPDK is always enabled"); the SPDK-orthogonal
# future is to ungate those opaque-pointer trait definitions (they reference no
# SPDK type) as was done for IMemoryTier. See
# specs/002-remote-lookup-rdma/research.md Decision 10.
default-members = [
    "components/component-framework/crates/component-core",
    "components/component-framework/crates/component-macros",
    "components/component-framework/crates/component-framework",
    "components/component-framework/examples",
    "components/example-helloworld",
    "components/example-helloworld-dylib",
    "apps/helloworld-mainline",
    "apps/dynamic-loading-example",
    "components/logger",
    "components/gpu-services",
    "components/eviction-policy-lru"
]

resolver = "2"

[patch.crates-io]
creusot-std = { path = "tools/creusot/creusot/creusot-std" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
component-core = { path = "components/component-framework/crates/component-core" }
component-macros = { path = "components/component-framework/crates/component-macros" }
component-framework = { path = "components/component-framework/crates/component-framework" }
example-helloworld = { path = "components/example-helloworld" }
interfaces = { path = "components/interfaces" }
spdk-sys = { path = "components/spdk-sys" }
spdk-env = { path = "components/spdk-env" }
block-device-spdk-nvme = { path = "components/block-device-spdk-nvme" }
block-device-filesys = { path = "components/block-device-filesys" }
block-device-kernel = { path = "components/block-device-kernel" }
logger = { path = "components/logger" }
dispatch-map = { path = "components/dispatch-map" }
memory-tier = { path = "components/memory-tier" }
dispatcher = { path = "components/dispatcher", default-features = false }
dispatcher-p2p = { path = "components/dispatcher-p2p", default-features = false }
disk-partition-manager = { path = "components/disk-partition-manager" }
extent-manager = { path = "components/extent-manager" }
gpu-services = { path = "components/gpu-services" }
eviction-policy-lru = { path = "components/eviction-policy-lru" }
remote-lookup = { path = "components/remote-lookup" }
remote-lookup-rdma-initiator = { path = "components/remote-lookup-rdma-initiator" }
remote-lookup-rdma-responder = { path = "components/remote-lookup-rdma-responder" }
zyre = { path = "components/zyre" }
certus-connector = { path = "certus-connector" }
creusot-std = "0.12.0-dev"
libloading = "0.8"
