[package]
name = "workload-trace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Trace output containers and the Qwen-Bailian projection. CUDA-free and a
# workspace default member, so container equivalence and schema invariants are
# testable with no accelerator and no server.

[dependencies]
workload-model.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# T061 drives the simulator's own loader rather than a reimplementation of it. The
# claim being tested is about *that* app's record shape (research.md D1), and the only
# way to check such a claim is to run the code it is about. Test-only, so this does
# not make the trace crate depend on an app.
eviction-replay-benchmark = { path = "../../../eviction-replay-benchmark" }

[features]
# Opt-in switch for this crate's unit and integration tests. OFF by default, so
# `cargo test --workspace` skips the workload-generator suites (they are slow and
# isolated from the rest of the tree). Turn it on to run them, e.g.
#   cargo test -p workload-gen --features workload-gen/workload-tests
# Doctests still run without it; cargo cannot gate them on a feature.
workload-tests = []
# Skips tests that exceed the per-PR time budget. OFF by default, so
# `cargo test --features workload-tests` runs everything. CI opts in explicitly.
#
# Deliberately a feature and not a bare #[ignore]: #[ignore] is already used
# here for tests needing a live Certus server, an agent and a GPU, and
# overloading it would make `--include-ignored` unable to run the slow tests
# without also running the ones that cannot pass off-cluster.
ci-fast = []

[lints]
workspace = true
