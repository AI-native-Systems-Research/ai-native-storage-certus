[package]
name = "workload-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The generator-to-node-agent TCP protocol, per contracts/node-agent-wire.md.
# CUDA-free and a workspace default member: framing, the Hello handshake, and
# the six conformance cases are all testable with no agent and no GPU.

[dependencies]
workload-model.workspace = true

[features]
# Skips tests that exceed the per-PR time budget. OFF by default, so a
# plain `cargo test` runs everything: a developer working on the generator
# must not have coverage hidden from them. CI opts in explicitly.
#
# Deliberately a feature and not a bare #[ignore]: #[ignore] is already used
# here for tests needing a live Certus server, an agent and a GPU, and
# overloading it would make `--include-ignored` unable to run the slow tests
# without also running the ones that cannot pass off-cluster.
ci-fast = []
