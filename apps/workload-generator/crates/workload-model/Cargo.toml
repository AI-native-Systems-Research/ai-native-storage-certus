[package]
name = "workload-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The CUDA-free simulation core. Both execution paths (live and emit) consume
# this crate, which is what makes FR-072 ("the plan is identical across live and
# emit runs, and independent of batching and lane count") a structural property
# rather than an honour-system one. Nothing here may know about mailboxes, CUDA,
# sockets, or output containers.

[dependencies]
# Reproducible sampling. `rand_chacha::ChaCha20Rng` rather than `StdRng` or
# `SmallRng`: those are explicitly NOT reproducible across `rand` releases, so a
# recorded seed would silently stop reproducing its own plan on a dependency
# bump (research.md D5).
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
# The per-key plan-generation benchmark (T036) registers its own `[[bench]]`
# target with `harness = false` when it lands.
criterion = "0.5"
serde_json = "1"
