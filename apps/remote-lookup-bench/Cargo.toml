[package]
name = "remote-lookup-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# Per-node load generator for the multi-node remote-lookup performance test.
# Rust rather than Python: the fabric and the NVMe drives are fast enough that a
# Python driver measures the interpreter (see the notes in
# scripts/bench-remote-lookup-multinode.sh).

# Deliberately does NOT depend on `gpu-services`. That crate's `IGpuServices`
# impl is only complete when its own `spdk` feature is on, because the trait's
# SPDK methods are `#[cfg(feature = "spdk")]` in `interfaces`. Any cargo
# invocation that also builds a crate enabling `interfaces/spdk` (e.g.
# `remote-lookup`) would unify features and leave `gpu-services` an incomplete
# impl. This bench needs six CUDA symbols, not a component — so it declares
# them itself, as the deleted apps/baseline-generalized-fs did.
[dependencies]
# Control transport: the /dev/shm shmq mailbox. `shm-queue` provides the
# blocking `Client`; `shmq-dispatcher` provides the wire framing (opcodes +
# little-endian encoders) so this bench speaks exactly what the server serves.
shm-queue.workspace = true
shmq-dispatcher.workspace = true
clap = { version = "4", features = ["derive", "env"] }
