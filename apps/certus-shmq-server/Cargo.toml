[package]
name = "certus-shmq-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# Prototype: a shared-memory-queue alternative to the gRPC control plane
# (apps/certus-server). Same component stack + CUDA-IPC translation, but the
# transport is the lock-free /dev/shm mailbox from `shm-queue` instead of
# tonic/gRPC. The KV bytes still move GPU<->DRAM<->SSD via CUDA/SPDK DMA; only
# the small control messages change transport. Requires SPDK + GPU, so it is a
# workspace member but NOT a default member.

[features]
default = []
rw-telemetry = ["dispatcher/rw-telemetry"]
integrity-check = [
    "dispatcher/integrity-check",
    "dispatch-map/integrity-check",
    "remote-lookup/integrity-check",
]

[dependencies]
shm-queue.workspace = true
interfaces = { workspace = true, features = ["spdk"] }
component-framework.workspace = true
component-core.workspace = true
dispatcher = { workspace = true, features = ["spdk-backend"] }
dispatch-map.workspace = true
eviction-policy-lru.workspace = true
memory-tier = { workspace = true, features = ["spdk"] }
block-device-spdk-nvme.workspace = true
extent-manager.workspace = true
spdk-env.workspace = true
gpu-services = { workspace = true, features = ["gpu"] }
logger.workspace = true
remote-lookup.workspace = true

clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
