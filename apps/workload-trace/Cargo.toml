[package]
name = "workload-trace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# `certus-trace` -- fits a workload model from a real trace, validates a
# generated plan against one, and converts a plan into the parquet interchange
# container.
#
# A separate binary from `certus-workload` because the two point in opposite
# directions: the generator turns parameters into keys, `fit` turns keys into
# parameters. Different inputs, different failure modes, no shared control flow.
#
# `arrow`/`parquet` are behind a DEFAULT-OFF feature (spec SC-012). This crate is
# still a default workspace member, because excluding it would leave `fit` and
# `validate` untested by `cargo test --all` -- worse than a slow build, given the
# FR-058a round trip is the strongest check either has. Gating only the columnar
# container costs almost no coverage: the container is the thinnest seam in the
# design, and readers normalise to one representation on ingest.
[[bin]]
name = "certus-trace"
path = "src/main.rs"

[features]
default = []
parquet = ["dep:arrow", "dep:parquet"]

[dependencies]
workload-model = { path = "../workload-model" }
# The cache-curve check of `fit --cache-curve` (spec FR-057d): the fidelity loop
# replays both the trace and the plan fitted from it through a real
# `IEvictionPolicy` component and compares hit rate against capacity.
#
# These deps live HERE and never in `workload-model`, which still knows nothing of a
# cache (FR-018a). The deferred cache simulator is not being un-deferred: there is
# no tier, no disk, no latency and no byte accounting, only a bounded block set and
# a hit fraction, and the result is a statement about a FIT rather than a property
# of a workload. Simulating with the same component both arms go through is what
# makes a hit mean one thing on both sides -- the same reason every statistic comes
# from `workload_model::stats`.
eviction-replay-benchmark = { path = "../eviction-replay-benchmark" }
eviction-policy-lru.workspace = true
eviction-policy-session-lists.workspace = true
interfaces.workspace = true
component-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
arrow = { version = "53", optional = true }
parquet = { version = "53", optional = true }
