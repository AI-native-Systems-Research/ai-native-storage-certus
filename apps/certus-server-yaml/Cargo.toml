[package]
name = "certus-server-yaml"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
interfaces = { workspace = true, features = ["spdk"] }
component-framework.workspace = true
component-core.workspace = true
dispatcher = { workspace = true, default-features = false }
dispatcher-p2p = { workspace = true, default-features = false, optional = true }
dispatch-map.workspace = true
eviction-policy-lru.workspace = true
eviction-policy-session-lists.workspace = true
memory-tier = { workspace = true, features = ["spdk", "telemetry"] }
block-device-spdk-nvme = { workspace = true, optional = true }
block-device-filesys = { workspace = true, optional = true }
block-device-kernel = { workspace = true, optional = true }
extent-manager.workspace = true
spdk-env = { workspace = true, optional = true }
gpu-services = { workspace = true, features = ["gpu"] }
logger.workspace = true
remote-lookup.workspace = true
remote-lookup-rdma-initiator = { workspace = true, optional = true }
remote-lookup-rdma-responder = { workspace = true, optional = true }
zyre = { workspace = true, optional = true }
shm-queue.workspace = true
shmq-dispatcher.workspace = true

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
crossbeam-channel = "0.5"

# OpenTelemetry (optional, enabled via --features otel)
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["metrics", "http-proto", "reqwest-client"], optional = true }

[features]
default = ["spdk"]
spdk = ["spdk-mem", "dep:block-device-spdk-nvme", "dispatcher/spdk-backend"]
spdk-mem = ["dep:spdk-env"]
filesys = ["dep:block-device-filesys", "spdk-mem"]
kernel = ["dep:block-device-kernel", "spdk-mem"]
p2p-native = ["dep:dispatcher-p2p", "spdk", "gpu-services/p2p", "dispatcher-p2p/spdk-backend"]
# Enables the remote-lookup transport stack (full-remote profile). The
# initiator/responder crates build in stub mode here; add their own `rdma`
# features for real hardware RDMA. zyre pulls the native zyre libraries.
rdma = ["dep:remote-lookup-rdma-initiator", "dep:remote-lookup-rdma-responder", "dep:zyre"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
rw-telemetry = ["dispatcher/rw-telemetry"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
