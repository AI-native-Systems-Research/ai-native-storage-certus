profile:
  name: full-remote
  description: "Production profile: SPDK NVMe + GPU + zyre/RDMA remote-lookup (cross-node cache fills)"

components:
  logger:
    crate: logger
    factory: "LoggerComponent::new_default"
    provides: [ILogger]

  spdk_env:
    crate: spdk-env
    factory: "SPDKEnvComponent::new_default"
    provides: [ISPDKEnv]
    trait_path: spdk-env
    init_hook: init_spdk_env

  gpu:
    crate: gpu-services
    factory: "GpuServicesComponent::new_default"
    provides: [IGpuServices]
    init_hook: init_gpu

  eviction_policy:
    crate: eviction-policy-lru
    factory: "EvictionPolicyLruComponent::new_default"
    provides: [IEvictionPolicy]

  dispatch_map:
    crate: dispatch-map
    factory: "DispatchMapComponent::new(Default::default())"
    provides: [IDispatchMap]
    init_hook: init_dispatch_map

  memory_tier:
    crate: memory-tier
    factory: "MemoryTierComponent::new_default"
    provides: [IMemoryTier]
    init_hook: init_memory_tier

  block_device:
    crate: block-device-spdk-nvme
    factory: "BlockDeviceSpdkNvmeComponent::new_default"
    provides: [IBlockDevice, IBlockDeviceAdmin]
    kind: factory
    receptacles: [spdk_env, logger]

  extent_manager:
    crate: extent-manager
    factory: "ExtentManager::new_inner"
    provides: [IExtentManager]
    kind: factory

  zyre:
    crate: zyre
    factory: "ZyreComponent::new"
    provides: [IZyre]

  remote_lookup_rdma_initiator:
    crate: remote-lookup-rdma-initiator
    factory: "RemoteLookupRdmaInitiatorComponent::new_default"
    provides: [IRemoteLookupRdmaInitiator]

  remote_lookup_rdma_responder:
    crate: remote-lookup-rdma-responder
    factory: "RemoteLookupRdmaResponderComponent::new_default"
    provides: [IRemoteLookupRdmaResponder, IRemoteLookupRdmaResponderAdmin]

  remote_lookup:
    crate: remote-lookup
    factory: "RemoteLookupComponent::new_default"
    provides: [IRemoteLookup]
    # init_remote_lookup reads these environment overrides (unset ⇒ built-in
    # default). Tune the timeouts up for real RDMA — a cold connect can run into
    # seconds, and the 50ms default op_deadline would finalize every cold lookup
    # as NotFound:
    #   CERTUS_RDMA_BIND_IP     RoCE IPv4 to bind (unset ⇒ first active device)
    #   CERTUS_RL_OP_DEADLINE_MS  overall op deadline (default 50)
    #   CERTUS_RL_PHASE1_MS       Phase-1 (memory) timeout (default 20)
    #   CERTUS_RL_QUORUM_PCT      Phase-1→2 quorum percent (default 80)
    #   CERTUS_RL_GROUP           zyre group / cluster name (or --rl-group; the
    #                             flag wins). Default: a random per-process group
    #                             ⇒ the node is its own single-node cluster. Set
    #                             the same value on every node that should form
    #                             one cluster together.
    # Cross-subnet clusters (UDP beacon does not route) use gossip discovery:
    #   CERTUS_RL_GOSSIP_BIND     hub node only, e.g. "tcp://*:9999"
    #   CERTUS_RL_GOSSIP_CONNECT  every node, the hub endpoint
    #   CERTUS_RL_NODE_ENDPOINT   this node's ZRE mailbox (required with gossip)
    init_hook: init_remote_lookup

  dispatcher:
    crate: dispatcher
    factory: "DispatcherComponent::new_default"
    provides: [IDispatcher]
    init_hook: init_dispatcher

wiring:
  - target: gpu.logger
    source: logger
  - target: eviction_policy.logger
    source: logger
  - target: dispatch_map.logger
    source: logger
  - target: dispatch_map.eviction_policy
    source: eviction_policy
  - target: memory_tier.logger
    source: logger
  - target: memory_tier.eviction_policy
    source: eviction_policy
  - target: dispatcher.logger
    source: logger
  - target: dispatcher.dispatch_map
    source: dispatch_map
  - target: dispatcher.memory_tier
    source: memory_tier
  - target: dispatcher.gpu_services
    source: gpu
  - target: dispatcher.spdk_env
    source: spdk_env
  - target: dispatcher.remote_lookup
    source: remote_lookup

  # RDMA initiator/responder provider wiring
  - target: remote_lookup_rdma_initiator.logger
    source: logger
  - target: remote_lookup_rdma_initiator.memory_tier
    source: memory_tier
  - target: remote_lookup_rdma_responder.logger
    source: logger
  - target: remote_lookup_rdma_responder.memory_tier
    source: memory_tier

  # remote-lookup receptacles. dispatcher.remote_lookup above + this
  # remote_lookup.dispatcher close an Arc cycle — the mainline disconnects one
  # side at teardown (specs/002-remote-lookup-rdma/quickstart.md). responder and
  # responder_admin come from the one responder component, so name the interface.
  - target: remote_lookup.logger
    source: logger
  - target: remote_lookup.zyre
    source: zyre
  - target: remote_lookup.dispatch_map
    source: dispatch_map
  - target: remote_lookup.memory_tier
    source: memory_tier
  - target: remote_lookup.dispatcher
    source: dispatcher
  - target: remote_lookup.initiator
    source: remote_lookup_rdma_initiator
  - target: remote_lookup.responder
    source: remote_lookup_rdma_responder
    interface: IRemoteLookupRdmaResponder
  - target: remote_lookup.responder_admin
    source: remote_lookup_rdma_responder
    interface: IRemoteLookupRdmaResponderAdmin

init_order:
  - logger
  - spdk_env
  - gpu
  - eviction_policy
  - dispatch_map
  - memory_tier
  - zyre
  - remote_lookup_rdma_initiator
  - remote_lookup_rdma_responder
  - remote_lookup
  - dispatcher

exports:
  - component: logger
    interface: ILogger
  - component: dispatcher
    interface: IDispatcher
  - component: spdk_env
    interface: ISPDKEnv
  - component: dispatch_map
    interface: IDispatchMap
  - component: memory_tier
    interface: IMemoryTier
