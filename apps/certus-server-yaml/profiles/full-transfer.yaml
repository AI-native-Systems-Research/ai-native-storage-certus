profile:
  name: full-transfer
  description: "full + the certus-to-certus transfer endpoint (shm-queue FETCH); needs --features spdk,rdma"

components:
  logger:
    crate: logger
    factory: "LoggerComponent::new_default"
    provides: [ILogger]

  spdk_env:
    crate: spdk-env
    factory: "SPDKEnvComponent::new_default"
    provides: [ISPDKEnv]
    trait_path: spdk-env
    init_hook: init_spdk_env

  gpu:
    crate: gpu-services
    factory: "GpuServicesComponent::new_default"
    provides: [IGpuServices]
    init_hook: init_gpu

  eviction_policy:
    crate: eviction-policy-lru
    factory: "EvictionPolicyLruComponent::new_default"
    provides: [IEvictionPolicy]
    algorithm: "O(1) index-linked LRU (least-recently-used)"

  dispatch_map:
    crate: dispatch-map
    factory: "DispatchMapComponent::new(Default::default())"
    provides: [IDispatchMap]
    init_hook: init_dispatch_map

  memory_tier:
    crate: memory-tier
    factory: "MemoryTierComponent::new_default"
    provides: [IMemoryTier]
    init_hook: init_memory_tier

  block_device:
    crate: block-device-spdk-nvme
    factory: "BlockDeviceSpdkNvmeComponent::new_default"
    provides: [IBlockDevice, IBlockDeviceAdmin]
    kind: factory
    receptacles: [spdk_env, logger]

  extent_manager:
    crate: extent-manager
    factory: "ExtentManager::new_inner"
    provides: [IExtentManager]
    kind: factory

  remote_lookup:
    crate: remote-lookup
    factory: "RemoteLookupComponent::new_default"
    provides: [IRemoteLookup]

  dispatcher:
    crate: dispatcher
    factory: "DispatcherComponent::new_default"
    provides: [IDispatcher]
    init_hook: init_dispatcher

  # Explicit certus-to-certus transfer: serves peers' fetches from this node's
  # memory and block tiers, and runs the fetches the connector asks for (shm-
  # queue FETCH). It registers the memory-tier pool once, at initialize.
  # init_transfer_endpoint reads:
  #   CERTUS_RDMA_BIND_IP   RoCE IPv4 to listen on (unset ⇒ first active device)
  #   CERTUS_RDMA_PORT      listen port (default 7481); this node's name is
  #                         "ip:port", and a peer's hint must say exactly that
  #   CERTUS_TRANSFER_CPU   pin the endpoint thread (a core on the NIC's node)
  transfer_endpoint:
    crate: certus-transfer-endpoint
    factory: "CertusTransferEndpoint::new_default"
    provides: [ITransferEndpointAdmin, ITransferEndpoint]
    init_hook: init_transfer_endpoint

wiring:
  - target: gpu.logger
    source: logger
  - target: eviction_policy.logger
    source: logger
  - target: dispatch_map.logger
    source: logger
  - target: dispatch_map.eviction_policy
    source: eviction_policy
  - target: memory_tier.logger
    source: logger
  - target: memory_tier.eviction_policy
    source: eviction_policy
  - target: dispatcher.logger
    source: logger
  - target: dispatcher.dispatch_map
    source: dispatch_map
  - target: dispatcher.memory_tier
    source: memory_tier
  - target: dispatcher.gpu_services
    source: gpu
  - target: dispatcher.spdk_env
    source: spdk_env
  - target: remote_lookup.logger
    source: logger
  - target: dispatcher.remote_lookup
    source: remote_lookup
  - target: transfer_endpoint.logger
    source: logger
  - target: transfer_endpoint.dispatch_map
    source: dispatch_map
  - target: transfer_endpoint.memory_tier
    source: memory_tier
  - target: transfer_endpoint.dispatcher
    source: dispatcher

init_order:
  - logger
  - spdk_env
  - gpu
  - eviction_policy
  - dispatch_map
  - memory_tier
  - remote_lookup
  - dispatcher
  - transfer_endpoint

exports:
  - component: logger
    interface: ILogger
  - component: dispatcher
    interface: IDispatcher
  - component: spdk_env
    interface: ISPDKEnv
  - component: memory_tier
    interface: IMemoryTier
  - component: remote_lookup
    interface: IRemoteLookup
  - component: transfer_endpoint
    interface: ITransferEndpoint
