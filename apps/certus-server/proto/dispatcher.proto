syntax = "proto3";

package certus.dispatcher.v1;

// Service exposing IDispatcher data operations as batch-capable RPCs.
service Dispatcher {
  // Populate cache entries by DMA-copying from GPU memory.
  rpc Populate(BatchPopulateRequest) returns (BatchPopulateResponse);

  // Look up cache entries and DMA-copy data to client GPU memory.
  rpc Lookup(BatchLookupRequest) returns (BatchLookupResponse);

  // Check whether cache entries exist without transferring data.
  rpc Check(BatchCheckRequest) returns (BatchCheckResponse);

  // Remove cache entries, freeing associated resources.
  rpc Remove(BatchRemoveRequest) returns (BatchRemoveResponse);

  // Touch cache entries, updating eviction timestamps without DMA.
  rpc Touch(BatchTouchRequest) returns (BatchTouchResponse);

  // Reserve memory-tier slots for split-phase store (no DMA, no dispatch-map registration).
  rpc Reserve(BatchReserveRequest) returns (BatchReserveResponse);

  // DMA-copy from GPU into previously reserved slots (server synchronizes stream internally).
  rpc CopyToStore(BatchCopyToStoreRequest) returns (BatchCopyToStoreResponse);

  // Finalize reserved slots: register in dispatch-map and enqueue SSD write-through.
  rpc CommitStore(BatchCommitStoreRequest) returns (BatchCommitStoreResponse);

  // Cancel reserved slots without populating (idempotent).
  rpc AbortStore(BatchAbortStoreRequest) returns (BatchAbortStoreResponse);

  // Clear all entries from the memory-tier cache pool.
  rpc ClearMemoryTier(ClearMemoryTierRequest) returns (ClearMemoryTierResponse);

  // Flush all pending background write-through jobs to SSD and block until done.
  rpc FlushToSsd(FlushToSsdRequest) returns (FlushToSsdResponse);

  // Pin cache entries: increment reference count to prevent eviction.
  rpc Pin(BatchPinRequest) returns (BatchPinResponse);

  // Unpin cache entries: decrement reference count, allowing eviction when zero.
  rpc Unpin(BatchUnpinRequest) returns (BatchUnpinResponse);

  // Drain eviction events since the last call (non-blocking poll).
  rpc TakeEvents(TakeEventsRequest) returns (TakeEventsResponse);

  // Return cumulative per-direction SSD read/write byte/op/latency counters.
  rpc GetIoStats(GetIoStatsRequest) returns (IoStatsResponse);
}

// --- Common types ---

message IpcHandle {
  // CUDA IPC memory handle (64 bytes from cudaIpcGetMemHandle) for cross-process GPU sharing.
  // The server opens this handle to obtain a device pointer in its own CUDA context.
  bytes cuda_ipc_handle = 1;
  uint32 size = 2;              // Data size in bytes
  int32 gpu_device_id = 3;     // CUDA device ordinal that allocated this memory
  // Byte offset from the allocation base (what cudaIpcOpenMemHandle resolves to)
  // to the start of this block. Lets a client share one large allocation (e.g. a
  // vLLM KV cache) and address individual blocks; the server DMAs at base+offset.
  // Defaults to 0 for clients that export one allocation per block.
  uint64 offset = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_INITIALIZED = 1;
  ERROR_CODE_KEY_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_ALLOCATION_FAILED = 4;
  ERROR_CODE_IO_ERROR = 5;
  ERROR_CODE_TIMEOUT = 6;
  ERROR_CODE_INVALID_PARAMETER = 7;
  ERROR_CODE_DUPLICATE_KEY = 8;
}

message EntryResult {
  uint64 key = 1;
  bool success = 2;
  ErrorCode error_code = 3;
  string error_message = 4;
}

// --- Populate ---

message PopulateEntry {
  uint64 key = 1;
  IpcHandle ipc_handle = 2;
}

message BatchPopulateRequest {
  repeated PopulateEntry entries = 1;
}

message BatchPopulateResponse {
  repeated EntryResult results = 1;
}

// --- Lookup ---

message LookupEntry {
  uint64 key = 1;
  // Single-region (legacy): one IPC handle addressing the whole block. Used by
  // clients that export one contiguous KV allocation (vLLM <=0.22, populate).
  IpcHandle ipc_handle = 2;
  // Multi-region: one IPC handle per per-layer KV tensor (vLLM 0.23+ splits a
  // block into N per-layer allocations). The server scatters the N regions from
  // the one slot back to GPU in order (region L <- slot + sum(sizes[0..L])).
  // When non-empty this supersedes ipc_handle. N is variable (bounded by the
  // model's KV-cache layer count).
  repeated IpcHandle ipc_handles = 3;
}

message BatchLookupRequest {
  repeated LookupEntry entries = 1;
}

message BatchLookupResponse {
  repeated EntryResult results = 1;
}

// --- Check ---

message BatchCheckRequest {
  repeated uint64 keys = 1;
}

message CheckResult {
  uint64 key = 1;
  bool exists = 2;
}

message BatchCheckResponse {
  repeated CheckResult results = 1;
}

// --- Remove ---

message BatchRemoveRequest {
  repeated uint64 keys = 1;
}

message BatchRemoveResponse {
  repeated EntryResult results = 1;
}

// --- Touch ---

message BatchTouchRequest {
  repeated uint64 keys = 1;
  // When true, SSD-resident entries are promoted to the memory-tier (DRAM)
  // asynchronously without GPU DMA. The response confirms acceptance; the
  // actual promotion completes in the background.
  bool promote = 2;
}

message BatchTouchResponse {
  repeated EntryResult results = 1;
}

// --- Split-phase Store ---

message ReserveEntry {
  uint64 key = 1;
  uint32 size = 2;    // Data size in bytes to reserve
  // Opaque session identifier (e.g. a hash of vLLM's session_id string).
  // 0 = unset. Propagated to the dispatcher for per-session observability.
  uint64 session_id = 3;
}

message BatchReserveRequest {
  repeated ReserveEntry entries = 1;
}

message BatchReserveResponse {
  repeated EntryResult results = 1;
}

message CopyToStoreEntry {
  uint64 key = 1;
  // Single-region (legacy): one IPC handle addressing the whole block.
  IpcHandle ipc_handle = 2;
  // Multi-region: one IPC handle per per-layer KV tensor (vLLM 0.23+). The
  // server gathers the N regions into the one reserved slot in order
  // (slot + sum(sizes[0..L]) <- region L). When non-empty this supersedes
  // ipc_handle. Total copied = sum of region sizes = the reserved slot size.
  repeated IpcHandle ipc_handles = 3;
}

message BatchCopyToStoreRequest {
  repeated CopyToStoreEntry entries = 1;
}

message BatchCopyToStoreResponse {
  repeated EntryResult results = 1;
}

message BatchCommitStoreRequest {
  repeated uint64 keys = 1;
}

message BatchCommitStoreResponse {
  repeated EntryResult results = 1;
}

message BatchAbortStoreRequest {
  repeated uint64 keys = 1;
}

message BatchAbortStoreResponse {
  repeated EntryResult results = 1;
}

// --- ClearMemoryTier ---

message ClearMemoryTierRequest {}

message ClearMemoryTierResponse {
  uint64 entries_cleared = 1;
}

// --- FlushToSsd ---

message FlushToSsdRequest {}

message FlushToSsdResponse {
  uint64 jobs_flushed = 1;
}

// --- Pin / Unpin ---

message BatchPinRequest {
  repeated uint64 keys = 1;
  // When true, SSD-resident entries are promoted to the memory-tier (DRAM)
  // after pinning. Combines prepare_load semantics (Pin + promote) into a
  // single round-trip.
  bool promote = 2;
}

message BatchPinResponse {
  repeated EntryResult results = 1;
}

message BatchUnpinRequest {
  repeated uint64 keys = 1;
}

message BatchUnpinResponse {
  repeated EntryResult results = 1;
}

// --- TakeEvents (eviction drain) ---

message TakeEventsRequest {
  uint32 max_events = 1;  // 0 = drain all available
}

enum EvictionReason {
  EVICTION_REASON_UNSPECIFIED = 0;
  EVICTION_REASON_DEMOTED = 1;   // DRAM→SSD, key still accessible
  EVICTION_REASON_REMOVED = 2;   // Data lost, key no longer accessible
}

message EvictionEvent {
  uint64 key = 1;
  EvictionReason reason = 2;
}

message TakeEventsResponse {
  repeated EvictionEvent events = 1;
  uint64 dropped_count = 2;  // Events lost due to channel overflow since last drain
}

// --- GetIoStats (per-direction SSD I/O counters) ---

message GetIoStatsRequest {}

message IoStatsResponse {
  uint64 read_ops = 1;
  uint64 read_bytes = 2;
  uint64 read_latency_ns_sum = 3;
  uint64 write_ops = 4;
  uint64 write_bytes = 5;
  uint64 write_latency_ns_sum = 6;
}
