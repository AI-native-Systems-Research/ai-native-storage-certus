syntax = "proto3";

package certus.dispatcher.v1;

// Service exposing IDispatcher data operations as batch-capable RPCs.
service Dispatcher {
  // Populate cache entries by DMA-copying from GPU memory.
  // Each entry is processed independently; per-entry results returned.
  rpc Populate(BatchPopulateRequest) returns (BatchPopulateResponse);

  // Look up cache entries and DMA-copy data to client GPU memory.
  // Each entry is processed independently; per-entry results returned.
  rpc Lookup(BatchLookupRequest) returns (BatchLookupResponse);

  // Check whether cache entries exist without transferring data.
  rpc Check(BatchCheckRequest) returns (BatchCheckResponse);

  // Remove cache entries, freeing associated resources.
  // Each entry is processed independently; per-entry results returned.
  rpc Remove(BatchRemoveRequest) returns (BatchRemoveResponse);
}

// --- Common types ---

message IpcHandle {
  uint64 address = 1;  // GPU memory pointer (shared address space)
  uint32 size = 2;     // Data size in bytes
}

// Error codes mapping to DispatcherError variants
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_INITIALIZED = 1;
  ERROR_CODE_KEY_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_ALLOCATION_FAILED = 4;
  ERROR_CODE_IO_ERROR = 5;
  ERROR_CODE_TIMEOUT = 6;
  ERROR_CODE_INVALID_PARAMETER = 7;
  ERROR_CODE_DUPLICATE_KEY = 8;
}

message EntryResult {
  uint64 key = 1;
  bool success = 2;
  ErrorCode error_code = 3;    // Set when success = false
  string error_message = 4;    // Human-readable detail when success = false
}

// --- Populate ---

message PopulateEntry {
  uint64 key = 1;
  IpcHandle ipc_handle = 2;
}

message BatchPopulateRequest {
  repeated PopulateEntry entries = 1;
}

message BatchPopulateResponse {
  repeated EntryResult results = 1;
}

// --- Lookup ---

message LookupEntry {
  uint64 key = 1;
  IpcHandle ipc_handle = 2;
}

message BatchLookupRequest {
  repeated LookupEntry entries = 1;
}

message BatchLookupResponse {
  repeated EntryResult results = 1;
}

// --- Check ---

message BatchCheckRequest {
  repeated uint64 keys = 1;
}

message CheckResult {
  uint64 key = 1;
  bool exists = 2;
}

message BatchCheckResponse {
  repeated CheckResult results = 1;
}

// --- Remove ---

message BatchRemoveRequest {
  repeated uint64 keys = 1;
}

message BatchRemoveResponse {
  repeated EntryResult results = 1;
}
