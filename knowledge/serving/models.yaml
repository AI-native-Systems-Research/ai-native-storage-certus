# Model architecture facts, each copied from the model's config.json at a pinned revision.
# Only engine-independent facts: no dtype choice, TP, block size or layout (see deployments.yaml).
# Derived byte sizes are NOT stored; knowledge/serving/check.py computes them.
# Fetched 2026-10-26; research notes: /home/nara/certus/plans/serving-models-research.md (not in repo).
#
# Gated repos (meta-llama/*, google/gemma-2-27b) were read through public mirrors whose
# config.json has the same git blob oid as the official file (HF tree API), i.e. is
# byte-identical. `revision` is the official repo's sha; `source.mirror_revision` the mirror's.
schema_version: 1

models:
