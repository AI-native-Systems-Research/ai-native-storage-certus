  deepseek-v3:
    hf_name: deepseek-ai/DeepSeek-V3
    revision: e815299b0bcbac849fa540c768ef21845365c9eb
    source:
      config: https://huggingface.co/deepseek-ai/DeepSeek-V3/raw/main/config.json
    family: deepseek_v3
    attention: mla
    num_layers: 61
    num_attention_heads: 128
    num_kv_heads: 128   # in config; not used to size the MLA cache
    max_context_len: 163840
    native_dtype: bf16   # torch_dtype; weights are FP8 (quantization_config fp8 e4m3, block [128,128])
    layer_kinds:
      - {kind: full, count: 61}
    mla:
      kv_lora_rank: 512
      qk_rope_head_dim: 64
      qk_nope_head_dim: 128
      v_head_dim: 128
      q_lora_rank: 1536
    notes: >-
      head_dim is absent and hidden_size/heads (56) is meaningless for MLA, so it is not
      recorded. vLLM 0.30 caches one latent per layer of kv_lora_rank + qk_rope_head_dim = 576
      elements (mla_attention.py L462/L467; kv_cache_interface.py L660 head_size_v = 0): no
      separate K and V. The latent is replicated, not sharded, across TP ranks.
      num_nextn_predict_layers 1 (MTP module, not one of the 61 layers); its KV allocation
      under speculative decoding is UNVERIFIED. With kv_cache_dtype fp8_ds_mla the per-token
      state is 656 B, which the generic formula does not give. MLA kernels in vLLM 0.30 may
      require block 64 (FlashMLA) or 128 (CUTLASS MLA); whether block 16 runs on CUDA is UNVERIFIED.

  gemma-2-27b:
    hf_name: google/gemma-2-27b
    revision: 938270f5272feb02779b55c2bb2fffdd0f53ff0c
    source:
      config: https://huggingface.co/axolotl-ai-co/gemma-2-27b/raw/main/config.json
      mirror: axolotl-ai-co/gemma-2-27b
      mirror_revision: e31f8bbcde298b452a7124db999621a26e358bf4
      byte_identical: true
      config_blob_oid: 9515f989c9c21d533f1ce21f89ba8a997217a950
    family: gemma2
    attention: gqa
    num_layers: 46
    num_attention_heads: 32
    num_kv_heads: 16
    head_dim: 128   # explicit in config; hidden_size / heads would be 144
    max_context_len: 8192
    native_dtype: fp32   # torch_dtype float32 in the official file; vLLM dtype=auto downcasts to bf16 on GPUs that support it
    layer_kinds:
      - {kind: sliding_window, count: 23, window: 4096}
      - {kind: full, count: 23}
    notes: >-
      config.json has no layer_types. The split is the transformers default
      (configuration_gemma2.py @ 6c5f8f41 L95-98: layer i is sliding when (i+1) % 2 != 0), so
      layers 0,2,...,44 are sliding (window 4096) and 1,3,...,45 full; vLLM reads that list
      (gemma2.py L155). Derived from the default, not from config.json (UNVERIFIED against a
      running vLLM). Sliding and full layers form separate KV cache groups under vLLM's hybrid
      KV cache manager, so the model is not uniform.
      unsloth/gemma-2-27b is NOT byte-identical (changes torch_dtype to bfloat16).

