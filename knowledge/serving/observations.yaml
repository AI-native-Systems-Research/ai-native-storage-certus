# Values seen in runs of one workload on one deployment. Each value has a basis:
# measured (quote the log line), configured (a setting), computed (give the formula).
# Logs are not committed; they live in the run directories named under `runs`.
# Medians are over the listed runs. Per-run "summed" values add every vLLM
# "KV Transfer metrics:" line in server.log (each line reports the interval since the last).
schema_version: 1

observations:
