# vLLM KV Offload Plugin Interface
# What ANY connector must implement to work with vLLM.
# Source: vllm/v1/kv_offload/base.py
#
# This is the ABSTRACT CONTRACT — no implementation details.
# WARNING: vLLM marks this API as experimental and subject to change.

api_version: "v0.30 (commit 2bc902eb0f)"
api_stability: "Experimental — subject to change between vLLM releases"
verified_against: "vllm v0.30.1rc0-171-g2bc902eb0f"
tested_versions: ["0.26", "0.28", "0.29", "0.30"]
# NOTE: This file documents the 0.26-rewrite era (single OffloadingWorker,
# OffloadingConfig ctor, LookupResult enum, CanonicalKVCaches). Deltas that are
# specifically NEW at 0.30 are tagged "# 0.30:" inline. For the ≤0.28 surface see
# vllm-offloading-interface-v026.yaml (kept for the version-walk matrix).

plugin_mechanism:
  how_vllm_discovers_connectors: |
    1. User sets kv_connector_extra_config in engine config
    2. vLLM's OffloadingSpecFactory loads spec_module_path
    3. Instantiates spec_name class with OffloadingConfig
    4. Calls get_manager() in scheduler process
    5. Calls get_worker(kv_caches) in each GPU worker process
  config_example: |
    {
      "kv_connector": "OffloadingConnector",
      "kv_role": "kv_both",
      "kv_connector_extra_config": {
        "spec_name": "<YourSpec>",
        "spec_module_path": "<your.module>",
        "cpu_bytes_to_use": 10737418240,
        "block_size": 16
      }
    }
  factory:
    module: vllm.v1.kv_offload.factory
    class: OffloadingSpecFactory
    default_spec_name: "CPUOffloadingSpec"
    out_of_tree: "spec_module_path loads a class by spec_name (stable since v026)"
    builtin_specs: ["CPUOffloadingSpec", "TieringOffloadingSpec"]

# ─── Required Interfaces ──────────────────────────────────────────────

required_interfaces:
  OffloadingSpec:
    module: vllm.v1.kv_offload.base
    init: "(config: OffloadingConfig)"
    base_attributes_set_by_init:
      - "config: OffloadingConfig"
      - "extra_config: dict[str, Any]  # == config.extra_config"
      - "replicated_layout: bool = False"
      - "kv_events_config: OffloadingKVEventsConfig"
      - "offload_prompt_only: bool  # extra_config['offload_prompt_only'], default True"
      - "tokens_per_block: tuple[int, ...]  # per group"
      - "tokens_per_hash: int  # == config.cache.tokens_per_hash"
      - "blocks_per_chunk: int  # == config.cache.blocks_per_chunk"
    required_methods:
      get_manager: "() -> OffloadingManager  # called once in scheduler process"
      get_worker: "(kv_caches: CanonicalKVCaches) -> OffloadingWorker  # called per GPU worker"
    optional_methods:
      build_metric_definitions: |
        @classmethod (extra_config: dict[str, Any]) -> dict[str, OffloadingMetricMetadata]
        Optional. Defines custom metrics the connector exposes. Default {}.

  OffloadingManager:
    module: vllm.v1.kv_offload.base
    thread_model: "Single scheduler thread. Not thread-safe required."
    required:
      lookup: "(key: OffloadKey, req_context: ReqContext) -> LookupResult"
      prepare_load: "(keys: Collection[OffloadKey], req_context: ReqContext) -> LoadStoreSpec"
      prepare_store: |
        (keys: Collection[OffloadKey], req_context: ReqContext) -> PrepareStoreOutput | None
        Returns None when blocks cannot be stored (any reason, not just capacity).
      on_new_request: "(req_context: ReqContext) -> RequestOffloadingContext"
    optional:
      touch: "(keys: Collection[OffloadKey], req_context: ReqContext) -> None"
      complete_load: "(keys: Collection[OffloadKey], req_context: ReqContext) -> None"
      complete_store: "(keys: Collection[OffloadKey], req_context: ReqContext, success: bool = True) -> None"
      on_request_finished: |
        (req_context: ReqContext) -> None
        NOTE: may fire while previously submitted transfers are still running.
        Completion callbacks may arrive after on_request_finished.
      take_events: "() -> Iterable[OffloadingEvent]"
      on_schedule_end: "(context: ScheduleEndContext) -> None"
      has_pending_work: "() -> bool"
      reset_cache: "() -> None"
      get_stats: "() -> OffloadingConnectorStats | None"
      shutdown: "() -> None"

  OffloadingWorker:
    module: vllm.v1.kv_offload.base
    thread_model: "Per-GPU worker process. SEPARATE process from manager."
    required:
      submit_store: "(job_id: int, src_spec: GPULoadStoreSpec, dst_spec: LoadStoreSpec) -> bool"
      submit_load: "(job_id: int, src_spec: LoadStoreSpec, dst_spec: GPULoadStoreSpec) -> bool"
      get_finished: |
        () -> list[TransferResult]
        Non-blocking poll. This is the NORMAL completion path.
      wait: |
        (job_ids: set[int]) -> None
        Blocking wait. Used for flushing fenced/preempted jobs, NOT normal polling.
    optional:
      shutdown: "() -> None"

# ─── Key Data Types ───────────────────────────────────────────────────

key_types:
  OffloadKey:
    type: "NewType('OffloadKey', bytes)"
    encoding: "block_hash (content-addressed) + group_idx (4-byte big-endian)"
    helpers:
      - "make_offload_key(block_hash: bytes, group_idx: int) -> OffloadKey"
      - "get_offload_block_hash(key: OffloadKey) -> bytes"
      - "get_offload_group_idx(key: OffloadKey) -> int"
    notes: "Content-addressed — same token content = same key across instances"

  LookupResult:
    type: "enum (auto values)"
    values: ["MISS", "HIT", "HIT_PENDING", "RETRY"]

  Medium:
    type: "enum"
    values: ["CPU", "STORAGE"]
    notes: |
      # 0.30: "REMOTE" was REMOVED from Medium. Cross-instance/remote is now
      # expressed via the Locality enum + TierFilter matchers, not a Medium value.
      Used in OffloadingEvent / LoadStoreSpec.medium to identify which tier.

  Locality:
    type: "enum"
    values: ["LOCAL", "REMOTE"]

  TierMatcher:
    type: "NamedTuple"
    fields:
      - "medium: Medium | None = None"
      - "locality: Locality | None = None"
    methods:
      matches: "(medium: Medium | None, locality: Locality | None) -> bool"
    notes: "None means wildcard for that axis."

  TierFilter:
    type: "@dataclass(frozen=True)"
    fields:
      - "matchers: tuple[TierMatcher, ...] = ()"
    class_vars:
      - "ALL: TierFilter  # == TierFilter(matchers=(TierMatcher(),))"
    methods:
      allows: "(medium: Medium | None, locality: Locality | None) -> bool"
    notes: |
      # 0.30: TierFilter is now a frozen dataclass of TierMatcher tuples, NOT an
      # enum of ALL/LOCAL/REMOTE (that was the ≤0.28 shape). Used in
      # ReqContext.load_tier_filter to restrict which tiers a load may search.

  ReqContext:
    type: "@dataclass"
    fields:
      - "req_id: str"
      - "kv_transfer_params: dict[str, Any] | None = None"
      - "kv_hints: KvHintsEnvelope | None = None   # 0.30: NEW (from vllm.v1.kv_hints)"
      - "load_tier_filter: TierFilter = TierFilter.ALL  # NOT optional, has default"
      - "_state: dict[type, Any]  # internal typed state map (init=False)"
      - "_offload_key_positions: dict[OffloadKey, int]  # 0.30: NEW (init=False)"
    methods:
      - "set_state / get_state  # typed per-request scratch"
      - "set_offload_key_position / get_offload_key_position  # 0.30: NEW"

  OffloadPolicy:
    type: "enum"
    values: ["CHUNK_LEVEL = 'chunk_level'", "REQUEST_LEVEL = 'request_level'"]
    notes: "Per-request offloading policy set by on_new_request. Default CHUNK_LEVEL."

  RequestOffloadingContext:
    type: "@dataclass"
    fields:
      - "policy: OffloadPolicy = OffloadPolicy.CHUNK_LEVEL"
    notes: "Returned by on_new_request. Contains per-request policy/state."

  ScheduleEndContext:
    type: "NamedTuple"
    fields:
      - "new_req_ids: Collection[str]"
      - "preempted_req_ids: Collection[str]"
    notes: "Passed to on_schedule_end with scheduling-step metadata."

  OffloadingEvent:
    type: "@dataclass"
    fields:
      - "keys: list[OffloadKey]"
      - "medium: Medium"
      - "removed: bool                       # True=blocks removed, False=stored"
      - "locality: Locality | None = None    # 0.30: NEW"
      - "ownership: str | None = None         # 0.30: NEW (secondary-tier id, None=primary)"
      - "removal_expected: bool = False        # 0.30: NEW"
    notes: "Used for eviction notifications, BlockStored events, etc."

  LoadStoreSpec:
    type: "ABC base"
    fields:
      - "medium: Medium  # class-level; subclass declares its tier"

  BlockIDsLoadStoreSpec:
    type: "LoadStoreSpec, ABC   # 0.30: NEW shared base for block-id specs"
    init: "(block_ids: list[int])"
    fields:
      - "block_ids: np.ndarray  # dtype=np.int32   # 0.30: int32 (was int64 in v026 doc)"

  GPULoadStoreSpec:
    type: "BlockIDsLoadStoreSpec"
    init: "(block_ids: list[int], group_sizes: Sequence[int], block_indices: Sequence[int])"
    fields:
      - "block_ids: np.ndarray[np.int32]"
      - "group_sizes: Sequence[int]   # asserts sum(group_sizes) == len(block_ids)"
      - "block_indices: Sequence[int] # asserts len(block_indices) == len(group_sizes)"
    notes: "group_sizes / block_indices are REQUIRED positional args (per KV group)."

  PrepareStoreOutput:
    type: "@dataclass"
    fields:
      - "keys_to_store: list[OffloadKey]"
      - "store_spec: LoadStoreSpec"
      - "evicted_keys: list[OffloadKey]"

  TransferResult:
    type: "@dataclass"
    fields:
      - "job_id: int"
      - "success: bool"
      - "transfer_size: int | None = None"
      - "transfer_time: float | None = None"
    notes: "No transfer_type field (direction is explicit via submit_store/submit_load)."

  CanonicalKVCaches:
    type: "@dataclass"
    fields:
      - "tensors: list[CanonicalKVCacheTensor]"
      - "group_data_refs: list[list[CanonicalKVCacheRef]]"
    notes: "N per-layer tensors (changed from 1 coalesced tensor in v0.23)."

  CanonicalKVCacheTensor:
    type: "@dataclass"
    fields:
      - "tensor: torch.Tensor  # shape (num_blocks, ...)"
      - "page_size_bytes: int"

  CanonicalKVCacheRef:
    type: "@dataclass"
    fields:
      - "tensor_idx: int"
      - "page_size_bytes: int"
      - "mapping: CanonicalPageMapping | None = None   # 0.30: RENAMED from page_mapping"

  CanonicalPageMapping:
    type: "@dataclass   # 0.30: NEW (RFC #42082 canonical layouts)"
    fields:
      - "canonical_page_size_bytes: int"
      - "local_page_size_bytes: int"
      - "runs: tuple[CopyRun, ...]"
      - "num_writers: int"
      - "writer_index: int"
      - "parallelism_agnostic: bool"
    methods:
      - "is_writer() -> bool"

  OffloadingKVEventsConfig:
    type: "@dataclass   # 0.30: on the spec as self.kv_events_config"
    fields:
      - "enable_kv_cache_events: bool"
      - "self_describing_kv_events: bool"

  OffloadingConfig:
    type: "@dataclass (vllm.v1.kv_offload.config)"
    notes: "0.26 ctor object handed to OffloadingSpec.__init__."
    fields:
      - "groups: tuple[OffloadingGroupConfig, ...]"
      - "worker_kv_bytes_per_block: int   # full per-block bytes across all layers"
      - "enable_kv_cache_events: bool"
      - "extra_config: dict[str, Any]"
      - "engine_id: <engine id>"
      - "model: OffloadingModelConfig            # (name, dtype)"
      - "cache: OffloadingCacheConfig            # (tokens_per_hash, blocks_per_chunk)"
      - "parallel: OffloadingParallelConfig      # rank/world_size/tp/pp/pcp/dcp/dp..."
      - "replicated_layout: bool = False"
      - "canonical_layout: bool = False          # 0.30: NEW (from extra_config)"
      - "kv_cache_layout: str | None = None       # 0.30: NEW (resolved KVCacheLayout name)"

  KVCacheLayout:
    type: "enum (vllm.v1.kv_cache_layout)   # 0.30: NEW"
    values: ["LBHNC", "LBNHC", "LHBNC", "BLHNC", "BLNHC", "BHLNC"]
    notes: |
      Stride permutations of (L, B, H, N, C). Resolved name is surfaced on
      OffloadingConfig.kv_cache_layout. Properties: stride_order, layer_view_order,
      is_layer_compact, is_block_contiguous, is_block_compact, is_block_outermost.

# ─── LookupResult Semantics ──────────────────────────────────────────

lookup_semantics:
  MISS:
    meaning: "Block not in offload storage"
    vllm_behavior: "Recomputes KV from scratch (prefill) or stalls (decode miss)"
    optimization_impact: "Every MISS costs a full prefill computation"
  HIT:
    meaning: "Block in primary tier, ready for immediate GPU load"
    vllm_behavior: "Calls prepare_load + submit_load to transfer to GPU"
    optimization_impact: "Load latency is the critical path"
  HIT_PENDING:
    meaning: "Block being promoted from secondary tier to primary (async)"
    vllm_behavior: "Retries lookup on next scheduling step. Does NOT block."
    optimization_impact: "Reducing promotion latency reduces retry steps"
  RETRY:
    meaning: "Connector needs more time (generic deferral)"
    vllm_behavior: "Same as HIT_PENDING — retries next step"
    optimization_impact: "Minimize situations requiring RETRY"

# ─── Calling Sequences ────────────────────────────────────────────────

calling_sequences:
  store: |
    1. manager.prepare_store(keys, req_context) → PrepareStoreOutput | None
       Returns None when blocks cannot be stored (any reason).
    2. worker.submit_store(job_id, gpu_spec, store_spec) → bool
    3. worker.get_finished()  [normal polling — NOT wait()]
    4. manager.complete_store(keys, req_context, success)
  load: |
    1. manager.lookup(key, req_context) per block → HIT/MISS/HIT_PENDING/RETRY
    2. manager.prepare_load(hit_keys, req_context) → LoadStoreSpec
    3. worker.submit_load(job_id, src_spec, gpu_spec) → bool
    4. worker.get_finished()  [normal polling]
    5. manager.complete_load(keys, req_context)
  eviction: |
    Triggered inside prepare_store when storage cannot accommodate new blocks.
    Connector decides the eviction policy. vLLM has NO explicit evict() call.
    Eviction is entirely connector-owned.
  lifecycle: |
    init: Spec(config) → get_manager() → get_worker(kv_caches)
    per-request: on_new_request → lookup/load/store → on_request_finished
      NOTE: on_request_finished may fire while transfers are still in-flight.
    per-step: on_schedule_end
    end: shutdown()

# ─── Concurrency ──────────────────────────────────────────────────────

concurrency:
  manager_and_worker_separate_processes: true
  manager_thread_safe_required: false
  tp_support: "TP>1: all ranks must agree on block residency"

# ─── Invariants ───────────────────────────────────────────────────────

invariants:
  - "Manager and Worker are in SEPARATE processes — no shared state"
  - "OffloadKey is content-addressed (full hash + group_idx), not positional"
  - "prepare_store returns None when blocks cannot be stored — no crash"
  - "complete_store(success=False) must clean up any partial state"
  - "on_request_finished may fire before all transfers complete"
  - "TP>1: all ranks must agree on residency"
  - "Eviction is connector-owned — vLLM never calls evict()"
  - "get_finished() is normal polling; wait() is for fenced/preempted flush only"
  - "0.30: Medium has no REMOTE — remoteness is a Locality axis + TierFilter matcher"
  - "0.30: block_ids arrays are np.int32; adapters must not assume int64"
