id: request-completion-retention-and-delete
kind: atomic
name: Request Completion Immediate Delete
status: candidate
parameters:
  total_blocks:
    type: integer
    range:
    - 1
    - 8192
    default: 256
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  completed_blocks:
    cardinality: total_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: completed_blocks
  state: present_in_store
  value: true
phases:
- id: completion-delete
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: delete
    keys: completed_blocks
    order: sequential
    repeat: total_blocks
measure:
- phase: completion-delete
  operation: store
  metrics:
  - latency_p50_ms
expected_io:
  stores: '0'
  loads: '0'
