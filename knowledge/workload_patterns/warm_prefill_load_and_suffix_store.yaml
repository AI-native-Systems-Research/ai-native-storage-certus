id: warm-prefill-load-and-suffix-store
name: Prefix Cache Hit Load Then Suffix Store
status: candidate
parameters:
  matched_prefix_tokens:
    type: integer
    range:
    - 16
    - 131072
    default: 2048
  suffix_tokens:
    type: integer
    range:
    - 1
    - 131072
    default: 2048
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  prefix_blocks:
    cardinality: ceil(matched_prefix_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: global
    disjoint_between_actors: false
  suffix_blocks:
    cardinality: ceil(suffix_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: prefix_blocks
  state: present_in_store
  value: true
- subject: prefix_blocks
  state: absent_from_local_cache
  value: true
phases:
- id: prefix-load
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: load
    keys: prefix_blocks
    order: sequential
    repeat: ceil(matched_prefix_tokens / block_size)
  barrier_after: true
- id: suffix-store
  depends_on: prefix-load
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: suffix_blocks
    order: sequential
    repeat: ceil(suffix_tokens / block_size)
measure:
- phase: prefix-load
  operation: load
  metrics:
  - throughput_MBps
  - latency_p50_ms
  - latency_p99_ms
- phase: suffix-store
  operation: store
  metrics:
  - throughput_MBps
expected_io:
  stores: ceil(suffix_tokens / block_size)
  loads: ceil(matched_prefix_tokens / block_size)
