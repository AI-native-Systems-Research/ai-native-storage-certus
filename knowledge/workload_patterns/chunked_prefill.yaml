id: chunked-prefill
kind: atomic
name: Chunked Prefill Incremental Block Store
status: candidate
parameters:
  total_prompt_tokens:
    type: integer
    range:
    - 512
    - 131072
    default: 8192
  chunk_size:
    type: integer
    range:
    - 128
    - 8192
    default: 512
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  chunk_blocks:
    cardinality: ceil(total_prompt_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: chunk_blocks
  state: absent_from_store
  value: true
phases:
- id: iterative-chunk-store
  actors:
    count: 1
    arrival: serial
    concurrency: 1
  operations:
  - op: store
    keys: chunk_blocks
    order: sequential
    repeat: ceil(total_prompt_tokens / block_size)
    batch_size: ceil(chunk_size / block_size)
measure:
- phase: iterative-chunk-store
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: ceil(total_prompt_tokens / block_size)
  loads: '0'
