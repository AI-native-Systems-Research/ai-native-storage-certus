id: crash-safe-writeback
kind: atomic
name: Crash-Safe Atomic Writeback With Fence
status: candidate
parameters:
  writeback_blocks:
    type: integer
    range:
    - 1
    - 1024
    default: 64
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  pending_blocks:
    cardinality: writeback_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
  committed_blocks:
    cardinality: writeback_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: pending_blocks
  state: absent_from_store
  value: true
- subject: committed_blocks
  state: absent_from_store
  value: true
phases:
- id: stage-writeback
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: pending_blocks
    order: sequential
    repeat: writeback_blocks
  barrier_after: true
- id: commit-fence
  depends_on: stage-writeback
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: committed_blocks
    order: sequential
    repeat: writeback_blocks
  - op: delete
    keys: pending_blocks
    order: sequential
    repeat: writeback_blocks
measure:
- phase: stage-writeback
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
- phase: commit-fence
  operation: store
  metrics:
  - latency_p99_ms
expected_io:
  stores: writeback_blocks * 2
  loads: "0"
