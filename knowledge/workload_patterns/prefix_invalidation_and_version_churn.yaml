id: prefix-invalidation-and-version-churn
name: Suffix Fan-Out Invalidation
status: candidate
parameters:
  invalidated_prefix_blocks:
    type: integer
    range:
    - 1
    - 1024
    default: 64
  suffix_fan_out:
    type: integer
    range:
    - 1
    - 4096
    default: 32
  avg_suffix_blocks:
    type: integer
    range:
    - 1
    - 512
    default: 16
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  stale_blocks:
    cardinality: invalidated_prefix_blocks + suffix_fan_out * avg_suffix_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: global
    disjoint_between_actors: false
preconditions:
- subject: stale_blocks
  state: present_in_store
  value: true
phases:
- id: gc-stale-blocks
  actors:
    count: 1
    arrival: staggered
    concurrency: 1
  operations:
  - op: delete
    keys: stale_blocks
    order: random
    repeat: invalidated_prefix_blocks + suffix_fan_out * avg_suffix_blocks
measure:
- phase: gc-stale-blocks
  operation: store
  metrics:
  - latency_p99_ms
expected_io:
  stores: '0'
  loads: '0'
