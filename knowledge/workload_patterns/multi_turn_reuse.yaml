id: multi-turn-reuse
kind: atomic
name: Multi-Turn Prefix Load From Memory Tier
status: candidate
parameters:
  shared_prefix_tokens:
    type: integer
    range:
    - 16
    - 131072
    default: 4096
  new_suffix_tokens:
    type: integer
    range:
    - 1
    - 32768
    default: 512
  chunk_size:
    type: integer
    range:
    - 64
    - 1024
    default: 256
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  prior_turn_chunks:
    cardinality: ceil(shared_prefix_tokens / chunk_size)
    object_bytes: chunk_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
  new_turn_chunks:
    cardinality: ceil(new_suffix_tokens / chunk_size)
    object_bytes: chunk_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: prior_turn_chunks
  state: present_in_store
  value: true
- subject: prior_turn_chunks
  state: absent_from_local_cache
  value: true
phases:
- id: load-prior-turn
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: load
    keys: prior_turn_chunks
    order: sequential
    repeat: ceil(shared_prefix_tokens / chunk_size)
    batch_size: ceil(shared_prefix_tokens / chunk_size)
  barrier_after: true
- id: store-new-suffix
  depends_on: load-prior-turn
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: new_turn_chunks
    order: sequential
    repeat: ceil(new_suffix_tokens / chunk_size)
measure:
- phase: load-prior-turn
  operation: load
  metrics:
  - throughput_MBps
  - latency_p50_ms
  - latency_p99_ms
- phase: store-new-suffix
  operation: store
  metrics:
  - throughput_MBps
expected_io:
  stores: ceil(new_suffix_tokens / chunk_size)
  loads: ceil(shared_prefix_tokens / chunk_size)
