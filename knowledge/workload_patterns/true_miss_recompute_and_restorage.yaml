id: true-miss-recompute-and-restorage
kind: atomic
name: True Miss Full Recompute and Store
status: candidate
parameters:
  recompute_tokens:
    type: integer
    range:
    - 16
    - 131072
    default: 4096
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  recomputed_blocks:
    cardinality: ceil(recompute_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: recomputed_blocks
  state: absent_from_store
  value: true
phases:
- id: recompute-store
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: recomputed_blocks
    order: sequential
    repeat: ceil(recompute_tokens / block_size)
measure:
- phase: recompute-store
  operation: store
  metrics:
  - throughput_MBps
expected_io:
  stores: ceil(recompute_tokens / block_size)
  loads: '0'
