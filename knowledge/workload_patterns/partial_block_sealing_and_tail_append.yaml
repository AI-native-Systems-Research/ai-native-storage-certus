id: partial-block-sealing-and-tail-append
kind: atomic
name: Tail Block Seal and Identity Registration
status: candidate
parameters:
  seal_events:
    type: integer
    range:
    - 1
    - 4096
    default: 32
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  sealed_blocks:
    cardinality: seal_events
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: sealed_blocks
  state: absent_from_store
  value: true
phases:
- id: seal-writeback
  actors:
    count: 1
    arrival: staggered
    concurrency: 1
  operations:
  - op: store
    keys: sealed_blocks
    order: sequential
    repeat: seal_events
    batch_size: 1
measure:
- phase: seal-writeback
  operation: store
  metrics:
  - throughput_MBps
  - latency_p50_ms
expected_io:
  stores: seal_events
  loads: '0'
