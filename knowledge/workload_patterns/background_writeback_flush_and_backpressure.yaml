id: background-writeback-flush-and-backpressure
kind: atomic
name: Async Sealed Block Writeback
status: candidate
parameters:
  writeback_batch_blocks:
    type: integer
    range:
    - 1
    - 64
    default: 8
  writeback_queue_depth:
    type: integer
    range:
    - 1
    - 256
    default: 32
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  writeback_blocks:
    cardinality: writeback_batch_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: writeback_blocks
  state: absent_from_store
  value: true
phases:
- id: async-writeback
  actors:
    count: 1
    arrival: staggered
    concurrency: writeback_queue_depth
  operations:
  - op: store
    keys: writeback_blocks
    order: sequential
    repeat: writeback_batch_blocks
    batch_size: 1
measure:
- phase: async-writeback
  operation: store
  metrics:
  - throughput_MBps
  - latency_p50_ms
  - latency_p99_ms
expected_io:
  stores: writeback_batch_blocks
  loads: '0'
