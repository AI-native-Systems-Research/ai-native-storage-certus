id: preemption-and-reschedule
name: Preemption Swap-Out and Swap-In
status: candidate
parameters:
  preempted_blocks:
    type: integer
    range:
    - 1
    - 4096
    default: 256
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  swapped_blocks:
    cardinality: preempted_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: swapped_blocks
  state: absent_from_store
  value: true
phases:
- id: swap-out
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: swapped_blocks
    order: sequential
    repeat: preempted_blocks
  barrier_after: true
- id: swap-in
  depends_on: swap-out
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: load
    keys: swapped_blocks
    order: sequential
    repeat: preempted_blocks
  - op: delete
    keys: swapped_blocks
    order: sequential
    repeat: preempted_blocks
measure:
- phase: swap-out
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
- phase: swap-in
  operation: load
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: preempted_blocks
  loads: preempted_blocks
