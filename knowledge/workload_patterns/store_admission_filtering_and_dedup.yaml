id: store-admission-filtering-and-dedup
name: Content-Hash Admission and Store Deduplication
status: candidate
parameters:
  candidate_blocks:
    type: integer
    range:
    - 1
    - 8192
    default: 256
  dedup_hit_rate:
    type: number
    range:
    - 0.0
    - 1.0
    default: 0.3
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  admitted_blocks:
    cardinality: ceil(candidate_blocks * (1 - dedup_hit_rate))
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: global
    disjoint_between_actors: false
preconditions:
- subject: admitted_blocks
  state: absent_from_store
  value: true
phases:
- id: deduplicated-store
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: admitted_blocks
    order: sequential
    repeat: ceil(candidate_blocks * (1 - dedup_hit_rate))
measure:
- phase: deduplicated-store
  operation: store
  metrics:
  - throughput_MBps
expected_io:
  stores: ceil(candidate_blocks * (1 - dedup_hit_rate))
  loads: '0'
