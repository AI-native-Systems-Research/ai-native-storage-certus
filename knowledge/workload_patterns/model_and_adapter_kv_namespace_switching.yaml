id: model-and-adapter-kv-namespace-switching
kind: atomic
name: Adapter Switch KV Invalidation and Re-Store
status: candidate
parameters:
  stale_suffix_blocks:
    type: integer
    range:
    - 1
    - 2048
    default: 128
  new_suffix_blocks:
    type: integer
    range:
    - 1
    - 2048
    default: 128
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  stale_blocks:
    cardinality: stale_suffix_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
  new_adapter_blocks:
    cardinality: new_suffix_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: stale_blocks
  state: present_in_store
  value: true
phases:
- id: invalidate-old
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: delete
    keys: stale_blocks
    order: random
    repeat: stale_suffix_blocks
  barrier_after: true
- id: store-new-adapter
  depends_on: invalidate-old
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: new_adapter_blocks
    order: sequential
    repeat: new_suffix_blocks
measure:
- phase: store-new-adapter
  operation: store
  metrics:
  - throughput_MBps
expected_io:
  stores: new_suffix_blocks
  loads: '0'
