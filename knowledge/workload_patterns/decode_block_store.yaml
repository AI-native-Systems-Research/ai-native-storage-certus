id: decode-block-store
kind: atomic
name: Decode Sealed Block Writeback
status: candidate
parameters:
  generated_tokens:
    type: integer
    range:
    - 1
    - 32768
    default: 512
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  sealed_decode_blocks:
    cardinality: floor(generated_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: sealed_decode_blocks
  state: absent_from_store
  value: true
phases:
- id: decode-writeback
  actors:
    count: 1
    arrival: serial
    concurrency: 1
  operations:
  - op: store
    keys: sealed_decode_blocks
    order: sequential
    repeat: floor(generated_tokens / block_size)
    batch_size: 1
measure:
- phase: decode-writeback
  operation: store
  metrics:
  - throughput_MBps
  - latency_p50_ms
expected_io:
  stores: floor(generated_tokens / block_size)
  loads: '0'
