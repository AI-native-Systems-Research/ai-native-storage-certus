id: disaggregated-prefill-decode
kind: atomic
name: Disaggregated Prefill-Decode KV Transfer
status: candidate
parameters:
  prompt_tokens:
    type: integer
    range:
    - 128
    - 131072
    default: 4096
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  handoff_blocks:
    cardinality: ceil(prompt_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: handoff_blocks
  state: absent_from_store
  value: true
phases:
- id: prefill-push
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: handoff_blocks
    order: sequential
    repeat: ceil(prompt_tokens / block_size)
  barrier_after: true
- id: decode-pull
  depends_on: prefill-push
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: load
    keys: handoff_blocks
    order: sequential
    repeat: ceil(prompt_tokens / block_size)
  - op: delete
    keys: handoff_blocks
    order: sequential
    repeat: ceil(prompt_tokens / block_size)
measure:
- phase: prefill-push
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
- phase: decode-pull
  operation: load
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: ceil(prompt_tokens / block_size)
  loads: ceil(prompt_tokens / block_size)
