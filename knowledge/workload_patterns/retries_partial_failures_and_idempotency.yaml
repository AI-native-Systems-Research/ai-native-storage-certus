id: retries-partial-failures-and-idempotency
name: Disk Checkpoint Write Retry
status: candidate
parameters:
  chunk_blocks:
    type: integer
    range:
    - 1
    - 256
    default: 16
  max_retries:
    type: integer
    range:
    - 1
    - 5
    default: 2
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  retry_blocks:
    cardinality: chunk_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: retry_blocks
  state: absent_from_store
  value: true
phases:
- id: store-with-retry
  actors:
    count: 1
    arrival: serial
    concurrency: 1
  operations:
  - op: store
    keys: retry_blocks
    order: sequential
    repeat: chunk_blocks * max_retries
measure:
- phase: store-with-retry
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: chunk_blocks * max_retries
  loads: '0'
