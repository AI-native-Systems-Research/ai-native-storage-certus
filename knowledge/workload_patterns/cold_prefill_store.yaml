id: cold-prefill-store
kind: atomic
name: Cold Prefill Bulk Store
status: candidate
parameters:
  prompt_tokens:
    type: integer
    range:
    - 128
    - 131072
    default: 4096
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  prefill_blocks:
    cardinality: ceil(prompt_tokens / block_size)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: prefill_blocks
  state: absent_from_store
  value: true
phases:
- id: prefill-writeback
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: prefill_blocks
    order: sequential
    repeat: ceil(prompt_tokens / block_size)
    batch_size: ceil(prompt_tokens / block_size)
measure:
- phase: prefill-writeback
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: ceil(prompt_tokens / block_size)
  loads: '0'
