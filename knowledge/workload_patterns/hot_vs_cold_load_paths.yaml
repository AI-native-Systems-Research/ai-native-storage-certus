id: hot-vs-cold-load-paths
kind: atomic
name: Hot Path Memory-Tier Load
status: candidate
parameters:
  requested_blocks:
    type: integer
    range:
    - 1
    - 4096
    default: 128
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  cached_blocks:
    cardinality: requested_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: global
    disjoint_between_actors: false
preconditions:
- subject: cached_blocks
  state: present_in_store
  value: true
- subject: cached_blocks
  state: absent_from_local_cache
  value: true
phases:
- id: hot-load
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: load
    keys: cached_blocks
    order: sequential
    repeat: requested_blocks
    batch_size: requested_blocks
measure:
- phase: hot-load
  operation: load
  metrics:
  - throughput_MBps
  - latency_p50_ms
  - latency_p99_ms
expected_io:
  stores: '0'
  loads: requested_blocks
