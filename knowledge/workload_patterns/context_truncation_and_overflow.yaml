id: context-truncation-and-overflow
kind: atomic
name: Importance-Scored Selective Eviction at Overflow
status: candidate
parameters:
  total_context_blocks:
    type: integer
    range:
    - 8
    - 8192
    default: 256
  eviction_fraction:
    type: number
    range:
    - 0.1
    - 0.9
    default: 0.8
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  overflow_victims:
    cardinality: ceil(total_context_blocks * eviction_fraction)
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: per_actor
    disjoint_between_actors: true
preconditions:
- subject: overflow_victims
  state: absent_from_store
  value: true
phases:
- id: overflow-eviction
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: overflow_victims
    order: random
    repeat: ceil(total_context_blocks * eviction_fraction)
measure:
- phase: overflow-eviction
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: ceil(total_context_blocks * eviction_fraction)
  loads: '0'
