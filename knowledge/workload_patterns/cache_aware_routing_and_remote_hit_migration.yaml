id: cache-aware-routing-and-remote-hit-migration
name: Remote Hit KV Pull Migration
status: candidate
parameters:
  missing_blocks:
    type: integer
    range:
    - 1
    - 8192
    default: 256
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  remote_blocks:
    cardinality: missing_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: global
    disjoint_between_actors: false
preconditions:
- subject: remote_blocks
  state: present_in_store
  value: true
- subject: remote_blocks
  state: absent_from_local_cache
  value: true
phases:
- id: remote-pull
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: load
    keys: remote_blocks
    order: sequential
    repeat: missing_blocks
measure:
- phase: remote-pull
  operation: load
  metrics:
  - throughput_MBps
  - latency_p50_ms
  - latency_p99_ms
expected_io:
  stores: '0'
  loads: missing_blocks
