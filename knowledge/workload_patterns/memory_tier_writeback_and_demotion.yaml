id: memory-tier-writeback-and-demotion
kind: atomic
name: Pressure-Triggered Batched Demotion
status: candidate
parameters:
  demotion_batch_blocks:
    type: integer
    range:
    - 1
    - 1024
    default: 64
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  num_layers:
    type: integer
    range:
    - 24
    - 128
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range:
    - 256
    - 16384
    default: 4096
keyspaces:
  demoted_blocks:
    cardinality: demotion_batch_blocks
    object_bytes: block_size * num_layers * kv_bytes_per_token_per_layer
    sharing: global
    disjoint_between_actors: false
preconditions:
- subject: demoted_blocks
  state: present_in_store
  value: true
phases:
- id: demotion-writeback
  actors:
    count: 1
    arrival: burst
    concurrency: 1
  operations:
  - op: store
    keys: demoted_blocks
    order: sequential
    repeat: demotion_batch_blocks
  - op: delete
    keys: demoted_blocks
    order: sequential
    repeat: demotion_batch_blocks
measure:
- phase: demotion-writeback
  operation: store
  metrics:
  - throughput_MBps
  - latency_p99_ms
expected_io:
  stores: demotion_batch_blocks
  loads: '0'
