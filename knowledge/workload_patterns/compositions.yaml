kind: composition
id: chat-multi-turn
name: Chat Multi-Turn Conversation
status: candidate
parameters:
  turns:
    type: integer
    range:
    - 2
    - 50
    default: 5
  system_prompt_tokens:
    type: integer
    range:
    - 64
    - 8192
    default: 1024
  user_message_tokens:
    type: integer
    range:
    - 16
    - 4096
    default: 256
  assistant_output_tokens:
    type: integer
    range:
    - 32
    - 4096
    default: 512
  block_size:
    type: integer
    range:
    - 1
    - 64
    default: 16
  concurrent_sessions:
    type: integer
    range:
    - 1
    - 1024
    default: 32
members:
- ref: cold-prefill-store
  role: first-turn-system-prompt-store
  repeat: 1
  arrival: burst
  concurrent_start: concurrent_sessions
  duration: ceil((system_prompt_tokens + user_message_tokens) / block_size)
- ref: decode-block-store
  role: first-turn-generation-writeback
  repeat: 1
  arrival: serial
  concurrent_start: concurrent_sessions
  duration: floor(assistant_output_tokens / block_size)
- ref: warm-prefill-load-and-suffix-store
  role: subsequent-turn-prefix-reload
  repeat: turns - 1
  arrival: staggered
  concurrent_start: concurrent_sessions
  duration: ceil((system_prompt_tokens + i * (user_message_tokens + assistant_output_tokens)
    + user_message_tokens) / block_size)
  iteration_variable: i
- ref: decode-block-store
  role: subsequent-turn-generation-writeback
  repeat: turns - 1
  arrival: serial
  concurrent_start: concurrent_sessions
  duration: floor(assistant_output_tokens / block_size)
- ref: compute-local-eviction-and-later-reload
  role: inter-turn-eviction-and-reload
  repeat: turns - 1
  arrival: staggered
  concurrent_start: concurrent_sessions
  duration: ceil((system_prompt_tokens + i * (user_message_tokens + assistant_output_tokens)
    + user_message_tokens) / block_size)
  iteration_variable: i
- ref: request-completion-retention-and-delete
  role: session-end-cleanup
  repeat: 1
  arrival: burst
  concurrent_start: concurrent_sessions
  duration: ceil((system_prompt_tokens + turns * (user_message_tokens + assistant_output_tokens))
    / block_size)
- ref: multi-turn-reuse
  role: inter-turn-cache-lookup-and-match
  repeat: turns - 1
  arrival: staggered
  concurrent_start: concurrent_sessions
  duration: 1
- ref: partial-block-sealing-and-tail-append
  role: per-token-append-during-decode
  repeat: turns
  arrival: serial
  concurrent_start: concurrent_sessions
  duration: floor(assistant_output_tokens / block_size)
evidence:
- 'Gao et al. 2024 AttentionStore arXiv:2403.19708: cost-effective multi-turn KV reuse
  with CPU/SSD tiering'
- 'Zheng et al. 2023 SGLang RadixAttention arXiv:2312.07104: radix-tree prefix matching
  across turns'
- "Strati et al. 2024 D\xE9j\xE0Vu arXiv:2403.01876: KV-cache streaming for multi-turn\
  \ fault-tolerant serving"
- 'vLLM automatic prefix caching: hash-chain block matching for session resumption'
