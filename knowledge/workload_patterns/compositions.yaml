kind: composition
id: chat-multi-turn
name: Chat Multi-Turn Conversation
status: candidate
parameters:
  turns:
    type: integer
    range: [2, 50]
    default: 5
  system_prompt_tokens:
    type: integer
    range: [64, 8192]
    default: 1024
  user_message_tokens:
    type: integer
    range: [16, 4096]
    default: 256
  assistant_output_tokens:
    type: integer
    range: [32, 4096]
    default: 512
  block_size:
    type: integer
    range: [1, 64]
    default: 16
  num_layers:
    type: integer
    range: [24, 128]
    default: 80
  kv_bytes_per_token_per_layer:
    type: integer
    range: [256, 16384]
    default: 4096
  inter_turn_gap_ms:
    type: integer
    range: [500, 3600000]
    default: 15000
  concurrent_sessions:
    type: integer
    range: [1, 1024]
    default: 32
members:
  - ref: cold-prefill-store
    role: first-turn-system-prompt-store
    repeat: 1
    arrival: burst
    concurrent_start: concurrent_sessions
    duration: "ceil((system_prompt_tokens + user_message_tokens) / block_size)"
  - ref: decode-block-store
    role: first-turn-generation-writeback
    repeat: 1
    arrival: serial
    concurrent_start: concurrent_sessions
    duration: "floor(assistant_output_tokens / block_size)"
  - ref: multi-turn-reuse
    role: subsequent-turn-prefix-reload-and-suffix-store
    repeat: "turns - 1"
    arrival: staggered
    concurrent_start: concurrent_sessions
    duration: "ceil((system_prompt_tokens + turns * user_message_tokens) / block_size)"
  - ref: decode-block-store
    role: subsequent-turn-generation-writeback
    repeat: "turns - 1"
    arrival: serial
    concurrent_start: concurrent_sessions
    duration: "floor(assistant_output_tokens / block_size)"
  - ref: compute-local-eviction-and-later-reload
    role: inter-turn-eviction-and-reload
    repeat: "turns - 1"
    arrival: staggered
    concurrent_start: concurrent_sessions
    duration: "ceil((system_prompt_tokens + turns * user_message_tokens) / block_size)"
  - ref: request-completion-retention-and-delete
    role: session-end-cleanup
    repeat: 1
    arrival: burst
    concurrent_start: concurrent_sessions
    duration: "ceil((system_prompt_tokens + turns * (user_message_tokens + assistant_output_tokens)) / block_size)"
evidence:
  - "Gao et al. 2024 CachedAttention arXiv:2403.19708: multi-turn KV reuse with CPU/SSD tier offload"
  - "Zheng et al. 2023 SGLang RadixAttention: radix tree prefix matching across turns"
