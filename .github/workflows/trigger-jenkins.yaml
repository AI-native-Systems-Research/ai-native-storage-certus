name: Trigger Jenkins

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins job
        run: |
          curl -X POST \
            -u "jenkins:${{ secrets.JENKINS_API_TOKEN }}" \
            "http://sg-gw.svl.cloud9.ibm.com:8080/job/Certus/build"
