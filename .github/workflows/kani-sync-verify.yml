# Triggered on every push to `unstable`.
#
# Merges the new unstable commit into `unstable-kani`, runs all Kani
# harnesses, and pushes the updated branch back to origin.
# Opens a GitHub issue if Kani fails — but the job itself always
# succeeds so this check is ADVISORY and never blocks PRs to main.
#
# unstable ──push──► this workflow
#                       │
#                 merge into unstable-kani
#                       │
#                 cargo kani (dispatch-map)      ← advisory
#                 cargo kani (example-helloworld) ← advisory
#                 cargo kani (component-core)     ← advisory
#                       │
#              ┌────────┴────────┐
#           PASS              FAIL
#              │                 │
#   push unstable-kani    open issue
#   back to origin        (still push unstable-kani)
#   job: SUCCESS          job: SUCCESS (advisory)

name: Kani — sync and verify

on:
  push:
    branches: [unstable]

permissions:
  contents: write
  issues: write

concurrency:
  group: kani-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-verify:
    name: Merge unstable → unstable-kani and run Kani
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unstable-kani
        uses: actions/checkout@v4.2.2
        with:
          ref: unstable-kani
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge origin/unstable into unstable-kani
        id: merge
        run: |
          git fetch origin unstable
          if git merge origin/unstable --no-edit \
               -m "chore: sync unstable → unstable-kani [automated]"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Merge conflict between unstable and unstable-kani — manual resolution required."
            exit 1
          fi

      # Kani requires nightly-2025-11-21 at runtime (cargo metadata, harness
      # compilation). This step always runs — even on cache hits — so cargo-kani
      # can always find the toolchain regardless of cache state.
      - name: Install Rust nightly
        run: rustup toolchain install nightly-2025-11-21 --no-self-update

      # Cache both the cargo-kani binary and the Kani toolchain directory
      # (~/.kani/) which contains CBMC and supporting tools (~1 GB).
      - name: Cache Kani toolchain
        id: kani-cache
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.kani/
          key: kani-0.67.0-v5-${{ runner.os }}

      - name: Install Kani verifier
        id: kani-install
        if: steps.kani-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          # 1. Extract pre-built Kani backend tools (CBMC etc.) from GitHub release.
          mkdir -p ~/.kani
          curl -sSL https://github.com/model-checking/kani/releases/download/kani-0.67.0/kani-0.67.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C ~/.kani/
          # 2. Install cargo-kani wrapper using the pinned nightly toolchain.
          cargo +nightly-2025-11-21 install kani-verifier --version 0.67.0 --locked

      # Always runs (even on cache hit) — write the full toolchain triple so
      # cargo-kani can construct ~/.rustup/toolchains/<triple>/bin/cargo correctly.
      - name: Fix rust-toolchain-version
        run: |
          TOOLCHAIN=$(rustup toolchain list | grep "nightly-2025-11-21" | head -1 | awk '{print $1}')
          echo "$TOOLCHAIN" > ~/.kani/kani-0.67.0/rust-toolchain-version
          echo "rust-toolchain-version set to: $TOOLCHAIN"

      - name: Kani environment diagnostics
        run: |
          echo "=== Installed toolchains ==="
          rustup toolchain list
          echo "=== ~/.kani/ contents ==="
          ls ~/.kani/ 2>/dev/null || echo "(empty)"
          echo "=== rust-toolchain-version ==="
          cat ~/.kani/kani-0.67.0/rust-toolchain-version 2>/dev/null || echo "(not found)"
          echo "=== cargo-kani location ==="
          which cargo-kani 2>/dev/null || ls ~/.cargo/bin/cargo-kani 2>/dev/null || echo "(not found)"
          echo "=== nightly cargo location ==="
          rustup run nightly-2025-11-21 which cargo 2>/dev/null || echo "(nightly cargo not found)"
          echo "=== nightly toolchain bin/ contents ==="
          ls ~/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu/bin/ 2>/dev/null || echo "(toolchain bin/ not found)"
          echo "=== test nightly cargo runs ==="
          ~/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu/bin/cargo --version 2>&1 || echo "FAILED"
          echo "=== rust-toolchain.toml in workspace ==="
          cat rust-toolchain.toml 2>/dev/null || cat rust-toolchain 2>/dev/null || echo "(none found)"
          echo "=== rust-toolchain-version final content ==="
          cat ~/.kani/kani-0.67.0/rust-toolchain-version

      # Advisory: continue-on-error means failures show as warnings,
      # not as job failures, so this check never blocks PR merges.
      - name: Run Kani harnesses — dispatch-map
        id: kani-dispatch-map
        continue-on-error: true
        run: |
          echo "=== RUSTUP_HOME / CARGO_HOME ==="
          echo "RUSTUP_HOME=${RUSTUP_HOME}"
          echo "CARGO_HOME=${CARGO_HOME}"
          echo "=== cargo metadata via absolute nightly path ==="
          ~/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu/bin/cargo metadata \
            --no-deps --format-version 1 2>&1 | head -3 || echo "FAILED"
          echo "=== cargo metadata via rustup run ==="
          rustup run nightly-2025-11-21 cargo metadata \
            --no-deps --format-version 1 2>&1 | head -3 || echo "FAILED"
          echo "=== Running cargo kani ==="
          RUST_BACKTRACE=full cargo kani --package dispatch-map

      - name: Run Kani harnesses — example-helloworld
        id: kani-helloworld
        continue-on-error: true
        run: |
          cargo kani --package example-helloworld

      - name: Run Kani harnesses — component-core
        id: kani-component-core
        continue-on-error: true
        run: |
          cargo kani --package component-core

      # Always push unstable-kani as long as the merge succeeded.
      - name: Push updated unstable-kani
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        run: git push origin unstable-kani

      # Open an issue only when a harness actually fails — not for install failures.
      # This prevents the ~10 daily noise issues caused by build environment problems.
      - name: Open issue on Kani failure
        continue-on-error: true
        if: |
          steps.kani-install.outcome == 'success' &&
          (steps.kani-dispatch-map.outcome == 'failure' ||
           steps.kani-helloworld.outcome == 'failure' ||
           steps.kani-component-core.outcome == 'failure')
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const sha    = context.payload.after ?? context.sha;
            const short  = sha.slice(0, 7);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const failed = [
              '${{ steps.kani-dispatch-map.outcome }}'   === 'failure' ? 'dispatch-map'      : null,
              '${{ steps.kani-helloworld.outcome }}'     === 'failure' ? 'example-helloworld' : null,
              '${{ steps.kani-component-core.outcome }}' === 'failure' ? 'component-core'     : null,
            ].filter(Boolean).join(', ');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Kani advisory: harness failure after unstable commit ${short}`,
              body: [
                `Kani harnesses failed (advisory — did not block merge) after commit \`${sha}\`.`,
                ``,
                `**Failed packages:** ${failed}`,
                ``,
                `**Action required:** review the [failing run](${runUrl}) and either:`,
                `- Fix the bug introduced in \`unstable\`, or`,
                `- Update the Kani harnesses if the change is intentional.`,
              ].join('\n'),
              labels: ['kani', 'verification-failure'],
            });
