# Triggered on every push to `unstable`.
#
# Merges the new unstable commit into `unstable-kani`, runs all Kani
# harnesses, and pushes the updated branch back if verification passes.
# Opens a GitHub issue if either the merge or verification fails.
#
# unstable ──push──► this workflow
#                       │
#                 merge into unstable-kani
#                       │
#                 cargo kani (dispatch-map)
#                 cargo kani (example-helloworld)
#                 cargo kani (component-core)
#                       │
#              ┌────────┴────────┐
#            PASS              FAIL
#              │                 │
#   push unstable-kani     open issue
#   back to origin         (do not push)

name: Kani — sync and verify

on:
  push:
    branches: [unstable]

permissions:
  contents: write
  issues: write

jobs:
  sync-and-verify:
    name: Merge unstable → unstable-kani and run Kani
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unstable-kani
        uses: actions/checkout@v4
        with:
          ref: unstable-kani
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge origin/unstable into unstable-kani
        id: merge
        run: |
          git fetch origin unstable
          if git merge origin/unstable --no-edit \
               -m "chore: sync unstable → unstable-kani [automated]"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::error::Merge conflict between unstable and unstable-kani — manual resolution required."
            exit 1
          fi

      # Kani requires a specific nightly toolchain. Pin to the version
      # that matches the installed kani-verifier (see cache key below).
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-21

      # Cache both the cargo-kani binary and the Kani toolchain directory
      # (~/.kani/) which contains CBMC and supporting tools (~1 GB).
      - name: Cache Kani toolchain
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.kani/
          key: kani-0.67.0-v2-${{ runner.os }}

      - name: Install Kani verifier
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install kani-verifier --version 0.67.0 --locked
          cargo kani setup

      - name: Diagnose Kani environment
        run: |
          echo "cache-hit: ${{ steps.kani-cache.outputs.cache-hit }}"
          echo "cargo-kani location: $(which cargo-kani 2>/dev/null || echo NOT FOUND)"
          cargo kani --version || echo "cargo kani --version FAILED"
          echo "rustup show:"
          rustup show

      - name: Run Kani harnesses — dispatch-map
        run: |
          cargo kani --package dispatch-map

      - name: Run Kani harnesses — example-helloworld
        run: |
          cargo kani --package example-helloworld

      - name: Run Kani harnesses — component-core
        run: |
          cargo kani --package component-core

      # Only push if the merge happened AND all harnesses passed.
      - name: Push updated unstable-kani
        if: success()
        run: git push origin unstable-kani

      # On any failure (merge conflict or Kani failure), open a tracking issue.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha    = context.payload.after ?? context.sha;
            const short  = sha.slice(0, 7);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const merged = '${{ steps.merge.outputs.merged }}';

            const title = merged === 'false'
              ? `Merge conflict: unstable → unstable-kani (${short})`
              : `Kani verification failure after unstable commit ${short}`;

            const body = merged === 'false'
              ? [
                  `Automatic merge of \`unstable\` into \`unstable-kani\` failed at commit \`${sha}\`.`,
                  ``,
                  `**Action required:** resolve the conflict manually:`,
                  `\`\`\`bash`,
                  `git fetch origin`,
                  `git checkout unstable-kani`,
                  `git merge origin/unstable`,
                  `# resolve conflicts, preserving Kani stubs and harnesses`,
                  `git push origin unstable-kani`,
                  `\`\`\``,
                  `See [workflow run](${runUrl}) for details.`,
                ].join('\n')
              : [
                  `Kani harnesses on \`unstable-kani\` failed after merging unstable commit \`${sha}\`.`,
                  ``,
                  `**Action required:** review the [failing run](${runUrl}) and either:`,
                  `- Fix the bug introduced in \`unstable\`, or`,
                  `- Update the Kani harnesses in \`unstable-kani\` if the change is intentional.`,
                ].join('\n');

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['kani', 'verification-failure'],
            });
