# Holds one GPU on node5 while prefill (re)starts, so prefill lands on the
# other. Deleted once prefill runs on GPU1 (A1:00).
apiVersion: v1
kind: Pod
metadata:
  name: gpu-hold
  namespace: %%NS%%
spec:
  nodeSelector: {kubernetes.io/hostname: %%PREFILL_NODE%%}   # filled in by pin_pd
  runtimeClassName: nvidia
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: hold
      image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        limits: {nvidia.com/gpu: 1}
