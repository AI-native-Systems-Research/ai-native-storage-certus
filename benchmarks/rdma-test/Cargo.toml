[package]
name = "rdma-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "RDMA network throughput and latency benchmark tool"
build = "build.rs"

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
pkg-config = "0.3"
cc = "1"
