# Certus observability stack: OTel Collector + Prometheus + Grafana
#
# Usage:
#   cd deploy/grafana && docker compose up -d
#
# Then run certus-server with: --otel-endpoint http://<this-host>:4317
# Grafana UI: http://localhost:3000 (no login required)

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: certus-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: certus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    # Lets the vllm scrape job reach the host's published :8000 (the vLLM bench
    # container publishes to the host, on a separate podman network). On Linux
    # Docker Engine host.docker.internal does NOT resolve without this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: certus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
