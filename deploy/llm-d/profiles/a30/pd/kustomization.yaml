apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prefill/decode disaggregation on A30s: prefill and decode engines of one A30
# each at TP=1, KV handed over by vLLM's NixlConnector. An overlay on llm-d's
# own P/D base (guides/pd-disaggregation/modelserver/gpu/vllm/base), so install.sh
# materializes it beside that base rather than beside ../agg.
#
# Replica counts come from the private site file (PD_PREFILL_REPLICAS,
# PD_DECODE_REPLICAS). For long multi-turn chat, favour decode: after the
# handoff every in-flight sequence lives on a decode GPU, and one A30 holds only
# ~30k tokens of KV, so decode capacity is what runs out first.
#
# This is a testbed, not a tuned deployment. The NIXL transfer runs UCX over TCP
# on the pod network (see patch.yaml); it proves the P/D path end to end, but
# on a typical pod network it is far too slow to measure transfer performance.
resources:
  - ../base

# The base deliberately leaves the model-server image unset so each overlay
# picks one. release == docker.io/vllm/vllm-openai:v0.30.0, the same image the
# agg overlay runs, whose containerd layers the GPU nodes already hold.
components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/release

# Overrides base's llm-d.ai/model: gpt-oss-120b. includeSelectors is safe here,
# unlike in ../agg: base already put the model label in the selectors, and these
# Deployments are created fresh rather than patched in place, so there is no
# immutable live selector to stay compatible with.
labels:
  - pairs:
      llm-d.ai/model: Qwen3-8B
    includeSelectors: true
    includeTemplates: true

# llm-d's routing sidecar, pinned by digest. The base pulls
# ghcr.io/llm-d/llm-d-router-disagg-sidecar:main with imagePullPolicy Always, so
# every pod start takes whatever main is that day, while the router is pinned
# to v1.0.0 (install.sh). The two have to agree on how the router names a
# fetch source: from llm-d-router 7cb7709a (2026-11-03) the sidecar reads it
# only from the request body, which router v1.0.0 does not write, so certus
# fetch stops silently -- the router still logs every pull. This digest is the
# build (Git SHA ddabbfd0) every fetching run so far used. Move it with the
# router, not alone. The policy stays the base's Always: a digest cannot drift.
images:
  - name: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    digest: sha256:adea9eda69259ab60737079c635f5158cfbd31d1e9eadd26ee1c1633a4f835ed

patches:
  - path: patch.yaml
