# Router values for the agg-tiered profile: llm-d's
# guides/tiered-prefix-cache/router/single-host/tiered-prefix-cache-cpu.values.yaml
# at the pinned llm-d.ref, sized for this deployment. install.sh applies it after
# the optimized-baseline guide's values when TIERED=1, so the generic stack is
# routed as its own guide routes it.
#
# Changed from upstream:
#   lruCapacityPerServer  the CPU tier in blocks, as upstream sizes it: 7.97 GiB
#                         over Qwen3-8B's 2.25 MiB per 16-token block = 3626
#                         (upstream's 82000 is ~200 GB for Qwen-32B).
#   modelServers          kept as optimized-baseline's selector, which is what
#                         ../agg's pods carry (upstream's selects its own guide).
#
# pluginsCustomConfig is a single string, so this file carries the WHOLE plugin
# config: an llm-d.ref bump must re-check it against upstream's.
router:
  epp:
    pluginsConfigFile: "tiered-prefix-cache-plugins.yaml"
    pluginsCustomConfig:
      tiered-prefix-cache-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: no-hit-lru-scorer
        - type: approx-prefix-cache-producer
          name: gpu-prefix-cache-producer
        - type: approx-prefix-cache-producer
          name: cpu-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 3626
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
          name: gpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: gpu-prefix-cache-producer
        - type: prefix-cache-scorer
          name: cpu-prefix-cache-scorer
          parameters:
            prefixMatchInfoProducerName: cpu-prefix-cache-producer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
          - pluginRef: kv-cache-utilization-scorer
          - pluginRef: gpu-prefix-cache-scorer
          - pluginRef: cpu-prefix-cache-scorer
          - pluginRef: no-hit-lru-scorer
