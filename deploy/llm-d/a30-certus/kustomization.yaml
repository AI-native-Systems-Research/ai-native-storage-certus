apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Layered on top of the plain A30 overlay rather than folded into it, so the
# deployment can still be rolled out without certus by applying ../a30.
resources:
  - ../a30

configMapGenerator:
  - name: certus-entrypoint
    files:
      - entrypoint-certus.sh

patches:
  - path: patch-certus.yaml

# Swap the stock vLLM image for the connector-bearing build published by
# ../publish-image.sh. Pin the exact tag after each build rather than editing by
# hand:
#   (cd a30-certus && kustomize edit set image \
#      docker.io/vllm/vllm-openai=<registry>/<repo>/llm-d-vllm-certus:<tag>)
# Tag scheme: vllm<version>-<certus sha of the source the image was built from>.
images:
  - name: docker.io/vllm/vllm-openai
    newName: registry.example.com/my-team-docker-local/llm-d-vllm-certus
    newTag: vllm0.30.0-45b4f2a3
