apiVersion: apps/v1
kind: Deployment
# Already namePrefix'd: this overlay consumes ../base as a resource, so base has
# applied its `namePrefix: optimized-baseline-nvidia-gpu-vllm-` by now.
metadata:
  name: optimized-baseline-nvidia-gpu-vllm-decode
spec:
  # 3 replicas == exactly the 3 A30s of the example cluster (a two-GPU node
  # plus a one-GPU node). Size this to the GPUs you actually have.
  replicas: 3
  # vLLM's startup probe allows 60 min (120 x 30s) because a cold start downloads
  # ~16Gi of weights and compiles CUDA graphs. progressDeadlineSeconds defaults to
  # 600, so a single slow pod -- or any stall such as a failing image pull -- marks
  # the Deployment ProgressDeadlineExceeded and makes `kubectl rollout status` exit
  # non-zero even though the rollout is still advancing. Match the probe budget so
  # the watcher agrees with reality.
  progressDeadlineSeconds: 3900
  # No spare GPU exists for a surge pod, so a rolling update must free one before
  # claiming one. With the default maxSurge 25% the rollout deadlocks: the old
  # ReplicaSet holds every GPU, never goes Ready, and so is never scaled down.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # Set here rather than via the label transformer because it is immutable after
  # creation -- it must keep matching the live Deployment exactly.
  selector:
    matchLabels:
      llm-d.ai/model: Qwen3-8B
  template:
    spec:
      containers:
        - name: modelserver
          # Lists without a merge key are replaced wholesale, so this is the
          # complete arg vector, not an addition to base's.
          args:
            - "Qwen/Qwen3-8B"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=1"
            - "--gpu-memory-utilization=0.90"
            # An A30 is 24Gi: ~15.3Gi of bf16 weights plus activations and CUDA
            # graphs leave only ~4.11Gi of GPU KV = 29,936 tokens, while Qwen3-8B
            # advertises a 40960 context -- vLLM refuses to start because
            # _check_enough_kv_cache_memory requires ONE full-length sequence to
            # fit in GPU KV. Certus offload does NOT relax that: the offload tier
            # is not counted, so ~29,920 remains the hard ceiling. What offload
            # buys is tolerance for lower concurrency -- evicted prefixes come
            # back from certus instead of being recomputed. 24576 gives 1.22x
            # concurrency (29,936/24,576); 16384 gave 1.83x, 28672 would give
            # 1.04x (one request at a time).
            - "--max-model-len=24576"
          env:
            # Qwen3-8B is ungated, so drop base's dependency on the
            # llm-d-hf-token secret entirely. Omitting it is not enough -- env
            # merges by name, so the entry has to be deleted explicitly.
            - name: HF_TOKEN
              $patch: delete
            # This image has HOME=/root and sets no HF_HOME, so HuggingFace
            # writes ~16Gi of weights to /root/.cache on the container's
            # writable layer -- under containerd's root on /home, which is
            # kubelet's imagefs. Two pods on one node crossed
            # imagefs.available<15% and were evicted mid-download. Redirect both
            # caches into the shared hostPath below. (base's emptyDirs at
            # /.cache, /.triton and /.config are dead -- 0 bytes -- for the same
            # HOME=/root reason.)
            - name: HF_HOME
              value: /.cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /.cache/vllm
          resources:
            limits:
              cpu: '8'
              memory: 96Gi
              nvidia.com/gpu: 1
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: 1
          volumeMounts:
            # Merge key is mountPath, so this repoints /.cache at model-cache.
            - mountPath: /.cache
              name: model-cache
      volumes:
        # base mounts this as an emptyDir. `$patch: replace` on a list element
        # does NOT work here -- it silently keeps the emptyDir and drops the
        # hostPath, with no error. So delete base's volume and introduce a
        # differently-named one. The new name also describes it better: it holds
        # HF weights and the vLLM compile cache, not just a torch cache.
        - name: torch-compile-cache
          $patch: delete
        # One shared ~16Gi copy per node instead of one per pod, and it survives
        # pod restarts, so a restart no longer re-downloads the weights.
        - name: model-cache
          hostPath:
            path: /home/llm-d-cache
            type: DirectoryOrCreate
