bench_cmd_args: "--bench-only --bench-object-size 4194304 --bench-num-objects 20 --bench-iterations 1"
notes: |
  Use --bench-iterations 1 to get pure SSD-tier latency.
  With multiple iterations, objects get promoted to memory-tier after first access,
  making subsequent iterations measure memory-tier latency and distorting the average.
  Ring size limited to 2 due to SPDK qpair submission limit (rc=-12 at ring_size>=3).
