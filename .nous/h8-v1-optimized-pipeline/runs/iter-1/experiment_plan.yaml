notes: |
  Implementation constraint: SPDK qpair submission fails with rc=-12 (ENOMEM) for
  ring_size >= 3. Ring size is capped at 2 which provides QD=2 parallelism.
  This is a hardware/configuration constraint — the effective queue depth per pipeline
  call is limited to 2 concurrent ReadAsync operations.

  Benchmark note: use --bench-iterations 1 to measure pure SSD-tier latency.
  With iterations > 1, promoted objects re-enter memory-tier, averaging down the result.
