      - name: "baseline-seed1"
        cmd: "git checkout -- . && cargo build -p certus-server --release && ./target/release/certus-server --device-pci 0000:61:00.0 --device-pci 0000:62:00.0 --format --poller-base-cpu 2 & sleep 6 && python3 apps/python/certus-api-bench.py --clients 1 --num-objects 16 --iterations 10 --block-size 4194304 2>&1 | tee /home/nara/certus/evolve_p2p/ai-native-storage-certus/.nous/p2p-evolve-2026-06-01_22-25-40/runs/iter-3/results/h-main/baseline-s1.txt && kill $(ps -ef | grep certus-server | grep -v grep | grep -v bash | awk '{print $2}')"
