metadata:
  iteration: 3
  bundle_ref: "runs/iter-3/bundle.yaml"
  description: "Test batch_lookup path queue depth (QD8→QD32-64) and thread count (2→4) for cold lookup throughput improvement"

setup:
  - cmd: "cargo build -p certus-server --release"
    description: "Build certus-server baseline"

arms:
  - arm_id: "h-main"
