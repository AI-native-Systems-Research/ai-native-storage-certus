metadata:
  iteration: 2
  bundle_ref: "runs/iter-2/bundle.yaml"
  description: >
    Decompose P2P advantage into path effect vs submission-strategy effect by adding
    sequential ReadSync variants (p2p-seq and bounce-seq) to gpu-p2p-server.
    4 MiB transfer, 128 KiB chunks, device 0000:63:00.0, 20 iterations per seed, 3 seeds.

setup:
  - cmd: "RUSTFLAGS='-L /usr/local/lib' cargo build -p gpu-services --features p2p --bin gpu-p2p-server"
    description: "Build gpu-p2p-server with P2P feature (baseline modes only)"
  - cmd: "git apply /home/nara/certus/ai-native-storage-certus/.nous/h8-dispatcher-p2p/runs/iter-2/patches/h-main.patch"
    description: "Apply patch adding P2pSeq and BounceSeq modes (covers h-main and h-ablation arms)"
  - cmd: "RUSTFLAGS='-L /usr/local/lib' cargo build -p gpu-services --features p2p --bin gpu-p2p-server"
    description: "Rebuild with patched code including p2p-seq and bounce-seq modes"

arms:
  - arm_id: "h-robustness"
    conditions:
      - name: "bounce-batch-seed1"
        cmd: "pkill -x gpu-p2p-server 2>/dev/null; sleep 2; rm -f /var/tmp/spdk_pci_lock_0000:63:00.0 /tmp/gpu_p2p_bench.sock; LD_LIBRARY_PATH=/usr/local/lib:/usr/local/cuda/lib64:$LD_LIBRARY_PATH ./target/debug/gpu-p2p-server --socket /tmp/gpu_p2p_bench.sock --pci 0000:63:00.0 --mode bounce --chunk-size 131072 --staging-size 4194304 > /tmp/server.log 2>&1 & sleep 7; LD_LIBRARY_PATH=/usr/local/lib:/usr/local/cuda/lib64:$LD_LIBRARY_PATH python3 components/gpu-services/v0/tests/gpu_client_p2p.py 4194304 /tmp/gpu_p2p_bench.sock --iterations 20 2>&1 | tee /home/nara/certus/ai-native-storage-certus/.nous/h8-dispatcher-p2p/runs/iter-2/results/h-robustness/bounce-batch-s1.txt; pkill -x gpu-p2p-server 2>/dev/null"
        output: "/home/nara/certus/ai-native-storage-certus/.nous/h8-dispatcher-p2p/runs/iter-2/results/h-robustness/bounce-batch-s1.txt"
        description: "Bounce BatchSubmit seed 1 — baseline NVMe→DRAM→GPU with concurrent submission"
