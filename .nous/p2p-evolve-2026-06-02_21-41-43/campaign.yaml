research_question: "Implement GPUDirect Storage (P2P) for the cold lookup path: NVMe\
  \ reads DMA directly into GPU BAR1 memory, bypassing host DRAM entirely. The current\
  \ path bounces through host DRAM (NVMe \u2192 DRAM \u2192 GPU via cudaMemcpy) achieving\
  \ only 2.4 GB/s against a 5.9 GB/s drive ceiling. P2P eliminates the host bounce.\n"
run_id: p2p-evolve-hint
max_iterations: 3
target_system:
  name: "Certus Storage Engine \u2014 SSD-to-GPU Data Path Optimization"
  description: "A storage server that moves data from NVMe SSDs to GPU memory for\
    \ inference workloads. The cold lookup path currently reads NVMe SSD \u2192 host\
    \ DRAM \u2192 GPU.\nHARDWARE: - NVMe Gen4 SSDs via SPDK (userspace driver, no\
    \ kernel filesystem) - NVIDIA A30 GPU, PCIe Gen4 x16 - Kernel modules loaded:\
    \ nvidia-peermem, gdrdrv - 2048 hugepages allocated, memlock unlimited, NVMe devices\
    \ bound to VFIO\nSCORING: score = 0.60 * min(1.0, throughput_gbps / 12.0) + 0.40\
    \ * min(1.0, 0.4 / p99_latency_ms) Hard constraints: build must succeed, data\
    \ integrity must pass.\nBUILD & EVALUATION: - cargo build -p certus-server --release\
    \ --features p2p - The p2p feature enables GPU-direct DMA buffer functions in\
    \ gpu-services - Start server: ./target/release/certus-server --metadata-pci 0000:61:00.0\
    \ --data-pci 0000:62:00.0 - Run benchmark: python3 apps/python/certus-api-bench.py\
    \ --clients 1 --num-objects 16 --iterations 10 --block-size 4194304 - Parse cold\
    \ lookup: look for \"Lookup (cold)\" then \"per-client=X.XX GB/s\" - ALWAYS kill\
    \ and restart server after code changes - Server takes ~3s to initialize. Wait\
    \ for gRPC port 50051.\nTARGET OPTIMIZATION: Implement GPUDirect Storage (P2P)\
    \ NVMe reads DMA directly into GPU BAR1 memory, bypassing host DRAM entirely.\
    \ This eliminates the host-bounce cudaMemcpy step.\nCODEBASE: The gpu-services\
    \ crate (components/gpu-services/src/) contains DMA buffer creation functions\
    \ for various memory types. The dispatcher crate (components/dispatcher/src/)\
    \ manages the data transfer. The interfaces crate defines DmaBuffer, GpuStream,\
    \ etc.\nKEY FILES: - components/dispatcher/src/pipeline.rs \u2014 transfer loop\
    \ - components/dispatcher/src/lib.rs \u2014 promote_and_serve() call site - components/gpu-services/src/dma.rs\
    \ \u2014 DMA buffer creation functions\nIMPLEMENTATION NOTES: - The cuda_ffi module\
    \ uses std::os::raw::c_int for all flags and error return types. - Build uses\
    \ --features p2p, so all #[cfg(feature = \"p2p\")] code is compiled and type-checked.\
    \ - The function create_spdk_dma_buffer_from_gpu_bar(gpu_ptr, size, container_fd)\
    \ in dma.rs creates an SPDK-registered DMA buffer backed by GPU BAR1 memory for\
    \ P2P NVMe\u2192GPU transfers. - PipelineRing.streams is [GpuStream; 2] \u2014\
    \ callers pass &ring.streams as a fixed-size array.\n"
  observable_metrics:
  - cold lookup throughput (GB/s) single drive, 1 client
  - cold lookup p99 latency (ms)
  - CPU utilization fraction
  - data integrity (PASS/FAIL)
  controllable_knobs:
  - ring depth
  - number of CUDA streams
  - DMA buffer configuration
  - transfer architecture
  repo_path: /home/nara/certus/evolve_p2p/ai-native-storage-certus
