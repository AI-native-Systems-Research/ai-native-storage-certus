  date: "2026-06-02"
  system: "Certus Storage Engine — P2P GPUDirect Cold Lookup"

setup:
  - cmd: "ln -sf /home/nara/certus/evolve_p2p/ai-native-storage-certus/deps/spdk deps/spdk && ln -sf /home/nara/certus/evolve_p2p/ai-native-storage-certus/deps/spdk-build deps/spdk-build"
    description: "Symlink SPDK dependencies from main repo"
  - cmd: "cargo build -p certus-server --release --features p2p"
    description: "Build the system (baseline)"

arms:
