      - name: "baseline-s1"
        cmd: |
          git checkout -- .
          cargo build -p certus-server --release --features p2p
          nohup ./target/release/certus-server --drive-count 1 --format > /tmp/server.log 2>&1 &
          sleep 8
          python3 apps/python/certus-api-bench.py --clients 1 --num-objects 16 --iterations 10 --block-size 4194304 > /home/nara/certus/evolve_p2p/ai-native-storage-certus/.nous/p2p-evolve-2026-06-02_21-41-43/runs/iter-1/results/h-main/baseline-s1.txt 2>&1
          kill %1; wait; sleep 2
